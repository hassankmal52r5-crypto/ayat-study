Vp, mA, time and filtration. With automatic exposure control a phantom simulates the patient and the exposure time is noted to calculate free-in-air exposure. Actual skin dose can also be measured by placing the detector on the phantom.</p>", "ar": "<p>Entrance skin exposure (ESE) هو التعرض عند مستوى دخول الجلد في الهوا من غير المريض ويتسجل مع kVp وmA والزمن والفلترة. مع التحكم الأوتوماتيك في التعريض بنحط phantom بيحاكي المريض ونسجل زمن التعريض لحساب free-in-air exposure. وممكن نقيس جرعة الجلد الفعلية بوضع الكاشف على الـphantom.</p>"}], "terms": [["ESE", "Entrance skin exposure measured in air at skin plane.", "التعرض عند دخول الجلد."]]}, {"id": "fund25_2", "title_en": "Patient protection", "title_ar": "حماية المريض", "figs": [], "blocks": [{"en": "<p>First maintain the machine with a quality control program (output, beam quality, collimator, timer). Avoid unnecessary x-rays: use alternatives such as ultrasound when possible, exchange information between doctors and avoid repeat exams by making records available. Good practice: minimize field size with accurate collimators, do not expose parts not examined, and use maximum target-patient distance to reduce the difference between entrance and exit dose.</p>", "ar": "<p>أول حاجة صيانة الجهاز ببرنامج quality control (الخرج وجودة الشعاع والـcollimator والتايمر). نتجنب الأشعة غير الضرورية: نستخدم بدائل زي الموجات فوق الصوتية لو ممكن وتبادل المعلومات بين الأطباء ومنع تكرار الفحوصات بتوفير السجلات. ممارسة سليمة: قلل حجم الحقل بـcollimator دقيق وماتعرضش أجزاء مش مطلوبة واستخدم أقصى مسافة هدف-مريض لتقليل الفرق بين جرعة الدخول والخروج.</p>"}], "terms": [["quality control", "Program checking output, beam quality, collimator, timer.", "برنامج مراقبة الجودة."]]}], "flash": [{"f": "ESE?", "b": "Entrance skin exposure."}, {"f": "Phantom use?", "b": "Simulates patient to estimate exposure."}, {"f": "First protection element?", "b": "Proper machine QC."}, {"f": "Alternative to x-ray?", "b": "Ultrasound."}, {"f": "Field size?", "b": "Minimize with collimators."}, {"f": "Distance?", "b": "Maximum target-patient distance."}], "quiz": [{"q": "ESE is measured:", "o": ["Inside patient", "In air without patient", "In film", "In bin"], "a": 1, "w": "في الهوا."}, {"q": "Phantom simulates:", "o": ["Patient", "Tube", "Film", "Table"], "a": 0, "w": "المريض."}, {"q": "Reduce field with:", "o": ["Grids", "Film", "Gel", "Collimators"], "a": 3, "w": "collimators."}, {"q": "Alternative:", "o": ["More x-rays", "None", "Ultrasound", "CT only"], "a": 2, "w": "سونار."}, {"q": "Distance should be:", "o": ["Minimum", "Maximum", "Zero", "Random"], "a": 1, "w": "أقصى."}], "recall": [{"q": "How is dose measured?", "a": "ESE in air, phantom for AEC.", "w": "القياس."}, {"q": "Protection steps.", "a": "QC, avoid unnecessary exams, collimate, distance.", "w": "الحماية."}]}, "fund26": {"name": "Fundamentals of Radiography", "lec": "Lecture 26 - Image artifacts and retakes", "short": "Fund", "sections": [{"id": "fund26_1", "title_en": "Retake analysis and exposure artifacts", "title_ar": "تحليل الإعادة وأخطاء التعريض", "figs": [], "blocks": [{"en": "<p>Retake rate should be under 5%; analysis looks at the view repeated and the cause. An artifact is any irregularity not caused by normal shadowing of tissue by the primary beam. They arise in exposure, processing and handling. Exposure artifacts: wrong screen-film match, poor screen contact, warped cassettes, dirty screens, improper grid use, improper technical factors (the most common reason for retakes), poor patient preparation, double exposures, motion blur and improper positioning.</p>", "ar": "<p>معدل الإعادة لازم يكون أقل من 5%؛ والتحليل بيشوف الإسقاط المتكرر والسبب. الـartifact أي عدم انتظام مش ناتج عن ظل النسيج الطبيعي بالشعاع الأساسي. بتحصل في التعريض والتحميض والمناولة. أخطاء التعريض: عدم توافق شاشة-فيلم وتلامس سيئ للشاشة وكاسيت ملتوي وشاشات متسخة واستخدام grid غلط وعوامل فنية غلط (أشهر سبب للإعادة) وتجهيز سيئ للمريض وتعريض مزدوج وضبابية حركة ووضعية غلط.</p>"}], "terms": [["artifact", "Image irregularity not from normal tissue shadowing.", "شائبة في الصورة."]]}, {"id": "fund26_2", "title_en": "Patient-related artifacts", "title_ar": "أخطاء متعلقة بالمريض", "figs": [], "blocks": [{"en": "<p>Ask about removable dentures (partial dentures have metal clips and ruin views). Remove earrings, necklaces, bobby pins, hair buns and extensions, bras, rings and watches before cervical, skull and other views. Keep arms at the sides and out of the view on AP or PA, and positioned properly for lateral views. Good gowning instructions prevent most of these.</p>", "ar": "<p>اسأل عن طقم الأسنان المتحرك (الجزئي فيه مشابك معدنية وبيبوظ الصور). شيل الحلق والسلاسل والبنس وكعكة الشعر والـextensions والستيان والخواتم والساعات قبل فحوصات الرقبة والجمجمة وغيرها. خلي الدراعين على الجنب وبعيد عن الحقل في AP أو PA ومظبوطين في الجانبي. تعليمات الـgowning الكويسة بتمنع أغلبها.</p>"}], "terms": [["gowning", "Preparing patient by removing clothing and metal objects.", "تجهيز المريض بالملابس."]]}], "flash": [{"f": "Acceptable retake rate?", "b": "Under 5%."}, {"f": "Artifact areas?", "b": "Exposure, processing, handling."}, {"f": "Most common retake reason?", "b": "Improper technical factors."}, {"f": "Partial dentures problem?", "b": "Metal clips."}, {"f": "Arms position?", "b": "At sides, out of view."}, {"f": "Hair for AP cervical?", "b": "Put hair up."}], "quiz": [{"q": "Retake rate:", "o": ["Over 50%", "20%", "Under 5%", "None"], "a": 2, "w": "أقل من 5%."}, {"q": "Common reason:", "o": ["Weather", "Technical factors", "Film color", "Luck"], "a": 1, "w": "عوامل فنية."}, {"q": "Dentures partial have:", "o": ["Metal clips", "Plastic only", "Glass", "Nothing"], "a": 0, "w": "مشابك."}, {"q": "Artifact is:", "o": ["Normal tissue", "Dose", "Film", "Image irregularity"], "a": 3, "w": "شائبة."}, {"q": "Prevent with:", "o": ["More kV", "Less film", "Gowning instructions", "Gel"], "a": 2, "w": "gowning."}], "recall": [{"q": "Define artifact and sources.", "a": "Irregularity; exposure, processing, handling.", "w": "الـartifact."}, {"q": "Patient-related artifacts.", "a": "Dentures, jewelry, hair, clothes, arms.", "w": "أخطاء المريض."}]}};

const SVGS = {};
const SVG_CAPS = {};
const FIG_META = {};
const SCENES = {};

const STORE_KEY="ayatStudyV1";
let S={};
try{S=JSON.parse(localStorage.getItem(STORE_KEY)||"{}")}catch(e){S={}}
if(S.planNew){if(!S.plan){S.plan=S.planNew.plan;S.planV=S.planNew.planV;S.planStart=S.planNew.planStart}delete S.planNew}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(S))}catch(e){}}
function st(sid){ if(!S[sid])S[sid]={read:[],flash:{},quizBest:0,quizAtt:0,recall:{}}; return S[sid]; }
// migrate pilot single-lecture progress to per-lecture keys
if(S.ct&&!S.ct1){S.ct1=S.ct;delete S.ct}
if(S.bio&&!S.bio1){S.bio1=S.bio;delete S.bio}
if(!S.lang)S.lang={};

let cur=null, tab="learn", qi=0, qscore=0, qmiss=[], qlock=false;
let fi=0, flipped=false, deck=null, deckMode="all";
let ri=0, rshown=false, rdeck=null;

const $=s=>document.querySelector(s);
const hdr=$("#hdr"), app=$("#app");
function pct(n,d){return d?Math.round(n/d*100):0}

function lecProgress(lid){
 const d=DATA[lid], s=st(lid);
 const parts=[
  pct(s.read.length, d.sections.length),
  pct(Object.keys(s.flash).filter(k=>s.flash[k]).length, d.flash.length),
  s.quizAtt? s.quizBest : 0,
  pct(Object.keys(s.recall).filter(k=>s.recall[k]).length, d.recall.length),
 ];
 return Math.round(parts.reduce((a,b)=>a+b,0)/parts.length);
}
function builtLecs(subj){ const r=[]; SUBJECTS[subj].titles.forEach((t,i)=>{const lid=subj+(i+1); if(DATA[lid])r.push(lid)}); return r; }
function subjProgress(subj){
 const ls=builtLecs(subj);
 if(!ls.length)return 0;
 return Math.round(ls.reduce((a,l)=>a+lecProgress(l),0)/ls.length);
}
function headerHome(){ hdr.innerHTML=`<div class="hrow"><h1>Ayat Study · آيات ستدي</h1><button class="tourbtn" onclick="tourStart()">؟ جولة</button></div><p>Semester 1 · offline</p>`; }
function headerSubj(sid){ const d=DATA[sid]; const subj=sid.replace(/\d+$/,''); hdr.innerHTML=`<button class="back" onclick="goSubj('${subj}')">&#8592; Lectures</button><div class="hrow"><h1>${d.name}</h1><button class="tourbtn" onclick="tourStart()">؟ جولة</button></div><p>${d.lec}</p>`; }

function goHome(){cur=null;render()}
window.goHome=goHome;
function goSubj(subj){cur="subj:"+subj;render();window.scrollTo(0,0)}
window.goSubj=goSubj;
function goLec(lid,t){cur=lid;tab=t||"learn";qi=0;qscore=0;qmiss=[];fi=0;flipped=false;deck=null;ri=0;rshown=false;rdeck=null;render();window.scrollTo(0,0)}
window.goLec=goLec;
function setTab(t){tab=t;qi=0;qscore=0;qmiss=[];qlock=false;fi=0;flipped=false;deck=null;deckMode="all";ri=0;rshown=false;rdeck=null;render()}
window.setTab=setTab;

function home(){
 headerHome();
 let h="";
 for(const subj of ["elec", "anat", "path", "physio", "physics", "fund", "care"]){
  const d=SUBJECTS[subj], p=subjProgress(subj);
  const nB=builtLecs(subj).length, nT=d.titles.length;
  h+=`<button class="card subj" onclick="goSubj('${subj}')">
    <h2>${d.name}</h2><div class="lec">${nB===nT?nT+" lectures":nB+" of "+nT+" lectures in the app"}</div>
    <div class="bar"><div style="width:${p}%"></div></div>
    <div class="pct">${p}% complete</div>
  </button>`;
 }
 const pl=planStats();
 h+=`<button class="card subj" onclick="goPlan()">
   <h2>Study plan - جدول المذاكرة</h2><div class="lec">${pl.state==="before"?"Plan starts Sat "+fmtD(pl.start):(pl.state==="after"?"Plan finished · ":"")+(pl.state==="in"||pl.state==="after"?(pl.today>0?pl.today+(pl.today===1?" session today":" sessions today"):'No sessions today')+" · week "+pl.week+" of "+PLAN_WEEKS:"")}</div>
   <div class="bar"><div style="width:${pl.pct}%"></div></div>
   <div class="pct">${pl.done}/${pl.total} sessions done (${pl.pct}%)</div>
 </button>`;
 h+=`<div class="footer-note">Content from your lecture slides only. Built from Semester 1 lectures.<br>Tap any English word for its Arabic translation · select a sentence for a paragraph translation.<br>Progress is saved on this device.</div>`;
 app.innerHTML=h;
}

function picker(subj){
 const d=SUBJECTS[subj];
 hdr.innerHTML=`<button class="back" onclick="goHome()">&#8592; All subjects</button><div class="hrow"><h1>${d.name}</h1><button class="tourbtn" onclick="tourStart()">؟ جولة</button></div><p>اختاري المحاضرة · pick a lecture</p>`;
 let h="";
 d.titles.forEach((t,i)=>{
  const lid=subj+(i+1), built=!!DATA[lid];
  if(built){
   const dd=DATA[lid], p=lecProgress(lid);
   h+=`<button class="card subj" onclick="goLec('${lid}')">
     <h2>Lecture ${i+1}</h2><div class="lec">${t}</div>
     <div class="bar"><div style="width:${p}%"></div></div>
     <div class="pct">${p}% complete - ${dd.sections.length} sections · ${dd.flash.length} cards · ${dd.quiz.length} quiz Qs · ${dd.recall.length} recall Qs</div>
   </button>`;
  }else{
   h+=`<div class="card subj" style="opacity:.55;cursor:default">
     <h2>Lecture ${i+1}</h2><div class="lec">${t}</div>
     <div class="pct">not in the app yet</div>
   </div>`;
  }
 });
 app.innerHTML=h;
}

function tabsHtml(sid){
 const t=[["learn","Learn"],["cards","Cards"],["notes","Notes"],["quiz","Quiz"],["recall","Recall"],["prog","Progress"]];
 return `<div class="tabs">`+t.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="setTab('${k}')">${l}</button>`).join("")+`</div>`;
}

function figHtml(fid){
 if(SVGS[fid])return `<div class="svgfig" data-svg="${fid}" onclick="openSvg(this.dataset.svg)"><button class="vexp" type="button">⤢ تكبير</button>${SVGS[fid]}</div><div class="figcap">${SVG_CAPS[fid]||""}</div>`;
 if(SCENES[fid])return `<div class="viewer" data-scene="${fid}"><div class="vtitle">${SCENES[fid].title}</div><div class="vhint">اسحب للف · إصبعين للتكبير · اضغط تكبير للشاشة الكاملة · drag to rotate, pinch to zoom, tap to enlarge</div></div><div class="figcap">${FIG_META[fid]||""}</div>`;
 return "";
}

function toggleLang(btn,secid){
 S.lang[secid]=!S.lang[secid];save();
 const card=btn.closest(".sec");
 card.classList.toggle("show-ar",S.lang[secid]);
 btn.classList.toggle("on",S.lang[secid]);
 btn.setAttribute("aria-checked",S.lang[secid]?"true":"false");
 btn.querySelector(".knob").textContent=S.lang[secid]?"ع":"EN";
}
window.toggleLang=toggleLang;

function toggleTerm(el){ const n=el.nextElementSibling; n.style.display=n.style.display==="block"?"none":"block"; }
window.toggleTerm=toggleTerm;

function markRead(sid,id){
 const s=st(sid); const i=s.read.indexOf(id);
 if(i<0)s.read.push(id);else s.read.splice(i,1);
 save();render();
}
window.markRead=markRead;

function learn(sid){
 const d=DATA[sid], s=st(sid);
 let h="";
 for(const sec of d.sections){
  const done=s.read.includes(sec.id);
  const arOn=!!S.lang[sec.id];
  h+=`<div class="card sec ${arOn?'show-ar':''}" data-sec="${sec.id}">
   <div class="sechead"><h3>${sec.title_en}</h3><button class="langbtn ${arOn?'on':''}" role="switch" aria-checked="${arOn?'true':'false'}" aria-label="Arabic translation" onclick="toggleLang(this,'${sec.id}')"><span class="knob">${arOn?'ع':'EN'}</span></button></div>
   <div class="sec-ar-title">${sec.title_ar||""}</div>`;
  sec.blocks.forEach((b,i)=>{
   h+=`<div class="blk" data-bid="${sec.id}-${i}">${b.en}<div class="arb">${b.ar}</div></div>`;
  });
  for(const f of sec.figs||[])h+=figHtml(f);
  if(sec.terms&&sec.terms.length){
   h+=`<div class="chips">`+sec.terms.map(t=>`<button class="chip" onclick="toggleTerm(this)">${t[0]}</button><div class="termdef" style="display:none">${t[1]}<span class="ar">${t[2]||""}</span></div>`).join("")+`</div>`;
  }
  h+=`<button class="readbtn ${done?'done':''}" onclick="markRead('${sid}','${sec.id}')">${done?'✓ Read':'Mark as read'}</button></div>`;
 }
 return h;
}

/* ---------- flashcards ---------- */
function getDeck(sid){
 if(!deck){
  const d=DATA[sid], s=st(sid);
  deck=d.flash.map((c,i)=>i);
  if(deckMode==="todo")deck=deck.filter(i=>!s.flash[i]);
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}
 }
 return deck;
}
function cards(sid){
 const d=DATA[sid], s=st(sid);
 const mastered=Object.keys(s.flash).filter(k=>s.flash[k]).length;
 const dk=getDeck(sid);

function nToks(s){return Array.from(new Set((String(s||"").replace(/<[^>]*>/g," ").toLowerCase().match(/[a-z][a-z-]{3,}/g)||[]).filter(w=>!N_STOP.has(w))))}

 const d=DATA[sid];
 const units=[];
 d.sections.forEach(sc=>{units.push(nToks(sc.blocks.map(b=>b.en).join(" ")))});
 const tested=[];
 d.quiz.forEach(q=>{tested.push(nToks(q.q+" "+(q.o&&q.o[q.a]!=null?q.o[q.a]:"")))});
 d.recall.forEach(q=>{tested.push(nToks(q.q+" "+q.a))});
 const df={};units.concat(tested).forEach(u=>u.forEach(w=>{df[w]=(df[w]||0)+1}));
 const cards=d.flash.map((c,i)=>{
  const tk=nToks(c.f+" "+c.b);
  let sc=0;tk.forEach(w=>{sc+=Math.log(1+(df[w]||0))});
  sc=sc/Math.sqrt(Math.max(4,tk.length))*3;
  let hits=0;
  tested.forEach(u=>{let m=0;for(const w of tk){if(u.indexOf(w)>=0)m++;if(m>=3)break}if(m>=3)hits++});

 d.sections.forEach(sc=>(sc.terms||[]).forEach(tm=>{
  const w=nToks(tm[0]).concat(nToks(tm[1]).slice(0,2));let s=0;w.forEach(x=>{s+=(df[x]||0)});

/* ---------- study plan ---------- */
const PLAN_WEEKS=7;
const DAYS=[[6,"السبت","Sat"],[0,"الأحد","Sun"],[1,"الاتنين","Mon"],[2,"التلات","Tue"],[3,"الأربع","Wed"],[4,"الخميس","Thu"],[5,"الجمعة","Fri"]];
let planWeek=1, planFormDay=null, planEdit=null;
function planState(){
 if(!S.plan||S.planV!==2){
  // plan v2: all subjects, interleaved so every subject finishes by week 7; Friday = weekly review
  const keys=Object.keys(SUBJECTS), tot={}, ptr={};
  let N=0; keys.forEach(k=>{tot[k]=LECTURES[k].length;ptr[k]=0;N+=tot[k]});
  const queue=[];
  for(let n=0;n<N;n++){
   let best=null,bv=-1;
   keys.forEach(k=>{ if(ptr[k]<tot[k]){const v=(tot[k]-ptr[k])/tot[k]; if(v>bv+1e-9){bv=v;best=k}} });
   queue.push({s:best,l:ptr[best]});ptr[best]++;
  }
  const order=[6,0,1,2,3,4];
  S.plan={};
  for(let w=1;w<=PLAN_WEEKS;w++){
   S.plan[w]={6:[],0:[],1:[],2:[],3:[],4:[],5:[]};
   const items=queue.slice(Math.floor(N*(w-1)/PLAN_WEEKS),Math.floor(N*w/PLAN_WEEKS));
   {let at=0;order.forEach((dd,di)=>{const c=Math.floor(items.length/6)+(di<items.length%6?1:0);for(let z=0;z<c;z++){const it=items[at++];S.plan[w][dd].push({s:it.s,l:it.l,done:false})}})}
   const by={};items.forEach(it=>{(by[it.s]=by[it.s]||[]).push(it.l+1)});
   const parts=keys.filter(k=>by[k]).map(k=>{const a=by[k];return SUBJECTS[k].short+" "+(a.length>1?a[0]+"-"+a[a.length-1]:a[0])});
   if(parts.length)S.plan[w][5].push({s:"rev",l:-1,done:false,label:"مراجعة الأسبوع: "+parts.join(" + ")+" (كروت + كويز + تسميع)"});
  }
  S.planV=2;
  save();
 }
 // migration (no reset): start date, auto-built Friday reviews
 if(!S.planStartFix){S.planStartFix=1;if(S.planStart==="2026-11-28")S.planStart="2026-11-21";save()}
 if(!S.planStart){const t=new Date();const add=-((t.getDay()+1)%7);const d=new Date(t.getFullYear(),t.getMonth(),t.getDate()+add);S.planStart=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");save()}
 for(let w=1;w<=PLAN_WEEKS;w++){(S.plan[w][5]||[]).forEach(it=>{if(it.s==="rev"&&!it.lecs&&!it.custom&&typeof it.label==="string"&&it.label.indexOf("مراجعة الأسبوع")===0&&!it.auto)it.auto=true})}
 return S.plan;
}
function pad2(n){return String(n).padStart(2,"0")}
function planStartDate(){const a=(S.planStart||"").split("-").map(Number);return new Date(a[0],a[1]-1,a[2])}
function dayDate(w,jsd){const o=DAYS.findIndex(d=>d[0]===jsd);const b=planStartDate();return new Date(b.getFullYear(),b.getMonth(),b.getDate()+(w-1)*7+o)}
function fmtD(d){return pad2(d.getDate())+"/"+pad2(d.getMonth()+1)}
function dateInfo(){
 planState();
 const t=new Date(),td=new Date(t.getFullYear(),t.getMonth(),t.getDate()),b=planStartDate();
 const days=Math.round((td-b)/86400000);
 if(days<0)return {state:"before",week:1,jsd:td.getDay(),days};
 const wk=Math.floor(days/7)+1;
 if(wk>PLAN_WEEKS)return {state:"after",week:PLAN_WEEKS,jsd:td.getDay(),days};
 return {state:"in",week:wk,jsd:td.getDay(),days};
}
function revLecs(w,it){
 if(it.lecs&&it.lecs.length)return it.lecs;
 const out=[];const p=S.plan[w];
 DAYS.forEach(([d])=>{if(d===5)return;(p[d]||[]).forEach(x=>{if(x.s!=="rev"&&x.done&&!out.some(o=>o.s===x.s&&o.l===x.l))out.push({s:x.s,l:x.l})})});
 return out;
}
function revText(lecs){
 const keys=Object.keys(SUBJECTS),by={};
 lecs.forEach(x=>{(by[x.s]=by[x.s]||[]).push(x.l+1)});
 return keys.filter(k=>by[k]).map(k=>SUBJECTS[k].short+" "+by[k].sort((a,b)=>a-b).join(","));
}
function revLabel(w,it){
 if(it.label&&!it.auto&&!it.lecs)return it.label;
 const l=revLecs(w,it);
 if(!l.length)return "مراجعة الأسبوع: لسه مفيش محاضرات متعلّم عليها «تم» (أو اختاري المحاضرات من تعديل اليوم)";
 return "مراجعة الأسبوع: "+revText(l).join(" + ")+" · "+l.length+(l.length===1?" lecture":" lectures")+" (كروت + كويز + تسميع)";
}
function planStats(){
 const p=planState();
 let done=0,total=0;
 for(const w of Object.values(p))for(const d of Object.values(w))for(const s of d){total++;if(s.done)done++}
 const di=dateInfo();
 const wk=di.week;
 let today=(di.state==="in"&&p[wk]&&p[wk][di.jsd])?p[wk][di.jsd].filter(s=>!s.done).length:0;
 if(di.state==="in"){const L=lateInfo().at[wk+"|"+di.jsd];if(L)today+=L.length}
 return {done,total,pct:pct(done,total),week:wk,today,state:di.state,start:planStartDate()};
}

/* ---------- late lectures carry over (computed live, plan data untouched) ---------- */
function lateInfo(){
 const p=planState(),di=dateInfo(),at={},from={};
 if(di.state==="before")return {at:at,from:from};
 const curW=di.state==="after"?PLAN_WEEKS+1:di.week;
 const todayI=di.state==="after"?9999:(di.days%7);
 const slots=[];
 for(let w=1;w<=PLAN_WEEKS;w++)DAYS.forEach(([jd],o)=>{if(jd!==5)slots.push({w:w,jd:jd,o:o,idx:(w-1)*7+o})});
 const nowIdx=di.state==="after"?9999:di.days;
 for(let w0=1;w0<curW&&w0<=PLAN_WEEKS;w0++){
  DAYS.forEach(([jd0])=>{(p[w0][jd0]||[]).forEach((it,i)=>{
   if(it.s==="rev"||it.done)return;
   const rest=slots.filter(x=>x.w>w0&&x.idx>=nowIdx);
   let tg=rest.find(x=>(p[x.w][x.jd]||[]).some(y=>y.s===it.s));
   if(!tg)tg=rest[0];
   if(!tg)tg=slots[slots.length-1];
   const k=tg.w+"|"+tg.jd;
   (at[k]=at[k]||[]).push({w:w0,jd:jd0,i:i,it:it});
   from[w0+"|"+jd0+"|"+i]=tg;
  })});
 }
 return {at:at,from:from};
}

  if(planEdit&&planEdit.jsd===jsd)h+=planEditorHTML(jsd);
  if(planFormDay===jsd){

  }

let tourI=0;
function tourStart(){tourI=0;showTourStep()}
window.tourStart=tourStart;
function showTourStep(){
 const s=TOUR[tourI];
 if(s.go){if(s.go==="home"){if(cur)goHome()}else if(s.go==="plan"){if(cur!=="plan")goPlan()}else if(typeof s.go==="string"){if(cur!==s.go)goSubj(s.go.slice(5))}else if(cur!==s.go[0]||tab!==s.go[1])goLec(s.go[0],s.go[1]);}
 setTimeout(()=>{
  $("#tourbg").style.display="block";
  const card=$("#tourcard");
  $("#tourtext").textContent=s.text;
  $("#tourcount").textContent=(tourI+1)+" / "+TOUR.length;
  $("#tournext").textContent=tourI===TOUR.length-1?"خلاص":"التالي";
  card.style.display="block";
  const hl=$("#tourhl");
  const el=s.sel?document.querySelector(s.sel):null;
  if(el){
   el.scrollIntoView({block:"center"});
   setTimeout(()=>{
    const r=el.getBoundingClientRect();
    hl.style.display="block";
    hl.style.left=(r.left-6)+"px";hl.style.top=(r.top-6)+"px";
    hl.style.width=(r.width+12)+"px";hl.style.height=(r.height+12)+"px";
    const ch=card.offsetHeight;
    let top=r.bottom+14;
    if(top+ch>window.innerHeight-10)top=Math.max(10,r.top-ch-14);
    card.style.top=top+"px";
   },420);
  }else{
   hl.style.display="none";
   card.style.top="30%";
  }
 },s.go?380:60);
}
function tourNext(){tourI++;if(tourI>=TOUR.length){tourEnd();return}showTourStep()}
window.tourNext=tourNext;
function tourEnd(){$("#tourbg").style.display="none";$("#tourhl").style.display="none";$("#tourcard").style.display="none";S.tourDone=true;save();goHome()}
window.tourEnd=tourEnd;

function render(){
 if(!cur){home();return}
 if(cur.startsWith("subj:")){picker(cur.slice(5));return}
 if(cur==="plan"){
  hdr.innerHTML=`<button class="back" onclick="goHome()">&#8592; All subjects</button><div class="hrow"><h1>Study plan</h1><button class="tourbtn" onclick="tourStart()">؟ جولة</button></div><p>جدول المذاكرة الأسبوعي</p>`;
  app.innerHTML=planView();
  return;
 }
 headerSubj(cur);
 let body="";
 if(tab==="learn")body=learn(cur);
 else if(tab==="cards")body=cards(cur);
 else if(tab==="quiz")body=quiz(cur);
 else if(tab==="recall")body=recall(cur);
 else if(tab==="notes")body=notes(cur);
 else body=prog(cur);
 app.innerHTML=tabsHtml(cur)+body;
 initViewers();
}
render();
if(!S.tourDone){setTimeout(tourStart,700)}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!planEdit&&(cur==="plan"||!cur))render()});
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
