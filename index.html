ors, unapproved extension cords.</p>", "ar": "<p>الأنواع: A مواد صلبة (ورق وخشب) وB سوايل أو غازات قابلة للاشتعال وC معدات كهربية. الطفاية الكيميائية الجافة متعددة الأغراض بتنفع للتلاتة. وقت الحريق: إخلاء وإبلاغ وطمأنة المرضى ومكافحة لو مناسب. مخالفات شائعة: سد أبواب الحريق وتخزين معدات في الممرات ووصلات كهرباء غير معتمدة.</p>"}], "terms": [["fire triangle", "Fuel, oxygen and heat.", "مثلث النار: وقود وأكسجين وحرارة."]]}, {"id": "care9_2", "title_en": "Falls, ergonomics and transfers", "title_ar": "السقوط والميكانيكا والنقل", "figs": [], "blocks": [{"en": "<p>Keep corridors clear, store heavy items low, deal with spills (limit access, clean if qualified, otherwise report). Ergonomics is workplace injury prevention; common injuries are musculoskeletal. Body mechanics rests on base of support, center of gravity and line of gravity.</p>", "ar": "<p>سيب الممرات فاضية وخزن الحاجات التقيلة تحت وتعامل مع الانسكابات (امنع الدخول ونضف لو مؤهل وإلا بلّغ). الإرجونوميكس هو منع إصابات العمل وأكترها عضلية هيكلية. ميكانيكا الجسم قايمة على قاعدة الارتكاز ومركز الثقل وخط الثقل.</p>"}, {"en": "<p>Patients must be transported by wheelchair or stretcher, never walking or carried (infants). Prepare: check chart and ID, plan, check equipment, get help, tell the patient. Wheelchair: set the brakes, extra care after stroke or joint replacement; patients who cannot stand need a 2-3 person or hydraulic lift. Stretcher: for those unable to stand; use a draw sheet and slider board; side rails or straps always.</p>", "ar": "<p>المريض لازم يتنقل بكرسي أو نقالة وليس ماشي ولا الرضيع محمول. جهز: راجع الملف والهوية وخطط وراجع المعدات وهات مساعدة وعرّف المريض. الكرسي: اقفل الفرامل واحذر بعد السكتة أو تغيير مفصل؛ ومن لا يقف يحتاج رفع بـ2-3 أشخاص أو رافعة. النقالة: لمن لا يقف؛ استخدم draw sheet وslider board والسور أو الأحزمة دايماً.</p>"}], "terms": [["body mechanics", "Proper body alignment, movement and balance to reduce effort and injury.", "ميكانيكا الجسم."]]}], "flash": [{"f": "Fire components?", "b": "Fuel, oxygen, heat."}, {"f": "Class A, B, C fires?", "b": "Solids; flammable liquids/gases; electrical."}, {"f": "Best all-round extinguisher?", "b": "Multipurpose dry chemical."}, {"f": "What to do in a fire?", "b": "Evacuate, report, reassure, fight if appropriate."}, {"f": "Three concepts of body mechanics?", "b": "Base of support, center of gravity, line of gravity."}, {"f": "Spill action?", "b": "Limit access, evaluate, clean if qualified or report."}, {"f": "Why not let patients walk to radiology?", "b": "Weakness or fainting is unsafe."}, {"f": "First step before transfer?", "b": "Check chart and patient ID."}, {"f": "Wheelchair before transfer?", "b": "Set the brakes."}, {"f": "Stretcher safety?", "b": "Always use side rails or straps."}], "quiz": [{"q": "Which is NOT needed for fire?", "o": ["Fuel", "Water", "Oxygen", "Heat"], "a": 1, "w": "الماية بتطفي."}, {"q": "Class C fire involves:", "o": ["Electrical equipment", "Paper", "Flammable liquid", "Wood"], "a": 0, "w": "كهرباء."}, {"q": "A wet-chemical-free multipurpose extinguisher is:", "o": ["Water only", "Sand only", "Foam only", "Dry chemical"], "a": 3, "w": "الكيميائية الجافة."}, {"q": "Heavy items should be stored:", "o": ["On high shelves", "In corridors", "Near the floor", "Near wires"], "a": 2, "w": "تحت."}, {"q": "Ergonomics concerns:", "o": ["Drug dosing", "Workplace injury prevention", "Fire classes", "Diet"], "a": 1, "w": "منع إصابات."}, {"q": "Wheelchair transfer first:", "o": ["Set brakes", "Run", "Skip help", "Tilt the chair"], "a": 0, "w": "الفرامل."}, {"q": "Patients unable to stand are moved by:", "o": ["Walking", "Carrying infants", "Hopping", "Stretcher or lift"], "a": 3, "w": "نقالة أو رافعة."}, {"q": "On stretchers always use:", "o": ["Nothing", "Oxygen", "Side rails or straps", "Wheels unlocked"], "a": 2, "w": "سور وأحزمة."}], "recall": [{"q": "Explain fire prevention and classes.", "a": "Fire triangle, causes, classes A/B/C, multipurpose extinguisher, response steps.", "w": "الحريق."}, {"q": "Describe safe transfer of patients.", "a": "Wheelchair vs stretcher, brakes, help, draw sheet/slider board, side rails, body mechanics.", "w": "النقل."}]}, "care10": {"name": "Patient Care", "lec": "Lecture 10 - Hygiene and cross-infection", "short": "Care", "sections": [{"id": "care10_1", "title_en": "Causes of infection", "title_ar": "مسببات العدوى", "figs": [], "blocks": [{"en": "<p>Cross-infection is acquiring disease by contact with a source of infection. Agents: bacteria, viruses, parasites, fungi. Harmful bacteria are pathogens. Types: cocci (staphylococci in groups, pus forming; streptococci in chains, throat infections), bacilli, vibrios and spirillae (GI infections).</p>", "ar": "<p>العدوى المتقاطعة هي اكتساب مرض بالتلامس مع مصدر عدوى. المسببات: بكتيريا وفيروسات وطفيليات وفطريات. البكتيريا الضارة اسمها pathogens. الأنواع: كروية (staphylococci عناقيد وبتعمل صديد وstreptococci سلاسل والتهاب حلق) وعصوية وvibrios وspirillae (التهابات هضمية).</p>"}, {"en": "<p>Viruses are smaller than bacteria and multiply inside cells. Fungi cause ringworm, monilia and thrush (Candida albicans, common in radiotherapy of mouth or throat). Parasites live at the host's expense; Bilharzia contributes to bladder tumor. Routes: inhalation, ingestion, inoculation.</p>", "ar": "<p>الفيروسات أصغر من البكتيريا وبتتكاثر داخل الخلايا. الفطريات: ringworm وmonilia وthrush (Candida albicans شائع مع العلاج الإشعاعي للفم والحلق). الطفيليات بتعيش على حساب العائل؛ البلهارسيا بتساهم في ورم المثانة. الطرق: استنشاق وبلع وحقن/جروح.</p>"}], "terms": [["pathogen", "A harmful microorganism.", "ميكروب ضار."], ["cross-infection", "Acquiring disease by contact with a source of infection.", "عدوى متقاطعة."]]}, {"id": "care10_2", "title_en": "Sterilization and asepsis", "title_ar": "التعقيم والتعقيم الجراحي", "figs": [], "blocks": [{"en": "<p>Methods: chemical (germicidal bath), dry heat (165-170 C, 1-6 hours), gas (electrical, plastic, rubber, optical items), autoclave steam (121-135 C under pressure, quickest and most effective), ionizing radiation (cobalt-60).</p>", "ar": "<p>الطرق: كيميائي (حمام مطهر) وحرارة جافة (165-170 م لمدة 1-6 ساعات) وغاز (كهرباء وبلاستيك ومطاط وبصريات) وأوتوكلاف بخار (121-135 م تحت ضغط الأسرع والأكفأ) وإشعاع مؤين (كوبالت 60).</p>"}, {"en": "<p>A sterile package is clean, dry, unopened, unexpired and its indicator has changed color. Principles of surgical asepsis: touched sterile items become contaminated, never reach across the field, discard if in doubt, do not pass between physician and field, never leave it unattended; 1 inch border is a buffer zone.</p>", "ar": "<p>الباكيت المعقم نضيف وناشف ومقفول وصلاحيته سارية ومؤشره غير لونه. مبادئ التعقيم الجراحي: أي حاجة معقمة لمست غير معقم تتلوث وما تمدش إيدك فوق الحقل وارميها لو شاكك ومتعديش بين الدكتور والحقل وما تسيبش المنطقة والحافة 1 بوصة منطقة عازلة.</p>"}], "terms": [["autoclave", "Steam sterilization at 121-135 C under pressure.", "أوتوكلاف: تعقيم بالبخار."]]}], "flash": [{"f": "Four causative agents?", "b": "Bacteria, viruses, parasites, fungi."}, {"f": "Staphylococci?", "b": "Grape-like groups, pus forming."}, {"f": "Streptococci?", "b": "Chains; throat infections like tonsillitis."}, {"f": "Three routes of infection?", "b": "Inhalation, ingestion, inoculation."}, {"f": "Thrush organism?", "b": "Candida albicans."}, {"f": "Bilharzia effect?", "b": "Contributes to bladder tumor."}, {"f": "Autoclave temperature?", "b": "121-135 C under pressure."}, {"f": "Dry heat?", "b": "165-170 C for 1-6 hours."}, {"f": "Sterile package criteria?", "b": "Clean, dry, unopened, unexpired, indicator changed."}, {"f": "Buffer zone of sterile field?", "b": "1 inch border."}], "quiz": [{"q": "Which is a fungus?", "o": ["Staphylococcus", "Streptococcus", "Candida albicans", "Bilharzia"], "a": 2, "w": "فطر."}, {"q": "Streptococci form:", "o": ["Clusters", "Chains", "Spirals", "Rods"], "a": 1, "w": "سلاسل."}, {"q": "Ingestion means:", "o": ["Swallowing infected food or drink", "Breathing", "Skin cut", "Needle"], "a": 0, "w": "بلع."}, {"q": "Most convenient sterilization:", "o": ["Dry heat", "Cold bath", "UV only", "Autoclave"], "a": 3, "w": "أوتوكلاف."}, {"q": "Gas sterilization is for:", "o": ["Metal tools only", "Glass only", "Electrical, plastic, rubber", "Food"], "a": 2, "w": "كهرباء وبلاستيك."}, {"q": "A sterile item touching a non-sterile one:", "o": ["Stays sterile", "Becomes contaminated", "Cleans itself", "Is stronger"], "a": 1, "w": "يتلوث."}, {"q": "Cobalt-60 is used for:", "o": ["Sterilizing packs", "Treating thrush", "Heating", "Fire"], "a": 0, "w": "تعقيم."}, {"q": "Border of sterile field:", "o": ["10 cm sterile", "None", "Sterile always", "1 inch buffer"], "a": 3, "w": "1 بوصة."}], "recall": [{"q": "Explain causes and routes of infection.", "a": "Bacteria, viruses, fungi, parasites; inhalation, ingestion, inoculation.", "w": "العدوى."}, {"q": "List sterilization methods and asepsis principles.", "a": "Chemical, dry heat, gas, autoclave, radiation; never reach across field, discard if in doubt.", "w": "التعقيم."}]}, "care11": {"name": "Patient Care", "lec": "Lecture 11 - Health-illness continuum and attitude", "short": "Care", "sections": [{"id": "care11_1", "title_en": "Wellness continuum", "title_ar": "سلسلة الصحة والمرض", "figs": [], "blocks": [{"en": "<p>The illness-wellness continuum shows degrees of health. Left of center is worsening health; right is increasing wellbeing. The treatment paradigm (drugs, surgery, psychotherapy...) brings you to the neutral point; the wellness paradigm works at any point and moves you beyond neutral.</p>", "ar": "<p>سلسلة المرض والعافية بتوضح درجات الصحة. يسار المنتصف تدهور في الصحة ويمين المنتصف زيادة في العافية. نموذج العلاج (أدوية وجراحة وعلاج نفسي...) يوصلك للنقطة المحايدة ونموذج العافية يشتغل في أي نقطة ويحركك بعدها.</p>"}, {"en": "<p>Wellness is not static. It includes caring for the body, using the mind, expressing emotions, being creative with others and caring for physical, psychological and spiritual environments. It matters which direction you face. A person can be ill but wellness oriented, or healthy with an illness mentality.</p>", "ar": "<p>العافية مش حالة ثابتة. بتشمل رعاية الجسم واستخدام العقل والتعبير عن المشاعر والإبداع مع الناس والاهتمام بالبيئة الجسدية والنفسية والروحية. الاتجاه اللي بتواجهه هو المهم. ممكن تبقى مريض بعقلية العافية أو سليم بعقلية المرض.</p>"}], "terms": [["wellness paradigm", "Approach that moves a person toward higher levels of health beyond the neutral point.", "نموذج العافية."]]}, {"id": "care11_2", "title_en": "Attitude and professionalism", "title_ar": "الاتجاه والمهنية", "figs": [], "blocks": [{"en": "<p>An attitude is a psychological tendency expressed by evaluating an entity with some degree of favour or disfavour. It exists when a person evaluates an object and expresses that evaluation.</p>", "ar": "<p>الاتجاه (attitude) ميل نفسي بيتعبر عنه بتقييم شيء بدرجة من التأييد أو الرفض. بيوجد لما الشخص يقيّم موضوع ويعبر عن التقييم.</p>"}, {"en": "<p>Job satisfaction comes from a good professional attitude plus self-care, empathy for patients and precautions against burnout. Taking part in professional activities promotes growth, aids colleagues and the profession.</p>", "ar": "<p>الرضا الوظيفي بييجي من اتجاه مهني كويس مع رعاية النفس وتعاطف مع المرضى واحتياطات ضد الاحتراق الوظيفي. المشاركة المهنية بتنمي المهنة وتساعد الزملاء.</p>"}], "terms": [["burnout", "Exhaustion from prolonged work stress.", "احتراق وظيفي."]]}], "flash": [{"f": "Left of center on the continuum?", "b": "Worsening health."}, {"f": "Treatment paradigm brings you to?", "b": "The neutral point."}, {"f": "Wellness paradigm role?", "b": "Moves toward high-level wellness at any point."}, {"f": "Is wellness static?", "b": "No."}, {"f": "Can an ill person be wellness oriented?", "b": "Yes."}, {"f": "Define attitude.", "b": "A tendency expressed by favouring or disfavouring an entity."}, {"f": "What gives job satisfaction?", "b": "Good attitude, self-care, empathy, avoiding burnout."}], "quiz": [{"q": "The treatment paradigm reaches:", "o": ["High wellness", "Burnout", "Death only", "The neutral point"], "a": 3, "w": "النقطة المحايدة."}, {"q": "Wellness is:", "o": ["A fixed state", "Absence of illness only", "A direction, not static", "Only physical"], "a": 2, "w": "اتجاه."}, {"q": "An attitude is:", "o": ["A disease", "Evaluation expressed as favour or disfavour", "A drug", "A fixed trait"], "a": 1, "w": "تقييم."}, {"q": "Right of center means:", "o": ["Increasing wellbeing", "Worsening health", "Death", "Treatment only"], "a": 0, "w": "زيادة عافية."}, {"q": "Burnout prevention supports:", "o": ["Sickness", "Anxiety", "Mistakes", "Job satisfaction"], "a": 3, "w": "رضا وظيفي."}, {"q": "The wellness paradigm:", "o": ["Replaces treatment", "Forbids drugs", "Works with treatment", "Is only mental"], "a": 2, "w": "بيشتغل مع العلاج."}], "recall": [{"q": "Explain the illness-wellness continuum.", "a": "Degrees of health; treatment to neutral point, wellness beyond; direction matters.", "w": "السلسلة."}, {"q": "What is attitude and why does it matter for job satisfaction?", "a": "Evaluative tendency; good attitude, self-care and empathy give satisfaction.", "w": "الاتجاه."}]}, "care12": {"name": "Patient Care", "lec": "Lecture 12 - Positioning, restraints and incidents", "short": "Care", "sections": [{"id": "care12_1", "title_en": "Body positions", "title_ar": "أوضاع الجسم", "figs": [], "blocks": [{"en": "<p>Recumbent: lying down. Supine: on the back. Prone: face down. Lateral recumbent: on one side (right or left). Sims: comfortable, used for rectal exam and enema. Fowler: upper body elevated; semi-Fowler: partly elevated. Trendelenburg: head lower than feet (about 15 degrees), used in some procedures and shock. Knee-chest and lithotomy are used by physicians and nurses.</p>", "ar": "<p>Recumbent: نايم. Supine: على الضهر. Prone: على البطن. Lateral: على جنب (يمين أو شمال). Sims: مريح لفحص الشرج والحقنة الشرجية. Fowler: الجزء العلوي مرفوع؛ semi-Fowler: مرفوع جزئياً. Trendelenburg: الرأس أوطى من الرجلين (حوالي 15 درجة) ويفيد في الصدمة. Knee-chest وlithotomy بيستخدمها الأطباء والتمريض.</p>"}, {"en": "<p>Use radiolucent sponges for support and padding under bony prominences. A pillow under the head relieves neck strain and apprehension. Elderly skin tears easily with shear pressure and may lead to decubitus ulcers.</p>", "ar": "<p>استخدم إسفنج شفاف للأشعة للدعم تحت النتوءات العظمية. مخدة تحت الرأس بتريح الرقبة وتقلل القلق. جلد كبار السن بيتقطع بسهولة بالاحتكاك وممكن يعمل قرح فراش.</p>"}], "terms": [["Trendelenburg", "Head lower than feet, table tilted about 15 degrees.", "الرأس أوطى من الرجلين."]]}, {"id": "care12_2", "title_en": "Restraints, immobilization and incidents", "title_ar": "التقييد والتثبيت والحوادث", "figs": [], "blocks": [{"en": "<p>Restraints (wrist/ankle bands, vest) protect disoriented patients and need an order. Immobilization (straps, compression bands, sandbags, stockinette) prevents motion and does not need an order. The mummy wrap, Tam-em immobilizer, papoose board (2-6 years) and Pigg-O-Stat are used for children.</p>", "ar": "<p>التقييد (أربطة معصم وكاحل وسترة) لحماية المريض المشوش ومحتاج أمر. التثبيت (أحزمة وأربطة ضغط وأكياس رمل) لمنع الحركة ومش محتاج أمر. لف الميمي وTam-em وpapoose board (2-6 سنين) وPigg-O-Stat للأطفال.</p>"}, {"en": "<p>Any fall or accident must be reported immediately to the supervisor or radiologist, then an incident report completed, whether the victim is a patient, visitor or staff. If a patient, also record in the chart. Incident reports support risk management.</p>", "ar": "<p>أي وقعة أو حادثة تتبلغ فوراً للمشرف أو طبيب الأشعة وبعدها تتعبى تقرير حادث سواء المصاب مريض أو زائر أو موظف. ولو مريض يتسجل في الملف كمان. التقارير بتخدم إدارة المخاطر.</p>"}], "terms": [["incident report", "Written report of any accident or injury, completed after the victim is treated.", "تقرير الحادث."]]}], "flash": [{"f": "Supine versus prone?", "b": "On the back vs face down."}, {"f": "Trendelenburg?", "b": "Head lower than feet, about 15 degrees."}, {"f": "Fowler position?", "b": "Upper body elevated."}, {"f": "Sims position use?", "b": "Rectal exam and enema."}, {"f": "Why use radiolucent sponges?", "b": "Support and padding without showing on the image."}, {"f": "Restraint versus immobilization?", "b": "Restraint needs an order; immobilization does not."}, {"f": "Papoose board age?", "b": "2 to 6 years."}, {"f": "When to write an incident report?", "b": "After any injury or accident once the victim is attended."}, {"f": "Who must be informed first?", "b": "Departmental supervisor or radiologist."}], "quiz": [{"q": "Lying face down:", "o": ["Prone", "Supine", "Fowler", "Sims"], "a": 0, "w": "prone."}, {"q": "Head lower than feet:", "o": ["Fowler", "Sims", "Lithotomy", "Trendelenburg"], "a": 3, "w": "Trendelenburg."}, {"q": "Best for enema:", "o": ["Prone", "Fowler", "Sims", "Supine"], "a": 2, "w": "Sims."}, {"q": "Restraints require:", "o": ["Nothing", "A physician's order", "Parent only", "Student note"], "a": 1, "w": "أمر طبي."}, {"q": "Immobilization requires:", "o": ["No order", "Court order", "Surgery", "Anesthesia"], "a": 0, "w": "بدون أمر."}, {"q": "Papoose board suits:", "o": ["Newborns only", "Adults", "Teenagers", "2-6 years"], "a": 3, "w": "2-6 سنين."}, {"q": "Elderly skin is:", "o": ["Very thick", "Never injured", "Easily torn by shear", "Hairless"], "a": 2, "w": "بيتقطع."}, {"q": "Incident reports help:", "o": ["Billing only", "Risk management", "Advertising", "Nothing"], "a": 1, "w": "إدارة المخاطر."}], "recall": [{"q": "Name common body positions.", "a": "Supine, prone, lateral, Sims, Fowler, semi-Fowler, Trendelenburg.", "w": "الأوضاع."}, {"q": "Differentiate restraint and immobilization and describe incidents.", "a": "Restraint needs an order; immobilization no; report incidents at once and write a report.", "w": "التقييد والحوادث."}]}, "care13": {"name": "Patient Care", "lec": "Lecture 13 - Communication in patient care", "short": "Care", "sections": [{"id": "care13_1", "title_en": "Culture and nonverbal communication", "title_ar": "الثقافة والتواصل غير اللفظي", "figs": [], "blocks": [{"en": "<p>Diversity includes ethnic, racial, religious, gender, age and economic differences. Culture affects communication, modesty, diet and acceptance of treatments. Do not stereotype by national origin. Radiographers are ethically required to meet the needs of all patients.</p>", "ar": "<p>التنوع يشمل العرق والدين والنوع والعمر والحالة الاقتصادية. الثقافة بتأثر على التواصل والحشمة والأكل وتقبل العلاج. ما تعمّمش حسب البلد. الراديوجرافر ملزم أخلاقياً بتلبية احتياجات كل المرضى.</p>"}, {"en": "<p>Much communication is nonverbal: posture, expressions, gestures, eye contact, tone. Direct eye contact shows interest but is not welcome in all cultures. Touch should be firm but gentle, only as necessary, and explained first. Appearance shapes patient confidence.</p>", "ar": "<p>جزء كبير من التواصل غير لفظي: وضع الجسم وتعابير الوش والإيماءات والنظر والنبرة. النظر المباشر يدل على اهتمام لكنه مش مقبول في كل الثقافات. اللمس ثابت ولطيف وبقدر الحاجة وبعد الشرح. المظهر بيأثر على ثقة المريض.</p>"}], "terms": [["nonverbal communication", "Messages sent without words: posture, gestures, eye contact, tone.", "تواصل غير لفظي."]]}, {"id": "care13_2", "title_en": "Listening, attitude and stress", "title_ar": "الاستماع والاتجاه والتوتر", "figs": [], "blocks": [{"en": "<p>Listening means giving full attention. Speak clearly, face to face, with language suited to the listener. Attitudes show through tone and word choice and are more powerful than words. Assertiveness (calm, firm) is effective; aggressiveness shows hostility.</p>", "ar": "<p>الاستماع إنك تدي انتباه كامل. اتكلم بوضوح ووش لوش وبلغة تناسب السامع. الاتجاهات بتظهر في النبرة واختيار الكلام وأقوى من الكلام. الحزم الهادي فعال والعدوانية بتبين عداء.</p>"}, {"en": "<p>Validation: the listener reflects the information back accurately. Under stress, lower your voice, speak slowly, be nonjudgmental, avoid inappropriate reactions and validate by asking an open-ended question.</p>", "ar": "<p>التأكيد (validation): السامع يعيد المعلومة بدقة. وقت التوتر اخفض صوتك واتكلم ببطء وبدون أحكام وتجنب ردود الفعل غير المناسبة وتأكد بسؤال مفتوح.</p>"}], "terms": [["validation", "Confirming understanding by having information reflected back.", "التأكد من الفهم."]]}], "flash": [{"f": "Why not stereotype patients?", "b": "Individuals vary within cultures."}, {"f": "Nonverbal signals?", "b": "Posture, facial expression, gestures, eye contact, tone."}, {"f": "Direct eye contact?", "b": "Shows interest but not welcome in all cultures."}, {"f": "Positive touch?", "b": "Firm but gentle, necessary, explained."}, {"f": "Good listening?", "b": "Full attention, respond appropriately."}, {"f": "Assertive versus aggressive?", "b": "Calm and firm vs hostile."}, {"f": "What is validation?", "b": "Information reflected back accurately."}, {"f": "Communication under stress?", "b": "Lower voice, slow speech, no judgment, open-ended question."}], "quiz": [{"q": "Cultural differences affect:", "o": ["Radiation units", "Modesty and diet", "Exposure time", "Anatomy"], "a": 1, "w": "حشمة وأكل."}, {"q": "Stereotyping by origin is:", "o": ["Avoided", "Required", "Helpful", "Ethical"], "a": 0, "w": "ممنوع."}, {"q": "A positive touch is:", "o": ["Abrupt", "Tentative", "Absent", "Firm but gentle"], "a": 3, "w": "ثابت ولطيف."}, {"q": "More powerful than words:", "o": ["Spelling", "Posture only", "Attitude", "Distance"], "a": 2, "w": "الاتجاه."}, {"q": "Assertiveness is:", "o": ["Hostile", "Calm and firm", "Passive", "Loud"], "a": 1, "w": "هادي وحازم."}, {"q": "Validation uses:", "o": ["Open-ended questions", "Yes/no only", "Silence", "Orders"], "a": 0, "w": "سؤال مفتوح."}, {"q": "Under stress, you:", "o": ["Raise it", "Argue", "Rush", "Lower your voice"], "a": 3, "w": "اخفض صوتك."}], "recall": [{"q": "Explain cultural and nonverbal communication.", "a": "Culture shapes expectations; eye contact, touch, appearance, tone matter.", "w": "الثقافة وغير اللفظي."}, {"q": "How do you communicate under stress?", "a": "Calm voice, slow speech, nonjudgmental, validate with open question.", "w": "وقت التوتر."}]}, "care14": {"name": "Patient Care", "lec": "Lecture 14 - Communicating with special patient groups and families", "short": "Care", "sections": [{"id": "care14_1", "title_en": "Addressing and assessing patients", "title_ar": "مخاطبة المريض وتقييمه", "figs": [], "blocks": [{"en": "<p>Address patients by name with friendliness; ask how they prefer to be addressed (outside public areas). Avoid assumptions, especially for ambulatory patients needing preparation. Conversation helps assessment: alert or confused, hearing, language, ability to get on the table.</p>", "ar": "<p>نادي المريض باسمه بود واسأله يحب يتنادى إزاي (بعيداً عن الأماكن العامة). تجنب الافتراضات وخصوصاً للمرضى الماشيين اللي محتاجين تحضير. المحادثة بتساعد التقييم: واعي ولا مشوش وسمعه ولغته وقدرته يطلع على الترابيزة.</p>"}, {"en": "<p>Age-specific care: neonate/infant (birth-1 yr), toddler (1-2), preschooler (3-5), school age (6-12), adolescent (13-18), young adult (19-45), middle adult (46-64), late adult (65-79), old adult (80+). Use qualified interpreters rather than family members.</p>", "ar": "<p>الرعاية حسب السن: رضيع (0-1 سنة) وطفل صغير (1-2) وما قبل المدرسة (3-5) وسن مدرسة (6-12) ومراهق (13-18) وشاب (19-45) وبالغ متوسط (46-64) ومتأخر (65-79) ومسن (80+). استخدم مترجم مؤهل بدل أفراد الأسرة.</p>"}], "terms": [["age-specific care", "Communication matched to the patient's developmental stage.", "الرعاية حسب المرحلة العمرية."]]}, {"id": "care14_2", "title_en": "Special needs and families", "title_ar": "احتياجات خاصة والأسرة", "figs": [], "blocks": [{"en": "<p>Hearing impaired: get attention, face them with light on your face, speak lower and somewhat louder, clearly, moderate pace, avoid noise. Deaf: may lip-read or use sign language; they have a right to an interpreter. Impaired vision: ask what help is useful and respect independence. Aphasia is damage to speech centers. Loss of a sense is not loss of intelligence.</p>", "ar": "<p>ضعاف السمع: اجذب انتباههم ووشك ناحية النور وصوت أوطى وأعلى شوية وواضح وببطء وبعيد عن الضوضاء. الصم: قراءة الشفايف أو لغة الإشارة ولهم حق مترجم. ضعاف البصر: اسأل عن المساعدة واحترم استقلاليتهم. Aphasia تلف في مراكز الكلام. فقد حاسة مش فقد ذكاء.</p>"}, {"en": "<p>Impaired mental function: use methods suited to a child of similar mental age but keep adult dignity. Patients with decreased consciousness cannot be relied on to remember instructions; protect them and speak as if they can hear. Teach by allowing time, listening, printed materials, reviewing steps and validating.</p>", "ar": "<p>ضعف الوظيفة العقلية: استخدم أساليب مناسبة لطفل بنفس العمر العقلي مع الحفاظ على كرامة البالغ. المريض بوعي منخفض ما ينفعش يعتمد على تذكره؛ احميه واتكلم كأنه سامع. علّم بالوقت والاستماع والمواد المطبوعة ومراجعة الخطوات والتأكد.</p>"}, {"en": "<p>Families: be sensitive and tolerant, they may be upset and may want to hold the patient's hand or await results. Radiographers may sometimes image patients who have died and are kept on life support as organ donors, or crime victims.</p>", "ar": "<p>الأسر: كن حساس ومتسامح فقد يكونوا منزعجين وعايزين يمسكوا إيد المريض أو يستنوا النتيجة. أحياناً الراديوجرافر بيصور مريض متوفى على أجهزة كمتبرع بأعضاء أو ضحايا جرائم.</p>"}], "terms": [["aphasia", "Inability to speak due to damage to brain speech centers.", "فقدان القدرة على الكلام لتلف مراكز الكلام."]]}], "flash": [{"f": "How to address a patient?", "b": "By name; ask preference in private."}, {"f": "Age group 6-12?", "b": "School age."}, {"f": "Age group 65-79?", "b": "Late adult."}, {"f": "Better than family translators?", "b": "Qualified interpreters."}, {"f": "Hearing impaired approach?", "b": "Face them, light on face, clear moderate speech, quiet area."}, {"f": "Deaf patients?", "b": "May lip-read or sign; have a right to an interpreter."}, {"f": "Aphasia?", "b": "Speech center damage."}, {"f": "Communicating with impaired mental function?", "b": "Child-level methods with adult dignity."}, {"f": "Unconscious or sedated patient?", "b": "Protect and speak as if they hear."}, {"f": "Dealing with family?", "b": "Sensitive and tolerant."}], "quiz": [{"q": "The adolescent age range:", "o": ["6-12", "19-45", "13-18", "1-2"], "a": 2, "w": "13-18."}, {"q": "Interpreters should be:", "o": ["Family members", "Qualified", "Neighbours", "None"], "a": 1, "w": "مؤهلين."}, {"q": "Deaf patients:", "o": ["Have a right to an interpreter", "Cannot communicate", "Need loud speech", "Must write only"], "a": 0, "w": "لهم حق مترجم."}, {"q": "For hearing impaired, you:", "o": ["Turn away", "Shout", "Whisper", "Face them with light"], "a": 3, "w": "وشك للنور."}, {"q": "Aphasia relates to:", "o": ["Eyes", "Ears", "Speech centers", "Heart"], "a": 2, "w": "مراكز الكلام."}, {"q": "Loss of sight, hearing or speech is:", "o": ["Loss of intelligence", "Not loss of intelligence", "A diagnosis", "Contagious"], "a": 1, "w": "مش فقد ذكاء."}, {"q": "With impaired mental function:", "o": ["Keep adult dignity", "Treat as an infant", "Ignore", "Shout"], "a": 0, "w": "احترم كرامته."}, {"q": "Late adult is:", "o": ["46-64", "80+", "19-45", "65-79"], "a": 3, "w": "65-79."}], "recall": [{"q": "Explain age-specific and special-needs communication.", "a": "Stages from neonate to old adult; hearing, vision, speech, mental impairments; interpreters.", "w": "الفئات الخاصة."}, {"q": "How do you deal with patients' families?", "a": "Sensitively and tolerantly; they help the patient; sometimes imaging deceased donors.", "w": "الأسرة."}]}, "physio1": {"name": "Physiology", "lec": "Lecture 1 - Introduction to endocrinology", "short": "Physio", "sections": [{"id": "physio1_1", "title_en": "Hormones and glands", "title_ar": "الهرمونات والغدد", "figs": [], "blocks": [{"en": "<p>Endocrine glands are ductless and release hormones directly into blood to act on target organs. Organs with endocrine function include hypothalamus, kidney, heart and GIT. Glands essential to life: anterior pituitary (ACTH), adrenal cortex (cortisol), parathyroid (PTH). Hormones act as endocrine (distant), paracrine (neighbouring) or autocrine (same cell).</p>", "ar": "<p>الغدد الصماء ملهاش قنوات وبتفرز الهرمونات في الدم مباشرة على الأعضاء المستهدفة. أعضاء ليها وظيفة صماء: الهيبوثالامس والكلية والقلب والجهاز الهضمي. غدد أساسية للحياة: الفص الأمامي للنخامية (ACTH) وقشرة الكظر (كورتيزول) والجار درقية (PTH). الهرمون ممكن يشتغل endocrine (بعيد) أو paracrine (جار) أو autocrine (نفس الخلية).</p>"}, {"en": "<p>Chemical types: proteins/polypeptides (growth hormone), steroids from cholesterol (estrogens), amines (thyroid hormone). Lipid soluble hormones travel free or protein bound; the free form is active, the bound form is inactive storage and gives a longer half-life.</p>", "ar": "<p>الأنواع الكيميائية: بروتينات (هرمون النمو) وستيرويدات من الكوليسترول (استروجين) وأمينات (هرمون الغدة الدرقية). الهرمونات الذائبة في الدهون بتتنقل حرة أو مرتبطة ببروتين؛ الحرة نشطة والمرتبطة مخزن غير نشط وبتطول نصف العمر.</p>"}], "terms": [["hormone", "Chemical substance released by endocrine glands to act on specific target cells.", "هرمون: مادة كيميائية من غدة صماء تؤثر على خلايا مستهدفة."]]}, {"id": "physio1_2", "title_en": "Fate and action of hormones", "title_ar": "مصير الهرمون وتأثيره", "figs": [], "blocks": [{"en": "<p>Steroid hormones are destroyed mainly in the liver; peptide hormones mainly in the kidney. Half-life is the time for blood hormone concentration to fall by half; peptide hormones usually have shorter half-life than steroid and thyroid hormones. Peptide hormone receptors are on the cell membrane; steroid receptors are in the cytoplasm or nucleus.</p>", "ar": "<p>هرمونات الستيرويد بتتكسر أساساً في الكبد والببتيدية في الكلية. نصف العمر هو الوقت اللي يقل فيه تركيز الهرمون للنص؛ والببتيدية عادة نصف عمرها أقصر من الستيرويد والدرقية. مستقبلات الببتيدية على غشاء الخلية ومستقبلات الستيرويد جوه الخلية في السيتوبلازم أو النواة.</p>"}], "terms": [["half-life", "Time for the blood concentration of a hormone to fall to half.", "نصف العمر."]]}], "flash": [{"f": "Define endocrine gland.", "b": "Ductless gland releasing hormones directly into blood."}, {"f": "Endocrine, paracrine, autocrine?", "b": "Distant target, neighbouring cells, same cell."}, {"f": "Three glands essential to life?", "b": "Anterior pituitary, adrenal cortex, parathyroid."}, {"f": "Chemical classes of hormones?", "b": "Proteins, steroids, amines."}, {"f": "Active form of a transported hormone?", "b": "The free form."}, {"f": "Where are steroids destroyed?", "b": "Mainly liver."}, {"f": "Where are peptide hormones destroyed?", "b": "Mainly kidney."}, {"f": "Peptide receptors location?", "b": "Cell membrane."}], "quiz": [{"q": "Growth hormone is a:", "o": ["Steroid", "Protein hormone", "Amine", "Lipid"], "a": 1, "w": "بروتين."}, {"q": "Estrogens are:", "o": ["Steroids", "Proteins", "Amines", "Peptides"], "a": 0, "w": "ستيرويد."}, {"q": "Active hormone form:", "o": ["Protein-bound", "Conjugated stored", "Excreted", "Free"], "a": 3, "w": "الحرة."}, {"q": "Steroid receptors are:", "o": ["Membrane", "Extracellular", "Intracellular", "Absent"], "a": 2, "w": "داخل الخلية."}, {"q": "Peptide hormones are mainly destroyed in:", "o": ["Liver", "Kidney", "Skin", "Bone"], "a": 1, "w": "الكلية."}, {"q": "Longer half-life goes with:", "o": ["Higher protein-bound fraction", "Lower binding", "Peptide only", "No receptor"], "a": 0, "w": "الارتباط ببروتين."}, {"q": "Paracrine action means:", "o": ["Acts on same cell", "Distant only", "No action", "Acts on neighbouring cells"], "a": 3, "w": "الخلايا المجاورة."}], "recall": [{"q": "Define hormone and signaling types.", "a": "Chemical messenger; endocrine, paracrine, autocrine.", "w": "التعريف."}, {"q": "Compare peptide and steroid hormones.", "a": "Receptors membrane vs intracellular; destroyed kidney vs liver; shorter vs longer half-life.", "w": "المقارنة."}]}, "physio2": {"name": "Physiology", "lec": "Lecture 2 - Hypothalamus and pituitary gland", "short": "Physio", "sections": [{"id": "physio2_1", "title_en": "Pituitary structure and control", "title_ar": "تركيب النخامية والتحكم", "figs": [], "blocks": [{"en": "<p>The pituitary (about 1 g) lies in the hypophyseal fossa and has anterior and posterior lobes. The anterior lobe is connected to the hypothalamus by the hypothalamic-hypophysial portal system carrying releasing and inhibiting hormones. The posterior lobe receives direct neural tracts; its hormones are stored in axons.</p>", "ar": "<p>النخامية (حوالي 1 جم) في الحفرة النخامية ولها فص أمامي وخلفي. الأمامي متصل بالهيبوثالامس بنظام الأوعية البابي اللي بينقل الهرمونات المحفزة والمثبطة. الخلفي ليه مسارات عصبية مباشرة وهرموناته مخزنة في المحاور.</p>"}, {"en": "<p>Anterior cells: somatotropes (GH), lactotropes (prolactin), corticotropes (ACTH), thyrotropes (TSH), gonadotropes (LH and FSH). Tropic hormones act on another endocrine gland: they stimulate its hormone synthesis and growth and increase its blood supply.</p>", "ar": "<p>خلايا الأمامي: somatotropes (GH) وlactotropes (برولاكتين) وcorticotropes (ACTH) وthyrotropes (TSH) وgonadotropes (LH وFSH). الهرمونات المحفزة (tropic) بتأثر على غدة تانية: بتنشط تصنيعها ونموها وتزود الدم ليها.</p>"}], "terms": [["tropic hormone", "Anterior pituitary hormone acting on another endocrine gland.", "هرمون محفز لغدة تانية."]]}, {"id": "physio2_2", "title_en": "Growth hormone", "title_ar": "هرمون النمو", "figs": [], "blocks": [{"en": "<p>GH is a single chain peptide from somatotropes. It stimulates growth of bones, muscles and viscera, increases amino acid uptake and protein synthesis (anabolic), reduces glucose utilization (hyperglycaemic) and mobilizes fat (ketogenic). Somatomedins (IGFs) formed in the liver mediate its actions.</p>", "ar": "<p>GH ببتيد سلسلة واحدة من somatotropes. بيحفز نمو العظام والعضلات والأحشاء وبيزود امتصاص الأحماض الأمينية وتصنيع البروتين (بنائي) وبيقلل استهلاك الجلوكوز (رافع للسكر) وبيحرك الدهون (كيتوني). السوماتوميدينات (IGF) من الكبد بتتوسط تأثيره.</p>"}, {"en": "<p>GHRH stimulates and GHIH inhibits secretion. Increased by hypoglycaemia, fasting, amino acids, exercise, deep sleep and stress; decreased by hyperglycaemia and free fatty acids. Deficiency in childhood causes dwarfism and delayed bone maturation.</p>", "ar": "<p>GHRH بيحفز وGHIH بيثبط. بيزيد مع نقص السكر والصيام والأحماض الأمينية والتمرين والنوم العميق والتوتر؛ وبيقل مع ارتفاع السكر والأحماض الدهنية. نقصه في الطفولة بيسبب قزامة وتأخر نضج العظام.</p>"}], "terms": [["somatomedins", "Insulin-like growth factors made in the liver that mediate GH actions.", "وسطاء هرمون النمو."]]}], "flash": [{"f": "Anterior pituitary cell types?", "b": "Somatotropes, lactotropes, corticotropes, thyrotropes, gonadotropes."}, {"f": "What links hypothalamus and anterior pituitary?", "b": "Hypothalamic-hypophysial portal system."}, {"f": "How do posterior pituitary hormones reach it?", "b": "Neural tracts; stored in axons."}, {"f": "What is a tropic hormone?", "b": "Acts on another endocrine gland."}, {"f": "GH metabolic effects?", "b": "Anabolic, hyperglycaemic, ketogenic."}, {"f": "Mediators of GH?", "b": "Somatomedins (IGFs) from liver."}, {"f": "Stimulators of GH?", "b": "Hypoglycaemia, fasting, amino acids, exercise, deep sleep, stress."}, {"f": "GH deficiency in childhood?", "b": "Dwarfism, delayed bone maturation."}], "quiz": [{"q": "Thyrotropes secrete:", "o": ["GH", "Prolactin", "TSH", "ACTH"], "a": 2, "w": "TSH."}, {"q": "Lactotropes secrete:", "o": ["LH", "Prolactin", "ACTH", "TSH"], "a": 1, "w": "برولاكتين."}, {"q": "GH is:", "o": ["Hyperglycaemic", "Hypoglycaemic", "Catabolic", "Neutral"], "a": 0, "w": "رافع للسكر."}, {"q": "GH release is decreased by:", "o": ["Fasting", "Deep sleep", "Exercise", "Hyperglycaemia"], "a": 3, "w": "ارتفاع السكر."}, {"q": "Posterior pituitary hormones are:", "o": ["Made by portal system", "Made by corticotropes", "Stored in axons", "Absent"], "a": 2, "w": "مخزنة."}, {"q": "Childhood GH deficiency causes:", "o": ["Gigantism", "Short stature", "Obesity", "Goitre"], "a": 1, "w": "قزامة."}, {"q": "GH acts via:", "o": ["Somatomedins", "Insulin", "Cortisol", "ACTH"], "a": 0, "w": "IGF."}], "recall": [{"q": "Describe hypothalamic control of the pituitary.", "a": "Portal system with releasing/inhibiting hormones to anterior; neural tracts to posterior.", "w": "التحكم."}, {"q": "Explain GH actions and control.", "a": "Growth, anabolic, hyperglycaemic, ketogenic; GHRH/GHIH; factors.", "w": "هرمون النمو."}]}, "physio3": {"name": "Physiology", "lec": "Lecture 3 - Thyroid gland", "short": "Physio", "sections": [{"id": "physio3_1", "title_en": "Structure and hormones", "title_ar": "التركيب والهرمونات", "figs": [], "blocks": [{"en": "<p>The thyroid is the largest endocrine gland (20-25 g) with two lobes joined by an isthmus. Follicular cells secrete T4 and T3; parafollicular cells secrete calcitonin. T4 and T3 are iodinated amino acids; 99.98% of T4 and 99.8% of T3 are protein bound (TBG, transthyretin, albumin).</p>", "ar": "<p>الغدة الدرقية أكبر غدة صماء (20-25 جم) من فصين بينهم برزخ. الخلايا الجريبية بتفرز T4 وT3 والجار جريبية بتفرز الكالسيتونين. T4 وT3 أحماض أمينية فيها يود؛ 99.98% من T4 و99.8% من T3 مرتبطين ببروتين (TBG وtransthyretin وألبومين).</p>"}, {"en": "<p>Mechanism: hormones enter the cell, most T4 becomes T3, bind nuclear receptors, induce mRNA and protein synthesis. Control: TRH from hypothalamus stimulates TSH, which stimulates the thyroid, and thyroid hormone feeds back negatively.</p>", "ar": "<p>الآلية: الهرمون يدخل الخلية ومعظم T4 يتحول لـT3 ويرتبط بمستقبلات النواة وينتج mRNA وبروتينات. التحكم: TRH من الهيبوثالامس يحفز TSH اللي يحفز الدرقية وهرمون الدرقية يعمل تغذية راجعة سالبة.</p>"}], "terms": [["calorigenesis", "Increase in heat production and oxygen use by tissues.", "زيادة إنتاج الحرارة واستهلاك الأكسجين."]]}, {"id": "physio3_2", "title_en": "Actions", "title_ar": "التأثيرات", "figs": [], "blocks": [{"en": "<p>Main functions: calorigenic and metabolic effects, growth and development, nervous system development. Carbohydrate: more absorption. Protein: moderate doses increase synthesis, large doses increase catabolism (muscle weakness). Lipid: stimulates all aspects, degradation more, lowers plasma cholesterol (more LDL receptors). Increases vitamin demand.</p>", "ar": "<p>الوظائف: حرارية وأيضية ونمو وتطور الجهاز العصبي. سكريات: يزود الامتصاص. بروتين: جرعات متوسطة تزود التصنيع والكبيرة تزود الهدم (ضعف عضلات). دهون: ينشط كل الجوانب والتكسير أكتر ويقلل الكوليسترول (مستقبلات LDL أكتر). يزود الحاجة للفيتامينات.</p>"}, {"en": "<p>Growth: essential for skeletal maturation; hypothyroid infants (cretins) have slowed bone growth and mental retardation. Adults: hypothyroidism slows mentation, hyperthyroidism causes anxiety. CVS: increases beta receptors, heart rate, contractility, cardiac output and systolic pressure.</p>", "ar": "<p>النمو: أساسي لنضج الهيكل؛ رضع قصور الدرقية (cretins) نموهم بطيء وتخلف عقلي. البالغين: القصور يبطئ التفكير والفرط يسبب قلق. القلب: يزود مستقبلات بيتا ومعدل القلب والانقباض والناتج القلبي والضغط الانقباضي.</p>"}], "terms": [["cretinism", "Hypothyroidism in infants causing slow bone growth and mental retardation.", "القماءة: قصور الدرقية عند الرضع."]]}], "flash": [{"f": "Largest endocrine gland?", "b": "Thyroid, 20-25 g."}, {"f": "Which cells make calcitonin?", "b": "Parafollicular cells."}, {"f": "Thyroid binding proteins?", "b": "TBG, transthyretin, albumin."}, {"f": "Control chain?", "b": "TRH, TSH, thyroid hormone, negative feedback."}, {"f": "Calorigenesis?", "b": "More heat and oxygen use."}, {"f": "Effect on cholesterol?", "b": "Lowers it via more LDL receptors."}, {"f": "Hypothyroid infant?", "b": "Cretin: slow bones, mental retardation."}, {"f": "CVS effects?", "b": "Heart rate, force, output, systolic BP up."}], "quiz": [{"q": "T4 and T3 come from:", "o": ["Parafollicular cells", "Pituitary", "Adrenal", "Follicular cells"], "a": 3, "w": "الجريبية."}, {"q": "Calcitonin comes from:", "o": ["Follicular cells", "Liver", "Parafollicular cells", "Thymus"], "a": 2, "w": "الجار جريبية."}, {"q": "TSH is stimulated by:", "o": ["ACTH", "TRH", "GHRH", "CRH"], "a": 1, "w": "TRH."}, {"q": "Thyroid hormones plasma cholesterol:", "o": ["Decrease it", "Increase it", "No effect", "Double it"], "a": 0, "w": "بتقللها."}, {"q": "Large doses of thyroid hormone:", "o": ["Only synthesis", "No effect", "Reduce heart rate", "Increase protein catabolism"], "a": 3, "w": "هدم."}, {"q": "Hypothyroidism in adults:", "o": ["Causes anxiety", "Raises BP", "Slows mentation", "Speeds metabolism"], "a": 2, "w": "تبطئ التفكير."}, {"q": "Most T4 becomes ___ in the cell:", "o": ["Calcitonin", "T3", "TSH", "TRH"], "a": 1, "w": "T3."}], "recall": [{"q": "Explain thyroid hormone synthesis control and mechanism.", "a": "TRH-TSH axis, negative feedback, nuclear receptor and mRNA.", "w": "التحكم والآلية."}, {"q": "List thyroid hormone actions.", "a": "Calorigenic, metabolic, growth, CNS, CVS.", "w": "التأثيرات."}]}, "physio4": {"name": "Physiology", "lec": "Lecture 4 - Adrenal gland", "short": "Physio", "sections": [{"id": "physio4_1", "title_en": "Medulla and cortex", "title_ar": "النخاع والقشرة", "figs": [], "blocks": [{"en": "<p>The adrenal is two glands. The medulla secretes catecholamines (adrenaline mainly, noradrenaline, dopamine) under preganglionic sympathetic control during stress (hypoglycaemia, exercise, trauma). Alpha receptors prefer noradrenaline and beta prefer adrenaline. Effects: vasoconstriction (alpha1), vasodilatation (beta2), more heart rate and force (beta1), glycogenolysis, lipolysis, higher metabolic rate and alertness.</p>", "ar": "<p>الكظر غدتين. النخاع بيفرز الكاتيكولامينات (أدرينالين أساساً ونورأدرينالين ودوبامين) تحت تحكم السمبثاوي في الضغط (نقص سكر وتمرين وإصابة). مستقبلات ألفا تفضل النورأدرينالين وبيتا الأدرينالين. التأثيرات: انقباض أوعية (alpha1) وتوسع (beta2) وزيادة معدل وقوة القلب (beta1) وتكسير الجليكوجين والدهون وزيادة الأيض واليقظة.</p>"}, {"en": "<p>Cortex zones: glomerulosa (aldosterone), fasciculata and reticularis (glucocorticoids and androgens). ACTH from anterior pituitary (under CRH) controls cortisol, with circadian rhythm and negative feedback. Aldosterone is controlled by angiotensin II, serum K+ and ACTH. Renin from juxtaglomerular cells cuts angiotensinogen; ACE (mainly lungs) makes angiotensin II.</p>", "ar": "<p>مناطق القشرة: glomerulosa (ألدوستيرون) وfasciculata وreticularis (جلوكوكورتيكويد وأندروجين). ACTH من الأمامي (بـCRH) يتحكم في الكورتيزول مع إيقاع يومي وتغذية راجعة سالبة. الألدوستيرون بتحكمه angiotensin II وK+ وACTH. الرينين من الخلايا جار الكبيبية يقطع angiotensinogen وACE (في الرئة) يكوّن angiotensin II.</p>"}], "terms": [["catecholamines", "Adrenaline, noradrenaline and dopamine.", "الكاتيكولامينات."]]}, {"id": "physio4_2", "title_en": "Cortisol, aldosterone and disorders", "title_ar": "الكورتيزول والألدوستيرون والأمراض", "figs": [], "blocks": [{"en": "<p>Cortisol: gluconeogenesis, proteolysis, lipolysis, permissive effect for catecholamines and glucagon, raises RBCs, neutrophils and platelets, lowers eosinophils, basophils and lymphocytes. Pharmacologically anti-inflammatory, anti-allergic, immunosuppressive.</p>", "ar": "<p>الكورتيزول: تكوين جلوكوز وتحليل بروتين وتحليل دهون وتأثير مسموح للكاتيكولامينات والجلوكاجون ويزود RBC والنيوتروفيل والصفائح ويقلل الإيوزينوفيل والباسوفيل والليمفاوي. دوائياً مضاد التهاب وحساسية ومثبط مناعة.</p>"}, {"en": "<p>Cushing's: hyperglycaemia, muscle and bone wasting, thin skin, central obesity, moon face, hypertension, polycythaemia. Addison's: cortisol deficiency (TB, autoimmune); stress can be fatal by hypotension and hypoglycaemia. Aldosterone retains sodium in the distal nephron and increases K+ excretion; excess = Conn's syndrome.</p>", "ar": "<p>Cushing: ارتفاع سكر وضمور عضلات وعظام وجلد رقيق وسمنة مركزية ووش قمر وضغط عالي وزيادة RBC. Addison: نقص كورتيزول (سل أو مناعة)؛ التوتر ممكن يكون مميت بهبوط الضغط ونقص السكر. الألدوستيرون يحتفظ بالصوديوم في الجزء البعيد من النيفرون ويزود طرد البوتاسيوم؛ وزيادته = Conn.</p>"}], "terms": [["Cushing's syndrome", "Cortisol excess: central obesity, moon face, hypertension, hyperglycaemia.", "زيادة الكورتيزول."]]}], "flash": [{"f": "Main adrenal medullary hormone?", "b": "Adrenaline."}, {"f": "Which zone makes aldosterone?", "b": "Zona glomerulosa."}, {"f": "What controls cortisol?", "b": "ACTH, under CRH, with negative feedback."}, {"f": "Who converts angiotensin I to II?", "b": "ACE, mainly in lungs."}, {"f": "Cortisol actions?", "b": "Gluconeogenesis, proteolysis, lipolysis, anti-inflammatory."}, {"f": "Cushing features?", "b": "Central obesity, moon face, hypertension, hyperglycaemia."}, {"f": "Addison's disease?", "b": "Cortisol deficiency; hypotension, hypoglycaemia."}, {"f": "Aldosterone action?", "b": "Na+ retention, K+ excretion."}], "quiz": [{"q": "Adrenal medulla is under:", "o": ["Sympathetic control", "ACTH", "TSH", "Renin"], "a": 0, "w": "سمبثاوي."}, {"q": "Aldosterone is made in:", "o": ["Medulla", "Fasciculata", "Reticularis", "Zona glomerulosa"], "a": 3, "w": "glomerulosa."}, {"q": "ACTH is stimulated by:", "o": ["TRH", "GHRH", "CRH", "FSH"], "a": 2, "w": "CRH."}, {"q": "Cortisol reduces:", "o": ["Neutrophils", "Lymphocytes", "Platelets", "RBCs"], "a": 1, "w": "الليمفاوي."}, {"q": "Moon face suggests:", "o": ["Cushing's syndrome", "Addison's", "Conn's", "Goitre"], "a": 0, "w": "Cushing."}, {"q": "Hypotension and hypoglycaemia under stress:", "o": ["Cushing's", "Conn's", "Diabetes insipidus", "Addison's disease"], "a": 3, "w": "Addison."}, {"q": "Excess aldosterone is called:", "o": ["Cushing's", "Addison's", "Conn's syndrome", "Graves"], "a": 2, "w": "Conn."}], "recall": [{"q": "Compare adrenal medulla and cortex hormones.", "a": "Catecholamines vs mineralocorticoid, glucocorticoid, androgens, with controls.", "w": "المقارنة."}, {"q": "Describe cortisol actions and its disorders.", "a": "Metabolic, blood count, anti-inflammatory; Cushing's and Addison's.", "w": "الكورتيزول."}]}, "physio5": {"name": "Physiology", "lec": "Lecture 5 - Endocrine pancreas", "short": "Physio", "sections": [{"id": "physio5_1", "title_en": "Islets and hormones", "title_ar": "الجزر والهرمونات", "figs": [], "blocks": [{"en": "<p>Islets of Langerhans are about 2% of pancreas volume: A cells 25% (glucagon, 29 aa), B cells 65% (insulin, 51 aa), D cells (somatostatin), F cells (pancreatic polypeptide). Glucagon is glycogenolytic, gluconeogenic, lipolytic and ketogenic; inhibited by glucose and somatostatin. Somatostatin inhibits both insulin and glucagon.</p>", "ar": "<p>جزر لانجرهانس حوالي 2% من حجم البنكرياس: خلايا A 25% (جلوكاجون 29 حمض) وخلايا B 65% (إنسولين 51 حمض) وخلايا D (سوماتوستاتين) وخلايا F (ببتيد البنكرياس). الجلوكاجون يحلل الجليكوجين ويكوّن الجلوكوز ويحلل الدهون وكيتوني؛ ويتثبط بالجلوكوز والسوماتوستاتين. السوماتوستاتين يثبط الإنسولين والجلوكاجون.</p>"}, {"en": "<p>Insulin has an A chain (21 aa) and B chain (30 aa) joined by two disulfide bridges. Actions: protein (more uptake and synthesis, less breakdown), lipid (more fatty acid synthesis, less ketogenesis, activates lipoprotein lipase), carbohydrate (more glucose entry via GLUT4, more glycogenesis, less gluconeogenesis and glycogenolysis).</p>", "ar": "<p>الإنسولين سلسلة A (21) وسلسلة B (30) بجسرين ثنائي كبريت. التأثيرات: بروتين (امتصاص وتصنيع أكتر وهدم أقل) ودهون (تصنيع أحماض دهنية أكتر وكيتونات أقل وينشط lipoprotein lipase) وسكريات (دخول جلوكوز بـGLUT4 وجليكوجين أكتر وتكوين جلوكوز وتكسير أقل).</p>"}], "terms": [["islets of Langerhans", "Endocrine cell groups in the pancreas.", "جزر لانجرهانس."]]}, {"id": "physio5_2", "title_en": "Control and disorders", "title_ar": "التحكم والاضطرابات", "figs": [], "blocks": [{"en": "<p>Insulin secretion is stimulated by glucose, amino acids, ketone bodies, GIP and parasympathetic activity; inhibited by somatostatin, sympathetic alpha stimulation and hypokalaemia. Fasting glucose is 70-110 mg/dl (4-6 mmol/L). The liver stores, makes and releases glucose, coordinated by insulin and its antagonists: glucagon, adrenaline, GH, cortisol.</p>", "ar": "<p>إفراز الإنسولين يتحفز بالجلوكوز والأحماض الأمينية والكيتونات وGIP والباراسمبثاوي؛ ويتثبط بالسوماتوستاتين والسمبثاوي ألفا ونقص البوتاسيوم. سكر الصيام 70-110 مجم/دل. الكبد يخزن ويصنع ويطلق الجلوكوز بتنسيق الإنسولين ومضاداته: جلوكاجون وأدرينالين وGH وكورتيزول.</p>"}, {"en": "<p>Insulin excess gives hypoglycaemia: sweating, tremors, hunger, palpitations, irritability, convulsions, coma. Insulin deficiency gives diabetes mellitus: fatigue, polyuria, thirst, hunger, weight loss. Type 1 (IDDM) appears early and needs insulin; type 2 (NIDDM) appears late and is treated with drugs that stimulate insulin.</p>", "ar": "<p>زيادة الإنسولين = نقص سكر: عرق ورعشة وجوع وخفقان وعصبية وتشنج وغيبوبة. نقص الإنسولين = سكري: إجهاد وبول كتير وعطش وجوع ونزول وزن. النوع 1 (IDDM) بدري ويحتاج إنسولين والنوع 2 (NIDDM) متأخر ويعالج بأدوية تحفز الإنسولين.</p>"}], "terms": [["diabetes mellitus", "Disorder of insulin deficiency with hyperglycaemia, polyuria, thirst and weight loss.", "السكري."]]}], "flash": [{"f": "Which islet cell makes insulin?", "b": "B cells, 65%."}, {"f": "Which makes glucagon?", "b": "A cells, 25%."}, {"f": "Somatostatin effect?", "b": "Inhibits insulin and glucagon."}, {"f": "Insulin and glucose entry?", "b": "Increases via GLUT4."}, {"f": "Stimulators of insulin?", "b": "Glucose, amino acids, ketones, GIP, parasympathetic."}, {"f": "Inhibitors of insulin?", "b": "Somatostatin, sympathetic, hypokalaemia."}, {"f": "Insulin antagonists?", "b": "Glucagon, adrenaline, GH, cortisol."}, {"f": "Fasting glucose range?", "b": "70-110 mg/dl."}, {"f": "Hypoglycaemia symptoms?", "b": "Sweating, tremor, hunger, palpitations, convulsions."}], "quiz": [{"q": "Insulin is made by:", "o": ["A cells", "B cells", "D cells", "F cells"], "a": 1, "w": "B."}, {"q": "Glucagon is:", "o": ["Glycogenolytic", "Glycogenic", "Hypoglycaemic", "Anabolic"], "a": 0, "w": "يحلل الجليكوجين."}, {"q": "Insulin decreases:", "o": ["Glycogenesis", "Protein synthesis", "Glucose entry", "Gluconeogenesis"], "a": 3, "w": "بيقلل."}, {"q": "Which inhibits insulin?", "o": ["Glucose", "GIP", "Sympathetic alpha stimulation", "Parasympathetic"], "a": 2, "w": "السمبثاوي."}, {"q": "Type 1 diabetes:", "o": ["Is treated only by diet", "Needs insulin", "Appears late", "Has no symptoms"], "a": 1, "w": "IDDM."}, {"q": "Insulin excess causes:", "o": ["Hypoglycaemia", "Polyuria", "Ketoacidosis", "Weight loss"], "a": 0, "w": "نقص سكر."}, {"q": "Fasting glucose normal:", "o": ["200 mg/dl", "30 mg/dl", "300 mg/dl", "70-110 mg/dl"], "a": 3, "w": "70-110."}], "recall": [{"q": "Name islet cells and their hormones.", "a": "A glucagon, B insulin, D somatostatin, F pancreatic polypeptide.", "w": "الخلايا."}, {"q": "Describe insulin actions and diabetes.", "a": "Protein, lipid, CHO; deficiency leads to DM.", "w": "الإنسولين."}]}, "physio6": {"name": "Physiology", "lec": "Lecture 6 - Pineal gland and thymus", "short": "Physio", "sections": [{"id": "physio6_1", "title_en": "Pineal gland", "title_ar": "الغدة الصنوبرية", "figs": [], "blocks": [{"en": "<p>The pineal gland secretes melatonin. Production is stimulated by the suprachiasmatic nucleus (SCN) of the hypothalamus, the primary center of circadian rhythms (internal 24 hour clock). Light and dark changes synchronize it. Melatonin regulates the sleep-wake cycle; secretion increases with darkness and peaks in the middle of the night.</p>", "ar": "<p>الغدة الصنوبرية بتفرز الميلاتونين. إنتاجه بيتحفز من النواة فوق التصالبية (SCN) في الهيبوثالامس وهي المركز الأساسي للإيقاع اليومي (ساعة 24 ساعة). تغير الضوء والضلمة بينظمه. الميلاتونين بينظم النوم واليقظة؛ بيزيد مع الضلمة وبيوصل ذروته في نص الليل.</p>"}], "terms": [["melatonin", "Pineal hormone that regulates circadian rhythm and sleep.", "هرمون الإيقاع اليومي والنوم."]]}, {"id": "physio6_2", "title_en": "Thymus", "title_ar": "الغدة الزعترية", "figs": [], "blocks": [{"en": "<p>The thymus is the site of production of T cells (thymus-dependent lymphocytes) involved in cell-mediated immunity. It secretes thymosin, believed to stimulate T cells after they leave. It is large in newborns and children and regresses after puberty, infiltrated by fibrous tissue.</p>", "ar": "<p>الزعترية مكان إنتاج الخلايا التائية (T cells) المسؤولة عن المناعة الخلوية. بتفرز thymosin اللي يُعتقد إنه ينشط T cells بعد خروجها. كبيرة عند الأطفال وبتضمر بعد البلوغ وبيتسلل ليها نسيج ليفي.</p>"}], "terms": [["thymosin", "Thymus hormone believed to stimulate T cells.", "هرمون الزعترية."]]}], "flash": [{"f": "Pineal hormone?", "b": "Melatonin."}, {"f": "What drives melatonin production?", "b": "Suprachiasmatic nucleus."}, {"f": "When does melatonin peak?", "b": "Middle of the night."}, {"f": "Role of melatonin?", "b": "Sleep-wake cycle regulation."}, {"f": "Thymus product?", "b": "T cells and thymosin."}, {"f": "T cells give what immunity?", "b": "Cell-mediated."}, {"f": "Thymus after puberty?", "b": "Regresses and becomes fibrous."}], "quiz": [{"q": "Melatonin is secreted by:", "o": ["Thymus", "Thyroid", "Pineal gland", "Pituitary"], "a": 2, "w": "الصنوبرية."}, {"q": "The body clock center is:", "o": ["Thalamus", "SCN", "Cerebellum", "Pons"], "a": 1, "w": "SCN."}, {"q": "Melatonin increases with:", "o": ["Darkness", "Light", "Exercise", "Eating"], "a": 0, "w": "الضلمة."}, {"q": "T cells mature in the:", "o": ["Pineal", "Liver", "Kidney", "Thymus"], "a": 3, "w": "الزعترية."}, {"q": "Thymosin:", "o": ["Makes melatonin", "Lowers calcium", "Stimulates T cells", "Makes insulin"], "a": 2, "w": "ينشط T."}, {"q": "The thymus is largest in:", "o": ["Elderly", "Children", "Adults", "Athletes"], "a": 1, "w": "الأطفال."}], "recall": [{"q": "Explain pineal function.", "a": "Melatonin, SCN, circadian rhythm.", "w": "الصنوبرية."}, {"q": "Explain thymus function.", "a": "T cells, thymosin, involution after puberty.", "w": "الزعترية."}]}, "physio7": {"name": "Physiology", "lec": "Lecture 7 - Urinary system, nephron, renal blood flow and GFR", "short": "Physio", "sections": [{"id": "physio7_1", "title_en": "Kidney and nephron", "title_ar": "الكلية والنيفرون", "figs": [], "blocks": [{"en": "<p>Urinary system: two kidneys, two ureters, bladder, urethra. Kidney functions: excretion of wastes (urea, creatinine, uric acid, drugs), acid-base balance, ECF volume and electrolytes, blood pressure, and endocrine functions (erythropoietin, vitamin D activation, renin). Each kidney has about one million nephrons: glomerulus (filtration) and tubule (PCT, loop of Henle, DCT, collecting duct).</p>", "ar": "<p>الجهاز البولي: كليتين وحالبين ومثانة وإحليل. وظائف الكلية: إخراج الفضلات (يوريا وكرياتينين ويوريك أسيد وأدوية) وتوازن الحموضة وحجم السوائل والأملاح وضغط الدم ووظائف صماء (إريثروبويتين وتنشيط فيتامين د ورينين). كل كلية فيها حوالي مليون نيفرون: كبيبة (ترشيح) وأنبوب (PCT وعروة هنلي وDCT والقناة الجامعة).</p>"}, {"en": "<p>Cortical nephrons are about 85% with short loops; juxtamedullary nephrons 15% with long loops. Renal blood flow is 1.2 L/min (20-25% of cardiac output), 90% to cortex, and is autoregulated between mean arterial pressure 80-180 mmHg. Sympathetic, catecholamines, angiotensin II and ADH decrease RBF; dopamine increases it.</p>", "ar": "<p>النيفرونات القشرية حوالي 85% بعروة قصيرة والمجاورة للنخاع 15% بعروة طويلة. تدفق الدم الكلوي 1.2 لتر/دقيقة (20-25% من الناتج القلبي) و90% للقشرة ويتنظم ذاتياً عند ضغط 80-180 مم زئبق. السمبثاوي والكاتيكولامينات وangiotensin II وADH بتقلله والدوبامين بيزوده.</p>"}], "terms": [["nephron", "Functional unit of the kidney: glomerulus plus tubule.", "النيفرون: الوحدة الوظيفية للكلية."]]}, {"id": "physio7_2", "title_en": "Glomerular filtration", "title_ar": "الترشيح الكبيبي", "figs": [], "blocks": [{"en": "<p>Urine formation: filtration, reabsorption, secretion. GFR is the plasma volume filtered by both kidneys per minute: 125 ml/min (180 L/day). More than 99% is reabsorbed; urine is 1-1.5 L/day. Plasma proteins are not normally filtered.</p>", "ar": "<p>تكوين البول: ترشيح وامتصاص وإفراز. GFR هو حجم البلازما المترشح بالكليتين في الدقيقة: 125 مل/د (180 لتر/يوم). أكتر من 99% بيتمتص والبول 1-1.5 لتر/يوم. بروتينات البلازما مش بتترشح عادةً.</p>"}, {"en": "<p>Factors: surface area (about 0.8 m2), membrane permeability (under 4 nm passes easily, over 8 nm restricted; positive charge passes more easily), hydrostatic pressure (capillary 45-60 mmHg favours filtration, Bowman's capsule 10 mmHg opposes) and oncotic pressure (capillary 25 mmHg opposes). NFP = HPg - (OPg + HPc).</p>", "ar": "<p>العوامل: مساحة السطح (حوالي 0.8 م2) ونفاذية الغشاء (أقل من 4 نانومتر يعدي بسهولة وأكتر من 8 مقيد والشحنة الموجبة تعدي أسهل) والضغط الهيدروستاتيكي (الشعيرة 45-60 تشجع الترشيح وكبسولة بومان 10 تعارض) والضغط الأونكوتيكي (الشعيرة 25 يعارض). NFP = HPg - (OPg + HPc).</p>"}], "terms": [["GFR", "Plasma volume filtered by both kidneys per minute, 125 ml/min.", "معدل الترشيح الكبيبي."]]}], "flash": [{"f": "Kidney functions?", "b": "Excretion, acid-base, ECF and electrolytes, BP, endocrine."}, {"f": "Number of nephrons per kidney?", "b": "About one million."}, {"f": "Cortical vs juxtamedullary nephron percentages?", "b": "85% short loops, 15% long loops."}, {"f": "Renal blood flow?", "b": "1.2 L/min, 20-25% of CO."}, {"f": "Autoregulation range?", "b": "MAP 80-180 mmHg."}, {"f": "GFR normal?", "b": "125 ml/min (180 L/day)."}, {"f": "Daily urine volume?", "b": "1-1.5 L."}, {"f": "Net filtration pressure formula?", "b": "HPg - (OPg + HPc)."}, {"f": "Pressure opposing filtration?", "b": "Capillary oncotic 25 and capsule hydrostatic 10 mmHg."}], "quiz": [{"q": "The functional unit of the kidney:", "o": ["Glomerulus only", "Calyx", "Pelvis", "Nephron"], "a": 3, "w": "النيفرون."}, {"q": "RBF is autoregulated between:", "o": ["20-40", "200-300", "80-180 mmHg", "0-50"], "a": 2, "w": "80-180."}, {"q": "GFR is:", "o": ["1 ml/min", "125 ml/min", "1.2 L/min", "500 ml/min"], "a": 1, "w": "125."}, {"q": "Which increases RBF?", "o": ["Dopamine", "Angiotensin II", "ADH", "Sympathetic"], "a": 0, "w": "الدوبامين."}, {"q": "Particles under what size pass easily?", "o": ["8 nm", "20 nm", "50 nm", "4 nm"], "a": 3, "w": "أقل من 4 نانو."}, {"q": "Which favours filtration?", "o": ["Capillary oncotic pressure", "Capsule pressure", "Glomerular hydrostatic pressure", "Both opposing"], "a": 2, "w": "الضغط الهيدروستاتيكي."}, {"q": "About what fraction of nephrons are cortical?", "o": ["15%", "85%", "50%", "100%"], "a": 1, "w": "85%."}], "recall": [{"q": "Describe the nephron and renal blood flow.", "a": "Glomerulus and tubule; cortical/juxtamedullary; RBF 1.2 L/min autoregulated.", "w": "النيفرون وتدفق الدم."}, {"q": "Explain GFR and its determinants.", "a": "125 ml/min; surface area, permeability, hydrostatic and oncotic pressures.", "w": "GFR."}]}, "physio8": {"name": "Physiology", "lec": "Lecture 8 - Tubular functions", "short": "Physio", "sections": [{"id": "physio8_1", "title_en": "Mechanisms and proximal tubule", "title_ar": "الآليات والأنبوب القريب", "figs": [], "blocks": [{"en": "<p>Reabsorption moves a substance from lumen to blood; secretion moves it from blood to lumen. Mechanisms: passive diffusion, facilitated diffusion, primary active transport (energy against gradients) and secondary active (symport or antiport). Tubular transport maximum (Tm) is the maximum active transport rate, limited by saturation of carriers.</p>", "ar": "<p>الامتصاص من التجويف للدم والإفراز من الدم للتجويف. الآليات: انتشار سلبي وانتشار ميسر ونقل نشط أولي (طاقة ضد التدرج) ونقل نشط ثانوي (symport أو antiport). الحد الأقصى للنقل (Tm) أقصى معدل للنقل النشط بسبب تشبع الناقلات.</p>"}, {"en": "<p>PCT reabsorbs 60-70% of filtered Na+ and water (isotonic), all filtered glucose (SGLT2 with GLUT2, secondary active with Na+) and amino acids. Glucose Tm is 375 mg/min in males and 300 in females; renal threshold is 180 mg/dl, above which glucosuria appears. PCT secretes organic acids (penicillin, uric acid), organic bases and H+, and is the main site for drug secretion.</p>", "ar": "<p>الـPCT بيمتص 60-70% من الصوديوم والماء (متساوي التوتر) وكل الجلوكوز (SGLT2 مع GLUT2 نقل نشط ثانوي مع الصوديوم) والأحماض الأمينية. Tm الجلوكوز 375 مجم/د للرجال و300 للستات والعتبة الكلوية 180 مجم/دل وفوقها يظهر الجلوكوز في البول. الـPCT بيفرز أحماض عضوية (بنسلين ويوريك) وقواعد عضوية وH+ وهو الموقع الرئيسي لإفراز الأدوية.</p>"}], "terms": [["renal threshold", "Blood glucose level above which glucose appears in urine, 180 mg/dl.", "عتبة الجلوكوز الكلوية."]]}, {"id": "physio8_2", "title_en": "Loop of Henle and distal parts", "title_ar": "عروة هنلي والأنابيب البعيدة", "figs": [], "blocks": [{"en": "<p>Thin descending limb: permeable to water, reabsorbs 15-20% of water. Thin ascending: impermeable to water, passive NaCl reabsorption. Thick ascending: impermeable to water, active reabsorption of 20-25% of Na+, K+, Cl- (1Na-1K-2Cl cotransporter).</p>", "ar": "<p>الطرف النازل الرفيع: نافذ للماء وبيمتص 15-20% من الماء. الصاعد الرفيع: غير نافذ للماء وامتصاص NaCl سلبي. الصاعد السميك: غير نافذ للماء وامتصاص نشط 20-25% من Na+ وK+ وCl- (ناقل 1Na-1K-2Cl).</p>"}, {"en": "<p>Distal tubule is relatively impermeable to water and reabsorbs about 5% of filtered water; fluid becomes hypotonic. In collecting ducts water reabsorption is hormonally dependent: ADH increases it according to body need.</p>", "ar": "<p>الأنبوب البعيد غير نافذ نسبياً للماء ويمتص حوالي 5% وبيبقى السائل منخفض التوتر. في القنوات الجامعة امتصاص الماء بيعتمد على الهرمونات: ADH بيزوده حسب احتياج الجسم.</p>"}], "terms": [["ADH", "Hormone that increases collecting duct water reabsorption.", "هرمون يزيد امتصاص الماء."]]}], "flash": [{"f": "Reabsorption versus secretion?", "b": "Lumen to blood vs blood to lumen."}, {"f": "Tm?", "b": "Maximum active transport rate due to carrier saturation."}, {"f": "How much Na+ does PCT reabsorb?", "b": "60-70%."}, {"f": "Glucose Tm male?", "b": "375 mg/min."}, {"f": "Renal threshold?", "b": "180 mg/dl."}, {"f": "Thick ascending limb cotransporter?", "b": "1Na-1K-2Cl."}, {"f": "Distal tubule water reabsorption?", "b": "About 5%."}, {"f": "What controls collecting duct water?", "b": "ADH."}, {"f": "Main drug secretion site?", "b": "PCT."}], "quiz": [{"q": "Glucose reabsorption is:", "o": ["Secondary active with Na+", "Passive", "Primary active", "Absent"], "a": 0, "w": "ثانوي."}, {"q": "Glucosuria appears above:", "o": ["80 mg/dl", "110 mg/dl", "60 mg/dl", "180 mg/dl"], "a": 3, "w": "180."}, {"q": "PCT fluid stays:", "o": ["Hypertonic", "Hypotonic", "Isotonic", "Dry"], "a": 2, "w": "متساوي."}, {"q": "Thin descending limb is permeable to:", "o": ["Solute only", "Water", "Nothing", "Glucose"], "a": 1, "w": "الماء."}, {"q": "Thick ascending limb is:", "o": ["Impermeable to water", "Highly permeable to water", "Permeable to ADH", "Closed"], "a": 0, "w": "غير نافذ."}, {"q": "ADH acts on:", "o": ["PCT only", "Glomerulus", "Ureter", "Collecting ducts"], "a": 3, "w": "القنوات."}, {"q": "Tm is caused by:", "o": ["Low filtration", "Hormones", "Carrier saturation", "Water"], "a": 2, "w": "التشبع."}], "recall": [{"q": "Explain tubular transport mechanisms and Tm.", "a": "Passive, facilitated, primary and secondary active; Tm saturation.", "w": "الآليات."}, {"q": "Describe handling of Na, water and glucose along the nephron.", "a": "PCT 60-70%, loop, distal, collecting with ADH; glucose threshold.", "w": "على طول النيفرون."}]}, "physio9": {"name": "Physiology", "lec": "Lecture 9 - Micturition", "short": "Physio", "sections": [{"id": "physio9_1", "title_en": "Bladder anatomy and innervation", "title_ar": "تشريح المثانة وأعصابها", "figs": [], "blocks": [{"en": "<p>Micturition is a visceral reflex integrated in the spinal cord and influenced by higher centers. Detrusor is smooth muscle (parasympathetic contracts, sympathetic relaxes). Internal sphincter is smooth muscle (sympathetic contracts, parasympathetic relaxes). External sphincter is skeletal muscle supplied by the pudendal nerve (voluntary).</p>", "ar": "<p>التبول منعكس حشوي بيتكامل في النخاع الشوكي وبتأثر بالمراكز العليا. الدترسور عضلة ملساء (الباراسمبثاوي يقبضها والسمبثاوي يرخيها). الصمام الداخلي عضلة ملساء (السمبثاوي يقبض والباراسمبثاوي يرخي). الصمام الخارجي عضلة هيكلية بالعصب الفرجي (إرادي).</p>"}, {"en": "<p>Sympathetic supply from L1-L2 relaxes detrusor and contracts internal sphincter. Parasympathetic from S2-3-4 via pelvic nerve contracts detrusor and relaxes internal sphincter. Somatic supply to the external sphincter is the pudendal nerve S2-3-4.</p>", "ar": "<p>السمبثاوي من L1-L2 يرخي الدترسور ويقبض الصمام الداخلي. الباراسمبثاوي من S2-3-4 بالعصب الحوضي يقبض الدترسور ويرخي الصمام الداخلي. الجسدي للخارجي العصب الفرجي S2-3-4.</p>"}], "terms": [["detrusor", "Smooth muscle of the bladder wall whose contraction empties the bladder.", "عضلة جدار المثانة."]]}, {"id": "physio9_2", "title_en": "Reflex and abnormalities", "title_ar": "المنعكس والاضطرابات", "figs": [], "blocks": [{"en": "<p>Storage phase: parasympathetic inhibited, sympathetic stimulated (detrusor relaxes, internal sphincter contracts). Emptying phase: sympathetic inhibited, parasympathetic stimulated. First urge at 150 ml; reflex triggered at about 400 ml by stretch receptors; afferents via pelvic nerves to sacral S2-3-4 centre. Midbrain inhibits, pons facilitates, cortex gives voluntary control (learned).</p>", "ar": "<p>مرحلة التخزين: الباراسمبثاوي مثبط والسمبثاوي منشط (الدترسور يرتخي والصمام الداخلي ينقبض). مرحلة التفريغ: السمبثاوي مثبط والباراسمبثاوي منشط. أول رغبة عند 150 مل والمنعكس يبدأ عند حوالي 400 مل بمستقبلات الشد؛ الحسية بالأعصاب الحوضية لمركز S2-3-4. الدماغ المتوسط يثبط والبونز ينشط والقشرة تتحكم إرادياً (بالتدريب).</p>"}, {"en": "<p>Automatic bladder: spinal cord damage above S2, reflex emptying without voluntary control after spinal shock. Atonic bladder: damage to sacral center or efferents; reflex lost, overflow dribbling. Enuresis: unintentional urination during sleep; most children are dry by 5 years.</p>", "ar": "<p>المثانة الأوتوماتيكية: تلف النخاع فوق S2 والتفريغ منعكس بدون تحكم إرادي بعد الصدمة. المثانة الأتونية: تلف المركز الساكرال أو الأعصاب الحركية؛ المنعكس يضيع وتنقيط بالفيضان. التبول اللاإرادي: أثناء النوم؛ معظم الأطفال جافين بعمر 5 سنين.</p>"}], "terms": [["enuresis", "Unintentional urination during sleep.", "التبول اللاإرادي."]]}], "flash": [{"f": "External sphincter nerve?", "b": "Pudendal nerve, voluntary."}, {"f": "Parasympathetic effect on bladder?", "b": "Contracts detrusor, relaxes internal sphincter."}, {"f": "Sympathetic segments?", "b": "L1-L2."}, {"f": "Parasympathetic segments?", "b": "S2-3-4 via pelvic nerve."}, {"f": "Volume of first urge?", "b": "150 ml."}, {"f": "Reflex trigger volume?", "b": "About 400 ml."}, {"f": "Midbrain vs pons?", "b": "Midbrain inhibits, pons facilitates."}, {"f": "Automatic bladder cause?", "b": "Cord damage above S2."}, {"f": "Atonic bladder?", "b": "Sacral center or efferent damage; overflow."}, {"f": "Enuresis?", "b": "Bed wetting."}], "quiz": [{"q": "Detrusor contracts by:", "o": ["Sympathetic", "Parasympathetic", "Pudendal only", "None"], "a": 1, "w": "الباراسمبثاوي."}, {"q": "External sphincter is:", "o": ["Skeletal muscle", "Smooth muscle", "Cardiac", "None"], "a": 0, "w": "هيكلية."}, {"q": "Sympathetic during storage:", "o": ["Contracts detrusor", "Relaxes sphincter", "Nothing", "Relaxes detrusor"], "a": 3, "w": "يرخي."}, {"q": "Reflex triggered at about:", "o": ["50 ml", "150 ml", "400 ml", "1 L"], "a": 2, "w": "400 مل."}, {"q": "Overflow incontinence:", "o": ["Automatic bladder", "Atonic bladder", "Enuresis", "Normal"], "a": 1, "w": "أتونية."}, {"q": "Cord damage above S2 gives:", "o": ["Automatic bladder", "Atonic bladder", "Normal", "Enuresis"], "a": 0, "w": "أوتوماتيكية."}, {"q": "Voluntary control is gained by:", "o": ["Birth", "Drugs", "Surgery", "Training"], "a": 3, "w": "بالتدريب."}], "recall": [{"q": "Explain bladder innervation and phases.", "a": "Sympathetic L1-2, parasympathetic S2-4, pudendal; storage vs emptying.", "w": "التعصيب."}, {"q": "Describe micturition reflex and its abnormalities.", "a": "Stretch receptors, sacral centre, higher centres; automatic, atonic, enuresis.", "w": "المنعكس والاضطرابات."}]}, "physio10": {"name": "Physiology", "lec": "Lecture 10 - Acid-base balance", "short": "Physio", "sections": [{"id": "physio10_1", "title_en": "pH, sources and buffers", "title_ar": "pH ومصادر الحمض والمنظمات", "figs": [], "blocks": [{"en": "<p>Normal arterial pH is 7.4 (7.35-7.45); H+ at 7.4 is 40 nmol/L. Below 7.35 is acidosis, above 7.45 alkalosis. Acid sources: CO2 (volatile, about 12,500 mmol H+/day), fixed acids (sulphuric, phosphoric 50-100 mmol/day), organic acids (acetoacetic, lactic), acidifying salts, kidney failure. Alkali sources: loss of gastric acid (vomiting) and ingestion of alkali (NaHCO3, fruits).</p>", "ar": "<p>pH الدم الشرياني الطبيعي 7.4 (7.35-7.45) وH+ عند 7.4 = 40 نانومول/لتر. أقل من 7.35 حموضة وأكتر من 7.45 قلوية. مصادر الحمض: CO2 (متطاير حوالي 12500 مليمول/يوم) وأحماض ثابتة (كبريتيك وفوسفوريك 50-100 مليمول/يوم) وأحماض عضوية (أسيتو أسيتيك ولاكتيك) وأملاح حمضية وفشل كلوي. مصادر القلوي: فقد حمض المعدة (قيء) وتناول قلويات (بيكربونات وفاكهة).</p>"}, {"en": "<p>pH control is vital for enzyme and neuronal function. Three mechanisms: buffers (bicarbonate, phosphate, proteins and hemoglobin), respiratory (chemoreceptors change alveolar ventilation) and renal (H+ secretion in PCT and collecting ducts, bicarbonate reabsorption and generation).</p>", "ar": "<p>التحكم في pH مهم لوظيفة الإنزيمات والأعصاب. ثلاث آليات: منظمات (بيكربونات وفوسفات وبروتينات وهيموجلوبين) وتنفسية (مستقبلات كيميائية تغير التهوية) وكلوية (إفراز H+ في PCT والقنوات الجامعة وامتصاص وتكوين بيكربونات).</p>"}], "terms": [["buffer", "Substance that binds or releases H+ to keep pH nearly constant.", "منظم: مادة تربط أو تطلق H+ لتثبيت pH."]]}, {"id": "physio10_2", "title_en": "Acid-base disturbances", "title_ar": "اضطرابات الحمض والقاعدة", "figs": [], "blocks": [{"en": "<p>Four types. Respiratory acidosis: high PCO2 (respiratory center depression, muscle paralysis, lung disease), low pH. Respiratory alkalosis: low PCO2 (hyperventilation, hypoxia, CNS disease, hysteria), high pH. Metabolic acidosis: low HCO3 (diabetes, uraemia, diarrhoea), low pH. Metabolic alkalosis: high HCO3 (vomiting, NG suction, alkali, diuretics), high pH.</p>", "ar": "<p>أربع أنواع. حموضة تنفسية: PCO2 عالي (تثبيط مركز التنفس وشلل العضلات وأمراض الرئة) وpH واطي. قلوية تنفسية: PCO2 واطي (فرط تهوية ونقص أكسجين وأمراض عصبية وهستيريا) وpH عالي. حموضة أيضية: HCO3 واطي (سكري ويوريميا وإسهال) وpH واطي. قلوية أيضية: HCO3 عالي (قيء وشفط معدة وقلويات ومدرات) وpH عالي.</p>"}, {"en": "<p>Compensation: buffers act first. Respiratory acidosis and alkalosis are compensated by the kidney (more or less H+ secretion and HCO3 reabsorption). Metabolic acidosis is compensated by hyperventilation (low PCO2) and kidneys.</p>", "ar": "<p>التعويض: المنظمات الأول. الحموضة والقلوية التنفسية بتتعوض بالكلية (زيادة أو نقص إفراز H+ وامتصاص HCO3). الحموضة الأيضية بتتعوض بفرط التهوية (PCO2 واطي) والكلى.</p>"}], "terms": [["acidosis", "pH below 7.35.", "حموضة: pH أقل من 7.35."]]}], "flash": [{"f": "Normal arterial pH?", "b": "7.4 (7.35-7.45)."}, {"f": "Acidosis and alkalosis definitions?", "b": "pH below 7.35 and above 7.45."}, {"f": "Volatile acid?", "b": "CO2."}, {"f": "Three pH regulating mechanisms?", "b": "Buffers, respiratory, renal."}, {"f": "Respiratory acidosis?", "b": "High PCO2, low pH."}, {"f": "Respiratory alkalosis?", "b": "Low PCO2, high pH."}, {"f": "Metabolic acidosis?", "b": "Low HCO3, low pH."}, {"f": "Metabolic alkalosis?", "b": "High HCO3, high pH, e.g. vomiting."}, {"f": "Compensation for metabolic acidosis?", "b": "Hyperventilation and kidney."}], "quiz": [{"q": "Normal pH:", "o": ["6.8", "7.8", "7.4", "8"], "a": 2, "w": "7.4."}, {"q": "Vomiting causes:", "o": ["Metabolic acidosis", "Metabolic alkalosis", "Respiratory acidosis", "Normal"], "a": 1, "w": "فقد حمض."}, {"q": "Diarrhoea causes:", "o": ["Metabolic acidosis", "Metabolic alkalosis", "Respiratory alkalosis", "None"], "a": 0, "w": "فقد قاعدة."}, {"q": "Hyperventilation causes:", "o": ["Respiratory acidosis", "Metabolic acidosis", "None", "Respiratory alkalosis"], "a": 3, "w": "PCO2 واطي."}, {"q": "Respiratory acidosis has:", "o": ["Low PCO2", "High HCO3", "High PCO2", "Low CO2 only"], "a": 2, "w": "PCO2 عالي."}, {"q": "Which is a buffer?", "o": ["Urea", "Bicarbonate", "Glucose", "Insulin"], "a": 1, "w": "بيكربونات."}, {"q": "Renal pH control includes:", "o": ["H+ secretion and HCO3 reabsorption", "Glucose reabsorption", "Protein filtration", "Insulin"], "a": 0, "w": "إفراز H+."}], "recall": [{"q": "List acid sources and buffer systems.", "a": "CO2, fixed, organic acids; bicarbonate, phosphate, protein/Hb.", "w": "المصادر والمنظمات."}, {"q": "Classify acid-base disturbances.", "a": "Respiratory/metabolic acidosis/alkalosis with causes and compensation.", "w": "التصنيف."}]}, "physio11": {"name": "Physiology", "lec": "Lecture 11 - Respiratory system", "short": "Physio", "sections": [{"id": "physio11_1", "title_en": "Structure, ventilation and volumes", "title_ar": "التركيب والتهوية والحجوم", "figs": [], "blocks": [{"en": "<p>Upper tract is outside the thorax; lower tract inside. Conducting zone (nose to terminal bronchioles, 16 of about 23 divisions) conducts air; respiratory zone (respiratory bronchioles, alveolar ducts, alveoli) exchanges gas. Trachea and bronchi have cartilage; bronchioles have smooth muscle and no cartilage. Right lung 3 lobes, left 2. Pleural cavity has lubricating fluid.</p>", "ar": "<p>المجرى العلوي خارج الصدر والسفلي جوه. المنطقة الموصلة (الأنف لحد terminal bronchioles، 16 من حوالي 23 تفرع) بتوصل الهواء والمنطقة التنفسية (respiratory bronchioles وقنوات وحويصلات) للتبادل الغازي. القصبة والشعب فيها غضروف والشعيبات فيها عضلة ملساء من غير غضروف. الرئة اليمين 3 فصوص واليسار 2. التجويف الجنبي فيه سائل مزلق.</p>"}, {"en": "<p>Functions: oxygen supply, CO2 removal, pH regulation, temperature, protection (hair, mucus, cilia, cough, antibodies, macrophages), ACE (angiotensin I to II) and surfactant synthesis. Inspiration is active (diaphragm, external intercostals); resting expiration is passive; forced expiration uses internal intercostals and abdominal muscles.</p>", "ar": "<p>الوظائف: إمداد أكسجين وإزالة CO2 وتنظيم pH والحرارة والحماية (شعر ومخاط وأهداب وكحة ومضادات وبلعميات) وACE (تحويل angiotensin I لـII) وتصنيع surfactant. الشهيق نشط (الحجاب والوربية الخارجية) والزفير العادي سلبي والزفير القوي بالوربية الداخلية وعضلات البطن.</p>"}, {"en": "<p>Volumes: TV 0.5 L; IRV 3 L (male) 1.9 L (female); ERV 1 L male 0.7 L female; RV 1.2 L male 1.1 L female; VC about 5 L male 4 L female = IRV + TV + ERV; FRC = ERV + RV; TLC = VC + RV (6 L male, 5 L female). Pulmonary ventilation = TV x RR = 6 L/min; alveolar ventilation = (TV - dead space 150 ml) x RR = 4.2 L/min.</p>", "ar": "<p>الحجوم: TV 0.5 لتر؛ IRV 3 لتر (رجال) و1.9 (ستات)؛ ERV 1 و0.7؛ RV 1.2 و1.1؛ VC حوالي 5 و4 = IRV + TV + ERV؛ FRC = ERV + RV؛ TLC = VC + RV (6 و5 لتر). التهوية الرئوية = TV × معدل التنفس = 6 لتر/د؛ والحويصلية = (TV - الفراغ الميت 150 مل) × RR = 4.2 لتر/د.</p>"}], "terms": [["vital capacity", "Maximum air expired after maximum inspiration: IRV + TV + ERV.", "السعة الحيوية."], ["dead space", "Air that does not take part in gas exchange, about 150 ml anatomical.", "الفراغ الميت."]]}, {"id": "physio11_2", "title_en": "Lung properties, bronchial tone and gas exchange", "title_ar": "خواص الرئة والتبادل الغازي", "figs": [], "blocks": [{"en": "<p>Compliance is stretchability; elasticity is recoil; surface tension is resisted by surfactant, a phospholipid from type II alveolar cells that prevents alveolar collapse. It starts late in pregnancy (after week 32), so preterm babies get respiratory distress syndrome (RDS).</p>", "ar": "<p>الـcompliance قابلية التمدد والمرونة الارتداد والتوتر السطحي بيقاومه الـsurfactant وهو فوسفوليبيد من خلايا الحويصلات النوع II بيمنع انهيار الحويصلات. بيبدأ متأخر في الحمل (بعد الأسبوع 32) فالخدج بيصابوا بمتلازمة الضائقة التنفسية (RDS).</p>"}, {"en": "<p>Bronchial smooth muscle is controlled by the ANS: sympathetic dilates, parasympathetic constricts. Bronchoconstriction: irritants (SO2), cool air, exercise, adenosine, substance P, leukotrienes. Dilation: catecholamines, VIP. Maximal constriction occurs early morning, so asthma symptoms peak then.</p>", "ar": "<p>عضلة الشعب الملساء بيتحكم فيها الجهاز العصبي الذاتي: السمبثاوي يوسع والباراسمبثاوي يضيق. التضييق: مهيجات (SO2) وهواء بارد وتمرين وadenosine وsubstance P وleukotrienes. التوسيع: كاتيكولامينات وVIP. أقصى انقباض بالصبح بدري فأعراض الربو بتبقى في الوقت ده.</p>"}, {"en": "<p>Gas exchange depends on pressure gradient (O2 moves from alveoli to blood; CO2 from blood to alveoli), membrane thickness, surface area and ventilation-perfusion matching. Gases move passively from high to low partial pressure.</p>", "ar": "<p>التبادل الغازي بيعتمد على فرق الضغط (الأكسجين من الحويصلات للدم وCO2 من الدم للحويصلات) وسمك الغشاء والمساحة وتوافق التهوية والتروية. الغازات بتتحرك سلبياً من الضغط الأعلى للأقل.</p>"}], "terms": [["surfactant", "Phospholipid reducing alveolar surface tension and preventing collapse.", "مادة تقلل التوتر السطحي في الحويصلات."]]}], "flash": [{"f": "Conducting vs respiratory zone?", "b": "Conducting carries air; respiratory exchanges gas."}, {"f": "Lung lobes?", "b": "Right 3, left 2."}, {"f": "Is inspiration active?", "b": "Yes, diaphragm and external intercostals."}, {"f": "Tidal volume?", "b": "0.5 L."}, {"f": "Vital capacity formula?", "b": "IRV + TV + ERV."}, {"f": "FRC formula?", "b": "ERV + RV."}, {"f": "Alveolar ventilation formula?", "b": "(TV - dead space) x RR."}, {"f": "What is surfactant?", "b": "Phospholipid from type II cells that reduces surface tension."}, {"f": "RDS cause?", "b": "Surfactant deficiency in preterm babies."}, {"f": "Why are asthma symptoms worse in the morning?", "b": "Maximal bronchoconstriction early morning."}], "quiz": [{"q": "Right lung has:", "o": ["2 lobes", "4 lobes", "5 lobes", "3 lobes"], "a": 3, "w": "3."}, {"q": "Resting expiration is:", "o": ["Active", "Forced", "Passive", "Impossible"], "a": 2, "w": "سلبي."}, {"q": "Tidal volume is about:", "o": ["3 L", "0.5 L", "1.2 L", "6 L"], "a": 1, "w": "0.5."}, {"q": "VC =", "o": ["IRV + TV + ERV", "TV + RV", "ERV + RV", "TLC + RV"], "a": 0, "w": "المعادلة."}, {"q": "Anatomical dead space is about:", "o": ["500 ml", "1 L", "10 ml", "150 ml"], "a": 3, "w": "150."}, {"q": "Surfactant is made by:", "o": ["Type I cells", "Macrophages", "Type II alveolar cells", "Goblet cells"], "a": 2, "w": "النوع II."}, {"q": "Sympathetic stimulation causes:", "o": ["Bronchoconstriction", "Bronchodilation", "Cough", "Apnea"], "a": 1, "w": "توسيع."}, {"q": "Which causes bronchoconstriction?", "o": ["Cool air", "Catecholamines", "VIP", "Sympathetic"], "a": 0, "w": "هواء بارد."}], "recall": [{"q": "Describe respiratory zones and lungs.", "a": "Conducting and respiratory zones, cartilage vs smooth muscle, lobes, pleura.", "w": "التركيب."}, {"q": "Explain lung volumes and ventilation.", "a": "TV, IRV, ERV, RV, VC, FRC, TLC; pulmonary and alveolar ventilation.", "w": "الحجوم."}, {"q": "Explain surfactant and bronchial tone.", "a": "Type II cells; RDS; sympathetic dilates, parasympathetic constricts.", "w": "الخواص."}]}, "physio12": {"name": "Physiology", "lec": "Lecture 12 - Cardiovascular system: heart and ECG", "short": "Physio", "sections": [{"id": "physio12_1", "title_en": "Heart and cardiac muscle", "title_ar": "القلب والعضلة القلبية", "figs": [], "blocks": [{"en": "<p>The CVS has the heart (pump) and blood vessels (arteries, arterioles, capillaries, venules, veins). The heart has 4 chambers (2 thin-walled atria, 2 thick ventricles) and 4 valves: AV valves (mitral left, tricuspid right) and semilunar valves (aortic left, pulmonary right). Aorta leaves the left ventricle; pulmonary arteries the right; ve
