اغ غير مستقر فإلكترون من مدار أبعد بطاقة ربط أقل بيملاه. الطاقة الزايدة بتتطلق كفوتون أشعة مميزة طاقته = الفرق بين طاقتي ربط المدارين.</p>"}], "terms": [["binding energy", "Energy holding an electron in its shell; highest in K.", "طاقة ربط الإلكترون بمداره."], ["characteristic x-ray", "Photon from an outer electron filling an inner shell vacancy.", "فوتون ناتج من ملء فراغ داخلي."]]}], "flash": [{"f": "Who discovered x-rays and when?", "b": "Roentgen, November 1895, Wurzburg."}, {"f": "Tube used in discovery?", "b": "Crookes tube."}, {"f": "First living-body x-ray?", "b": "Bones of his wife's hand."}, {"f": "Why use a heavy metal anticathode?", "b": "Increases x-ray output."}, {"f": "Highest binding energy shell?", "b": "K shell."}, {"f": "Characteristic photon energy equals?", "b": "Difference between binding energies of the two shells."}], "quiz": [{"q": "X-rays were discovered by:", "o": ["Curie", "Roentgen", "Hounsfield", "Bloch"], "a": 1, "w": "رونتجن."}, {"q": "Year of discovery:", "o": ["1895", "1905", "1875", "1920"], "a": 0, "w": "1895."}, {"q": "Shell with highest binding energy:", "o": ["L", "M", "N", "K"], "a": 3, "w": "مدار K."}, {"q": "Characteristic x-ray arises when:", "o": ["Electron hits nucleus", "Photon is absorbed by film", "Outer electron fills inner vacancy", "Anode melts"], "a": 2, "w": "ملء فراغ."}, {"q": "L shell holds:", "o": ["2 electrons", "8 electrons", "18 electrons", "4 electrons"], "a": 1, "w": "8 إلكترونات."}], "recall": [{"q": "Describe the discovery of x-rays.", "a": "Roentgen 1895, Crookes tube, first bone image of hand, anticathode raises output.", "w": "الاكتشاف."}, {"q": "Explain characteristic x-rays.", "a": "Inner vacancy filled by outer electron, photon energy = binding energy difference.", "w": "الأشعة المميزة."}]}, "fund2": {"name": "Fundamentals of Radiography", "lec": "Lecture 2 - Basics of image formation and terminology", "short": "Fund", "sections": [{"id": "fund2_1", "title_en": "Terminology", "title_ar": "المصطلحات", "figs": [], "blocks": [{"en": "<p>Radiology is the medical specialty. Radiation is energy in the form of electromagnetic waves and particles with no charge and mass. A radiograph is the image produced using radiation. Radiography is the use of ionizing radiation to produce a recorded image. A radiologist is a board-certified physician who practices radiology. A radiologic technologist is skilled in the use of radiation, US, CT and MRI to produce images of the human body.</p>", "ar": "<p>Radiology هو التخصص الطبي. Radiation طاقة على شكل موجات كهرومغناطيسية وجسيمات من غير شحنة وكتلة. Radiograph هي الصورة الناتجة باستخدام الإشعاع. Radiography استخدام الإشعاع المؤين لعمل صورة مسجلة. Radiologist طبيب حاصل على بورد في الأشعة. Radiologic technologist شخص مدرب على استخدام الإشعاع والموجات فوق الصوتية والرنين والمقطعية لإنتاج صور الجسم.</p>"}], "terms": [["radiograph", "Image produced using radiation.", "الصورة الناتجة بالإشعاع."], ["radiography", "Use of ionizing radiation to produce a recorded image.", "التصوير بالإشعاع المؤين."]]}, {"id": "fund2_2", "title_en": "Technologist role, production and film", "title_ar": "دور الفني والإنتاج والفيلم", "figs": [], "blocks": [{"en": "<p>The technologist is responsible for exposure factors, field size, elimination of motion, position of anatomical parts and immobilization devices. Three things are needed to produce x-rays: a source of electrons, a means of accelerating them, and a target. There are two main film groups: direct-exposure film (exposed to x-ray alone) and screen film (x-ray plus light), which is duplitized with emulsion on both sides of the base.</p>", "ar": "<p>الفني مسؤول عن عوامل التعريض وحجم الحقل ومنع الحركة ووضع الجزء التشريحي وأدوات التثبيت. عشان تتنتج الأشعة محتاجين 3 حاجات: مصدر إلكترونات ووسيلة تسريعها وهدف. فيه نوعين فيلم: فيلم تعريض مباشر (بالأشعة بس) وفيلم مع شاشات (أشعة وضوء) وهو duplitized يعني طبقة حساسة على وش الأساس من الناحيتين.</p>"}], "terms": [["direct-exposure film", "Film exposed to x-ray alone.", "فيلم بيتعرض للأشعة مباشرة."], ["duplitized", "Emulsion on both sides of the base.", "طبقة حساسة على الوشين."]]}], "flash": [{"f": "Radiation definition?", "b": "Energy as EM waves and particles with no charge and mass."}, {"f": "Radiologist?", "b": "Board-certified physician practicing radiology."}, {"f": "Three needs for x-ray production?", "b": "Electron source, acceleration, target."}, {"f": "Two film groups?", "b": "Direct-exposure and screen film."}, {"f": "Duplitized film?", "b": "Emulsion on both sides of base."}, {"f": "Technologist duties?", "b": "Exposure factors, field size, motion, position, immobilization."}], "quiz": [{"q": "Radiograph is:", "o": ["The doctor", "The tube", "The image produced by radiation", "The film bin"], "a": 2, "w": "الصورة."}, {"q": "Not needed to produce x-rays:", "o": ["Electron source", "Contrast medium", "Acceleration", "Target"], "a": 1, "w": "الاحتياجات التلاتة."}, {"q": "Screen film is exposed to:", "o": ["X-ray and light", "Light only", "Sound", "Magnetic field"], "a": 0, "w": "أشعة وضوء."}, {"q": "Duplitized means emulsion:", "o": ["One side", "No base", "Outside only", "Both sides"], "a": 3, "w": "الوشين."}, {"q": "Radiologist is a:", "o": ["Technician", "Nurse", "Physician", "Engineer"], "a": 2, "w": "طبيب."}], "recall": [{"q": "Define radiology terms.", "a": "Radiology, radiation, radiograph, radiography, radiologist, technologist.", "w": "المصطلحات."}, {"q": "List technologist responsibilities.", "a": "Exposure factors, field size, motion, positioning, immobilization.", "w": "مسؤوليات الفني."}]}, "fund3": {"name": "Fundamentals of Radiography", "lec": "Lecture 3 - Film storage, latent image and intensifying screens", "short": "Fund", "sections": [{"id": "fund3_1", "title_en": "Film storage and care", "title_ar": "تخزين الفيلم", "figs": [], "blocks": [{"en": "<p>Unexposed film is stored in three areas: the hospital or department store, the darkroom and the imaging room. It must be protected from physical damage, light, high temperature, high humidity, harmful gases and fumes, and fire and theft. Expiry date is the date stamped by the manufacturer by which the film should be used. Shelf life is the period a box may be kept under specified conditions. Stock rotation means the oldest box is used first.</p>", "ar": "<p>الفيلم غير المعرض بيتخزن في 3 أماكن: مخزن المستشفى أو القسم والغرفة المظلمة وغرفة التصوير. لازم يتحمي من التلف الفيزيائي والضوء والحرارة العالية والرطوبة والغازات الضارة والحريق والسرقة. Expiry date تاريخ الصلاحية اللي الشركة بتختمه. Shelf life المدة اللي ينفع الصندوق يتحفظ فيها في ظروف محددة. Stock rotation يعني الصندوق الأقدم يتستخدم الأول.</p>"}], "terms": [["expiry date", "Manufacturer date by which film should be used.", "تاريخ الصلاحية."], ["stock rotation", "Oldest box used first.", "الأقدم الأول."]]}, {"id": "fund3_2", "title_en": "Latent image and intensifying screen", "title_ar": "الصورة الكامنة والشاشات المقوية", "figs": [], "blocks": [{"en": "<p>The latent image is an invisible image formed by the effect of radiation or light on silver halide crystals of the emulsion. Development converts the exposed crystals to black metallic silver and makes the image visible. Careless processing gives poor diagnostic quality. An intensifying screen converts x-ray energy into light: photons are absorbed by phosphor crystals that fluoresce, emitting ultraviolet and visible light. Its use reduces the radiation dose to the patient.</p>", "ar": "<p>الصورة الكامنة صورة غير مرئية بتتكون من تأثير الأشعة أو الضوء على بلورات silver halide في الطبقة الحساسة. التحميض بيحول البلورات المتعرضة لفضة معدنية سودا فتبان الصورة. التحميض الإهمال بيدي جودة تشخيصية ضعيفة. الشاشة المقوية بتحول طاقة الأشعة لضوء: الفوتونات بتتمتص في بلورات phosphor فتتفلور وتطلع ضوء فوق بنفسجي ومرئي. واستخدامها بيقلل جرعة المريض.</p>"}], "terms": [["latent image", "Invisible image formed in the emulsion after exposure.", "صورة كامنة غير مرئية."], ["intensifying screen", "Converts x-ray energy into light to cut patient dose.", "بتحول الأشعة لضوء وتقلل الجرعة."]]}], "flash": [{"f": "Three film storage areas?", "b": "Department store, darkroom, imaging room."}, {"f": "Shelf life?", "b": "Time a box can be kept under specified conditions."}, {"f": "Stock rotation?", "b": "Oldest box first."}, {"f": "Latent image?", "b": "Invisible image formed by exposure."}, {"f": "Development converts silver halide to?", "b": "Black metallic silver."}, {"f": "Why use intensifying screens?", "b": "Convert x-ray to light and reduce dose."}], "quiz": [{"q": "Film is harmed by:", "o": ["Cold dry dark", "Rotation", "Expiry label", "Heat, humidity, light"], "a": 3, "w": "الحرارة والرطوبة والضوء."}, {"q": "Oldest box used first is:", "o": ["Shelf life", "Expiry", "Stock rotation", "Latent image"], "a": 2, "w": "Stock rotation."}, {"q": "Latent image is:", "o": ["Visible", "Invisible", "Black", "Printed"], "a": 1, "w": "غير مرئية."}, {"q": "Screens emit:", "o": ["Light", "X-ray", "Sound", "Heat only"], "a": 0, "w": "ضوء."}, {"q": "Screens lower:", "o": ["Contrast only", "Film size", "Expiry", "Patient dose"], "a": 3, "w": "جرعة المريض."}], "recall": [{"q": "Explain care of x-ray film.", "a": "Protect from damage, light, heat, humidity, fumes; expiry, shelf life, rotation.", "w": "العناية بالفيلم."}, {"q": "Explain latent image and screen.", "a": "Invisible image on silver halide; screens convert x-ray to light, lower dose.", "w": "الكامنة والشاشة."}]}, "fund4": {"name": "Fundamentals of Radiography", "lec": "Lecture 4 - Positioning terminology", "short": "Fund", "sections": [{"id": "fund4_1", "title_en": "Anatomical position and planes", "title_ar": "الوضع التشريحي والمستويات", "figs": [], "blocks": [{"en": "<p>In the anatomical position the person stands erect with head, eyes and toes forward, feet together, arms at the sides and palms forward. A plane is a flat surface passed through the body. Sagittal plane is vertical, front to back, dividing right and left; the median plane is the sagittal plane through the midline giving equal halves. Coronal plane is vertical, side to side, dividing anterior and posterior. The axial (transverse) plane is horizontal, dividing upper and lower parts.</p>", "ar": "<p>في الوضع التشريحي الشخص واقف معتدل والراس والعينين وصوابع الرجل لقدام والقدمين مضمومين والدراعين على الجنب وراحة الإيد لقدام. المستوى سطح مسطح بيعدي في الجسم. Sagittal رأسي من الأمام للخلف وبيقسم يمين وشمال، والـmedian هو السهمي اللي في الخط الأوسط وبيقسم لنصين متساويين. Coronal رأسي من جنب لجنب وبيقسم أمامي وخلفي. Axial (transverse) أفقي وبيقسم علوي وسفلي.</p>"}], "terms": [["sagittal plane", "Vertical plane dividing the body into right and left.", "مستوى رأسي يقسم يمين وشمال."], ["coronal plane", "Vertical plane dividing anterior and posterior.", "مستوى رأسي يقسم أمامي وخلفي."]]}, {"id": "fund4_2", "title_en": "Directional terms", "title_ar": "مصطلحات الاتجاه", "figs": [], "blocks": [{"en": "<p>Lateral means away from the midline; medial means near the midline (the arms are lateral to the chest). Superior (cephalic or cranial) means toward the head, above; inferior means toward the feet. Examples: the head is superior to the chest. These terms are used to describe positions, projections and the relationship between body parts.</p>", "ar": "<p>Lateral يعني بعيد عن الخط الأوسط وmedial قريب منه (الدراعين lateral للصدر). Superior (cephalic أو cranial) ناحية الراس فوق وinferior ناحية الرجلين. مثال: الراس superior للصدر. المصطلحات دي بتوصف الأوضاع والإسقاطات والعلاقة بين أجزاء الجسم.</p>"}], "terms": [["lateral", "Away from the midline.", "بعيد عن الخط الأوسط."], ["medial", "Toward the midline.", "ناحية الخط الأوسط."]]}], "flash": [{"f": "Anatomical position?", "b": "Erect, eyes and toes forward, arms at sides, palms forward."}, {"f": "Sagittal plane?", "b": "Vertical front to back; right and left."}, {"f": "Median plane?", "b": "Sagittal through midline; equal halves."}, {"f": "Coronal plane?", "b": "Vertical side to side; anterior and posterior."}, {"f": "Axial plane?", "b": "Horizontal; upper and lower."}, {"f": "Lateral vs medial?", "b": "Away from midline vs near midline."}], "quiz": [{"q": "Plane dividing right and left:", "o": ["Sagittal", "Coronal", "Axial", "Oblique"], "a": 0, "w": "السهمي."}, {"q": "Plane dividing anterior and posterior:", "o": ["Sagittal", "Axial", "Median", "Coronal"], "a": 3, "w": "الإكليلي."}, {"q": "Horizontal plane is:", "o": ["Coronal", "Sagittal", "Axial", "Median"], "a": 2, "w": "الأفقي."}, {"q": "Arms are ___ to the chest:", "o": ["Medial", "Lateral", "Superior", "Inferior"], "a": 1, "w": "lateral."}, {"q": "Superior means:", "o": ["Toward the head", "Toward feet", "Toward midline", "Away from midline"], "a": 0, "w": "ناحية الراس."}], "recall": [{"q": "Describe the anatomical position.", "a": "Erect, head eyes toes forward, feet together, arms at side, palms forward.", "w": "الوضع التشريحي."}, {"q": "Define body planes.", "a": "Sagittal, median, coronal, axial.", "w": "مستويات الجسم."}]}, "fund5": {"name": "Fundamentals of Radiography", "lec": "Lecture 5 - Concepts of radiographic examination", "short": "Fund", "sections": [{"id": "fund5_1", "title_en": "Ordering and processing", "title_ar": "طلب الفحص", "figs": [], "blocks": [{"en": "<p>An exam starts when the patient has an injury or illness, the physician examines and orders the exam. The requisition includes patient ID (name, age, gender), clinical history, the exam to be done, referring doctor contact and signature. The order is sent to the department and clerical tasks are done: prepare an ID flash card and obtain billing information.</p>", "ar": "<p>الفحص بيبدأ لما يبقى فيه إصابة أو مرض والدكتور يكشف ويطلب الفحص. الطلب بيشمل بيانات المريض (اسم وسن ونوع) والتاريخ المرضي والفحص المطلوب وبيانات الدكتور المحول والتوقيع. الطلب بيروح القسم وبتتعمل الأعمال الكتابية: تجهيز كارت ID وأخذ بيانات الفواتير.</p>"}], "terms": [["requisition", "Request form for the exam.", "استمارة طلب الفحص."]]}, {"id": "fund5_2", "title_en": "Performing and completing the exam", "title_ar": "تنفيذ الفحص وإنهاؤه", "figs": [], "blocks": [{"en": "<p>The radiographer reviews the order and positively identifies the patient, then assesses physical status, ability to cooperate, need for help, and previous exams, and prepares the patient. Then: set technical factors, position patient, tube and film, expose, repeat for each projection, place the patient in a safe location, process films, evaluate image quality, radiologist review, and repeat unacceptable projections. Finally release the patient, prepare for the next one, clean the room and restock.</p>", "ar": "<p>الفني بيراجع الطلب ويتأكد من هوية المريض بشكل إيجابي، وبعدين بيقيّم حالته الجسدية وقدرته على التعاون وحاجته لمساعدة والفحوصات السابقة ويجهزه. بعدها: يظبط العوامل الفنية ويوضّع المريض والأنبوبة والفيلم ويعرّض ويكرر لكل إسقاط ويحط المريض في مكان آمن ويحمّض الأفلام ويقيّم جودة الصور ويراجعها الأخصائي ويعيد الإسقاطات المرفوضة. في الآخر يسيّب المريض ويجهز للي بعده وينضف الأوضة ويكمل المستلزمات.</p>"}], "terms": [["positive ID", "Confirming the patient identity before exam.", "التأكد من هوية المريض."]]}], "flash": [{"f": "Requisition contents?", "b": "Patient ID, history, exam, referring doctor, signature."}, {"f": "First step in performing exam?", "b": "Review order and identify patient."}, {"f": "Patient assessment includes?", "b": "Physical status, cooperation, help, previous exams."}, {"f": "After exposure?", "b": "Safe location, process films, evaluate."}, {"f": "Who reviews final images?", "b": "Radiologist."}, {"f": "End of exam tasks?", "b": "Release patient, clean room, restock."}], "quiz": [{"q": "Patient identification should be:", "o": ["Assumed", "Positive", "Skipped", "Verbal guess"], "a": 1, "w": "إيجابي."}, {"q": "Requisition lacks:", "o": ["Patient's insurance card photo", "Clinical history", "Exam to be done", "Referring doctor"], "a": 0, "w": "مش من محتوياته."}, {"q": "Unacceptable projections are:", "o": ["Ignored", "Filed", "Sold", "Repeated"], "a": 3, "w": "بتتعاد."}, {"q": "Films are evaluated by:", "o": ["Clerk", "Patient", "Technologist then radiologist", "Nurse"], "a": 2, "w": "فني ثم أخصائي."}, {"q": "Room after exam:", "o": ["Left", "Cleaned and restocked", "Locked", "Moved"], "a": 1, "w": "بتتنضف."}], "recall": [{"q": "Sequence of a radiographic exam.", "a": "Order, ID, assess, prepare, expose, process, evaluate, repeat if needed, release.", "w": "خطوات الفحص."}, {"q": "Contents of requisition.", "a": "ID, clinical history, exam, referring doctor, signature.", "w": "محتويات الطلب."}]}, "fund6": {"name": "Fundamentals of Radiography", "lec": "Lecture 6 - Processing: the developer", "short": "Fund", "sections": [{"id": "fund6_1", "title_en": "Developer composition", "title_ar": "مكونات المحمض", "figs": [], "blocks": [{"en": "<p>Developer replenisher contains: solvent, developing agents, accelerator, buffers, restrainers, preservative, hardener and sequestering agent. The solvent is clean water that carries the chemicals and softens the gelatin of the emulsion. Modern developers use two developing agents: phenidone and hydroquinone (PQ developers).</p>", "ar": "<p>الـdeveloper replenisher فيه: مذيب ومواد تحميض ومسرّع وبفرات ومثبطات ومادة حافظة ومقسّي وsequestering agent. المذيب ماء نضيف بيشيل المواد وبيلين جيلاتين الطبقة الحساسة. المحمضات الحديثة بتستخدم مادتين: phenidone وhydroquinone (محمضات PQ).</p>"}], "terms": [["PQ developer", "Developer using phenidone and hydroquinone.", "محمض فيه phenidone وhydroquinone."]]}, {"id": "fund6_2", "title_en": "Developing agents, accelerator and buffer", "title_ar": "مواد التحميض والمسرع", "figs": [], "blocks": [{"en": "<p>Phenidone is a quick-acting reducing agent that develops all exposed grains but has low selectivity and gives high fog if used alone. Hydroquinone needs an alkaline medium, is more selective and gives high contrast. PQ developers have super-additive effects, low chemical fog and fast action (complete development in 20-30 seconds). The accelerator is a strong alkali such as potassium carbonate or potassium hydroxide that sets alkalinity. A buffer keeps the pH within close limits.</p>", "ar": "<p>Phenidone مادة اختزال سريعة بتحمض كل الحبيبات المتعرضة لكن انتقائيتها قليلة وبتدي fog عالي لو استخدمت لوحدها. Hydroquinone محتاج وسط قلوي وأكتر انتقائية وبيدي كونتراست عالي. محمضات PQ ليها تأثير super-additive وfog كيميائي قليل وسريعة (تحميض كامل في 20-30 ثانية). المسرّع قلوي قوي زي potassium carbonate أو hydroxide بيظبط القلوية. والبفر بيحافظ على الـpH في حدود ضيقة.</p>"}], "terms": [["accelerator", "Alkali that sets developer alkalinity and speeds development.", "قلوي بيسرّع التحميض."], ["buffer", "Keeps pH within close limits.", "بيثبت الـpH."]]}], "flash": [{"f": "Solvent in developer?", "b": "Clean water."}, {"f": "Two developing agents?", "b": "Phenidone and hydroquinone."}, {"f": "Phenidone problem alone?", "b": "Low selectivity, high fog."}, {"f": "Hydroquinone gives?", "b": "High contrast; needs alkaline medium."}, {"f": "Accelerator examples?", "b": "Potassium carbonate, potassium hydroxide."}, {"f": "Buffer function?", "b": "Maintain pH."}], "quiz": [{"q": "Developer solvent is:", "o": ["Alcohol", "Acid", "Water", "Silver"], "a": 2, "w": "ماء."}, {"q": "High contrast agent:", "o": ["Phenidone", "Hydroquinone", "Water", "Acetic acid"], "a": 1, "w": "hydroquinone."}, {"q": "Phenidone alone gives:", "o": ["High fog", "High contrast", "No development", "Hardening"], "a": 0, "w": "fog."}, {"q": "Accelerator is:", "o": ["Acid", "Salt only", "Water", "Alkali"], "a": 3, "w": "قلوي."}, {"q": "PQ development time:", "o": ["5 minutes", "1 hour", "20-30 seconds", "1 second"], "a": 2, "w": "20-30 ثانية."}], "recall": [{"q": "List developer constituents.", "a": "Solvent, agents, accelerator, buffer, restrainer, preservative, hardener, sequestering agent.", "w": "مكونات المحمض."}, {"q": "Compare phenidone and hydroquinone.", "a": "Fast low selectivity vs selective high contrast alkaline.", "w": "المقارنة."}]}, "fund7": {"name": "Fundamentals of Radiography", "lec": "Lecture 7 - Processing: the fixer", "short": "Fund", "sections": [{"id": "fund7_1", "title_en": "Fixer function and agent", "title_ar": "وظيفة المثبت", "figs": [], "blocks": [{"en": "<p>The fixer has four functions: stop further development, clear the image by removing remaining silver halide, fix the image, and complete hardening of the emulsion. A fixing agent needs conversion (turn unexposed undeveloped silver halide into water-soluble silver complexes) and selectivity (no effect on the metallic silver or gelatin). Agents: ammonium thiosulphate and sodium thiosulphate.</p>", "ar": "<p>المثبت ليه 4 وظايف: يوقف التحميض ويوضّح الصورة بإزالة silver halide المتبقي ويثبت الصورة ويكمل تقسية الطبقة الحساسة. المادة المثبتة لازم يبقى فيها conversion (تحول silver halide غير المتعرض وغير المحمض لمركبات فضة بتدوب في الماء) وselectivity (من غير تأثير على الفضة المعدنية أو الجيلاتين). المواد: ammonium thiosulphate وsodium thiosulphate.</p>"}], "terms": [["conversion", "Turning unexposed silver halide into water-soluble complexes.", "تحويل الفضة غير المتعرضة لمركبات بتدوب."], ["selectivity", "No effect on metallic silver or gelatin.", "من غير تأثير على الصورة."]]}, {"id": "fund7_2", "title_en": "Fixer constituents", "title_ar": "مكونات المثبت", "figs": [], "blocks": [{"en": "<p>Constituents: fixing agent (ammonium thiosulphate), acid (acetic or sulphuric; stops development and gives correct pH), buffer (acetic acid plus preservative), preservative (sodium or potassium sulphite; reduces sulphurisation), hardener (aluminium sulphate plus acid; controls emulsion water absorption) and solvent (water).</p>", "ar": "<p>المكونات: مادة تثبيت (ammonium thiosulphate) وحمض (acetic أو sulphuric بيوقف التحميض ويظبط pH) وبفر (acetic acid مع الحافظة) وحافظة (sodium أو potassium sulphite بتقلل التكبرت) ومقسّي (aluminium sulphate مع حمض بيتحكم في امتصاص الطبقة للماء) ومذيب (ماء).</p>"}], "terms": [["hardener", "Aluminium sulphate plus acid controlling emulsion water absorption.", "مقسّي الطبقة الحساسة."]]}], "flash": [{"f": "Four fixer functions?", "b": "Stop development, clear, fix image, harden emulsion."}, {"f": "Two properties of fixing agent?", "b": "Conversion and selectivity."}, {"f": "Fixing agent examples?", "b": "Ammonium and sodium thiosulphate."}, {"f": "Acid in fixer?", "b": "Acetic or sulphuric; stops development."}, {"f": "Preservative?", "b": "Sodium or potassium sulphite."}, {"f": "Hardener?", "b": "Aluminium sulphate plus acid."}], "quiz": [{"q": "Fixer removes:", "o": ["Metallic silver", "Gelatin", "Base", "Unexposed silver halide"], "a": 3, "w": "silver halide."}, {"q": "Fixing agent:", "o": ["Hydroquinone", "Phenidone", "Ammonium thiosulphate", "Water"], "a": 2, "w": "thiosulphate."}, {"q": "Selectivity means:", "o": ["Fast action", "No effect on image silver or gelatin", "Alkaline", "Cooling"], "a": 1, "w": "الانتقائية."}, {"q": "Fixer acid role:", "o": ["Stops development", "Starts development", "Adds fog", "Removes water"], "a": 0, "w": "يوقف."}, {"q": "Hardener controls:", "o": ["Temperature", "Speed", "Fog", "Water absorption"], "a": 3, "w": "امتصاص الماء."}], "recall": [{"q": "Functions of fixer.", "a": "Stop development, clear, fix, harden.", "w": "وظايف المثبت."}, {"q": "Constituents of fixer.", "a": "Agent, acid, buffer, preservative, hardener, solvent.", "w": "مكونات المثبت."}]}, "fund8": {"name": "Fundamentals of Radiography", "lec": "Lecture 8 - Radiography as a profession and patient care", "short": "Fund", "sections": [{"id": "fund8_1", "title_en": "Terminology and profession", "title_ar": "المصطلحات والمهنة", "figs": [], "blocks": [{"en": "<p>Radiology is the medical specialty using radiation (general x-ray, fluoroscopy, CT, nuclear medicine). Some modalities do not use radiation (ultrasound and MRI); using them is called medical imaging. A profession is the application of specialized knowledge to benefit others. The radiologic technologist must focus on the patient and devote all efforts to quality service, producing high quality images.</p>", "ar": "<p>Radiology التخصص الطبي اللي بيستخدم الإشعاع (أشعة عادية وfluoroscopy وCT وطب نووي). بعض الأجهزة مبتستخدمش إشعاع (الموجات فوق الصوتية والرنين) واستخدامها اسمه medical imaging. المهنة هي تطبيق معرفة متخصصة لفايدة الناس. فني الأشعة لازم يركز على المريض ويوجه مجهوده لخدمة عالية الجودة وصور عالية الجودة.</p>"}], "terms": [["medical imaging", "Imaging including modalities that do not use radiation.", "التصوير الطبي."]]}, {"id": "fund8_2", "title_en": "Duties and careers", "title_ar": "الواجبات والوظائف", "figs": [], "blocks": [{"en": "<p>Duties include patient reception and scheduling of different types of examinations. Career paths include radiological sciences technologist, academics, medical imaging applications and sales specialist, and medical bioinformatics and quality assurance specialist.</p>", "ar": "<p>من واجباته استقبال المريض وجدولة أنواع الفحوصات المختلفة. المسارات الوظيفية: فني علوم الأشعة وأكاديمي وأخصائي تطبيقات ومبيعات التصوير الطبي وأخصائي bioinformatics وضمان الجودة.</p>"}], "terms": [["profession", "Applying specialized knowledge to benefit others.", "تطبيق معرفة متخصصة لخدمة الناس."]]}], "flash": [{"f": "Radiology?", "b": "Medical specialty using radiation."}, {"f": "Modalities without radiation?", "b": "Ultrasound and MRI."}, {"f": "Medical imaging?", "b": "Term used when non-radiation modalities are used."}, {"f": "Profession?", "b": "Applying specialized knowledge to benefit others."}, {"f": "Technologist focus?", "b": "The patient and quality service."}, {"f": "Career paths?", "b": "Technologist, academia, sales, bioinformatics, QA."}], "quiz": [{"q": "MRI uses:", "o": ["No ionizing radiation", "X-rays", "Gamma rays", "Radium"], "a": 0, "w": "من غير إشعاع."}, {"q": "Profession means:", "o": ["Hobby", "Business only", "Job title", "Specialized knowledge for others' benefit"], "a": 3, "w": "معرفة متخصصة."}, {"q": "Technologist focus:", "o": ["Profit", "Machine", "Patient", "Paper"], "a": 2, "w": "المريض."}, {"q": "Ultrasound is:", "o": ["Radiology only", "Medical imaging without radiation", "CT", "Nuclear"], "a": 1, "w": "بدون إشعاع."}, {"q": "A career path:", "o": ["Applications specialist", "Chef", "Pilot", "Judge"], "a": 0, "w": "أخصائي تطبيقات."}], "recall": [{"q": "Define profession and technologist role.", "a": "Specialized knowledge for others; patient-focused quality images.", "w": "المهنة ودور الفني."}, {"q": "Radiology vs medical imaging.", "a": "Radiation modalities vs includes US and MRI.", "w": "الفرق."}]}, "fund9": {"name": "Fundamentals of Radiography", "lec": "Lecture 9 - Abdominal x-ray positioning", "short": "Fund", "sections": [{"id": "fund9_1", "title_en": "Indications and AP supine", "title_ar": "الدواعي ووضع الاستلقاء", "figs": [], "blocks": [{"en": "<p>Abdominal pathology: stones (gallbladder, renal), calcifications, intestinal obstruction, masses, foreign bodies and hiatus hernia. AP supine abdomen: film 35x43 cm lengthwise, patient supine with the MSP aligned to the table midline, hands on chest or abducted. Cassette upper border above the xiphoid process, lower border below the symphysis pubis. CR vertical, CP at MSP at the level of the upper border of the iliac crest, FFD 100 cm, broad focus and grid, full expiration.</p>", "ar": "<p>أمراض البطن: حصوات (مرارة وكلى) وتكلسات وانسداد معوي وكتل وأجسام غريبة وفتق حجابي. AP supine للبطن: فيلم 35x43 سم طولي والمريض نايم على ضهره والـMSP على منتصف الترابيزة والإيدين على الصدر أو مبعدة. الحافة العلوية للكاسيت فوق الـxiphoid والسفلية تحت symphysis pubis. الشعاع المركزي عمودي ونقطة التركيز على MSP عند مستوى الحافة العليا للـiliac crest وFFD 100 سم وfocus عريض وgrid وزفير كامل.</p>"}], "terms": [["MSP", "Midsagittal plane.", "المستوى السهمي الأوسط."]]}, {"id": "fund9_2", "title_en": "AP erect abdomen", "title_ar": "وضع الوقوف", "figs": [], "blocks": [{"en": "<p>AP erect abdomen: film 35x43 cm lengthwise, patient standing with the MSP to the midline of the stand, same cassette borders. CR horizontal, CP at MSP at the level of the upper border of the iliac crest, FFD 100 cm, fine focus and grid, full expiration. Used in the acute abdomen.</p>", "ar": "<p>AP erect للبطن: فيلم 35x43 سم طولي والمريض واقف والـMSP على منتصف الstand ونفس حدود الكاسيت. الشعاع أفقي ونقطة التركيز على MSP عند الحافة العليا للـiliac crest وFFD 100 سم وfocus دقيق وgrid وزفير كامل. بيُستخدم في البطن الحادة.</p>"}], "terms": [["acute abdomen", "Sudden severe abdominal condition needing erect view.", "بطن حادة."]]}], "flash": [{"f": "Abdominal pathologies?", "b": "Stones, calcifications, obstruction, masses, foreign bodies, hiatus hernia."}, {"f": "Film size?", "b": "35x43 cm lengthwise."}, {"f": "CR in supine?", "b": "Vertical."}, {"f": "CR in erect?", "b": "Horizontal."}, {"f": "CP level?", "b": "MSP at upper border of iliac crest."}, {"f": "FFD?", "b": "100 cm."}], "quiz": [{"q": "Abdomen film size:", "o": ["18x24 cm", "35x43 cm", "24x30 cm", "10x12 cm"], "a": 1, "w": "35x43."}, {"q": "Erect abdomen CR:", "o": ["Horizontal", "Vertical", "Angled 45", "None"], "a": 0, "w": "أفقي."}, {"q": "FFD:", "o": ["180 cm", "50 cm", "150 cm", "100 cm"], "a": 3, "w": "100 سم."}, {"q": "Respiration:", "o": ["Full inspiration", "Deep breathing", "Full expiration", "Talking"], "a": 2, "w": "زفير كامل."}, {"q": "CP level:", "o": ["Xiphoid", "Iliac crest upper border", "Symphysis", "Knee"], "a": 1, "w": "iliac crest."}], "recall": [{"q": "Describe AP supine abdomen.", "a": "35x43 lengthwise, MSP aligned, CR vertical at iliac crest, FFD 100, grid, expiration.", "w": "وضع الاستلقاء."}, {"q": "Differences supine and erect.", "a": "Erect uses horizontal CR and fine focus.", "w": "الفرق."}]}, "fund10": {"name": "Fundamentals of Radiography", "lec": "Lecture 10 - Chest radiography", "short": "Fund", "sections": [{"id": "fund10_1", "title_en": "Technical aspects", "title_ar": "الجوانب الفنية", "figs": [], "blocks": [{"en": "<p>Chest pathology includes pneumonia, pneumothorax, pleural effusion, hydrothorax, tumors, TB, cysts, heart disease and foreign bodies. A high kV technique (100-130 kVp) with low mAs (about 3) and short exposure time is used to reduce motion blur from the heartbeat. FFD is 180 cm (72 inches) to keep the natural heart size; PA is preferred over AP to reduce heart magnification. Exposure is taken in full inspiration with a grid. Chest is taken erect so the diaphragm moves down and air-fluid levels show. Pediatrics use lower kV (60-70).</p>", "ar": "<p>أمراض الصدر: التهاب رئوي وpneumothorax وانصباب جنبي وhydrothorax وأورام وسل وكيسات وأمراض قلب وأجسام غريبة. بنستخدم kV عالي (100-130) مع mAs قليل (حوالي 3) وزمن تعريض قصير لتقليل ضبابية حركة القلب. الـFFD 180 سم (72 بوصة) عشان يفضل حجم القلب طبيعي وPA أفضل من AP لتقليل تكبير القلب. التعريض في شهيق كامل مع grid. الصدر بيتصور واقف عشان الحجاب الحاجز ينزل وتبان مستويات الهواء والسوائل. الأطفال kV أقل (60-70).</p>"}], "terms": [["high kV technique", "100-130 kVp with low mAs for chest.", "kV عالي للصدر."]]}, {"id": "fund10_2", "title_en": "PA and lateral projections", "title_ar": "الإسقاط الخلفي الأمامي والجانبي", "figs": [], "blocks": [{"en": "<p>Routine views are PA and lateral. PA erect: film 35x35 or 35x43 cm, MSP to the midline of the Bucky, hands on pelvis and abducted to move scapulae away, chin raised, cassette 5 cm above the shoulders, CR horizontal, CP at MSP at the level of the scapular tips (T7), FFD 180 cm, fine focus and grid, full inspiration. Lateral: 35x43 lengthwise, MCP to the midline, hands raised on head, same CP, left lateral is routine unless right lung pathology needs a right lateral. The anode heel effect is used with the anode toward the upper chest. Special views: apical, lordotic, lateral decubitus, AP supine, LAO and LPO.</p>", "ar": "<p>الوضعين الروتينيين PA وlateral. PA واقف: فيلم 35x35 أو 35x43 والـMSP على منتصف Bucky والإيدين على الحوض ومبعدين عشان الكتف يبعد عن الصدر والدقن مرفوعة والكاسيت فوق الكتف 5 سم والشعاع أفقي ونقطة التركيز على MSP عند أسفل الكتف (T7) وFFD 180 سم وfocus دقيق وgrid وشهيق كامل. الجانبي: 35x43 طولي والـMCP على المنتصف والإيدين مرفوعة على الراس ونفس النقطة، والجانبي الشمال روتيني إلا لو مرض في الرئة اليمين فنعمل يمين. نستخدم anode heel effect والأنود ناحية أعلى الصدر. وضعيات خاصة: apical وlordotic وlateral decubitus وAP supine وLAO وLPO.</p>"}], "terms": [["CP for chest", "T7, tips of the scapulae.", "T7 عند أسفل الكتف."]]}], "flash": [{"f": "Chest kV range?", "b": "100-130 kVp with low mAs."}, {"f": "Chest FFD?", "b": "180 cm (72 inches)."}, {"f": "Why PA over AP?", "b": "Reduces heart magnification."}, {"f": "Chest CP?", "b": "MSP at tips of scapulae (T7)."}, {"f": "Respiration?", "b": "Full inspiration."}, {"f": "Special views?", "b": "Apical, lordotic, decubitus, AP supine, LAO, LPO."}], "quiz": [{"q": "Chest FFD:", "o": ["100 cm", "50 cm", "180 cm", "120 cm"], "a": 2, "w": "180 سم."}, {"q": "Chest kV:", "o": ["Low", "High", "Zero", "Very low"], "a": 1, "w": "عالي."}, {"q": "CP chest:", "o": ["T7", "L3", "C1", "S1"], "a": 0, "w": "T7."}, {"q": "Preferred projection:", "o": ["AP", "Oblique", "Supine", "PA"], "a": 3, "w": "PA."}, {"q": "Chest taken:", "o": ["Prone", "Supine always", "Erect", "Seated only"], "a": 2, "w": "واقف."}], "recall": [{"q": "Technical aspects of chest x-ray.", "a": "High kV, low mAs, 180 cm, PA, full inspiration, erect.", "w": "الجوانب الفنية."}, {"q": "Describe PA chest erect.", "a": "35x35, hands on pelvis, CR horizontal T7, FFD 180.", "w": "وضع PA."}]}, "fund11": {"name": "Fundamentals of Radiography", "lec": "Lecture 11 - Darkroom and film processing", "short": "Fund", "sections": [{"id": "fund11_1", "title_en": "Darkroom functions", "title_ar": "وظايف الغرفة المظلمة", "figs": [], "blocks": [{"en": "<p>The darkroom has four basic functions: storage of unexposed film (film bin), film processing, handling of film (unloading exposed film) and film identification (patient name, date and time, x-ray number, DOB, Rt or Lt marker, exam type). Darkrooms are still needed for manually fed processors, daylight processors, loading automatic processor magazines and quality control tests (daily sensitometric strip). Follow the manufacturer recommendations on chemical strength, temperature and time, replenish and change solutions regularly, and monitor with a daily QC strip.</p>", "ar": "<p>الغرفة المظلمة ليها 4 وظايف: تخزين الفيلم غير المعرض (film bin) وتحميض الفيلم ومناولة الفيلم (تفريغ الفيلم المعرض) وتعريف الفيلم (اسم المريض والتاريخ والوقت ورقم الأشعة وتاريخ الميلاد وعلامة يمين أو شمال ونوع الفحص). لسه محتاجين الغرفة المظلمة للمحمضات اليدوية وdaylight وتعبئة magazines المحمض الأوتوماتيك واختبارات الجودة (شريط sensitometric يومي). اتبع تعليمات الشركة في تركيز الكيماويات ودرجة الحرارة والزمن وغيّر المحاليل بانتظام وراقبها بشريط QC يومي.</p>"}], "terms": [["film bin", "Storage for unexposed film.", "صندوق تخزين الفيلم."]]}, {"id": "fund11_2", "title_en": "Automatic processor chemistry and transport", "title_ar": "كيمياء ونقل المحمض الأوتوماتيك", "figs": [], "blocks": [{"en": "<p>Developer has 6 ingredients: reducing agent (hydroquinone, metol, phenidone), activator (sodium carbonate, softens gelatin and keeps alkaline pH), hardener (glutaraldehyde), preservative (sodium sulfite), restrainer (potassium bromide, prevents fog) and solvent (water). Fixer has 5: clearing agent (ammonium thiosulfate), tanning agent (aluminum salt), activator (acetic acid, neutralizes developer, acidic pH), preservative (sodium sulfite) and solvent (water). Wash removes residual chemicals, which would discolor the film; warm water is better than cold. Transport rollers: entrance, deep racks, turnaround, crossover, squeegee and dryer. Replenishment keeps tanks full and concentration right; feed film along the short edge.</p>", "ar": "<p>المحمض فيه 6 مكونات: مادة اختزال (hydroquinone وmetol وphenidone) ومنشط (sodium carbonate بيلين الجيلاتين ويحافظ على pH قلوي) ومقسّي (glutaraldehyde) وحافظة (sodium sulfite) ومثبط (potassium bromide بيمنع fog) ومذيب (ماء). المثبت فيه 5: clearing agent (ammonium thiosulfate) وtanning agent (aluminum salt) ومنشط (acetic acid بيعادل المحمض وpH حمضي) وحافظة (sodium sulfite) ومذيب (ماء). الغسيل بيشيل الكيماويات المتبقية اللي ممكن تغير لون الفيلم، والماء الدافي أحسن من البارد. بكرات النقل: entrance وdeep racks وturnaround وcrossover وsqueegee وdryer. نظام replenishment بيحافظ على امتلاء الخزانات والتركيز وبندخل الفيلم من الحافة القصيرة.</p>"}], "terms": [["replenishment", "Keeps tanks full and solution concentration correct.", "تعويض المحاليل."]]}], "flash": [{"f": "Four darkroom functions?", "b": "Storage, processing, handling, identification."}, {"f": "Developer ingredients count?", "b": "Six."}, {"f": "Restrainer?", "b": "Potassium bromide; prevents fog."}, {"f": "Fixer clearing agent?", "b": "Ammonium thiosulfate."}, {"f": "Why wash?", "b": "Remove residual chemicals that discolor film."}, {"f": "Roller assemblies?", "b": "Entrance, deep racks, turnaround, crossover, squeegee, dryer."}], "quiz": [{"q": "Fixer has how many ingredients:", "o": ["6", "3", "8", "5"], "a": 3, "w": "5."}, {"q": "Restrainer:", "o": ["Sodium sulfite", "Acetic acid", "Potassium bromide", "Water"], "a": 2, "w": "potassium bromide."}, {"q": "Fixer activator:", "o": ["Sodium carbonate", "Acetic acid", "Glutaraldehyde", "Phenidone"], "a": 1, "w": "acetic."}, {"q": "Feed film along:", "o": ["Short edge", "Long edge", "Corner", "Any"], "a": 0, "w": "الحافة القصيرة."}, {"q": "Better wash:", "o": ["Cold water", "No water", "Oil", "Warm water"], "a": 3, "w": "ماء دافي."}], "recall": [{"q": "Developer and fixer ingredients.", "a": "6 developer, 5 fixer with examples.", "w": "المكونات."}, {"q": "Parts of automatic processor.", "a": "Feed tray, rollers, tanks, wash, dryer, replenishment.", "w": "أجزاء المحمض."}]}, "fund12": {"name": "Fundamentals of Radiography", "lec": "Lecture 12 - Introduction to CT", "short": "Fund", "sections": [{"id": "fund12_1", "title_en": "Principles and gantry", "title_ar": "المبادئ والـgantry", "figs": [], "blocks": [{"en": "<p>CT uses x-rays and computers to create cross-sectional slices of the body, mostly transverse axial. It was developed by Godfrey Hounsfield in the late 1960s. The gantry is the ring-shaped part that houses the x-ray tube, detectors, DAS (data acquisition system), collimators and cooling. It tilts about +30 to -30 degrees. Most scanners have a 70 cm aperture.</p>", "ar": "<p>الـCT بيستخدم الأشعة والكمبيوتر لعمل شرائح مقطعية للجسم غالبًا axial. اخترعه Godfrey Hounsfield في أواخر الستينات. الـgantry الجزء الحلقي اللي فيه الأنبوبة والـdetectors والـDAS (نظام جمع البيانات) والـcollimators والتبريد. بيميل حوالي +30 لـ -30 درجة. أغلب الأجهزة فتحتها 70 سم.</p>"}], "terms": [["gantry", "Ring that houses tube, detectors, DAS, collimators.", "الحلقة اللي فيها الأنبوبة والمستشعرات."]]}, {"id": "fund12_2", "title_en": "Main systems", "title_ar": "الأنظمة الرئيسية", "figs": [], "blocks": [{"en": "<p>X-ray source: tungsten anode (Z 74), focal spot 0.5 and 1.0 mm; smaller is sharper but tolerates less heat. Cooling: blowers, filters or oil-to-air heat exchange. Filtration removes soft x-rays, lowers dose and makes a more uniform beam. Collimation restricts the beam and reduces scatter; the pre-patient collimator affects dose, image quality and slice thickness, the post-patient one affects image quality and slice thickness only. The table moves in increments (feed, step or index). Axes X, Y, Z converge at the isocenter. Max scannable range is how far the table moves without repositioning.</p>", "ar": "<p>مصدر الأشعة: أنود تنجستن (Z=74) وfocal spot 0.5 و1.0 مم؛ الأصغر أوضح لكن بيتحمل حرارة أقل. التبريد: مراوح وفلاتر أو تبادل حرارة زيت-هوا. الفلترة بتشيل الأشعة اللينة وتقلل الجرعة وتدي شعاع أكتر تجانس. الـcollimation بيحصر الشعاع ويقلل التشتت؛ pre-patient بيأثر على الجرعة والجودة وسمك الشريحة وpost-patient على الجودة وسمك الشريحة بس. الترابيزة بتتحرك على خطوات (feed أو step أو index). المحاور X وY وZ بتتقابل في isocenter. Max scannable range هو أقصى مدى تتحركه الترابيزة من غير إعادة وضع.</p>"}], "terms": [["isocenter", "Convergence point of the three axes of rotation.", "نقطة تلاقي المحاور."]]}], "flash": [{"f": "Who developed CT?", "b": "Godfrey Hounsfield, late 1960s."}, {"f": "Gantry contents?", "b": "Tube, detectors, DAS, collimators, cooling."}, {"f": "Typical aperture?", "b": "70 cm."}, {"f": "Tilt range?", "b": "+30 to -30 degrees."}, {"f": "Anode material?", "b": "Tungsten, Z 74."}, {"f": "Isocenter?", "b": "Where the three axes converge."}], "quiz": [{"q": "CT inventor:", "o": ["Hounsfield", "Roentgen", "Bloch", "Curie"], "a": 0, "w": "Hounsfield."}, {"q": "Aperture:", "o": ["20 cm", "150 cm", "10 cm", "70 cm"], "a": 3, "w": "70."}, {"q": "Smaller focal spot gives:", "o": ["More heat", "Less contrast", "Sharper image", "Bigger slice"], "a": 2, "w": "أوضح."}, {"q": "Filtration removes:", "o": ["Hard x-rays", "Soft x-rays", "Light", "Sound"], "a": 1, "w": "الأشعة اللينة."}, {"q": "Table movement is called:", "o": ["Incrementation", "Tilt", "Aperture", "Gantry"], "a": 0, "w": "incrementation."}], "recall": [{"q": "Main CT components.", "a": "Gantry, tube, detectors, DAS, collimators, cooling, filtration, table.", "w": "مكونات CT."}, {"q": "Gantry and table characteristics.", "a": "Aperture 70 cm, tilt +-30, XYZ axes, isocenter, range.", "w": "خصائص الـgantry."}]}, "fund13": {"name": "Fundamentals of Radiography", "lec": "Lecture 13 - Introduction to MRI", "short": "Fund", "sections": [{"id": "fund13_1", "title_en": "History and benefits", "title_ar": "التاريخ والمميزات", "figs": [], "blocks": [{"en": "<p>Bloch and Purcell discovered magnetic resonance independently in 1946 (Nobel 1952). Damadian showed in 1971 that relaxation times differ in tumors, Ernst proposed MR imaging with phase and frequency encoding and Fourier transform in 1975, fMRI appeared in 1992, and Lauterbur and Mansfield received the Nobel Prize in 2003. MRI has superior tissue contrast compared with CT and radiography, uses properties of hydrogen nuclei and no ionizing radiation. It is generally without significant health risk but not studied enough to be called absolutely safe.</p>", "ar": "<p>Bloch وPurcell اكتشفوا الرنين المغناطيسي بشكل مستقل في 1946 (نوبل 1952). Damadian في 1971 وضّح إن زمن الاسترخاء بيختلف في الأورام، وErnst اقترح التصوير بالـphase وfrequency encoding وFourier في 1975، وfMRI ظهر 1992، وLauterbur وMansfield خدوا نوبل 2003. الـMRI كونتراست الأنسجة فيه أحسن من CT والأشعة العادية بيستخدم خواص نوى الهيدروجين وبدون إشعاع مؤين. عموما من غير مخاطر صحية كبيرة لكن مش مدروس كفاية لنقول آمن تمامًا.</p>"}], "terms": [["fMRI", "Maps function of brain regions; developed 1992.", "MRI وظيفي."]]}, {"id": "fund13_2", "title_en": "Components and magnets", "title_ar": "المكونات والمغناطيسات", "figs": [], "blocks": [{"en": "<p>Components: large homogeneous magnet, gradient coils, radiofrequency coils, computer system and patient couch. Three magnet types: superconducting (near absolute zero, 4.2 K, cooled with liquid helium or nitrogen, 1.5 T and higher, 3 T becoming standard, large fringe field), permanent (bricks of ferromagnetic material, open design, about 0.2 T or less, less claustrophobia and smaller fringe field) and resistive electromagnets (high power use, 0.3 T or less). Low field is under 0.2 T, middle 0.2 to 0.6 T, high 1.0 T and above.</p>", "ar": "<p>المكونات: مغناطيس كبير متجانس وgradient coils وRF coils وكمبيوتر وترابيزة. 3 أنواع مغناطيس: superconducting (قريب من الصفر المطلق 4.2K ومبرد بهيليوم أو نيتروجين سائل و1.5 تسلا فأكتر و3T بقى معيار وfringe field كبير) وpermanent (طوب من مادة حديدية ومفتوح حوالي 0.2T أو أقل وclaustrophobia أقل وfringe field أصغر) وresistive electromagnet (استهلاك كهربا عالي و0.3T أو أقل). المجال الضعيف أقل من 0.2T والمتوسط من 0.2 لـ0.6 والعالي 1.0 فأكتر.</p>"}], "terms": [["fringe field", "Magnetic field leaking around the magnet; can affect pacemakers.", "المجال المتسرب حول المغناطيس."]]}], "flash": [{"f": "MRI discoverers 1946?", "b": "Bloch and Purcell."}, {"f": "MRI nucleus used?", "b": "Hydrogen."}, {"f": "MRI ionizing radiation?", "b": "None."}, {"f": "Superconducting temperature?", "b": "About 4.2 K, near absolute zero."}, {"f": "Permanent magnet strength?", "b": "About 0.2 T or less."}, {"f": "High field?", "b": "1.0 T and above."}], "quiz": [{"q": "MRI uses:", "o": ["Iodine", "Hydrogen nuclei", "Calcium", "Carbon"], "a": 1, "w": "هيدروجين."}, {"q": "Standard high field:", "o": ["3 T", "0.1 T", "0.05 T", "0.2 T"], "a": 0, "w": "3T."}, {"q": "Open design magnet:", "o": ["Superconducting", "Resistive only", "None", "Permanent"], "a": 3, "w": "permanent."}, {"q": "Superconductor coolant:", "o": ["Water", "Oil", "Liquid helium", "Air"], "a": 2, "w": "هيليوم."}, {"q": "MRI vs CT contrast:", "o": ["CT better", "MRI better", "Same", "None"], "a": 1, "w": "MRI أحسن."}], "recall": [{"q": "Compare the three magnet types.", "a": "Superconducting high field cryogens; permanent open low field; resistive high power low field.", "w": "أنواع المغناطيس."}, {"q": "Benefits of MRI.", "a": "Superior soft tissue contrast, no ionizing radiation.", "w": "مميزات MRI."}]}, "fund14": {"name": "Fundamentals of Radiography", "lec": "Lecture 14 - MRI physics", "short": "Fund", "sections": [{"id": "fund14_1", "title_en": "Hydrogen, precession and resonance", "title_ar": "الهيدروجين والـprecession والرنين", "figs": [], "blocks": [{"en": "<p>A moving charged particle creates a magnetic field, and the spinning positively charged hydrogen nucleus generates one. Hydrogen is used because it is abundant in the body (water) and has a large magnetic moment. In the bore the nuclei align parallel (low energy) or anti-parallel (high energy) to the main field B0. They precess like a spinning top; the precessional frequency depends on B0. Resonance is absorption of energy only at a specific frequency, the Larmor frequency: w0 = gamma x B0.</p>", "ar": "<p>الجسيم المشحون المتحرك بيعمل مجال مغناطيسي ونواة الهيدروجين الدايرة الموجبة بتعمل مجال. بنستخدم الهيدروجين لأنه كتير في الجسم (ماء) وعنده magnetic moment كبير. جوه الجهاز النوى بتصطف parallel (طاقة قليلة) أو anti-parallel (طاقة عالية) مع المجال الأساسي B0. وبتدور (precess) زي الخذروف؛ وتردد الـprecession بيعتمد على B0. Resonance امتصاص طاقة عند تردد محدد هو Larmor frequency: w0 = gamma x B0.</p>"}], "terms": [["Larmor frequency", "Precessional frequency proportional to B0.", "تردد الرنين."]]}, {"id": "fund14_2", "title_en": "RF, relaxation and weighting", "title_ar": "الـRF والاسترخاء والـweighting", "figs": [], "blocks": [{"en": "<p>The RF pulse produces field B1 applied at 90 degrees to B0. When it stops, the NMV relaxes back to B0. TR is the time between two RF pulses; TE is the time from the RF pulse to the maximum signal. Short TR and short TE give a T1-weighted image (shows anatomy); long TR and long TE give a T2-weighted image (shows pathology). Proton density reflects mobile hydrogen concentration. T1 is spin-lattice relaxation (return to alignment with B0); T2 depends on interaction between protons.</p>", "ar": "<p>نبضة الـRF بتعمل مجال B1 بيتطبق 90 درجة على B0. لما توقف الـNMV بيرجع لـB0 (relaxation). TR الزمن بين نبضتين وTE الزمن من بداية النبضة لأقصى إشارة. TR قصير وTE قصير = صورة T1 (بتوضح التشريح)؛ TR طويل وTE طويل = صورة T2 (بتوضح المرض). Proton density بتعكس تركيز الهيدروجين المتحرك. T1 هو spin-lattice (الرجوع لمحاذاة B0) وT2 بيعتمد على تفاعل البروتونات مع بعض.</p>"}], "terms": [["T1 weighted", "Short TR and short TE; shows anatomy.", "TR وTE قصار."]]}], "flash": [{"f": "Why hydrogen?", "b": "Abundant in water, large magnetic moment."}, {"f": "Larmor equation?", "b": "w0 = gamma x B0."}, {"f": "B1 direction?", "b": "90 degrees to B0."}, {"f": "TR?", "b": "Time between two RF pulses."}, {"f": "T1 weighting?", "b": "Short TR, short TE; anatomy."}, {"f": "T2 weighting?", "b": "Long TR, long TE; pathology."}], "quiz": [{"q": "Nucleus imaged:", "o": ["Oxygen", "Sodium", "Hydrogen", "Iron"], "a": 2, "w": "هيدروجين."}, {"q": "T2 shows:", "o": ["Anatomy only", "Pathology", "Bone", "Air"], "a": 1, "w": "المرض."}, {"q": "TE is:", "o": ["Time to max signal", "Time between pulses", "Gradient", "Coil"], "a": 0, "w": "TE."}, {"q": "Precession depends on:", "o": ["B1", "TE", "Table", "B0"], "a": 3, "w": "B0."}, {"q": "Short TR short TE:", "o": ["T2", "PD", "T1", "CT"], "a": 2, "w": "T1."}], "recall": [{"q": "Explain Larmor and resonance.", "a": "Precession frequency proportional to B0; energy absorbed at that frequency.", "w": "Larmor."}, {"q": "Compare T1 and T2.", "a": "T1 short TR/TE anatomy; T2 long TR/TE pathology.", "w": "T1 وT2."}]}, "fund15": {"name": "Fundamentals of Radiography", "lec": "Lecture 15 - Introduction to ultrasound", "short": "Fund", "sections": [{"id": "fund15_1", "title_en": "How ultrasound works", "title_ar": "إزاي الألتراساوند بيشتغل", "figs": [], "blocks": [{"en": "<p>Ultrasound is non-audible sound produced by piezoelectric materials in the probe. Sound sent out and reflected back to the transducer forms the image: brightness is the intensity of the reflection and depth is the time delay. Differences in acoustic impedance between tissues cause reflection. High frequency waves are absorbed more, giving shallower but higher resolution images: higher frequency = shorter wavelength = higher resolution = less depth.</p>", "ar": "<p>الألتراساوند صوت غير مسموع بيتولد من مواد piezoelectric في الـprobe. الصوت المرسل والمنعكس للترانسديوسر بيكوّن الصورة: السطوع = شدة الانعكاس والعمق = زمن التأخير. اختلاف acoustic impedance بين الأنسجة بيسبب الانعكاس. الترددات العالية بتتمتص أكتر فبتدي صورة أقل عمق وأعلى دقة: تردد أعلى = طول موجة أقصر = دقة أعلى = عمق أقل.</p>"}], "terms": [["acoustic impedance", "Resistance of tissue to sound propagation.", "مقاومة النسيج للصوت."]]}, {"id": "fund15_2", "title_en": "Exam steps and modes", "title_ar": "خطوات الفحص والأوضاع", "figs": [], "blocks": [{"en": "<p>Prepare: clean machine and probe with antiseptic, stand on the patient's right, choose the transducer, enter patient data and exam type, position and drape the patient, apply gel. Modes: B-mode (brightness), M-mode (motion) and Doppler. Adjust depth for the structure of interest and adjust gain (signal amplification on return; can be under, appropriate or over). After: clean gel from skin, end exam, clean probe. eFAST is extended focused assessment with sonography for trauma: cardiac, RUQ/chest, LUQ/chest and pelvic views.</p>", "ar": "<p>التجهيز: نضف الجهاز والـprobe بمطهر ووقف على يمين المريض واختار الترانسديوسر وسجل بيانات المريض ونوع الفحص ووضّع المريض وغطيه وحط الجل. الأوضاع: B-mode (سطوع) وM-mode (حركة) وDoppler. اظبط العمق للتركيب المطلوب واظبط الـgain (تكبير الإشارة العائدة؛ ممكن يبقى قليل أو مناسب أو زايد). بعد الفحص: امسح الجل وانهي الفحص ونضف الـprobe. eFAST تقييم موجه موسع بالسونار للإصابات: قلب وRUQ/صدر وLUQ/صدر وحوض.</p>"}], "terms": [["eFAST", "Extended focused assessment with sonography for trauma.", "تقييم سونار للإصابات."]]}], "flash": [{"f": "Probe produces sound by?", "b": "Piezoelectric material."}, {"f": "Brightness equals?", "b": "Intensity of reflection."}, {"f": "Depth from?", "b": "Time delay."}, {"f": "High frequency gives?", "b": "Higher resolution, less depth."}, {"f": "US modes?", "b": "B, M, Doppler."}, {"f": "eFAST views?", "b": "Cardiac, RUQ, LUQ, pelvic."}], "quiz": [{"q": "Image depth is from:", "o": ["Brightness", "Gain", "Gel", "Time delay"], "a": 3, "w": "زمن."}, {"q": "Higher frequency:", "o": ["More depth", "Longer wavelength", "Better resolution", "None"], "a": 2, "w": "دقة أعلى."}, {"q": "Gain controls:", "o": ["Depth", "Signal amplification", "Frequency", "Gel"], "a": 1, "w": "التكبير."}, {"q": "M-mode shows:", "o": ["Motion", "Color", "Bone", "Dose"], "a": 0, "w": "حركة."}, {"q": "Operator stands:", "o": ["Left", "Behind", "Far", "Patient's right"], "a": 3, "w": "يمين المريض."}], "recall": [{"q": "How is the US image formed?", "a": "Reflected echoes: intensity brightness, delay depth.", "w": "تكوين الصورة."}, {"q": "Steps of a US exam.", "a": "Prepare, gel, mode, depth, gain, clean.", "w": "خطوات الفحص."}]}, "fund16": {"name": "Fundamentals of Radiography", "lec": "Lecture 16 - Ultrasound physics and instrumentation", "short": "Fund", "sections": [{"id": "fund16_1", "title_en": "Sound waves", "title_ar": "موجات الصوت", "figs": [], "blocks": [{"en": "<p>A wave transfers energy from point to point in a medium. Sound is a mechanical, longitudinal pressure wave; it is not ionizing, not transverse, not electromagnetic and cannot travel in a vacuum. Spectrum: infrasound below 20 Hz, audible 20 Hz to 20 kHz, ultrasound above 20 kHz. Medical ultrasound uses 2 to 16 MHz.</p>", "ar": "<p>الموجة بتنقل طاقة من نقطة لنقطة في وسط. الصوت موجة ضغط ميكانيكية طولية؛ مش مؤينة ومش مستعرضة ومش كهرومغناطيسية ومبتسافرش في الفراغ. الطيف: infrasound أقل من 20 هرتز ومسموع 20 هرتز لـ20 كيلوهرتز وultrasound فوق 20 كيلوهرتز. الألتراساوند الطبي 2 لـ16 ميجاهرتز.</p>"}], "terms": [["ultrasound", "Sound above 20 kHz; medical range 2-16 MHz.", "صوت فوق 20 كيلوهرتز."]]}, {"id": "fund16_2", "title_en": "Speed, wavelength and attenuation", "title_ar": "السرعة وطول الموجة والتوهين", "figs": [], "blocks": [{"en": "<p>Speed of sound depends on the medium: it is inversely related to density and elasticity. Air 330 m/s, fat 1460, water 1480, soft tissue average 1540 m/s. Wave equation: C = F x WL. Wavelength depends on frequency and speed; shorter wavelength gives better resolution but poorer penetration, and penetration is the first criterion when choosing a transducer. Attenuation causes: absorption, reflection, scattering and refraction.</p>", "ar": "<p>سرعة الصوت بتعتمد على الوسط: علاقتها عكسية مع الكثافة والمرونة. الهوا 330 م/ث والدهون 1460 والماء 1480 والنسيج الرخو بمتوسط 1540 م/ث. معادلة الموجة: C = F x WL. طول الموجة بيعتمد على التردد والسرعة؛ طول أقصر = دقة أحسن لكن اختراق أضعف، والاختراق هو المعيار الأول لاختيار الترانسديوسر. أسباب التوهين: absorption وreflection وscattering وrefraction.</p>"}], "terms": [["attenuation", "Loss of sound energy by absorption, reflection, scattering, refraction.", "فقد طاقة الصوت."]]}], "flash": [{"f": "Sound type?", "b": "Mechanical longitudinal pressure wave."}, {"f": "Ultrasound frequency?", "b": "Above 20 kHz."}, {"f": "Medical range?", "b": "2-16 MHz."}, {"f": "Soft tissue speed?", "b": "1540 m/s."}, {"f": "Wave equation?", "b": "C = F x WL."}, {"f": "Attenuation causes?", "b": "Absorption, reflection, scattering, refraction."}], "quiz": [{"q": "Sound can travel in:", "o": ["Media only", "Vacuum", "Space", "None"], "a": 0, "w": "وسط."}, {"q": "Soft tissue speed:", "o": ["330 m/s", "1480 m/s", "3000 m/s", "1540 m/s"], "a": 3, "w": "1540."}, {"q": "Short wavelength gives:", "o": ["Better penetration", "Nothing", "Better resolution", "Less detail"], "a": 2, "w": "دقة."}, {"q": "First criterion for transducer:", "o": ["Resolution", "Penetration", "Color", "Price"], "a": 1, "w": "الاختراق."}, {"q": "Not attenuation:", "o": ["Ionization", "Absorption", "Scattering", "Refraction"], "a": 0, "w": "مش توهين."}], "recall": [{"q": "Properties of sound.", "a": "Mechanical longitudinal, not EM, needs medium.", "w": "خواص الصوت."}, {"q": "Explain wave equation and wavelength.", "a": "C = F x WL; short WL better resolution poorer depth.", "w": "المعادلة."}]}, "fund17": {"name": "Fundamentals of Radiography", "lec": "Lecture 17 - X-ray tube and generator", "short": "Fund", "sections": [{"id": "fund17_1", "title_en": "Anode, cathode and kVp", "title_ar": "الأنود والكاثود", "figs": [], "blocks": [{"en": "<p>Tubes have stationary or rotating anodes; most diagnostic tubes use a rotating anode because of greater heat loading. A tungsten insert sits in a copper block, and the copper supports the target and removes heat. The rotor is copper bars around an iron core, with the stator outside the tube forming an induction motor. Anode angle ranges 7 to 20 degrees, most commonly 12-15. The cathode is a helical tungsten filament in a focusing cup. Electrons are accelerated by 20 to 150 kVp; kinetic energy is proportional to the potential difference. Tube current is in mA (1 mA = 6.24 x 10^15 electrons/s).</p>", "ar": "<p>الأنبوبة فيها أنود ثابت أو دوار؛ أغلب أنابيب التشخيص بأنود دوار لتحمل حرارة أكبر. إدخال تنجستن في كتلة نحاس والنحاس بيسند الهدف ويشيل الحرارة. الـrotor قضبان نحاس حوالين قلب حديد والـstator برا الأنبوبة وبيكوّنوا موتور induction. زاوية الأنود من 7 لـ20 درجة والأشهر 12-15. الكاثود فتيلة تنجستن حلزونية في focusing cup. الإلكترونات بتتسارع بـ20 لـ150 kVp؛ الطاقة الحركية متناسبة مع فرق الجهد. تيار الأنبوبة بالـmA (1 mA = 6.24 x 10^15 إلكترون/ث).</p>"}], "terms": [["rotating anode", "Spreads heat over a large area; used in most diagnostic tubes.", "أنود دوار."]]}, {"id": "fund17_2", "title_en": "Generator", "title_ar": "المولد", "figs": [], "blocks": [{"en": "<p>The generator provides current at high voltage to the tube. Hospital power is about 220 V while 20,000 to 150,000 V is needed. Transformers convert low voltage to high voltage by electromagnetic induction, which occurs with changing magnetic fields and alternating current. The three main selectable parameters on the control panel are kVp, mA and exposure time, which determine beam quality and quantity.</p>", "ar": "<p>المولد بيدي تيار بجهد عالي للأنبوبة. كهرباء المستشفى حوالي 220 فولت والمطلوب 20,000 لـ150,000. المحولات بتحول الجهد المنخفض لعالي بالـelectromagnetic induction اللي بتحصل مع مجال مغناطيسي متغير وتيار متردد. العوامل التلاتة على لوحة التحكم: kVp وmA وزمن التعريض وهي بتحدد جودة وكمية الشعاع.</p>"}], "terms": [["transformer", "Converts low voltage to high voltage by induction.", "محول جهد."]]}], "flash": [{"f": "Why rotating anode?", "b": "Higher heat loading."}, {"f": "Copper role?", "b": "Supports tungsten and removes heat."}, {"f": "Common anode angle?", "b": "12-15 degrees."}, {"f": "Cathode?", "b": "Tungsten filament in focusing cup."}, {"f": "Diagnostic kVp?", "b": "20-150 kVp."}, {"f": "Generator transformer role?", "b": "Low voltage to high voltage."}], "quiz": [{"q": "Cathode material:", "o": ["Copper", "Tungsten filament", "Iron", "Glass"], "a": 1, "w": "تنجستن."}, {"q": "Hospital voltage:", "o": ["About 220 V", "20 kV", "150 kV", "1 MV"], "a": 0, "w": "220."}, {"q": "Common anode angle:", "o": ["45", "1", "90", "12-15"], "a": 3, "w": "12-15."}, {"q": "Tube current unit:", "o": ["kV", "Hz", "mA", "Gy"], "a": 2, "w": "mA."}, {"q": "Transformers work by:", "o": ["Friction", "Induction", "Chemistry", "Heat"], "a": 1, "w": "induction."}], "recall": [{"q": "Describe anode and cathode.", "a": "Rotating tungsten anode in copper; tungsten filament cathode.", "w": "الأنود والكاثود."}, {"q": "Role of generator.", "a": "Transformers step up voltage; kVp, mA, time set beam.", "w": "المولد."}]}, "fund19": {"name": "Fundamentals of Radiography", "lec": "Lecture 19 - Units of radiation measurement", "short": "Fund", "sections": [{"id": "fund19_1", "title_en": "Exposure and absorbed dose", "title_ar": "التعرض والجرعة الممتصة", "figs": [], "blocks": [{"en": "<p>Roentgen (R) is the unit of exposure: the amount of radiation that generates 2.58 x 10^-4 coulombs per kg of air. Exposure (X) is the charge produced by ionizing radiation per mass of air; its SI unit is C/kg. Absorbed dose is the energy deposited per unit mass of material. The traditional unit is the rad (1 rad = 0.01 J/kg); the SI unit is the gray (1 Gy = 1 J/kg = 100 rad). The old definition of the curie is the activity of one gram of Ra-226.</p>", "ar": "<p>Roentgen (R) وحدة التعرض: كمية الإشعاع اللي بتولد 2.58 x 10^-4 كولوم لكل كجم هوا. Exposure (X) الشحنة الناتجة عن الإشعاع المؤين لكل كتلة هوا ووحدتها C/kg. الجرعة الممتصة هي الطاقة المترسبة لكل وحدة كتلة. الوحدة القديمة rad (1 rad = 0.01 J/kg) والوحدة الدولية gray (1 Gy = 1 J/kg = 100 rad). والـcurie تعريفه القديم نشاط جرام راديوم 226.</p>"}], "terms": [["gray", "SI unit of absorbed dose, 1 J/kg.", "وحدة الجرعة الممتصة."]]}, {"id": "fund19_2", "title_en": "Equivalent dose", "title_ar": "الجرعة المكافئة", "figs": [], "blocks": [{"en": "<p>The rem (roentgen-equivalent man) is the absorbed dose in rad multiplied by a weighting factor for the radiation type. For x-rays the factor is 1, so 1 rad = 1 rem. The SI unit is the sievert (1 Sv = 100 rem). Equivalent dose H(T,R) = D(T,R) x W(R): average absorbed dose in tissue times the radiation weighting factor. Doses are expressed as R/hr or mR/hr, and received dose as rem or mrem over a time. Personal dosimeters include film badges, TLD and electronic dosimeters.</p>", "ar": "<p>الـrem هو الجرعة الممتصة بالـrad مضروبة في weighting factor حسب نوع الإشعاع. للأشعة السينية العامل = 1 يعني 1 rad = 1 rem. الوحدة الدولية sievert (1 Sv = 100 rem). الجرعة المكافئة H = D x W: متوسط الجرعة الممتصة في النسيج مضروب في عامل الوزن. المعدلات بتتقال R/hr أو mR/hr والجرعة المستلمة بـrem أو mrem في فترة. أجهزة قياس الجرعة الشخصية: film badge وTLD وإلكترونية.</p>"}], "terms": [["sievert", "SI unit of equivalent dose, 100 rem.", "وحدة الجرعة المكافئة."]]}], "flash": [{"f": "Roentgen measures?", "b": "Exposure in air."}, {"f": "SI unit of exposure?", "b": "C/kg."}, {"f": "Gray equals?", "b": "1 J/kg = 100 rad."}, {"f": "Sievert equals?", "b": "100 rem."}, {"f": "X-ray weighting factor?", "b": "1."}, {"f": "Personal dosimeters?", "b": "Film badge, TLD, electronic."}], "quiz": [{"q": "SI absorbed dose:", "o": ["Sievert", "Roentgen", "Curie", "Gray"], "a": 3, "w": "gray."}, {"q": "SI equivalent dose:", "o": ["Gray", "Rad", "Sievert", "R"], "a": 2, "w": "sievert."}, {"q": "X-ray W factor:", "o": ["10", "1", "20", "0"], "a": 1, "w": "1."}, {"q": "Roentgen unit of:", "o": ["Exposure", "Dose absorbed", "Activity", "Time"], "a": 0, "w": "تعرض."}, {"q": "1 Gy:", "o": ["1 rad", "10 rad", "1000 rad", "100 rad"], "a": 3, "w": "100 rad."}], "recall": [{"q": "Define exposure and absorbed dose.", "a": "Charge per air mass; energy per material mass.", "w": "التعريف."}, {"q": "Equivalent dose formula.", "a": "H = D x W.", "w": "المعادلة."}]}, "fund20": {"name": "Fundamentals of Radiography", "lec": "Lecture 20 - Preparation for contrast studies", "short": "Fund", "sections": [{"id": "fund20_1", "title_en": "Barium studies preparation", "title_ar": "تحضير فحوصات الباريوم", "figs": [], "blocks": [{"en": "<p>For barium examination of the small intestine and barium enema: ask female patients about pregnancy, low-residue diet for 2-3 days with plenty of liquids, cathartics (strong laxatives) to cleanse the bowel, and stop oral feeding for about 8 hours. For barium enema a cleansing enema is also given, filling the colon with liquid to flush remaining fecal content.</p>", "ar": "<p>لفحص الباريوم للأمعاء الدقيقة وحقنة الباريوم: اسأل المريضة عن الحمل ورجيم قليل البقايا 2-3 أيام مع سوائل كتير وملينات قوية لتنظيف الأمعاء ووقف الأكل عن طريق الفم حوالي 8 ساعات. في حقنة الباريوم بتتعمل كمان حقنة تنظيف بتملا القولون بسائل عشان تطرد باقي البراز.</p>"}], "terms": [["cathartic", "Strong laxative used to cleanse the bowel.", "ملين قوي."]]}, {"id": "fund20_2", "title_en": "Small bowel study and follow-up", "title_ar": "دراسة الأمعاء الدقيقة والمتابعة", "figs": [], "blocks": [{"en": "<p>Contrast enters the small bowel orally (most common) or by small intestine enema with a tube. The first film is taken 15 minutes after the barium, then every 15-30 minutes until the whole small bowel is seen; spot films can be taken at any time. After any barium study bowel care is important because barium clumps and hardens, causing constipation or even impaction and obstruction. Patients should increase fluids and high-bulk foods.</p>", "ar": "<p>الصبغة بتدخل الأمعاء الدقيقة بالفم (الأشهر) أو بحقنة معوية بأنبوبة. أول فيلم بعد 15 دقيقة من الباريوم وبعدين كل 15-30 دقيقة لحد ما تظهر الأمعاء كلها وممكن أفلام موضعية في أي وقت. بعد أي فحص باريوم العناية بالأمعاء مهمة لأن الباريوم بيتكتل ويتصلب ويسبب إمساك أو انحشار وانسداد. المريض يزود السوائل والأكل عالي الألياف.</p>"}], "terms": [["barium impaction", "Hardened barium causing bowel obstruction.", "انحشار الباريوم."]]}], "flash": [{"f": "Pregnancy question?", "b": "Ask female patients first."}, {"f": "Diet before barium?", "b": "Low-residue 2-3 days with liquids."}, {"f": "Fasting?", "b": "About 8 hours."}, {"f": "First small bowel film?", "b": "15 minutes after barium."}, {"f": "Subsequent films?", "b": "Every 15-30 minutes."}, {"f": "Aftercare?", "b": "More fluids and high-bulk foods."}], "quiz": [{"q": "Fasting before barium:", "o": ["About 8 hours", "1 hour", "24 hours", "None"], "a": 0, "w": "8 ساعات."}, {"q": "Diet:", "o": ["High residue", "Fatty", "None", "Low residue"], "a": 3, "w": "قليل البقايا."}, {"q": "Common route:", "o": ["Rectal", "IV", "Oral", "Nasal"], "a": 2, "w": "بالفم."}, {"q": "Barium risk:", "o": ["Burn", "Impaction", "Fever", "Rash"], "a": 1, "w": "انحشار."}, {"q": "First film at:", "o": ["15 min", "1 min", "2 h", "5 h"], "a": 0, "w": "15 دقيقة."}], "recall": [{"q": "Prepare patient for barium enema.", "a": "Pregnancy check, diet, cathartics, cleansing enema, fast 8 h.", "w": "التحضير."}, {"q": "Follow-up care.", "a": "Fluids and bulk to avoid impaction.", "w": "المتابعة."}]}, "fund21": {"name": "Fundamentals of Radiography", "lec": "Lecture 21 - Radiographic exposure and quality", "short": "Fund", "sections": [{"id": "fund21_1", "title_en": "Exposure factors", "title_ar": "عوامل التعريض", "figs": [], "blocks": [{"en": "<p>Exposure factors determine quantity and quality of radiation. The operator controls kVp, mA and time (mA x time = mAs); SID, focal spot and filtration are secondary. kVp controls contrast and penetration and affects receptor exposure more than any other factor. mA determines the number of x-rays and patient dose is directly proportional to mA; it does not change electron energy. Exposure time is kept short to reduce motion blur. Distance follows the inverse square law: mAs2/mAs1 = SID2^2/SID1^2.</p>", "ar": "<p>عوامل التعريض بتحدد كمية وجودة الإشعاع. المشغل بيتحكم في kVp وmA والزمن (mA x time = mAs) وSID وfocal spot والفلترة ثانوية. kVp بيتحكم في الكونتراست والاختراق وتأثيره على تعريض المستقبل أكبر من أي عامل. mA بيحدد عدد الأشعة وجرعة المريض متناسبة طرديًا مع mA ومبيغيرش طاقة الإلكترونات. زمن التعريض بنخليه قصير لتقليل ضبابية الحركة. المسافة بتتبع inverse square law: mAs2/mAs1 = SID2 تربيع / SID1 تربيع.</p>"}], "terms": [["mAs", "mA multiplied by exposure time; quantity of radiation.", "كمية الإشعاع."]]}, {"id": "fund21_2", "title_en": "Radiographic quality", "title_ar": "جودة الصورة", "figs": [], "blocks": [{"en": "<p>Radiographic quality is the fidelity with which anatomic structures are imaged; factors are film, geometric and subject factors. Spatial resolution (recorded detail) is imaging small high-contrast structures like bone-soft tissue. Contrast resolution is distinguishing similar structures like liver-spleen or fat-muscle. Noise is an undesirable fluctuation in optical density. Speed is the receptor response to low exposure. Latitude is the exposure range that gives diagnostic density. Film factors include characteristic curve, density, contrast, latitude and processing time and temperature.</p>", "ar": "<p>جودة الصورة هي أمانة تصوير التراكيب التشريحية؛ عواملها: فيلم وهندسية ومتعلقة بالجسم. Spatial resolution تصوير تراكيب صغيرة عالية الكونتراست زي حدود عظم-نسيج رخو. Contrast resolution التفريق بين تراكيب متشابهة زي كبد-طحال ودهون-عضلة. Noise تذبذب غير مرغوب في الكثافة الضوئية. Speed استجابة المستقبل لتعريض قليل. Latitude مدى التعريض اللي بيدي كثافة تشخيصية. عوامل الفيلم: characteristic curve والكثافة والكونتراست والـlatitude وزمن ودرجة حرارة التحميض.</p>"}], "terms": [["latitude", "Range of exposure giving diagnostic optical density.", "مدى التعريض التشخيصي."]]}], "flash": [{"f": "Operator-controlled factors?", "b": "kVp, mA, time."}, {"f": "kVp controls?", "b": "Contrast and penetration."}, {"f": "mAs equals?", "b": "mA x time."}, {"f": "Why short exposure time?", "b": "Reduce motion blur."}, {"f": "Spatial resolution?", "b": "Imaging small high-contrast structures."}, {"f": "Noise?", "b": "Undesirable fluctuation in optical density."}], "quiz": [{"q": "kVp mainly controls:", "o": ["Dose only", "Contrast", "Noise", "Time"], "a": 1, "w": "كونتراست."}, {"q": "mAs measures:", "o": ["Quantity", "Quality", "Speed", "Latitude"], "a": 0, "w": "كمية."}, {"q": "Distance law:", "o": ["Linear", "Cubic", "None", "Inverse square"], "a": 3, "w": "inverse square."}, {"q": "Liver-spleen distinction:", "o": ["Spatial", "Noise", "Contrast resolution", "Speed"], "a": 2, "w": "contrast."}, {"q": "Latitude is:", "o": ["Dose", "Exposure range", "Film color", "Time"], "a": 1, "w": "مدى."}], "recall": [{"q": "Exposure factors.", "a": "kVp, mA, time, SID, focal spot, filtration.", "w": "العوامل."}, {"q": "Characteristics of quality.", "a": "Spatial and contrast resolution, noise, artifacts.", "w": "الجودة."}]}, "fund22": {"name": "Fundamentals of Radiography", "lec": "Lecture 22 - Fluoroscopy", "short": "Fund", "sections": [{"id": "fund22_1", "title_en": "Principle", "title_ar": "المبدأ", "figs": [], "blocks": [{"en": "<p>Fluoroscopy obtains live x-ray images (30 frames per second) by combining an x-ray source with a fluorescent screen; today the screen is coupled to an image intensifier and a TV camera so the radiologist watches live on a monitor. Chain: x-rays, input phosphor (cesium iodide), photoelectrons, output phosphor, light, optical coupling, video camera, monitor. It is a dynamic study versus static radiography. Low exposure rates are needed, so the receptor must have very high brightness gain; total exposure is usually higher than a radiograph because the exposure time is long.</p>", "ar": "<p>الفلورسكوبي بيدي صور أشعة حية (30 فريم في الثانية) بدمج مصدر أشعة مع شاشة فلورية؛ دلوقتي الشاشة متوصلة بـimage intensifier وكاميرا فيديو والأخصائي بيتفرج على مونيتور. السلسلة: أشعة ثم input phosphor (cesium iodide) ثم إلكترونات ثم output phosphor ثم ضوء ثم optical coupling ثم كاميرا ثم مونيتور. هو فحص ديناميكي عكس الأشعة العادية الثابتة. محتاج معدل تعريض قليل فالمستقبل لازم يبقى عنده brightness gain عالي جدًا؛ والتعريض الكلي أكبر من أشعة عادية لأن الزمن طويل.</p>"}], "terms": [["image intensifier", "Converts x-rays to a bright light image for fluoroscopy.", "مكبر الصورة."]]}, {"id": "fund22_2", "title_en": "Applications and recording", "title_ar": "التطبيقات والتسجيل", "figs": [], "blocks": [{"en": "<p>Uses: live diagnosis such as GI exams, and positioning patients or catheters in angiography. During contrast injection a sequence is recorded by high frame rate pulsed radiography. Sequences are not recorded unless clinically necessary (e.g. barium swallow). Digital fluoroscopy gives a real-time movie loop; a cine camera records the heart at 120 frames per second on 35 mm film; other modes are film photo-spot and digital photo-spot. The first fluoroscopes used barium platinocyanide screens, later replaced by cadmium tungstate.</p>", "ar": "<p>الاستخدامات: تشخيص حي زي فحوصات الجهاز الهضمي وتوضيع المريض أو القسطرة في الأنجيو. وقت حقن الصبغة بيتسجل تسلسل بـpulsed radiography بمعدل فريمات عالي. التسلسلات مبتتسجلش إلا للضرورة (زي بلع الباريوم). الـdigital fluoroscopy بيدي movie loop لحظي وكاميرا cine بتسجل القلب 120 فريم/ث على فيلم 35 مم وأوضاع تانية photo-spot فيلم أو ديجيتال. أول فلورسكوب استخدم شاشة barium platinocyanide واتبدلت بـcadmium tungstate.</p>"}], "terms": [["cine camera", "Records the heart at 120 frames/s.", "كاميرا السينما."]]}], "flash": [{"f": "Fluoroscopy frame rate?", "b": "30 frames per second."}, {"f": "Input phosphor material?", "b": "Cesium iodide."}, {"f": "Why high brightness gain?", "b": "Low exposure rate."}, {"f": "Fluoroscopy is?", "b": "Dynamic study."}, {"f": "Cine camera rate?", "b": "120 frames/s."}, {"f": "Early screen material?", "b": "Barium platinocyanide."}], "quiz": [{"q": "Fluoroscopy is:", "o": ["Static", "Ultrasound", "Live imaging", "MRI"], "a": 2, "w": "حي."}, {"q": "Input phosphor:", "o": ["Silver", "CsI", "Lead", "Gold"], "a": 1, "w": "CsI."}, {"q": "Rate:", "o": ["30 fps", "3 fps", "300 fps", "1 fps"], "a": 0, "w": "30."}, {"q": "Used for:", "o": ["Bone density", "MRI", "Skin", "Barium GI exam"], "a": 3, "w": "GI."}, {"q": "Recorded only if:", "o": ["Always", "Never", "Clinically needed", "Random"], "a": 2, "w": "للضرورة."}], "recall": [{"q": "Explain fluoroscopy chain.", "a": "X-ray, input phosphor, electrons, output phosphor, camera, monitor.", "w": "السلسلة."}, {"q": "Applications.", "a": "GI diagnosis, catheter positioning, recording.", "w": "التطبيقات."}]}, "fund23": {"name": "Fundamentals of Radiography", "lec": "Lecture 23 - MRI safety and patient preparation", "short": "Fund", "sections": [{"id": "fund23_1", "title_en": "Contraindications", "title_ar": "موانع الاستخدام", "figs": [], "blocks": [{"en": "<p>Absolute contraindications for MR scanning: pacemakers, ferromagnetic aneurysm clips, metallic fragments in the eye, cochlear implants, Starr-Edwards pre-6000 model heart valve, internal drug infusion pumps, neurostimulators and bone-growth stimulators. Pregnancy is not absolute but often considered a contraindication; if scanning is indicated, informed consent must be obtained and documented.</p>", "ar": "<p>موانع مطلقة للرنين: pacemaker وaneurysm clips حديدية وشظايا معدنية في العين وزرع القوقعة وصمام Starr-Edwards قبل موديل 6000 ومضخات الأدوية الداخلية وneurostimulators ومحفزات نمو العظم. الحمل مش مانع مطلق لكن غالبًا بيتعتبر مانع؛ ولو الفحص ضروري لازم موافقة مستنيرة ومتوثقة.</p>"}], "terms": [["absolute contraindication", "Condition where MRI must not be done, e.g. pacemaker.", "مانع مطلق."]]}, {"id": "fund23_2", "title_en": "Patient preparation and anxiety", "title_ar": "تجهيز المريض وتقليل القلق", "figs": [], "blocks": [{"en": "<p>Allow time to take history, explain the exam, remove all metal and make the patient comfortable. Explain: the scanner, the importance of lying still, the knocking sound from the gradients (ear protection may be needed), length of each sequence, two-way communication and monitoring, no ionizing radiation, and removing metal. The bore may cause claustrophobia; generally it is better not to mention it, but be ready if the patient does. Options: music and relaxation, move the patient in slowly, constant communication.</p>", "ar": "<p>اديلك وقت لأخذ التاريخ المرضي وشرح الفحص وإزالة كل المعادن وراحة المريض. اشرح: الجهاز وأهمية الثبات وصوت الطرق من الـgradients (ممكن سماعات) ومدة كل sequence والتواصل في الاتجاهين والمراقبة وإنه من غير إشعاع مؤين وإزالة المعادن. الـbore ممكن يسبب claustrophobia؛ الأفضل عمومًا مانقولش عليها بس نكون جاهزين لو المريض ذكرها. الخيارات: موسيقى واسترخاء وإدخال المريض ببطء وتواصل مستمر.</p>"}], "terms": [["claustrophobia", "Fear of confined spaces, may occur in the bore.", "رهاب الأماكن المغلقة."]]}], "flash": [{"f": "MRI absolute contraindications?", "b": "Pacemaker, aneurysm clips, cochlear implant, etc."}, {"f": "Pregnancy in MRI?", "b": "Not absolute; needs informed consent."}, {"f": "Noise source?", "b": "Gradients."}, {"f": "Metal?", "b": "Remove all."}, {"f": "Anxiety options?", "b": "Music, slow entry, communication."}, {"f": "Radiation in MRI?", "b": "None."}], "quiz": [{"q": "Absolute contraindication:", "o": ["Glasses plastic", "Cotton", "Tattoo none", "Pacemaker"], "a": 3, "w": "pacemaker."}, {"q": "Knocking comes from:", "o": ["Magnet cooling", "RF coil", "Gradients", "Table"], "a": 2, "w": "gradients."}, {"q": "Pregnancy:", "o": ["Absolute", "Not absolute", "Required", "None"], "a": 1, "w": "مش مطلق."}, {"q": "Patient must:", "o": ["Remove metal", "Add metal", "Wear jewelry", "Eat"], "a": 0, "w": "يشيل المعادن."}, {"q": "Communication is:", "o": ["None", "One-way", "Written", "Two-way"], "a": 3, "w": "اتجاهين."}], "recall": [{"q": "List MRI contraindications.", "a": "Pacemakers, clips, eye metal, cochlear, valve, pumps, stimulators.", "w": "الموانع."}, {"q": "Prepare and calm patient.", "a": "Explain, noise, metal removal, claustrophobia steps.", "w": "التجهيز."}]}, "fund24": {"name": "Fundamentals of Radiography", "lec": "Lecture 24 - MRI of the head", "short": "Fund", "sections": [{"id": "fund24_1", "title_en": "Indications and preparation", "title_ar": "الدواعي والتجهيز", "figs": [], "blocks": [{"en": "<p>Indications include metastasis, internal auditory canal and pituitary pathology, hydrocephalus, child abuse, cranial nerve pathology, congenital anomalies, epilepsy, cavernous angioma, meningitis, leukodystrophies, multiple sclerosis, HIV and abscesses. Preparation: toilet before, explain the procedure, offer ear plugs, remove metal (dentures, hearing aids, hairpins, jewelry), IV line if needed (tumor, MS) and make sure the questionnaire is filled. Position supine with the head secured in the head coil and cushions under the legs.</p>", "ar": "<p>الدواعي: ورم منتشر وأمراض القناة السمعية الداخلية والغدة النخامية وhydrocephalus وإساءة الأطفال وأمراض الأعصاب القحفية وتشوهات خلقية وصرع وcavernous angioma والتهاب السحايا وleukodystrophies وتصلب متعدد وHIV وخراريج. التجهيز: دخول الحمام قبل الفحص وشرح الإجراء وإدي سدادات الودن وشيل المعادن (طقم أسنان وسماعة وبنس وحلي) وكانيولا وريدية لو لازم (أورام وتصلب) وتأكد من ملء الاستبيان. الوضع supine والراس مثبتة في head coil ومخدات تحت الرجلين.</p>"}], "terms": [["head coil", "Coil in which the head is secured for brain MRI.", "كويل الراس."]]}, {"id": "fund24_2", "title_en": "Sequences and tips", "title_ar": "السيكونسات والنصايح", "figs": [], "blocks": [{"en": "<p>Scanogram in three planes. Sequence 1 axial T2-weighted TSE (TR 3500-4500, TE 100-120) from the vertex to the foramen magnum, plotted on the central sagittal line through the corpus callosum; or proton density; or double echo. Sequence 3 coronal FLAIR (dark fluid, TR 9000, TE 120); sequence 4 sagittal T2. Tips: symmetric positioning using the bridge of the nose, cushions behind the knees, extra cushions for kyphosis, and a mirror on the head coil reduces claustrophobia. Pathologies: glioblastoma (most common malignant adult brain tumor), subdural hemorrhage, meningioma (15% of intracranial neoplasms).</p>", "ar": "<p>Scanogram في 3 مستويات. Sequence 1 axial T2 TSE (TR 3500-4500 وTE 100-120) من القمة لحد foramen magnum ومخطط على الخط السهمي المركزي عبر corpus callosum؛ أو proton density أو double echo. Sequence 3 coronal FLAIR (سائل غامق وTR 9000 وTE 120) وSequence 4 sagittal T2. نصايح: توضيع متماثل بجسر الأنف ومخدة ورا الركب ومخدات إضافية في kyphosis ومراية على الكويل بتقلل claustrophobia. أمراض: glioblastoma (أشهر ورم خبيث للمخ في الكبار) ونزيف subdural وmeningioma (15% من أورام الجمجمة).</p>"}], "terms": [["FLAIR", "Fluid-suppressed sequence, dark fluid.", "سيكونس بيطفي السائل."]]}], "flash": [{"f": "Patient position?", "b": "Supine, head in head coil."}, {"f": "Seq 1?", "b": "Axial T2 TSE."}, {"f": "FLAIR plane?", "b": "Coronal."}, {"f": "FLAIR TR?", "b": "About 9000."}, {"f": "Most common adult malignant brain tumor?", "b": "Glioblastoma."}, {"f": "Mirror use?", "b": "Reduces claustrophobia."}], "quiz": [{"q": "FLAIR makes fluid:", "o": ["Dark", "Bright", "Red", "Normal"], "a": 0, "w": "غامق."}, {"q": "Head MRI position:", "o": ["Prone", "Standing", "Seated", "Supine"], "a": 3, "w": "supine."}, {"q": "Reference for symmetry:", "o": ["Chin", "Ear", "Bridge of nose", "Neck"], "a": 2, "w": "جسر الأنف."}, {"q": "Meningioma share:", "o": ["80%", "15%", "1%", "50%"], "a": 1, "w": "15%."}, {"q": "Coil:", "o": ["Head coil", "Knee coil", "Body only", "None"], "a": 0, "w": "head coil."}], "recall": [{"q": "Prepare patient for head MRI.", "a": "Toilet, explain, ear plugs, remove metal, IV, questionnaire.", "w": "التجهيز."}, {"q": "Basic brain sequences.", "a": "Axial T2, PD, coronal FLAIR, sagittal T2.", "w": "السيكونسات."}]}, "fund25": {"name": "Fundamentals of Radiography", "lec": "Lecture 25 - Dose measurement and patient protection", "short": "Fund", "sections": [{"id": "fund25_1", "title_en": "Dose measurement", "title_ar": "قياس الجرعة", "figs": [], "blocks": [{"en": "<p>Entrance skin exposure (ESE) is the exposure at the skin-entrance plane in air with the patient absent, recorded with k
