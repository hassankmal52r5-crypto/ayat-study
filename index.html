na cava enters the right atrium; four pulmonary veins enter the left atrium. Coronary arteries nourish the myocardium and blood empties into the coronary sinus.</p>", "ar": "<p>الجهاز الدوري: القلب (مضخة) والأوعية (شرايين وشرينات وشعيرات وأوردة صغيرة وأوردة). القلب 4 حجرات (أذينين رقيقين وبطينين سميكين) و4 صمامات: أذينية بطينية (ميترال شمال وثلاثي الشرف يمين) وهلالية (أورطي شمال ورئوي يمين). الأورطي من البطين الأيسر والرئوية من الأيمن والأجوف في الأذين الأيمن وأربع أوردة رئوية للأذين الأيسر. الشرايين التاجية بتغذي العضلة والدم بيفضي في الجيب التاجي.</p>"}, {"en": "<p>Cardiac muscle properties: functional syncytium (gap junctions, intercalated discs); fat is main fuel; blood flow mainly during diastole; high oxygen extraction; exclusively aerobic metabolism; action potential has a plateau (calcium influx); long refractory period (200-400 ms); depends on ECF and ICF calcium; rhythmic without external stimulation.</p>", "ar": "<p>خواص العضلة القلبية: syncytium وظيفي (gap junctions وintercalated discs) والدهون الوقود الأساسي والدم في الانبساط أساساً واستخلاص أكسجين عالي وأيض هوائي فقط وجهد الفعل له plateau (دخول كالسيوم) وفترة انحراف طويلة (200-400 مللي ثانية) وبتعتمد على كالسيوم داخل وخارج الخلية وإيقاعية من غير تنبيه خارجي.</p>"}], "terms": [["functional syncytium", "Cells linked by gap junctions so the heart contracts as one unit.", "الخلايا مترابطة فتنقبض كوحدة."]]}, {"id": "physio12_2", "title_en": "Conduction system and ECG", "title_ar": "جهاز التوصيل والرسم القلبي", "figs": [], "blocks": [{"en": "<p>Conduction: SA node (right atrium, pacemaker; 100/min without innervation, 70/min with), AV node (delays conduction; 45/min if pacemaker), internodal pathways, bundle of His, Purkinje fibers. Sympathetic increases and parasympathetic decreases SA discharge.</p>", "ar": "<p>التوصيل: العقدة الجيبية (الأذين الأيمن، منظم الإيقاع؛ 100/د بدون أعصاب و70 بالأعصاب) والعقدة الأذينية البطينية (تؤخر التوصيل؛ 45/د لو بقت المنظم) والمسارات بين العقد وحزمة هيس وألياف بوركنجي. السمبثاوي يزود والباراسمبثاوي يقلل تفريغ الجيبية.</p>"}, {"en": "<p>ECG records the electrical activity from the body surface; it does not detect mechanical events. Unipolar limb leads aVR, aVL, aVF; chest leads V1-V6; bipolar limb leads I, II, III. Waves: P = atrial depolarization; QRS = ventricular depolarization (and atrial repolarization); T = ventricular repolarization. Uses: heart rate, heart size, heart disease (IHD, MI), electrolyte disturbances.</p>", "ar": "<p>الرسم القلبي بيسجل النشاط الكهربي من سطح الجسم ولا يكشف الأحداث الميكانيكية. أطراف أحادية aVR وaVL وaVF وصدرية V1-V6 وثنائية I وII وIII. الموجات: P = إزالة استقطاب الأذينين؛ QRS = إزالة استقطاب البطينين (وإعادة استقطاب الأذينين)؛ T = إعادة استقطاب البطينين. الاستخدامات: معدل القلب وحجمه وأمراض القلب (IHD وMI) واضطرابات الأملاح.</p>"}], "terms": [["pacemaker", "SA node, the cardiac region with the fastest spontaneous discharge.", "منظم الإيقاع: العقدة الجيبية."]]}], "flash": [{"f": "Heart chambers and valves?", "b": "4 chambers; mitral, tricuspid, aortic, pulmonary valves."}, {"f": "Cardiac main fuel?", "b": "Fat."}, {"f": "Why is the cardiac refractory period long?", "b": "Plateau phase of the action potential."}, {"f": "When does the heart get its blood flow?", "b": "Mainly diastole."}, {"f": "Pacemaker?", "b": "SA node."}, {"f": "SA rate without and with innervation?", "b": "100/min and 70/min."}, {"f": "AV node role?", "b": "Delays conduction from atria to ventricles."}, {"f": "What does ECG record?", "b": "Electrical activity, not mechanical events."}, {"f": "P wave, QRS, T wave?", "b": "Atrial depolarization, ventricular depolarization, ventricular repolarization."}], "quiz": [{"q": "Right AV valve:", "o": ["Tricuspid", "Mitral", "Aortic", "Pulmonary"], "a": 0, "w": "ثلاثي الشرف."}, {"q": "Aorta leaves:", "o": ["Right ventricle", "Left atrium", "Right atrium", "Left ventricle"], "a": 3, "w": "البطين الأيسر."}, {"q": "Heart's pacemaker:", "o": ["AV node", "Purkinje", "SA node", "Bundle of His"], "a": 2, "w": "الجيبية."}, {"q": "Plateau is due to:", "o": ["Sodium efflux", "Calcium influx", "Potassium influx", "Chloride"], "a": 1, "w": "كالسيوم."}, {"q": "Cardiac muscle metabolism is:", "o": ["Exclusively aerobic", "Anaerobic", "Both", "None"], "a": 0, "w": "هوائي."}, {"q": "T wave represents:", "o": ["Atrial depolarization", "Ventricular depolarization", "AV delay", "Ventricular repolarization"], "a": 3, "w": "T."}, {"q": "Lead II records between:", "o": ["Both arms", "Left arm and left foot", "Right arm and left foot", "Chest"], "a": 2, "w": "ذراع يمين ورجل شمال."}, {"q": "AV node rate as pacemaker:", "o": ["100/min", "45/min", "70/min", "20/min"], "a": 1, "w": "45."}], "recall": [{"q": "Describe the heart's structure and muscle properties.", "a": "Chambers, valves, vessels; syncytium, plateau, refractoriness, aerobic.", "w": "القلب."}, {"q": "Explain conduction and ECG waves.", "a": "SA, AV, His, Purkinje; P, QRS, T; leads.", "w": "التوصيل والرسم."}]}, "physio13": {"name": "Physiology", "lec": "Lecture 13 - Gastrointestinal system", "short": "Physio", "sections": [{"id": "physio13_1", "title_en": "Structure, functions and control", "title_ar": "التركيب والوظائف والتحكم", "figs": [], "blocks": [{"en": "<p>GIT is a tube from mouth to anal canal with associated glands (salivary glands, pancreas, liver). The wall has mucosa, submucosa, muscle and serosa. Functions: digestion (enzymes, often secreted as proenzymes; bile for lipids), absorption (mainly small intestine) and excretion.</p>", "ar": "<p>الجهاز الهضمي أنبوب من الفم للشرج مع غدد مصاحبة (لعابية وبنكرياس وكبد). الجدار: مخاطية وتحت مخاطية وعضلات وسيروزا. الوظائف: هضم (إنزيمات غالباً بتتفرز كـproenzymes والصفرا للدهون) وامتصاص (في الأمعاء الدقيقة أساساً) وإخراج.</p>"}, {"en": "<p>Control: neural (enteric nervous system: myenteric Auerbach's and submucous Meissner's plexuses, plus ANS) and hormonal (GI hormones). Parasympathetic cholinergic increases muscular activity and secretions; sympathetic adrenergic reduces motility and causes vasoconstriction.</p>", "ar": "<p>التحكم: عصبي (الجهاز العصبي المعوي: ضفيرة Auerbach وMeissner مع الجهاز الذاتي) وهرموني (هرمونات الجهاز الهضمي). الباراسمبثاوي الكولينرجي يزود النشاط العضلي والإفرازات والسمبثاوي يقلل الحركة ويسبب انقباض أوعية.</p>"}], "terms": [["proenzyme", "Inactive enzyme precursor activated at the site of action.", "إنزيم غير نشط."]]}, {"id": "physio13_2", "title_en": "Digestion and absorption", "title_ar": "الهضم والامتصاص", "figs": [], "blocks": [{"en": "<p>Enzymes: salivary amylase (starch) and lingual lipase; stomach pepsins (from chief cells, activated by HCl) and gastric lipase; pancreas: trypsinogen activated by enteropeptidase to trypsin, which activates chymotrypsinogen, proelastase and procarboxypeptidases. Brush border enzymes: aminopeptidase, dipeptidase, maltase, sucrase, lactase.</p>", "ar": "<p>الإنزيمات: أميليز اللعاب (نشا) وlingual lipase؛ والمعدة pepsins (من chief cells ويتنشط بـHCl) وgastric lipase؛ والبنكرياس: trypsinogen يتنشط بـenteropeptidase لـtrypsin اللي ينشط chymotrypsinogen وproelastase وprocarboxypeptidases. إنزيمات الحافة الفرشاتية: aminopeptidase وdipeptidase وmaltase وsucrase وlactase.</p>"}, {"en": "<p>Carbohydrates are absorbed as monosaccharides; glucose by Na+ coupled secondary active transport, not affected by insulin. Proteins end as amino acids actively transported. Lipids: bile emulsifies fat, colipase anchors lipase, micelles carry fatty acids, cholesterol and monoglycerides to mucosal cells, where chylomicrons form and enter lymphatics.</p>", "ar": "<p>السكريات بتتمتص كسكريات أحادية؛ الجلوكوز بنقل نشط ثانوي مرتبط بالصوديوم ولا يتأثر بالإنسولين. البروتينات بتنتهي لأحماض أمينية بتتنقل بنشاط. الدهون: الصفرا تستحلبها وcolipase يثبت اللايبيز والـmicelles بتحمل الأحماض الدهنية والكوليسترول للخلايا المخاطية فتتكون chylomicrons وتدخل الليمف.</p>"}], "terms": [["micelle", "Bile salt aggregate that keeps fat digestion products soluble.", "ميسيل: تجمع أملاح الصفرا بيحمل نواتج الدهون."]]}], "flash": [{"f": "Associated organs of the GIT?", "b": "Salivary glands, pancreas, liver."}, {"f": "Three GIT functions?", "b": "Digestion, absorption, excretion."}, {"f": "Enteric plexuses?", "b": "Myenteric (Auerbach's) and submucous (Meissner's)."}, {"f": "Parasympathetic effect?", "b": "Increases motility and secretion."}, {"f": "Pepsin source?", "b": "Chief cells as pepsinogen, activated by HCl."}, {"f": "Trypsinogen activator?", "b": "Enteropeptidase."}, {"f": "Glucose absorption?", "b": "Secondary active with Na+."}, {"f": "Role of bile?", "b": "Emulsification and micelle formation."}, {"f": "Chylomicrons enter?", "b": "Lymphatics."}], "quiz": [{"q": "Associated gland of the GIT:", "o": ["Thyroid", "Pancreas", "Pituitary", "Adrenal"], "a": 1, "w": "البنكرياس."}, {"q": "Pepsinogen is activated by:", "o": ["HCl", "Bile", "Insulin", "Trypsin"], "a": 0, "w": "الحمض."}, {"q": "Trypsinogen is activated by:", "o": ["Pepsin", "Amylase", "Bile", "Enteropeptidase"], "a": 3, "w": "enteropeptidase."}, {"q": "Amylase digests:", "o": ["Protein", "Fat", "Starch", "DNA"], "a": 2, "w": "النشا."}, {"q": "Glucose absorption is not affected by:", "o": ["Sodium", "Insulin", "Carriers", "Energy"], "a": 1, "w": "لا يتأثر."}, {"q": "Micelles carry:", "o": ["Fat digestion products", "Glucose", "Amino acids", "Pepsin"], "a": 0, "w": "نواتج الدهون."}, {"q": "Sympathetic stimulation:", "o": ["Increases peristalsis", "Increases secretion", "Opens sphincters", "Reduces motility"], "a": 3, "w": "يقلل."}], "recall": [{"q": "Describe GIT structure, function and control.", "a": "Layers, glands, digestion/absorption/excretion; neural and hormonal control.", "w": "التركيب."}, {"q": "Explain digestion and absorption of carbohydrate, protein, lipid.", "a": "Amylase, pepsin, pancreatic enzymes, brush border; Na-glucose; bile and micelles.", "w": "الهضم والامتصاص."}]}, "path1": {"name": "Pathology 1", "lec": "Lecture 1 - Introduction to pathology and cell injury", "short": "Path", "sections": [{"id": "path1_1", "title_en": "What is pathology and disease", "title_ar": "يعني إيه باثولوجي ومرض", "figs": [], "blocks": [{"en": "<p>Pathology is the science of disease: its causes (etiology) and nature (inflammation, degeneration, circulatory, infection, neoplasia). It is a bridge between preclinical sciences (anatomy, physiology) and clinical medicine. General pathology studies changes common to all tissues; systemic pathology studies organ systems. Disease is an abnormal alteration of structure or function in any part of the body.</p>", "ar": "<p>الباثولوجي علم المرض: أسبابه (etiology) وطبيعته (التهاب وتنكس ودوراني وعدوى وأورام). وهو جسر بين العلوم الأساسية (تشريح وفسيولوجي) والطب الإكلينيكي. العام بيدرس التغيرات المشتركة لكل الأنسجة والنظامي بيدرس أجهزة الجسم. المرض هو تغير غير طبيعي في التركيب أو الوظيفة في أي جزء من الجسم.</p>"}, {"en": "<p>Four aspects: etiology (cause), pathogenesis (mechanism of development), morphology (structural changes) and functional consequences. Predisposing causes make a person more susceptible (damp weather, poor ventilation); exciting causes directly cause disease (hypoxia, chemicals). Causes: environmental (physical, chemical, nutritional, infections, immunological, psychological) and genetic (age, genes).</p>", "ar": "<p>أربع جوانب: السبب (etiology) والآلية (pathogenesis) والشكل (morphology) والنتائج الوظيفية. الأسباب المهيئة بتخلي الشخص أكتر عرضة (جو رطب وتهوية سيئة) والمسببة مباشرة (نقص أكسجين ومواد كيميائية). الأسباب: بيئية (فيزيائية وكيميائية وغذائية وعدوى ومناعية ونفسية) ووراثية (سن وجينات).</p>"}], "terms": [["etiology", "Study of the cause of a disease.", "دراسة سبب المرض."], ["pathogenesis", "Mechanism by which a disease develops.", "آلية تطور المرض."]]}, {"id": "path1_2", "title_en": "Classification and causes of cell injury", "title_ar": "التصنيف وأسباب إصابة الخلية", "figs": [], "blocks": [{"en": "<p>Classification: developmental (genetic, congenital) and acquired (inflammatory, neoplastic, degenerative, metabolic, iatrogenic = drug induced). One cause can give one disease, several causes one disease, or one cause several diseases. Investigations: biopsy (remove tissue or cells) and autopsy (examine body after death).</p>", "ar": "<p>التصنيف: تطوري (وراثي وخلقي) ومكتسب (التهابي وورمي وتنكسي وأيضي وiatrogenic = بسبب دواء). السبب الواحد ممكن يسبب مرض واحد أو أسباب كتير لمرض واحد أو سبب واحد لأمراض كتير. الفحوصات: خزعة (biopsy) وتشريح بعد الوفاة (autopsy).</p>"}, {"en": "<p>Causes of cell injury: oxygen deprivation (hypoxia, ischemia), nutritional imbalance, physical agents (trauma, heat, cold, radiation, electric shock), chemicals and drugs, infectious agents, immunologic reactions, genetic derangements. Hypoxia causes: ischemia, cardiorespiratory failure, anemia, CO poisoning. Chemicals injure directly or via toxic metabolites.</p>", "ar": "<p>أسباب إصابة الخلية: نقص أكسجين (hypoxia وischemia) واختلال التغذية وعوامل فيزيائية (رضوض وحرارة وبرودة وإشعاع وصعق) ومواد كيميائية وأدوية وعدوى وتفاعلات مناعية واضطرابات وراثية. أسباب hypoxia: ischemia وفشل قلبي تنفسي وأنيميا وتسمم CO. المواد الكيميائية بتأذي مباشرة أو بمستقلبات سامة.</p>"}], "terms": [["ischemia", "Loss of blood supply to a tissue.", "انقطاع الدم عن النسيج."]]}], "flash": [{"f": "Define pathology.", "b": "Science of disease: causes and nature."}, {"f": "Four aspects of disease studied?", "b": "Etiology, pathogenesis, morphology, functional consequences."}, {"f": "Predisposing versus exciting cause?", "b": "Makes susceptible vs directly causes."}, {"f": "General versus systemic pathology?", "b": "Common tissue changes vs organ systems."}, {"f": "Iatrogenic disease?", "b": "Drug induced."}, {"f": "Biopsy?", "b": "Removing tissue or cells."}, {"f": "Autopsy?", "b": "Examining a body after death."}, {"f": "Causes of hypoxia?", "b": "Ischemia, cardiorespiratory failure, anemia, CO poisoning."}, {"f": "Physical causes of injury?", "b": "Trauma, heat, cold, radiation, electric shock."}], "quiz": [{"q": "Etiology means:", "o": ["Mechanism", "Cause of disease", "Structure", "Prognosis"], "a": 1, "w": "السبب."}, {"q": "Pathogenesis means:", "o": ["How disease develops", "Cause", "Treatment", "Prevention"], "a": 0, "w": "الآلية."}, {"q": "A predisposing cause:", "o": ["Directly causes disease", "Treats disease", "Is a drug", "Increases susceptibility"], "a": 3, "w": "مهيئ."}, {"q": "Drug-induced disease is:", "o": ["Congenital", "Neoplastic", "Iatrogenic", "Degenerative"], "a": 2, "w": "iatrogenic."}, {"q": "Autopsy is:", "o": ["Tissue removal in life", "Examination after death", "Imaging", "Drug test"], "a": 1, "w": "بعد الوفاة."}, {"q": "Loss of blood supply is:", "o": ["Ischemia", "Hypoxia only", "Atrophy", "Hyperplasia"], "a": 0, "w": "ischemia."}, {"q": "CO poisoning causes:", "o": ["Hyperplasia", "Metaplasia", "Fibrosis", "Hypoxia"], "a": 3, "w": "نقص أكسجين."}], "recall": [{"q": "Define pathology and the four aspects of disease.", "a": "Science of disease; etiology, pathogenesis, morphology, functional consequences.", "w": "التعريف."}, {"q": "List causes of cell injury.", "a": "Hypoxia, nutritional, physical, chemical, infectious, immunologic, genetic.", "w": "أسباب الإصابة."}]}, "path2": {"name": "Pathology 1", "lec": "Lecture 2 - Cellular adaptations", "short": "Path", "sections": [{"id": "path2_1", "title_en": "Hypertrophy, hyperplasia and atrophy", "title_ar": "التضخم وفرط التنسج والضمور", "figs": [], "blocks": [{"en": "<p>Principal adaptive responses: hypertrophy, hyperplasia, atrophy, metaplasia. If adaptation is exceeded or the stress is harmful, cell injury develops. Hypertrophy is an increase in cell size (no new cells) from increased functional demand or hormones, e.g. pregnant uterus (physiologic), cardiac muscle in hypertension (pathologic). Hyperplasia is an increase in cell number, e.g. breast at puberty, liver regeneration after partial resection, endometrial hyperplasia from estrogen.</p>", "ar": "<p>الاستجابات التكيفية: hypertrophy وhyperplasia وatrophy وmetaplasia. لو التكيف زاد عن الحد أو الضغط ضار بتحصل إصابة. Hypertrophy زيادة حجم الخلايا (من غير خلايا جديدة) بسبب زيادة الحمل الوظيفي أو الهرمونات: الرحم في الحمل (فسيولوجي) وعضلة القلب في الضغط العالي (مرضي). Hyperplasia زيادة عدد الخلايا: الثدي في البلوغ وتجدد الكبد بعد استئصال جزء وفرط تنسج بطانة الرحم من الاستروجين.</p>"}, {"en": "<p>Hyperplasia is not neoplastic but can be fertile soil for malignancy (atypical endometrial hyperplasia raises adenocarcinoma risk). Atrophy is a decrease in cell size and number after adult size. Causes: decreased workload, loss of innervation, decreased blood supply, inadequate nutrition, loss of endocrine stimulation, pressure. Involution is physiologic atrophy (uterus after labour).</p>", "ar": "<p>Hyperplasia مش ورمي لكن ممكن يبقى أرض خصبة للسرطان (فرط تنسج بطانة الرحم غير النمطي يزود خطر السرطان الغدي). Atrophy نقص حجم وعدد الخلايا بعد وصول الحجم البالغ. الأسباب: قلة الشغل وفقد التعصيب ونقص الدم وسوء التغذية وفقد التحفيز الهرموني والضغط. Involution ضمور فسيولوجي (الرحم بعد الولادة).</p>"}], "terms": [["hypertrophy", "Increase in cell size without increase in cell number.", "زيادة حجم الخلايا."], ["hyperplasia", "Increase in the number of cells.", "زيادة عدد الخلايا."]]}, {"id": "path2_2", "title_en": "Hypoplasia, metaplasia and dysplasia", "title_ar": "نقص التنسج والتحول والخلل", "figs": [], "blocks": [{"en": "<p>Hypoplasia is incomplete development so an organ fails to reach adult size (e.g. kidney). Metaplasia is a reversible change in which one adult cell type is replaced by another, caused by chronic irritation (cigarette smoke, calculi) or vitamin A deficiency. Examples: squamous replaces columnar in endocervix; Barrett esophagus (columnar replaces squamous from reflux).</p>", "ar": "<p>Hypoplasia عدم اكتمال نمو العضو فما يوصلش لحجم البالغ (مثلاً الكلية). Metaplasia تغير عكسي بيتبدل فيه نوع خلية بالغة بنوع تاني بسبب تهيج مزمن (دخان وحصوات) أو نقص فيتامين A. أمثلة: الحرشفية بتحل محل العمودية في عنق الرحم وBarrett esophagus (عمودية بدل حرشفية من الارتجاع).</p>"}, {"en": "<p>Dysplasia is an atypical proliferative change from chronic irritation or inflammation and is premalignant (mild, moderate, marked, e.g. cervix). Hyperplasia and metaplasia are not premalignant but are fertile fields for dysplasia.</p>", "ar": "<p>Dysplasia تغير تكاثري غير نمطي من تهيج أو التهاب مزمن وهو قبل سرطاني (بسيط ومتوسط وشديد مثل عنق الرحم). Hyperplasia وmetaplasia مش قبل سرطانية لكن أرض خصبة للـdysplasia.</p>"}], "terms": [["metaplasia", "Reversible replacement of one adult cell type by another.", "استبدال نوع خلية بالغة بنوع تاني."], ["dysplasia", "Premalignant atypical proliferation.", "خلل تنسج قبل سرطاني."]]}], "flash": [{"f": "Four adaptive responses?", "b": "Hypertrophy, hyperplasia, atrophy, metaplasia."}, {"f": "Hypertrophy definition?", "b": "Increase in cell size, no new cells."}, {"f": "Hyperplasia definition?", "b": "Increase in cell number."}, {"f": "Physiologic hyperplasia examples?", "b": "Breast at puberty; liver regeneration."}, {"f": "Pathologic hypertrophy example?", "b": "Cardiac muscle in hypertension."}, {"f": "Causes of atrophy?", "b": "Less workload, denervation, low blood, poor nutrition, no endocrine stimulation, pressure."}, {"f": "What is involution?", "b": "Physiologic atrophy, e.g. uterus after labour."}, {"f": "Metaplasia causes?", "b": "Chronic irritation, vitamin A deficiency."}, {"f": "Barrett esophagus?", "b": "Columnar replaces squamous from reflux."}, {"f": "Dysplasia?", "b": "Premalignant atypical proliferation."}], "quiz": [{"q": "Pregnant uterus shows:", "o": ["Atrophy", "Dysplasia", "Physiologic hypertrophy", "Hypoplasia"], "a": 2, "w": "زيادة حجم."}, {"q": "Hyperplasia is an increase in:", "o": ["Cell size only", "Cell number", "Cell death", "Fibrosis"], "a": 1, "w": "العدد."}, {"q": "Which is premalignant?", "o": ["Dysplasia", "Hyperplasia", "Metaplasia", "Hypertrophy"], "a": 0, "w": "Dysplasia."}, {"q": "Hypoplasia means:", "o": ["Cell loss", "Cell replacement", "Tumor", "Incomplete development"], "a": 3, "w": "عدم اكتمال."}, {"q": "Barrett esophagus is:", "o": ["Atrophy", "Hyperplasia", "Metaplasia", "Neoplasia"], "a": 2, "w": "metaplasia."}, {"q": "Vitamin A deficiency can cause:", "o": ["Hypertrophy", "Metaplasia", "Hyperplasia", "Gigantism"], "a": 1, "w": "metaplasia."}, {"q": "Atrophy causes include:", "o": ["Loss of innervation", "Increased workload", "Excess hormone", "Fever"], "a": 0, "w": "فقد التعصيب."}], "recall": [{"q": "Differentiate hypertrophy and hyperplasia.", "a": "Cell size vs cell number, with examples.", "w": "الفرق."}, {"q": "Define metaplasia and dysplasia with examples.", "a": "Replacement of adult cell type; premalignant atypia; cervix, Barrett.", "w": "التعريف."}]}, "path3": {"name": "Pathology 1", "lec": "Lecture 3 - Acute inflammation", "short": "Path", "sections": [{"id": "path3_1", "title_en": "Signs and events", "title_ar": "العلامات والأحداث", "figs": [], "blocks": [{"en": "<p>Acute inflammation is an immediate early response to an injurious agent, lasting minutes to days, with exudation of fluid and plasma proteins and emigration of neutrophils. Five cardinal signs: redness (vessel dilation), heat (hyperemia), swelling (fluid from increased permeability), pain (stretching, edema, pus under pressure) and loss of function.</p>", "ar": "<p>الالتهاب الحاد استجابة مبكرة فورية لعامل ضار بتستمر دقائق لأيام مع نضح سوائل وبروتينات وهجرة نيوتروفيل. خمس علامات: احمرار (توسع الأوعية) وحرارة (hyperemia) وتورم (سائل من زيادة النفاذية) وألم (شد وأوديما وصديد تحت ضغط) وفقد الوظيفة.</p>"}, {"en": "<p>Vascular response: momentary vasoconstriction, then vasodilatation with increased flow, then slowing and stasis. Cellular response: margination, rolling and adhesion, transmigration, chemotaxis, phagocytosis. Exudate is protein-rich inflammatory edema; transudate is non-inflammatory edema (cardiac, renal, nutritional).</p>", "ar": "<p>الاستجابة الوعائية: انقباض لحظي ثم توسع وزيادة تدفق ثم بطء وركود. الخلوية: margination وrolling وadhesion وهجرة وانجذاب كيميائي وبلعمة. الـexudate أوديما غنية بالبروتين التهابية والـtransudate أوديما غير التهابية (قلب وكلى وتغذية).</p>"}], "terms": [["exudate", "Protein-rich inflammatory edema fluid often with inflammatory cells.", "نضح غني بالبروتين."], ["transudate", "Non-inflammatory edema fluid.", "رشح غير التهابي."]]}, {"id": "path3_2", "title_en": "Morphologic types and outcomes", "title_ar": "الأنواع والنتائج", "figs": [], "blocks": [{"en": "<p>Types: serous (thin fluid), fibrinous (fibrinogen exudate, e.g. pericardium, pleura), suppurative/purulent (pus: abscess or diffuse like cellulitis), catarrhal (mild mucosal, e.g. rhinitis) and pseudomembranous (surface epithelial necrosis). An abscess is a circumscribed pus collection with a pyogenic membrane.</p>", "ar": "<p>الأنواع: serous (سائل رقيق) وfibrinous (نضح فيبرين مثل التامور والجنب) وsuppurative (صديد: خراج أو منتشر مثل cellulitis) وcatarrhal (مخاطي بسيط مثل rhinitis) وpseudomembranous (نخر بشرة السطح). الخراج تجمع صديد محدد له pyogenic membrane.</p>"}, {"en": "<p>Outcomes: resolution (complete restitution, e.g. lobar pneumonia), healing by fibrosis, abscess formation (sinus if the cavity contacts one epithelial lining, fistula if the tract connects two surfaces) and rarely septicemia or pyemia with metastatic abscesses.</p>", "ar": "<p>النتائج: resolution (رجوع كامل مثل الالتهاب الرئوي الفصي) وشفاء بالتليف وتكوين خراج (sinus لو الكهف يلامس سطح واحد وfistula لو يوصل سطحين) ونادراً septicemia أو pyemia مع خراريج انتقالية.</p>"}], "terms": [["fistula", "Abnormal tract connecting two epithelial surfaces.", "ناسور يوصل بين سطحين."]]}], "flash": [{"f": "Five cardinal signs?", "b": "Redness, heat, swelling, pain, loss of function."}, {"f": "Cause of redness?", "b": "Dilated small vessels."}, {"f": "Cause of swelling?", "b": "Fluid from increased vascular permeability."}, {"f": "Vascular response order?", "b": "Vasoconstriction, vasodilatation, slowing/stasis."}, {"f": "Cellular response steps?", "b": "Margination/rolling/adhesion, transmigration, chemotaxis, phagocytosis."}, {"f": "Exudate versus transudate?", "b": "Inflammatory protein-rich vs non-inflammatory."}, {"f": "Types of acute inflammation?", "b": "Serous, fibrinous, suppurative, catarrhal, pseudomembranous."}, {"f": "Abscess?", "b": "Circumscribed pus collection with pyogenic membrane."}, {"f": "Sinus versus fistula?", "b": "One epithelial lining vs connecting two surfaces."}], "quiz": [{"q": "Heat in inflammation is due to:", "o": ["Pus", "Fibrosis", "Necrosis", "Hyperemia"], "a": 3, "w": "زيادة الدم."}, {"q": "First vascular change:", "o": ["Stasis", "Edema", "Momentary vasoconstriction", "Fibrosis"], "a": 2, "w": "انقباض لحظي."}, {"q": "Transudate is:", "o": ["Rich in cells", "Non-inflammatory", "Pus", "Fibrin"], "a": 1, "w": "غير التهابي."}, {"q": "Pus is typical of:", "o": ["Suppurative inflammation", "Serous", "Catarrhal", "Fibrinous"], "a": 0, "w": "صديد."}, {"q": "Rhinitis is:", "o": ["Fibrinous", "Serous", "Suppurative", "Catarrhal"], "a": 3, "w": "catarrhal."}, {"q": "A tract joining two epithelial surfaces:", "o": ["Sinus", "Abscess", "Fistula", "Cyst"], "a": 2, "w": "ناسور."}, {"q": "Complete restitution is:", "o": ["Fibrosis", "Resolution", "Abscess", "Pyemia"], "a": 1, "w": "resolution."}], "recall": [{"q": "Describe the cardinal signs and events of acute inflammation.", "a": "Five signs; vascular and cellular response.", "w": "العلامات والأحداث."}, {"q": "List morphologic types and outcomes.", "a": "Serous, fibrinous, suppurative, catarrhal, pseudomembranous; resolution, fibrosis, abscess.", "w": "الأنواع والنتائج."}]}, "path4": {"name": "Pathology 1", "lec": "Lecture 4 - Repair and healing", "short": "Path", "sections": [{"id": "path4_1", "title_en": "Regeneration and scar", "title_ar": "التجدد والندبة", "figs": [], "blocks": [{"en": "<p>Repair is by regeneration (same type of tissue replaces damage, normal state) or healing with scar (connective tissue). Often both occur, e.g. wound healing. Growth factors from fibroblasts, macrophages, endothelial cells and platelets: stimulating (EGF, FGF, fibronectin, angiogenic) and inhibitory (TNF, contact inhibition).</p>", "ar": "<p>الإصلاح بالتجدد (نفس نوع النسيج يعوض التالف ويرجع طبيعي) أو الشفاء بندبة (نسيج ضام). غالباً الاتنين مع بعض مثل التئام الجروح. عوامل النمو من fibroblasts وmacrophages والبطانة والصفائح: منشطة (EGF وFGF وfibronectin ومكونة للأوعية) ومثبطة (TNF وcontact inhibition).</p>"}, {"en": "<p>Regeneration depends on the ability of cells to divide, the number of surviving cells and a connective tissue framework. Tissue groups: continuously dividing (epithelium, bone marrow stem cells), stable (liver, kidney, pancreas; low proliferation) and permanent (neurons; scar after injury). Scar steps: granulation, fibrosis from day 3-5 (collagen), remodeling for strength.</p>", "ar": "<p>التجدد بيعتمد على قدرة الخلايا على الانقسام وعدد الخلايا الحية والإطار الضام. مجموعات الأنسجة: دائمة الانقسام (طلائية وخلايا جذعية نخاع) وثابتة (كبد وكلية وبنكرياس انقسامها قليل) ودائمة (خلايا عصبية؛ ندبة بعد الإصابة). خطوات الندبة: granulation وfibrosis من اليوم 3-5 (كولاجين) وremodeling للقوة.</p>"}], "terms": [["regeneration", "Replacement of damaged tissue by the same type of tissue.", "تعويض بنفس النسيج."]]}, {"id": "path4_2", "title_en": "Wound healing and complications", "title_ar": "التئام الجروح والمضاعفات", "figs": [], "blocks": [{"en": "<p>First intention (primary union): clean, incised, sutured wound with minimal tissue loss; scar by end of first month. Second intention: extensive necrosis, no apposition, foreign body or infection; much more granulation tissue and wound contraction by myofibroblasts (large defects shrink to 5-6% in 6 weeks). Skin grafts speed healing.</p>", "ar": "<p>الالتئام بالنية الأولى: جرح نظيف مقطوع ومخيط بفقد نسيج قليل؛ ندبة في آخر الشهر الأول. بالنية الثانية: نخر واسع وحواف غير متقاربة أو جسم غريب أو عدوى؛ نسيج حبيبي أكتر وانكماش بـmyofibroblasts (العيوب الكبيرة تصغر لـ5-6% في 6 أسابيع). الترقيع الجلدي يسرع الشفاء.</p>"}, {"en": "<p>Delayed healing: local (infection, foreign body, poor perfusion, mechanical pressure, irradiation) and systemic (age, protein malnutrition, vitamin C or zinc deficiency, diabetes, excess corticosteroids, antimitotic drugs). Complications: keloid, exuberant granulation (proud flesh), contracture, wound dehiscence, weak scar or hernia, painful scar, epidermal cyst, rarely neoplasia.</p>", "ar": "<p>تأخر الالتئام: موضعي (عدوى وجسم غريب وتروية ضعيفة وضغط وإشعاع) وعام (سن وسوء تغذية بروتين ونقص فيتامين C أو زنك وسكري وكورتيزون زائد وأدوية مضادة للانقسام). المضاعفات: keloid وexuberant granulation (proud flesh) وcontracture وانفتاح الجرح وندبة ضعيفة أو فتق وندبة مؤلمة وكيس بشروي ونادراً ورم.</p>"}], "terms": [["keloid", "Excess collagen forming a raised scar.", "ندبة بارزة من كولاجين زائد."]]}], "flash": [{"f": "Two types of repair?", "b": "Regeneration and scar formation."}, {"f": "Growth stimulating factors?", "b": "EGF, FGF, fibronectin, angiogenic factors."}, {"f": "Three tissue groups by proliferation?", "b": "Continuously dividing, stable, permanent."}, {"f": "Example of permanent tissue?", "b": "Neurons."}, {"f": "First intention healing?", "b": "Clean sutured wound, minimal loss, small scar."}, {"f": "Second intention healing?", "b": "Extensive loss or infection; more granulation and contraction."}, {"f": "Cells that contract wounds?", "b": "Myofibroblasts."}, {"f": "Systemic causes of delayed healing?", "b": "Age, malnutrition, vitamin C/zinc deficiency, diabetes, steroids."}, {"f": "Keloid?", "b": "Excessive collagen raised scar."}, {"f": "Proud flesh?", "b": "Exuberant granulation protruding above skin."}], "quiz": [{"q": "Regeneration means:", "o": ["Same tissue replaces damage", "Scar formation", "Necrosis", "Atrophy"], "a": 0, "w": "نفس النسيج."}, {"q": "Neurons are:", "o": ["Stable", "Continuously dividing", "Labile", "Permanent tissue"], "a": 3, "w": "دائمة."}, {"q": "Primary union occurs in:", "o": ["Infected wounds", "Large defects", "Clean sutured wounds", "Burns only"], "a": 2, "w": "جرح نظيف."}, {"q": "Wound contraction is by:", "o": ["Neutrophils", "Myofibroblasts", "Platelets", "Keratinocytes"], "a": 1, "w": "myofibroblasts."}, {"q": "Vitamin delaying healing when deficient:", "o": ["Vitamin C", "Vitamin K", "Vitamin D", "Vitamin B12"], "a": 0, "w": "فيتامين C."}, {"q": "Excess steroids:", "o": ["Speed healing", "No effect", "Remove scars", "Impair healing"], "a": 3, "w": "بتعطل."}, {"q": "Keloid is:", "o": ["Weak scar", "Cyst", "Excess collagen scar", "Tumor"], "a": 2, "w": "كولاجين زائد."}], "recall": [{"q": "Compare first and second intention healing.", "a": "Clean vs extensive; little vs much granulation; contraction.", "w": "المقارنة."}, {"q": "List causes of delayed healing and complications.", "a": "Local, systemic; keloid, proud flesh, contracture, dehiscence.", "w": "التأخر والمضاعفات."}]}, "path5": {"name": "Pathology 1", "lec": "Lecture 5 - Neoplasia", "short": "Path", "sections": [{"id": "path5_1", "title_en": "Definition, naming and classification", "title_ar": "التعريف والتسمية والتصنيف", "figs": [], "blocks": [{"en": "<p>Neoplasm is a new abnormal mass of tissue whose growth exceeds and is uncoordinated with normal tissue; neoplastic cells show disturbed proliferation, differentiation and organization. All neoplasms are autonomous, have genetic changes and depend on the host for nutrition and blood. Every tumor has parenchyma (neoplastic cells, give the name and behavior) and stroma (connective tissue, vessels, inflammatory cells).</p>", "ar": "<p>الورم (neoplasm) كتلة جديدة غير طبيعية من النسيج نموها يزيد وبدون تنسيق مع النسيج الطبيعي؛ خلاياه فيها اضطراب في التكاثر والتمايز والتنظيم. كل الأورام مستقلة وفيها تغيرات جينية وبتعتمد على الجسم في الغذاء والدم. كل ورم له parenchyma (خلايا ورمية بتحدد الاسم والسلوك) وstroma (نسيج ضام وأوعية وخلايا التهابية).</p>"}, {"en": "<p>Benign tumors are named with the suffix -oma (adenoma, fibroma, lipoma, chondroma, osteoma, leiomyoma). Malignant epithelial tumors are carcinomas (squamous cell carcinoma, adenocarcinoma); malignant mesenchymal tumors are sarcomas (fibrosarcoma, osteosarcoma, liposarcoma). Lymphoma and leukemia arise from lymphoid and hematopoietic cells. Papilloma and polyp are benign epithelial growths.</p>", "ar": "<p>الأورام الحميدة اسمها بلاحقة -oma (adenoma وfibroma وlipoma وchondroma وosteoma وleiomyoma). الخبيثة الطلائية carcinoma (squamous cell carcinoma وadenocarcinoma) والخبيثة الميزنشيمية sarcoma (fibrosarcoma وosteosarcoma وliposarcoma). Lymphoma وleukemia من خلايا لمفاوية ودموية. Papilloma وpolyp أورام طلائية حميدة.</p>"}], "terms": [["neoplasm", "New abnormal mass of tissue with uncontrolled growth.", "ورم: كتلة جديدة بنمو غير منضبط."]]}, {"id": "path5_2", "title_en": "Benign versus malignant", "title_ar": "الحميد والخبيث", "figs": [], "blocks": [{"en": "<p>Benign: well differentiated, slow growth, encapsulated, no invasion, no metastasis. Malignant: poorly differentiated or anaplastic, rapid growth, invasive without capsule, frequent metastasis, central ischemic necrosis. Metastasis is secondary implants discontinuous with the primary; about 30% of solid tumor patients have clinical metastases at diagnosis and 20% hidden ones.</p>", "ar": "<p>الحميد: متمايز جيداً ونمو بطيء ومحاط بكبسولة بدون غزو ولا انتشار. الخبيث: ضعيف التمايز أو anaplastic ونمو سريع وغازي بدون كبسولة وانتشار متكرر ونخر إقفاري مركزي. الانتشار (metastasis) أورام ثانوية منفصلة عن الأولي؛ حوالي 30% من مرضى الأورام الصلبة عندهم انتشار ظاهر عند التشخيص و20% خفي.</p>"}, {"en": "<p>Epidemiology: cancer incidence varies with age, race, geography and genetics; it is most common at the extremes of age. Environmental carcinogens: asbestos, cigarettes, alcohol. Hereditary: inherited cancer syndromes, familial cancers (early onset, relatives, bilateral) and defective DNA repair. Even benign tumors can harm by location or hormone production.</p>", "ar": "<p>الوبائيات: الإصابة بتختلف بالسن والعرق والجغرافيا والوراثة وأكتر عند طرفي العمر. مسرطنات بيئية: أسبستوس وسجاير وكحول. الوراثة: متلازمات سرطان موروثة وسرطانات عائلية (بدري وأقارب وثنائي الجانب) وخلل إصلاح DNA. حتى الأورام الحميدة ممكن تضر بموقعها أو إفرازها الهرموني.</p>"}], "terms": [["anaplasia", "Lack of differentiation of tumor cells.", "فقدان تمايز الخلايا الورمية."], ["metastasis", "Secondary tumor deposits discontinuous with the primary tumor.", "انتشار الورم لأماكن بعيدة."]]}], "flash": [{"f": "Define neoplasm.", "b": "New abnormal mass with uncontrolled growth."}, {"f": "Two components of a tumor?", "b": "Parenchyma and stroma."}, {"f": "Suffix of benign tumors?", "b": "-oma."}, {"f": "Malignant epithelial tumor?", "b": "Carcinoma."}, {"f": "Malignant mesenchymal tumor?", "b": "Sarcoma."}, {"f": "Benign gland tumor?", "b": "Adenoma."}, {"f": "Characteristics of benign tumors?", "b": "Differentiated, slow, encapsulated, no metastasis."}, {"f": "Characteristics of malignant tumors?", "b": "Anaplastic, rapid, invasive, metastasize."}, {"f": "What is metastasis?", "b": "Secondary implants distant from primary."}, {"f": "Environmental carcinogens?", "b": "Asbestos, cigarettes, alcohol."}], "quiz": [{"q": "Benign cartilage tumor:", "o": ["Chondrosarcoma", "Chondroma", "Osteoma", "Lipoma"], "a": 1, "w": "chondroma."}, {"q": "Malignant bone tumor:", "o": ["Osteosarcoma", "Osteoma", "Chondroma", "Adenoma"], "a": 0, "w": "osteosarcoma."}, {"q": "Adenocarcinoma arises from:", "o": ["Muscle", "Bone", "Fat", "Glandular epithelium"], "a": 3, "w": "غدي."}, {"q": "Which is benign?", "o": ["Liposarcoma", "Carcinoma", "Lipoma", "Lymphoma"], "a": 2, "w": "lipoma."}, {"q": "Anaplasia means:", "o": ["Good differentiation", "Lack of differentiation", "Capsule", "Slow growth"], "a": 1, "w": "فقد التمايز."}, {"q": "Metastasis is typical of:", "o": ["Malignant tumors", "Benign tumors", "Cysts", "Scars"], "a": 0, "w": "الخبيث."}, {"q": "Stroma consists of:", "o": ["Neoplastic cells", "Mutations", "Hormones", "Connective tissue and vessels"], "a": 3, "w": "نسيج ضام."}], "recall": [{"q": "Compare benign and malignant tumors.", "a": "Differentiation, growth rate, invasion, capsule, metastasis.", "w": "المقارنة."}, {"q": "Explain tumor naming and classification.", "a": "-oma benign; carcinoma epithelial; sarcoma mesenchymal; lymphoma, leukemia.", "w": "التسمية."}]}, "path6": {"name": "Pathology 1", "lec": "Lecture 6 - Disorders of immunity", "short": "Path", "sections": [{"id": "path6_1", "title_en": "Immunity, antigens and cells", "title_ar": "المناعة والمستضدات والخلايا", "figs": [], "blocks": [{"en": "<p>Active immunity is produced by our own immune system; passive immunity is gained from someone else. An antigen is any substance that makes the immune system produce antibodies. Types: exogenous (viruses, bacteria, pollen, parasites, fungi), endogenous (cells inside the body, red cell antigens, HLA), autoantigens (cause autoimmune disease) and tumor antigens (TAA, TSA, neoantigens).</p>", "ar": "<p>المناعة النشطة بتنتجها مناعة الشخص نفسه والسلبية مكتسبة من حد تاني. المستضد أي مادة تخلي الجهاز المناعي يكوّن أجسام مضادة. الأنواع: خارجي (فيروسات وبكتيريا وحبوب لقاح وطفيليات وفطريات) وداخلي (خلايا الجسم ومستضدات الدم وHLA) وذاتي (بيسبب أمراض مناعة ذاتية) وورمي (TAA وTSA وneoantigens).</p>"}, {"en": "<p>Immune cells: lymphocytes (T, B, NK cells), neutrophils and monocytes/macrophages (white blood cells). Innate response involves phagocytes: neutrophils and macrophages.</p>", "ar": "<p>خلايا المناعة: لمفاويات (T وB وNK) ونيوتروفيل وmonocytes/macrophages (كرات دم بيضا). الاستجابة الفطرية فيها البلعميات: نيوتروفيل وماكروفاج.</p>"}], "terms": [["antigen", "Substance that triggers antibody production by the immune system.", "مستضد."]]}, {"id": "path6_2", "title_en": "Hypersensitivity", "title_ar": "فرط الحساسية", "figs": [], "blocks": [{"en": "<p>Hypersensitivity is an abnormal exaggerated or inappropriate immune response to an antigen or allergen, causing allergies and autoimmunity. Types I, II, III... Type I reactions are immediate: they occur within 24 hours of exposure. Other topics in the lecture: autoimmune disease and transplant rejection.</p>", "ar": "<p>فرط الحساسية استجابة مناعية مبالغ فيها أو غير مناسبة لمستضد أو مسبب حساسية بتسبب حساسية ومناعة ذاتية. الأنواع I وII وIII... النوع I فوري: بيحصل خلال 24 ساعة من التعرض. مواضيع تانية في المحاضرة: أمراض المناعة الذاتية ورفض الزرع.</p>"}], "terms": [["hypersensitivity", "Exaggerated or inappropriate immune response to an antigen.", "فرط الحساسية."]]}], "flash": [{"f": "Active versus passive immunity?", "b": "Own immune system vs gained from someone else."}, {"f": "Define antigen.", "b": "Substance that triggers antibody production."}, {"f": "Exogenous antigens?", "b": "Viruses, bacteria, pollen, parasites, fungi."}, {"f": "Endogenous antigens?", "b": "Body cell markers like HLA and red cell antigens."}, {"f": "Autoantigens cause?", "b": "Autoimmune diseases."}, {"f": "Tumor antigens examples?", "b": "TAA, TSA, neoantigens."}, {"f": "Immune cell groups?", "b": "Lymphocytes, neutrophils, monocytes/macrophages."}, {"f": "Phagocytes?", "b": "Neutrophils and macrophages."}, {"f": "Hypersensitivity?", "b": "Exaggerated or inappropriate immune response."}], "quiz": [{"q": "Passive immunity is:", "o": ["Made by own system", "Genetic", "Gained from someone else", "Tumor"], "a": 2, "w": "من حد تاني."}, {"q": "Pollen is a(n):", "o": ["Autoantigen", "Exogenous antigen", "Tumor antigen", "HLA"], "a": 1, "w": "خارجي."}, {"q": "HLA is a(n):", "o": ["Endogenous marker", "Exogenous antigen", "Drug", "Virus"], "a": 0, "w": "داخلي."}, {"q": "Autoantigens cause:", "o": ["Allergy only", "Infection", "Cancer only", "Autoimmune disease"], "a": 3, "w": "مناعة ذاتية."}, {"q": "NK cells are:", "o": ["Neutrophils", "Platelets", "Lymphocytes", "Macrophages"], "a": 2, "w": "لمفاويات."}, {"q": "Phagocytes include:", "o": ["T cells", "Neutrophils and macrophages", "B cells", "NK cells"], "a": 1, "w": "بلعميات."}, {"q": "Hypersensitivity is:", "o": ["Exaggerated immune response", "Absent immunity", "Normal response", "Vaccination"], "a": 0, "w": "استجابة مبالغ فيها."}], "recall": [{"q": "Define immunity types and antigens.", "a": "Active/passive; exogenous, endogenous, auto, tumor antigens.", "w": "المناعة والمستضدات."}, {"q": "Define hypersensitivity.", "a": "Exaggerated immune response to antigen; type I immediate; leads to allergy and autoimmunity.", "w": "فرط الحساسية."}]}, "anat1": {"name": "Radiographic Anatomy", "lec": "Lecture 1 - Radiographic terms and projections", "short": "Anat", "sections": [{"id": "anat1_1", "title_en": "Directional terms and planes", "title_ar": "اتجاهات ومستويات", "figs": [], "blocks": [{"en": "<p>Radiographic anatomy is the branch of radiology dealing with anatomy. Terms assume the anatomical position: upright, face front, arms at sides, palms forward, feet parallel. Anterior (ventral) is toward the front, posterior (dorsal) toward the back, medial toward the midline, lateral toward the side, proximal nearer the point of attachment. Planes: median sagittal (right and left halves), coronal (anterior and posterior), horizontal or axial (superior and inferior).</p>", "ar": "<p>التشريح الإشعاعي فرع من الأشعة بيتعامل مع التشريح. المصطلحات بتفترض الوضع التشريحي: واقف معتدل والوش لقدام والدراعين على الجنب وراحة الإيد لقدام والرجلين متوازيين. Anterior (ventral) ناحية الأمام وposterior (dorsal) ناحية الضهر وmedial ناحية الخط الأوسط وlateral ناحية الجنب وproximal الأقرب لنقطة الاتصال. المستويات: median sagittal (نصين يمين وشمال) وcoronal (أمامي وخلفي) وaxial الأفقي (علوي وسفلي).</p>"}], "terms": [["proximal", "Nearer to the point of attachment.", "الأقرب لنقطة الاتصال."]]}, {"id": "anat1_2", "title_en": "Radiographic projections", "title_ar": "الإسقاطات", "figs": [], "blocks": [{"en": "<p>Erect: patient sitting or standing, with the posterior, anterior or a side against the image detector. Decubitus: patient lying: supine (dorsal decubitus, on the back), prone (ventral decubitus, face down), lateral decubitus (right or left side). Semi-recumbent: reclining between supine and sitting erect with the posterior trunk against the detector.</p>", "ar": "<p>Erect: المريض قاعد أو واقف والضهر أو الصدر أو الجنب على المستقبل. Decubitus: المريض نايم: supine (على ضهره) وprone (على بطنه) وlateral decubitus (على جنبه يمين أو شمال). Semi-recumbent: مايل بين الاستلقاء والجلوس والضهر على المستقبل.</p>"}], "terms": [["decubitus", "Patient lying down.", "المريض نايم."]]}], "flash": [{"f": "Anatomical position?", "b": "Upright, face front, arms at sides, palms forward, feet parallel."}, {"f": "Ventral means?", "b": "Anterior."}, {"f": "Dorsal means?", "b": "Posterior."}, {"f": "Coronal plane?", "b": "Divides anterior and posterior."}, {"f": "Supine?", "b": "Lying on the back."}, {"f": "Prone?", "b": "Lying face down."}], "quiz": [{"q": "Toward the midline:", "o": ["Lateral", "Medial", "Proximal", "Distal"], "a": 1, "w": "medial."}, {"q": "Face-down position:", "o": ["Prone", "Supine", "Erect", "Lateral"], "a": 0, "w": "prone."}, {"q": "Divides right and left:", "o": ["Coronal", "Axial", "Oblique", "Median sagittal"], "a": 3, "w": "sagittal."}, {"q": "Dorsal decubitus:", "o": ["Prone", "Erect", "Supine", "Seated"], "a": 2, "w": "supine."}, {"q": "Proximal:", "o": ["Farther", "Nearer attachment", "Lateral", "Anterior"], "a": 1, "w": "أقرب."}], "recall": [{"q": "Define directional terms.", "a": "Anterior, posterior, medial, lateral, proximal.", "w": "الاتجاهات."}, {"q": "List projections by patient position.", "a": "Erect, supine, prone, lateral decubitus, semi-recumbent.", "w": "الإسقاطات."}]}, "anat2": {"name": "Radiographic Anatomy", "lec": "Lecture 2 - Upper limb: hand and wrist", "short": "Anat", "sections": [{"id": "anat2_1", "title_en": "Hand bones", "title_ar": "عظام الإيد", "figs": [], "blocks": [{"en": "<p>The upper extremity has humerus, ulna, radius, carpals, metacarpals and phalanges. The hand has 27 bones: 8 carpals, 5 metacarpals and 14 phalanges. Carpals are in two rows. Proximal: scaphoid, lunate, triquetrum, pisiform. Distal: hamate, capitate, trapezoid, trapezium. Each metacarpal has head, shaft and base. Fingers have three phalanges (proximal, middle, distal) and the thumb has two. Digits: 1 thumb, 2 index, 3 middle, 4 ring, 5 little.</p>", "ar": "<p>الطرف العلوي: humerus وulna وradius وcarpals وmetacarpals وphalanges. الإيد فيها 27 عظمة: 8 carpals و5 metacarpals و14 phalanges. الـcarpals في صفين. القريب: scaphoid وlunate وtriquetrum وpisiform. البعيد: hamate وcapitate وtrapezoid وtrapezium. كل metacarpal ليه head وshaft وbase. الصوابع 3 phalanges (proximal وmiddle وdistal) والإبهام 2. الصوابع: 1 إبهام و2 سبابة و3 وسطى و4 بنصر و5 خنصر.</p>"}], "terms": [["scaphoid", "Proximal row carpal bone on the thumb side.", "عظمة بالصف القريب ناحية الإبهام."]]}, {"id": "anat2_2", "title_en": "Joints and wrist projections", "title_ar": "المفاصل ووضعيات الرسغ", "figs": [], "blocks": [{"en": "<p>Joints: distal interphalangeal, proximal interphalangeal, metacarpophalangeal, intercarpal and radiocarpal. Hand views: PA, lateral and oblique. Routine wrist: PA (ulnar flexion), PA oblique, lateral; scaphoid views (Stecher); PA without flexion; lateral for foreign body.</p>", "ar": "<p>المفاصل: distal interphalangeal وproximal interphalangeal وmetacarpophalangeal وintercarpal وradiocarpal. وضعيات الإيد: PA وlateral وoblique. روتين الرسغ: PA (ulnar flexion) وPA oblique وlateral؛ وضعيات scaphoid (Stecher)؛ PA من غير flexion؛ وlateral للأجسام الغريبة.</p>"}], "terms": [["radiocarpal joint", "Joint between the radius and carpals.", "مفصل الرسغ."]]}], "flash": [{"f": "Bones in the hand?", "b": "27."}, {"f": "Carpals?", "b": "8 in two rows."}, {"f": "Proximal row?", "b": "Scaphoid, lunate, triquetrum, pisiform."}, {"f": "Distal row?", "b": "Hamate, capitate, trapezoid, trapezium."}, {"f": "Thumb phalanges?", "b": "Two."}, {"f": "Scaphoid views?", "b": "Stecher."}], "quiz": [{"q": "Carpals count:", "o": ["5", "14", "8", "7"], "a": 2, "w": "8."}, {"q": "Phalanges count:", "o": ["8", "14", "5", "10"], "a": 1, "w": "14."}, {"q": "Not proximal row:", "o": ["Hamate", "Scaphoid", "Lunate", "Pisiform"], "a": 0, "w": "hamate distal."}, {"q": "Thumb is digit:", "o": ["2", "5", "3", "1"], "a": 3, "w": "1."}, {"q": "Metacarpals:", "o": ["8", "14", "5", "4"], "a": 2, "w": "5."}], "recall": [{"q": "Describe hand bones.", "a": "27: 8 carpals, 5 metacarpals, 14 phalanges.", "w": "عظام الإيد."}, {"q": "Routine wrist projections.", "a": "PA ulnar flexion, oblique, lateral, scaphoid views.", "w": "وضعيات الرسغ."}]}, "anat3": {"name": "Radiographic Anatomy", "lec": "Lecture 3 - Upper limb: forearm and elbow", "short": "Anat", "sections": [{"id": "anat3_1", "title_en": "Forearm", "title_ar": "الساعد", "figs": [], "blocks": [{"en": "<p>The forearm has two bones. The radius is lateral and has a styloid process projecting distally; its proximal end has head, neck and tuberosity. The ulna is longer and lies medial to the radius; proximally it has the olecranon process, coronoid process, trochlear notch and radial notch; distally its head and styloid process. Joints are the wrist and elbow.</p>", "ar": "<p>الساعد فيه عظمتين. الـradius جانبي وليه styloid process بيبرز لتحت؛ وطرفه القريب فيه head وneck وtuberosity. الـulna أطول وبتبقى medial للـradius؛ والقريب فيها olecranon وcoronoid وtrochlear notch وradial notch والبعيد head وstyloid. المفاصل: الرسغ والكوع.</p>"}], "terms": [["olecranon", "Proximal ulna process forming the point of the elbow.", "نتوء الكوع."]]}, {"id": "anat3_2", "title_en": "Pronation and projections", "title_ar": "الانبطاح والوضعيات", "figs": [], "blocks": [{"en": "<p>Pronation crosses the radius over the ulna. Forearm views are AP and lateral and should include the wrist or elbow joint. Distal landmarks: radial and ulnar styloid processes; elbow landmarks: medial and lateral epicondyles, radial head and coronoid process.</p>", "ar": "<p>الـpronation بيخلي الـradius يتصالب فوق الـulna. وضعيات الساعد AP وlateral ولازم تشمل مفصل الرسغ أو الكوع. علامات الطرف البعيد: radial وulnar styloid؛ وعلامات الكوع: medial وlateral epicondyle وradial head وcoronoid.</p>"}], "terms": [["pronation", "Forearm rotation placing the palm down.", "كف الإيد لتحت."]]}], "flash": [{"f": "Lateral forearm bone?", "b": "Radius."}, {"f": "Longer forearm bone?", "b": "Ulna."}, {"f": "Elbow point?", "b": "Olecranon."}, {"f": "Radius proximal parts?", "b": "Head, neck, tuberosity."}, {"f": "Forearm views?", "b": "AP and lateral."}, {"f": "Pronation effect?", "b": "Radius crosses ulna."}], "quiz": [{"q": "Lateral forearm bone:", "o": ["Ulna", "Humerus", "Scaphoid", "Radius"], "a": 3, "w": "radius."}, {"q": "Olecranon belongs to:", "o": ["Radius", "Humerus", "Ulna", "Scapula"], "a": 2, "w": "ulna."}, {"q": "Longer:", "o": ["Radius", "Ulna", "Same", "None"], "a": 1, "w": "ulna."}, {"q": "Styloid at distal radius:", "o": ["Radial styloid", "Coronoid", "Olecranon", "Trochlea"], "a": 0, "w": "radial."}, {"q": "Forearm joints:", "o": ["Hip", "Knee", "Ankle", "Wrist and elbow"], "a": 3, "w": "رسغ وكوع."}], "recall": [{"q": "Compare radius and ulna.", "a": "Lateral shorter vs medial longer with olecranon.", "w": "المقارنة."}, {"q": "Landmarks of forearm and elbow.", "a": "Styloids, epicondyles, radial head, coronoid.", "w": "العلامات."}]}, "anat4": {"name": "Radiographic Anatomy", "lec": "Lecture 4 - Lower limb: pelvis, hip, femur and knee", "short": "Anat", "sections": [{"id": "anat4_1", "title_en": "Pelvis and hip", "title_ar": "الحوض والورك", "figs": [], "blocks": [{"en": "<p>The bony pelvis is a ring formed by the paired innominate bones, the sacrum and the coccyx, completed by the sacroiliac joints posteriorly and the pubic symphysis anteriorly. Each innominate has ilium, ischium and pubis. The sacroiliac joints are synovial; the symphysis pubis is a secondary cartilaginous joint. The hip is a ball and socket synovial joint between the femoral head and acetabulum. Views: AP pelvis (male, female, child), frog position, both SI joints, AP and lateral hip.</p>", "ar": "<p>الحوض العظمي حلقة من عظمتين innominate والـsacrum والـcoccyx وبتكمل بمفصلي sacroiliac من ورا وpubic symphysis من قدام. كل innominate فيها ilium وischium وpubis. مفاصل SI زلالية والـsymphysis pubis مفصل غضروفي ثانوي. الورك مفصل ball and socket بين رأس الفخذ والـacetabulum. الوضعيات: AP حوض (رجل وست وطفل) وfrog وSI الاتنين وAP وlateral للورك.</p>"}], "terms": [["acetabulum", "Socket of the hip joint in the pelvis.", "تجويف مفصل الورك."]]}, {"id": "anat4_2", "title_en": "Femur and knee", "title_ar": "الفخذ والركبة", "figs": [], "blocks": [{"en": "<p>The femur has a shaft, neck and head. The patella is a flat sesamoid bone. The knee is a modified hinge synovial joint, the largest in the body, with two condylar joints between femoral and tibial condyles and a saddle joint between patella and femur. Plain films show bony contours and joint space. The skyline view (tangential with the knee flexed) shows the patella and the tunnel view shows the intercondylar fossa.</p>", "ar": "<p>الفخذ فيه shaft وneck وhead. الـpatella عظمة sesamoid مفلطحة. الركبة مفصل زلالي hinge معدل وهي أكبر مفصل في الجسم وفيها مفصلين condylar بين condyles الفخذ والقصبة ومفصل saddle بين الـpatella والفخذ. الأشعة العادية بتوري الحدود العظمية ومسافة المفصل. وضعية skyline (مماسية والركبة مثنية) بتوري الـpatella والـtunnel بتوري intercondylar fossa.</p>"}], "terms": [["sesamoid bone", "Bone embedded in a tendon, e.g. patella.", "عظمة جوه وتر."]]}], "flash": [{"f": "Parts of innominate?", "b": "Ilium, ischium, pubis."}, {"f": "Pubic symphysis type?", "b": "Secondary cartilaginous joint."}, {"f": "Hip joint type?", "b": "Ball and socket."}, {"f": "Largest joint?", "b": "Knee."}, {"f": "Skyline view shows?", "b": "Patella."}, {"f": "Tunnel view shows?", "b": "Intercondylar fossa."}], "quiz": [{"q": "Innominate part:", "o": ["Ilium", "Talus", "Carpal", "Atlas"], "a": 0, "w": "ilium."}, {"q": "Hip joint:", "o": ["Hinge", "Pivot", "Saddle", "Ball and socket"], "a": 3, "w": "ball and socket."}, {"q": "Patella is:", "o": ["Long bone", "Flat skull", "Sesamoid", "Carpal"], "a": 2, "w": "sesamoid."}, {"q": "Skyline for:", "o": ["Hip", "Patella", "Ankle", "Femur shaft"], "a": 1, "w": "patella."}, {"q": "Largest joint:", "o": ["Knee", "Hip", "Elbow", "Wrist"], "a": 0, "w": "الركبة."}], "recall": [{"q": "Describe the bony pelvis.", "a": "Ring of innominates, sacrum, coccyx with SI joints and symphysis.", "w": "الحوض."}, {"q": "Knee joint and views.", "a": "Modified hinge; AP, lateral, skyline, tunnel.", "w": "الركبة."}]}, "anat5": {"name": "Radiographic Anatomy", "lec": "Lecture 5 - Respiratory system anatomy", "short": "Anat", "sections": [{"id": "anat5_1", "title_en": "Airway", "title_ar": "المجرى الهوائي", "figs": [], "blocks": [{"en": "<p>The respiratory system handles breathing, exchange of oxygen and carbon dioxide and speech. The upper tract is nose, nasal cavity, pharynx, larynx and trachea; the lower tract is the lungs and bronchial tree. The pharynx has nasopharynx (air only), oropharynx and laryngopharynx (air and food). The larynx is at C4-C6. The trachea has C-shaped hyaline cartilage rings from C6 to T7 and divides into the two main bronchi, which divide into bronchioles ending in alveoli.</p>", "ar": "<p>الجهاز التنفسي مسؤول عن التنفس وتبادل الأكسجين وثاني أكسيد الكربون والكلام. المجرى العلوي: أنف وتجويف أنفي وبلعوم وحنجرة وقصبة هوائية؛ والسفلي: الرئتين والشعب. البلعوم: nasopharynx (هوا بس) وoropharynx وlaryngopharynx (هوا وأكل). الحنجرة عند C4-C6. القصبة حلقات غضروف hyaline على شكل C من C6 لـT7 وبتتفرع لشعبتين رئيسيتين بيتفرعوا لـbronchioles بتنتهي بـalveoli.</p>"}], "terms": [["alveoli", "Air sacs where gas exchange occurs.", "أكياس هوائية."]]}, {"id": "anat5_2", "title_en": "Lungs and pleura", "title_ar": "الرئتين والغشاء", "figs": [], "blocks": [{"en": "<p>The right lung has 3 lobes and the left has 2. Each lung has an apex deep to the clavicle, a base on the diaphragm, costal, mediastinal surfaces and a hilus. Each lung is enclosed in pleura: parietal (outer lining of the chest wall) and visceral (on the lung), with the pleural space between them containing lubricating fluid.</p>", "ar": "<p>الرئة اليمين 3 فصوص والشمال 2. لكل رئة apex عميق للـclavicle وbase على الحجاب وأسطح costal وmediastinal وhilus. كل رئة داخل pleura: parietal (بطانة جدار الصدر) وvisceral (على الرئة) والمسافة بينهم فيها سائل تزليق.</p>"}], "terms": [["hilus", "Region where bronchi and vessels enter the lung.", "سرة الرئة."]]}], "flash": [{"f": "Right lung lobes?", "b": "Three."}, {"f": "Left lung lobes?", "b": "Two."}, {"f": "Larynx level?", "b": "C4-C6."}, {"f": "Trachea extent?", "b": "C6 to T7."}, {"f": "Visceral pleura?", "b": "Covers the lung."}, {"f": "Alveoli?", "b": "Air sacs ending bronchioles."}], "quiz": [{"q": "Left lung lobes:", "o": ["3", "2", "4", "1"], "a": 1, "w": "2."}, {"q": "Trachea rings:", "o": ["C-shaped", "O-shaped", "Flat", "None"], "a": 0, "w": "C."}, {"q": "Air only passage:", "o": ["Oropharynx", "Laryngopharynx", "Esophagus", "Nasopharynx"], "a": 3, "w": "nasopharynx."}, {"q": "Lung apex is:", "o": ["On diaphragm", "Mediastinal", "Deep to clavicle", "None"], "a": 2, "w": "تحت الـclavicle."}, {"q": "Pleural space has:", "o": ["Air", "Lubricating fluid", "Blood", "Bone"], "a": 1, "w": "سائل."}], "recall": [{"q": "Describe the airway.", "a": "Nose to alveoli with levels.", "w": "المجرى."}, {"q": "Lungs and pleura.", "a": "Lobes, surfaces, parietal and visceral pleura.", "w": "الرئتين."}]}, "anat6": {"name": "Radiographic Anatomy", "lec": "Lecture 6 - Bony thorax and chest film assessment", "short": "Anat", "sections": [{"id": "anat6_1", "title_en": "Ribs, sternum, trachea", "title_ar": "الضلوع والقص", "figs": [], "blocks": [{"en": "<p>There are 12 pairs of ribs: 7 true, 3 false and 2 floating. The sternum has a manubrium opposite T3-T4, a sternal angle opposite the T4/5 disc space, a body opposite T5-T9 and a xiphoid process that stays cartilaginous into adulthood. The trachea starts at the lower border of the cricoid at C6 and ends at the carina at the sternal angle (T5; T4 in inspiration and T6 in expiration). The lungs have costal, mediastinal, apical and diaphragmatic surfaces.</p>", "ar": "<p>فيه 12 زوج ضلوع: 7 حقيقية و3 كاذبة و2 عائمة. القص فيه manubrium قصاد T3-T4 وsternal angle قصاد قرص T4/5 وbody قصاد T5-T9 وxiphoid بيفضل غضروفي لحد الكبر. القصبة بتبدأ من الحافة السفلية للـcricoid عند C6 وتنتهي عند carina عند sternal angle (T5؛ T4 في الشهيق وT6 في الزفير). الرئتين أسطحهم costal وmediastinal وapical وdiaphragmatic.</p>"}], "terms": [["carina", "Where the trachea divides, at the sternal angle.", "نقطة تفرع القصبة."]]}, {"id": "anat6_2", "title_en": "Assessing the chest radiograph", "title_ar": "تقييم أشعة الصدر", "figs": [], "blocks": [{"en": "<p>First check quality: correct patient name, correct left and right markers (otherwise think dextrocardia) and projection PA or AP documented. Exposure: on a good film the vertebral bodies are just visible through the heart; if not visible the film is too white (underpenetrated). Diaphragms: the right is usually 1-1.5 cm higher than the left; costophrenic angles should be sharp and the outlines clear. The left hemidiaphragm outline stops at the posterior heart border and gastric air lies below it.</p>", "ar": "<p>الأول نتأكد من الجودة: اسم المريض الصح وعلامات يمين وشمال صح (وإلا نفكر في dextrocardia) وتوثيق الإسقاط PA أو AP. التعريض: في الفيلم الكويس الفقرات بتبان بالكاد من خلال القلب؛ لو مش باينة الفيلم أبيض (اخترق ناقص). الحجاب الحاجز: اليمين غالبًا أعلى من الشمال بـ1-1.5 سم؛ والزوايا costophrenic لازم تبقى حادة والحدود واضحة. حد الحجاب الشمال بيقف عند الحد الخلفي للقلب وهوا المعدة تحته.</p>"}], "terms": [["costophrenic angle", "Angle between diaphragm and chest wall; should be sharp.", "الزاوية الضلعية الحجابية."]]}], "flash": [{"f": "Ribs pairs?", "b": "12: 7 true, 3 false, 2 floating."}, {"f": "Manubrium level?", "b": "T3-T4."}, {"f": "Sternal angle level?", "b": "T4/5 disc."}, {"f": "Carina level?", "b": "Sternal angle, T5."}, {"f": "Right hemidiaphragm?", "b": "1-1.5 cm higher."}, {"f": "Good penetration sign?", "b": "Vertebrae just visible through heart."}], "quiz": [{"q": "False ribs:", "o": ["7", "2", "3", "12"], "a": 2, "w": "3."}, {"q": "Sternal angle:", "o": ["T10", "T4/5", "C1", "L3"], "a": 1, "w": "T4/5."}, {"q": "Higher diaphragm:", "o": ["Right", "Left", "Equal", "None"], "a": 0, "w": "اليمين."}, {"q": "Costophrenic angle:", "o": ["Blunt", "Absent", "Wide", "Sharp"], "a": 3, "w": "حادة."}, {"q": "Check first:", "o": ["Pathology only", "Nothing", "Labels and quality", "Color"], "a": 2, "w": "الجودة."}], "recall": [{"q": "Bony thorax.", "a": "Ribs, sternum parts, levels.", "w": "القفص."}, {"q": "Steps assessing CXR.", "a": "Quality, exposure, diaphragms, angles.", "w": "تقييم الصدر."}]}, "anat7": {"name": "Radiographic Anatomy", "lec": "Lecture 7 - Skull bones", "short": "Anat", "sections": [{"id": "anat7_1", "title_en": "Cranial and facial bones", "title_ar": "عظام الجمجمة", "figs": [], "blocks": [{"en": "<p>The skull has 22 bones: 8 cranial and 14 facial, resting on the top of the vertebral column. Its functions are protecting the brain and supporting the face. Cranial: frontal, 2 parietal, occipital (calvarium or skull cap) and 2 temporal, sphenoid, ethmoid (floor). Temporal bones contain the organs of hearing and balance. Facial: mandible, 2 maxillae, 2 palatine, 2 zygomatic, 2 nasal, 2 lacrimal, vomer, 2 inferior nasal conchae.</p>", "ar": "<p>الجمجمة 22 عظمة: 8 cranial و14 facial وبتتسند على قمة العمود الفقري. وظيفتها حماية المخ ودعم الوش. Cranial: frontal و2 parietal وoccipital (calvarium أو skull cap) و2 temporal وsphenoid وethmoid (القاع). عظام temporal فيها أعضاء السمع والتوازن. Facial: mandible و2 maxilla و2 palatine و2 zygomatic و2 nasal و2 lacrimal وvomer و2 inferior nasal conchae.</p>"}], "terms": [["calvarium", "Skull cap: frontal, two parietal, occipital.", "قبة الجمجمة."]]}, {"id": "anat7_2", "title_en": "Frontal bone and objectives", "title_ar": "عظمة الجبهة", "figs": [], "blocks": [{"en": "<p>The frontal bone forms the forehead and protects the brain and supports the face. It has a vertical portion (forehead) and a horizontal orbital portion. Lateral skull landmarks include the sphenoid, squamous suture, temporal, occipital, EAM, mastoid process, styloid process, TMJ and zygoma.</p>", "ar": "<p>عظمة frontal بتكوّن الجبهة وبتحمي المخ وتدعم الوش. فيها جزء رأسي (الجبهة) وجزء أفقي orbital. علامات الجمجمة الجانبية: sphenoid وsquamous suture وtemporal وoccipital وEAM وmastoid وstyloid وTMJ وzygoma.</p>"}], "terms": [["EAM", "External auditory meatus.", "القناة السمعية الخارجية."]]}], "flash": [{"f": "Skull bones?", "b": "22: 8 cranial, 14 facial."}, {"f": "Calvarium?", "b": "Frontal, parietals, occipital."}, {"f": "Floor bones?", "b": "Temporals, sphenoid, ethmoid."}, {"f": "Temporal bone holds?", "b": "Hearing and balance organs."}, {"f": "Facial bones count?", "b": "14."}, {"f": "EAM?", "b": "External auditory meatus."}], "quiz": [{"q": "Cranial bones:", "o": ["14", "22", "6", "8"], "a": 3, "w": "8."}, {"q": "Facial bones:", "o": ["8", "22", "14", "10"], "a": 2, "w": "14."}, {"q": "In calvarium:", "o": ["Sphenoid", "Occipital", "Ethmoid", "Vomer"], "a": 1, "w": "occipital."}, {"q": "Floor bone:", "o": ["Sphenoid", "Frontal", "Parietal", "Occipital"], "a": 0, "w": "sphenoid."}, {"q": "Unpaired facial:", "o": ["Nasal", "Lacrimal", "Zygoma", "Mandible"], "a": 3, "w": "mandible."}], "recall": [{"q": "List cranial and facial bones.", "a": "8 cranial, 14 facial with names.", "w": "العظام."}, {"q": "Skull functions.", "a": "Protect brain, support face.", "w": "الوظائف."}]}, "anat8": {"name": "Radiographic Anatomy", "lec": "Lecture 8 - Skull landmarks, baselines and projections", "short": "Anat", "sections": [{"id": "anat8_1", "title_en": "Baselines and positioning factors", "title_ar": "الخطوط الأساسية", "figs": [], "blocks": [{"en": "<p>Major skull baselines: the anthropological (Reid) line from the inferior orbital margin to the upper border of the EAM; the orbitomeatal line from the outer canthus to the EAM; and the interpupillary line connecting the centers of the orbits, at 90 degrees to the median sagittal plane. All skull positions depend on three factors: rotation, tilt and flexion-extension.</p>", "ar": "<p>خطوط الجمجمة الأساسية: الـanthropological (Reid) من الحافة السفلية للحجاج لأعلى الـEAM؛ والـorbitomeatal من outer canthus للـEAM؛ والـinterpupillary بيوصل مراكز الحجاجين وبيعمل 90 درجة مع المستوى السهمي. كل أوضاع الجمجمة بتعتمد على 3 عوامل: rotation وtilt وflexion-extension.</p>"}], "terms": [["interpupillary line", "Line between orbit centers, 90 degrees to the MSP.", "خط بين مركزي الحجاجين."]]}, {"id": "anat8_2", "title_en": "Skull views", "title_ar": "وضعيات الجمجمة", "figs": [], "blocks": [{"en": "<p>Views listed: PA skull, lateral skull (mastoid process, sella turcica), Towne's view, submentovertical, PA mandible, lateral oblique mandible and sinuses (ethmoid and maxillary sinuses). Landmarks: glabella, nasion, inner and outer canthus, infraorbital margin, acanthion, gonion and mentum.</p>", "ar": "<p>الوضعيات: PA skull وlateral skull (mastoid وsella turcica) وTowne وsubmentovertical وPA mandible وlateral oblique mandible وsinuses (ethmoid وmaxillary). العلامات: glabella وnasion وinner وouter canthus وinfraorbital margin وacanthion وgonion وmentum.</p>"}], "terms": [["sella turcica", "Pituitary fossa seen on lateral skull.", "سرج تركي."]]}], "flash": [{"f": "Three positioning factors?", "b": "Rotation, tilt, flexion-extension."}, {"f": "Reid line?", "b": "Inferior orbital margin to upper EAM."}, {"f": "Orbitomeatal line?", "b": "Outer canthus to EAM."}, {"f": "Interpupillary line?", "b": "Between orbit centers."}, {"f": "Lateral skull shows?", "b": "Sella turcica, mastoid."}, {"f": "Mandible views?", "b": "PA and lateral oblique."}], "quiz": [{"q": "Interpupillary line angle to MSP:", "o": ["90", "0", "45", "30"], "a": 0, "w": "90."}, {"q": "Towne's view is for:", "o": ["Hand", "Knee", "Foot", "Skull"], "a": 3, "w": "جمجمة."}, {"q": "Factor not in skull positioning:", "o": ["Rotation", "Tilt", "Dose", "Flexion"], "a": 2, "w": "dose."}, {"q": "Sella turcica seen on:", "o": ["PA hand", "Lateral skull", "AP knee", "Chest"], "a": 1, "w": "lateral."}, {"q": "Nasion is at:", "o": ["Bridge of nose", "Chin", "Ear", "Neck"], "a": 0, "w": "الأنف."}], "recall": [{"q": "Baselines of skull.", "a": "Anthropological, orbitomeatal, interpupillary.", "w": "الخطوط."}, {"q": "Skull views.", "a": "PA, lateral, Towne, SMV, mandible, sinuses.", "w": "الوضعيات."}]}, "anat9": {"name": "Radiographic Anatomy", "lec": "Lecture 9 - Vertebral column", "short": "Anat", "sections": [{"id": "anat9_1", "title_en": "Structure and curves", "title_ar": "التركيب والانحناءات", "figs": [], "blocks": [{"en": "<p>The adult vertebral column has 26 bones: 7 cervical, 12 thoracic (articulate with the ribs), 5 lumbar, the sacrum (fused sacral vertebrae) and coccyx. It lies in the MSP, supports the trunk and head, transmits weight to the lower limbs and protects the spinal cord within the spinal canal (CSF filled). The cord ends at about L1 as the conus medullaris. Intervertebral fibrocartilage discs act as cushions. Primary curves (thoracic and sacral) are convex; secondary curves are cervical and lumbar lordosis.</p>", "ar": "<p>العمود الفقري للبالغ 26 عظمة: 7 رقبية و12 صدرية (بتتمفصل مع الضلوع) و5 قطنية والـsacrum (فقرات عجزية ملتحمة) والـcoccyx. بيقع في الـMSP وبيدعم الجذع والراس وينقل الوزن للرجلين وبيحمي الحبل الشوكي جوه القناة الشوكية (فيها CSF). الحبل بينتهي عند L1 تقريبًا كـconus medullaris. الأقراص الغضروفية بين الفقرات زي الوسادة. الانحناءات الأولية (صدرية وعجزية) محدبة والثانوية رقبية وقطنية lordosis.</p>"}], "terms": [["conus medullaris", "Tapered end of the spinal cord at about L1.", "نهاية الحبل الشوكي."]]}, {"id": "anat9_2", "title_en": "Cervical and thoracic vertebrae", "title_ar": "الفقرات الرقبية والصدرية", "figs": [], "blocks": [{"en": "<p>C1 (atlas) and C2 (axis) form the atlanto-axial joint; the axis has the dens (odontoid process) projecting up and is seen on the open mouth view. C7 (vertebra prominens) has a long non-bifid spinous process. Cervical vertebrae have transverse foramina for the vertebral artery. The 12 thoracic vertebrae have rib articulations and slightly wedge-shaped bodies; ribs arise posteriorly between vertebrae.</p>", "ar": "<p>C1 (atlas) وC2 (axis) بيكوّنوا مفصل atlanto-axial؛ والـaxis فيها dens (odontoid) بتبرز لفوق وبتبان في open mouth view. C7 (vertebra prominens) ليها spinous process طويل غير مشقوق. الفقرات الرقبية فيها transverse foramina للشريان الفقري. الـ12 صدرية فيها مفاصل للضلوع وأجسامها مائلة شوية كالوتد.</p>"}], "terms": [["dens", "Odontoid process of C2.", "النتوء السني."]]}], "flash": [{"f": "Vertebral count?", "b": "26 bones in adult column."}, {"f": "Cord ends?", "b": "About L1."}, {"f": "Primary curves?", "b": "Thoracic and sacral."}, {"f": "C7 name?", "b": "Vertebra prominens."}, {"f": "Dens belongs to?", "b": "C2 axis."}, {"f": "Thoracic vertebrae number?", "b": "12."}], "quiz": [{"q": "Thoracic vertebrae:", "o": ["7", "12", "5", "4"], "a": 1, "w": "12."}, {"q": "Open mouth view shows:", "o": ["C1-C2", "L5", "Sacrum", "T12"], "a": 0, "w": "C1-C2."}, {"q": "Cord ends:", "o": ["C1", "S1", "T1", "L1"], "a": 3, "w": "L1."}, {"q": "Lordotic regions:", "o": ["Thoracic only", "Sacral", "Cervical and lumbar", "None"], "a": 2, "w": "رقبي وقطني."}, {"q": "Discs are:", "o": ["Bone", "Fibrocartilage", "Muscle", "Fat"], "a": 1, "w": "غضروف."}], "recall": [{"q": "Describe vertebral column.", "a": "Regions, curves, cord, discs.", "w": "العمود."}, {"q": "Features of C1, C2 and C7.", "a": "Atlas, axis with dens, C7 prominens.", "w": "الفقرات."}]}, "anat10": {"name": "Radiographic Anatomy", "lec": "Lecture 10 - Spine radiography", "short": "Anat", "sections": [{"id": "anat10_1", "title_en": "Surface landmarks and indications", "title_ar": "العلامات والدواعي", "figs": [], "blocks": [{"en": "<p>Surface landmarks and levels: mastoid process C1; thyroid cartilage C5; vertebra prominens C7; suprasternal notch T2-3; sternal angle T4-5; inferior angle of scapula T7; xiphoid T9-10; inferior costal margin L2-3; iliac crest L4-5; ASIS S1-2; symphysis pubis 2.5 cm below distal coccyx. Indications: congenital (scoliosis lateral bending, kyphosis thoracic hunchback, lordosis lumbar swayback, spina bifida), fractures (compression, odontoid) and disorders (cervical spondylosis, Scheuermann disease, Paget disease).</p>", "ar": "<p>علامات سطحية ومستوياتها: mastoid عند C1 وthyroid cartilage عند C5 وvertebra prominens C7 وsuprasternal notch عند T2-3 وsternal angle T4-5 وزاوية الكتف السفلية T7 وxiphoid T9-10 وحافة الضلوع السفلية L2-3 وiliac crest L4-5 وASIS S1-2 وsymphysis pubis تحت نهاية coccyx بـ2.5 سم. الدواعي: خلقية (scoliosis انحناء جانبي وkyphosis حدبة صدرية وlordosis قطني وspina bifida) وكسور (ضغط وodontoid) واضطرابات (cervical spondylosis وScheuermann وPaget).</p>"}], "terms": [["scoliosis", "Exaggerated lateral bending of the spine.", "انحناء جانبي."]]}, {"id": "anat10_2", "title_en": "Spine projections", "title_ar": "وضعيات العمود", "figs": [], "blocks": [{"en": "<p>Projections: AP open mouth (C1-C2), AP cervical (C3-C7), oblique cervical (anterior and posterior), swimmer lateral (cervicothoracic junction), lateral lumbar and oblique lumbar (RPO, LPO, RAO, LAO).</p>", "ar": "<p>الوضعيات: AP open mouth (C1-C2) وAP رقبي (C3-C7) وoblique رقبي (أمامي وخلفي) وswimmer lateral (الوصلة الرقبية الصدرية) وlateral قطني وoblique قطني (RPO وLPO وRAO وLAO).</p>"}], "terms": [["swimmer lateral", "Lateral view of cervicothoracic junction.", "جانبي للوصلة الرقبية الصدرية."]]}], "flash": [{"f": "Mastoid level?", "b": "C1."}, {"f": "Vertebra prominens?", "b": "C7."}, {"f": "Sternal angle level?", "b": "T4-5."}, {"f": "Iliac crest level?", "b": "L4-5."}, {"f": "Kyphosis?", "b": "Thoracic hunchback."}, {"f": "Swimmer lateral for?", "b": "Cervicothoracic junction."}], "quiz": [{"q": "Iliac crest:", "o": ["C1", "T1", "L4-5", "S5"], "a": 2, "w": "L4-5."}, {"q": "Lordosis is:", "o": ["Hunchback", "Lumbar swayback", "Lateral bend", "Fracture"], "a": 1, "w": "سوايباك."}, {"q": "Open mouth shows:", "o": ["C1-C2", "L1", "T5", "Sacrum"], "a": 0, "w": "C1-C2."}, {"q": "Xiphoid:", "o": ["C7", "L5", "T1", "T9-10"], "a": 3, "w": "T9-10."}, {"q": "Spina bifida is:", "o": ["Fracture", "Tumor", "Incomplete closure", "Infection"], "a": 2, "w": "عدم اكتمال."}], "recall": [{"q": "Surface landmarks of spine.", "a": "Mastoid C1 to symphysis.", "w": "العلامات."}, {"q": "Spine projections.", "a": "Open mouth, AP, oblique, swimmer, lumbar.", "w": "الوضعيات."}]}, "anat11": {"name": "Radiographic Anatomy", "lec": "Lecture 11 - Myelography and the urinary system", "short": "Anat", "sections": [{"id": "anat11_1", "title_en": "Myelography", "title_ar": "تصوير النخاع", "figs": [], "blocks": [{"en": "<p>Myelography is the radiologic examination of CNS structures within the vertebral canal, requiring contrast injected into the subarachnoid space by spinal puncture at L2-L3 or L3-L4 (or the cisterna magna at C1). The meninges are dura mater (outer), arachnoid (middle) and pia mater (inner). Indications: spinal cord tumor, cysts, nerve root injury, cord compression by herniated disc, arachnoiditis. Contraindications: blood in CSF, raised intracranial pressure, low platelets or anticoagulation. Contrast is water-soluble, nonionic, iodinated (Omnipaque, Isovue). The patient lies prone with a pillow under the abdomen. CT myelography and MRI (no intrathecal injection, no bone artifacts) are alternatives.</p>", "ar": "<p>الـmyelography فحص إشعاعي لتراكيب الجهاز العصبي جوه القناة الشوكية وبيحتاج صبغة بتتحقن في subarachnoid space بوخز شوكي بين L2-L3 أو L3-L4 (أو cisterna magna عند C1). الأغشية: dura (خارجي) وarachnoid (أوسط) وpia (داخلي). الدواعي: ورم حبل شوكي وكيسات وإصابة جذور الأعصاب وضغط الحبل من انزلاق غضروفي وarachnoiditis. الموانع: دم في CSF وزيادة ضغط الجمجمة وقلة الصفائح أو مميعات الدم. الصبغة ذائبة في الماء غير أيونية يودية (Omnipaque وIsovue). المريض prone ووسادة تحت البطن. بدائل: CT myelography وMRI (من غير حقن ومن غير bone artifacts).</p>"}], "terms": [["meninges", "Dura, arachnoid and pia mater.", "أغشية المخ والحبل."]]}, {"id": "anat11_2", "title_en": "Urinary system and IVU", "title_ar": "الجهاز البولي", "figs": [], "blocks": [{"en": "<p>Intravenous urography (IVU) is an intravenous contrast study of the urinary system. The kidneys lie under the costal margin and the right kidney lies slightly lower than the left because of the large right lobe of the liver. Kidney anatomy: cortex, medulla, pyramids, papilla, columns, hilum, renal pelvis, major and minor calyces. The ureters are muscular tubes from the kidneys to the posterior surface of the bladder, whose apex lies behind the symphysis pubis.</p>", "ar": "<p>الـIVU فحص بصبغة وريدية للجهاز البولي. الكلى تحت حافة الضلوع والكلية اليمين أوطى شوية من الشمال بسبب كبر الفص الأيمن للكبد. تشريح الكلية: cortex وmedulla وpyramids وpapilla وcolumns وhilum وrenal pelvis وmajor وminor calyces. الحالبين أنابيب عضلية من الكلى لسطح المثانة الخلفي والمثانة قمتها خلف symphysis pubis.</p>"}], "terms": [["IVU", "Intravenous urography.", "تصوير الجهاز البولي بالصبغة."]]}], "flash": [{"f": "Myelography puncture site?", "b": "L2-L3 or L3-L4."}, {"f": "Meninges layers?", "b": "Dura, arachnoid, pia."}, {"f": "Myelography contrast?", "b": "Water-soluble nonionic iodinated."}, {"f": "Patient position?", "b": "Prone with pillow under abdomen."}, {"f": "Lower kidney?", "b": "Right."}, {"f": "Why right kidney lower?", "b": "Large right lobe of liver."}], "quiz": [{"q": "Puncture level:", "o": ["C1 only", "T5", "S3", "L2-L3"], "a": 3, "w": "L2-L3."}, {"q": "Outer meninx:", "o": ["Pia", "Arachnoid", "Dura", "Falx"], "a": 2, "w": "dura."}, {"q": "Lower kidney:", "o": ["Left", "Right", "Equal", "None"], "a": 1, "w": "اليمين."}, {"q": "Contrast:", "o": ["Nonionic iodinated", "Barium", "Air", "Gas"], "a": 0, "w": "يودية."}, {"q": "IVU studies:", "o": ["Brain", "Uterus", "Heart", "Urinary system"], "a": 3, "w": "بولي."}], "recall": [{"q": "Myelography indications and contraindications.", "a": "Tumor, cysts, disc; bleeding, high ICP.", "w": "الدواعي والموانع."}, {"q": "Kidney anatomy.", "a": "Cortex, medulla, pyramids, calyces, pelvis.", "w": "الكلية."}]}, "anat12": {"name": "Radiographic Anatomy", "lec": "Lecture 12 - Hysterosalpingography (HSG)", "short": "Anat", "sections": [{"id": "anat12_1", "title_en": "Indications and contraindications", "title_ar": "الدواعي والموانع", "figs": [], "blocks": [{"en": "<p>HSG is an x-ray procedure to view the inside of the uterus and fallopian tubes, first described by Rubin and Carey in 1914. It checks tube blockage and the size and shape of the uterus. Indications: primary and secondary infertility, localizing fibroids, congenital uterine anomalies, tubal condition and blockage (hydrosalpinx), misplaced IUCD, suspected genital TB, before and after tuboplasty and habitual abortion. Contraindications: recent pelvic inflammation, vaginal bleeding, any doubt of pregnancy and allergy to dye.</p>", "ar": "<p>الـHSG إجراء بالأشعة لرؤية داخل الرحم وقناتي فالوب، وصفه Rubin وCarey سنة 1914. بيشوف انسداد القنوات وحجم وشكل الرحم. الدواعي: عقم أولي وثانوي وتحديد الأورام الليفية وتشوهات الرحم الخلقية وحالة القنوات وانسدادها (hydrosalpinx) ولولب IUCD في مكان غلط وشك سل تناسلي وقبل وبعد tuboplasty والإجهاض المتكرر. الموانع: التهاب حوض حديث ونزيف مهبلي وأي شك في الحمل وحساسية للصبغة.</p>"}], "terms": [["hydrosalpinx", "Fluid-filled blocked fallopian tube.", "قناة فالوب مسدودة بسائل."]]}, {"id": "anat12_2", "title_en": "Timing and contrast", "title_ar": "التوقيت والصبغة", "figs": [], "blocks": [{"en": "<p>HSG is done in a hospital or clinic, best in the first half of the menstrual cycle, after the period and before ovulation, to reduce the chance of pregnancy. Premedication with atropine and an analgesic; post-procedure antibiotics and analgesics for 5-6 days. An ideal contrast is non-irritant to tubal mucosa, endometrium and peritoneum, gives good contrast and causes no sensitivity reaction.</p>", "ar": "<p>الـHSG بيتعمل في مستشفى أو عيادة وأحسن وقت النص الأول من الدورة بعد الحيض وقبل التبويض لتقليل احتمال الحمل. بنديها atropine ومسكن قبل الإجراء وبعده مضاد حيوي ومسكن 5-6 أيام. الصبغة المثالية غير مهيجة لمخاطية القنوات والرحم والبريتون وبتدي كونتراست كويس ومن غير حساسية.</p>"}], "terms": [["IUCD", "Intrauterine contraceptive device.", "لولب."]]}], "flash": [{"f": "HSG shows?", "b": "Uterus and fallopian tubes."}, {"f": "Who described HSG?", "b": "Rubin and Carey, 1914."}, {"f": "Best timing?", "b": "After period, before ovulation."}, {"f": "Premedication?", "b": "Atropine and analgesic."}, {"f": "Contraindication?", "b": "Pregnancy doubt, bleeding, allergy, pelvic inflammation."}, {"f": "Post-procedure?", "b": "Antibiotics and analgesics 5-6 days."}], "quiz": [{"q": "HSG timing:", "o": ["First half of cycle", "Second half", "Any", "During period"], "a": 0, "w": "النص الأول."}, {"q": "Indication:", "o": ["Fracture", "Cough", "Rash", "Infertility"], "a": 3, "w": "عقم."}, {"q": "Contraindication:", "o": ["Infertility", "Fibroids", "Pregnancy doubt", "Misplaced IUCD"], "a": 2, "w": "شك الحمل."}, {"q": "HSG studies:", "o": ["Kidney", "Uterus and tubes", "Lung", "Brain"], "a": 1, "w": "رحم وقنوات."}, {"q": "Hydrosalpinx is:", "o": ["Blocked fluid tube", "Fibroid", "Cyst on kidney", "Bone"], "a": 0, "w": "قناة مسدودة."}], "recall": [{"q": "Indications of HSG.", "a": "Infertility, fibroids, anomalies, tubal blockage, IUCD, TB.", "w": "الدواعي."}, {"q": "Preparation and timing.", "a": "After period before ovulation; atropine; antibiotics.", "w": "التجهيز."}]}, "fund1": {"name": "Fundamentals of Radiography", "lec": "Lecture 1 - Discovery of X-rays and the characteristic spectrum", "short": "Fund", "sections": [{"id": "fund1_1", "title_en": "Roentgen's discovery", "title_ar": "اكتشاف رونتجن", "figs": [], "blocks": [{"en": "<p>X-rays were discovered in November 1895 in Wurzburg by Wilhelm Conrad Roentgen using a Crookes tube. He used the photographic property to image brass weights in a wooden box and then the first photo of the bones of a living hand (his wife's). He found that x-ray output increases when cathode rays hit a heavy metal anticathode, which can also be the anode. This is the basis of the modern x-ray tube. By February 1896 x-ray photographs were used in the US to diagnose fractures.</p>", "ar": "<p>اتكشفت الأشعة السينية في نوفمبر 1895 في فورتسبورج على إيد Wilhelm Conrad Roentgen باستخدام Crookes tube. استخدم خاصية التصوير الفوتوغرافي وصوّر أوزان نحاس جوه صندوق خشب وبعدها أول صورة لعظام إيد إنسان حي (مراته). واكتشف إن شدة الأشعة بتزيد لما الأشعة الكاثودية تضرب معدن تقيل اسمه anticathode ممكن يبقى هو الأنود. ودي أساس أنبوبة الأشعة الحديثة. ومن فبراير 1896 اتستخدمت الأشعة في أمريكا لتشخيص الكسور.</p>"}], "terms": [["Crookes tube", "Early tube similar to the one Roentgen used.", "الأنبوبة اللي استخدمها رونتجن."], ["anticathode", "Heavy metal target hit by cathode rays; can be the anode.", "هدف معدني تقيل بيتضرب بالإلكترونات."]]}, {"id": "fund1_2", "title_en": "Characteristic x-ray spectrum", "title_ar": "طيف الأشعة المميزة", "figs": [], "blocks": [{"en": "<p>Each electron in the target atom has a binding energy that depends on its shell. The K shell (2 electrons) is closest to the nucleus and has the highest binding energy, then the L shell (8 electrons), and so on. When an inner shell electron is knocked out, the vacancy is unstable and an outer shell electron with lower binding energy fills it. The excess energy is released as a characteristic x-ray photon equal to the difference between the binding energies of the two shells.</p>", "ar": "<p>كل إلكترون في ذرة الهدف ليه طاقة ربط حسب المدار. مدار K (إلكترونين) أقرب للنواة وأعلى طاقة ربط، وبعده L (8 إلكترونات) وهكذا. لما إلكترون داخلي يتطرد بيبقى فيه فر
