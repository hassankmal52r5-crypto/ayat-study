<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ayat Study - Semester 1</title>
<meta name="theme-color" content="#7c3aed">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ayat Study">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.svg">
<link rel="icon" href="icon-192.svg" type="image/svg+xml">
<style>
:root{
 --bg:#faf5ff; --card:#ffffff; --ink:#2e1065; --muted:#6b7280;
 --blue:#a78bfa; --purple:#7c3aed; --grad:linear-gradient(135deg,#a78bfa,#6d28d9);
 --ok:#16a34a; --bad:#dc2626; --line:#e5e7eb;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
header{background:var(--grad);color:#fff;padding:18px 16px 22px;border-radius:0 0 24px 24px;box-shadow:0 6px 24px rgba(124,58,237,.25)}
header h1{margin:0;font-size:22px}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
header p{margin:4px 0 0;opacity:.85;font-size:13px}
.tourbtn{flex-shrink:0;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:99px;padding:6px 13px;font-size:12.5px;font-weight:700;cursor:pointer;margin-left:6px}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--card);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 2px 10px rgba(46,16,101,.06)}
.subj{cursor:pointer;display:block;width:100%;text-align:left;border:0}
.subj h2{margin:0 0 2px;font-size:18px}
.subj .lec{color:var(--muted);font-size:13px;margin-bottom:10px}
.bar{height:9px;background:#ede9fe;border-radius:99px;overflow:hidden}
.bar div{height:100%;background:var(--grad);border-radius:99px;transition:width .4s}
.pct{font-size:12px;color:var(--muted);margin-top:6px}
.tabs{display:flex;gap:6px;margin:14px 0;position:sticky;top:8px;z-index:5}
.tabs button{flex:1;border:0;background:#fff;color:var(--muted);border-radius:12px;padding:9px 2px;font-size:12px;font-weight:700;box-shadow:0 2px 8px rgba(46,16,101,.08);cursor:pointer}
.tabs button.on{background:var(--grad);color:#fff}
.back{background:none;border:0;color:#fff;font-size:14px;font-weight:700;padding:0 0 8px;cursor:pointer;opacity:.9}
.sec h3{margin:0;font-size:17px;color:var(--purple);flex:1}
.sechead{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px}
.sec-ar-title{width:100%;font-size:13px;color:var(--muted);direction:rtl;text-align:right;display:none;margin:2px 0 0}
.show-ar .sec-ar-title{display:block}
.langbtn{width:54px;height:30px;border-radius:99px;border:2px solid var(--purple);background:#fff;position:relative;cursor:pointer;padding:0;flex-shrink:0;transition:background .18s ease}
.langbtn .knob{position:absolute;top:1px;left:2px;width:24px;height:24px;border-radius:50%;background:var(--grad);color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;transition:left .18s ease;font-family:inherit}
.langbtn.on{background:var(--purple)}
.langbtn.on .knob{left:24px;background:#fff;color:var(--purple)}
.sec p,.sec li{font-size:15px;line-height:1.65}
.sec ul{padding-left:20px}
.blk .arb{display:none;direction:rtl;text-align:right;background:#f5f3ff;border-radius:10px;padding:8px 12px;margin:4px 0 10px;font-size:14.5px;line-height:1.7;border-right:3px solid var(--purple)}
.show-ar .blk .arb{display:block}
.blk .arb ul{padding-right:20px;padding-left:0}
.note{background:#fef3c7;border-radius:10px;padding:10px 12px;font-size:14px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0}.tbl th,.tbl td{border:1px solid #ddd6fe;padding:4px 5px;text-align:left}.tbl th{background:#ede9fe}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:#faf5ff;color:#6d28d9;border:1px solid #ddd6fe;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.termdef{background:#faf5ff;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:8px;border-right:3px solid var(--purple);width:100%}
.termdef .ar{display:block;direction:rtl;text-align:right;margin-top:4px;color:#6d28d9}
.readbtn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.readbtn.done{border-color:var(--ok);color:var(--ok);background:#f0fdf4}
.btn{display:block;width:100%;border:0;background:var(--grad);color:#fff;border-radius:14px;padding:14px;font-size:15px;font-weight:800;margin-top:12px;cursor:pointer;box-shadow:0 4px 14px rgba(124,58,237,.3)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.row{display:flex;justify-content:space-between;gap:4%}
/* figures */
.svgfig{margin:14px 0 4px;background:#fdfcff;border:1px solid var(--line);border-radius:12px;padding:8px}
.svgfig svg{width:100%;height:auto;display:block}
.viewer{margin:14px 0 4px;background:linear-gradient(160deg,#2e1065,#5b21b6);border-radius:12px;overflow:hidden;position:relative}
.viewer .vtitle{color:#ddd6fe;font-size:12px;font-weight:700;padding:8px 12px 0}
.viewer .vhint{color:#a79bc4;font-size:10.5px;padding:0 12px 6px}
.viewer .vcv{position:relative;height:270px}
.viewer canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.vpins{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.vlines{position:absolute;inset:0;width:100%;height:100%}
.pin{z-index:2}
.viewer .vtitle,.viewer .vhint{padding-right:96px}
.pin{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#fbbf24;color:#2e1065;font:800 12px/18px system-ui,sans-serif;text-align:center;border:2px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.55);transition:transform .15s,opacity .15s,background .15s}
.pin.back{opacity:.3}
.pin.hot{transform:scale(1.7);background:#f472b6;opacity:1;z-index:3}
.vleg{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px 10px;direction:ltr}
.lchip{background:rgba(255,255,255,.1);color:#ede9fe;border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:4px 10px 4px 4px;font-size:12px;display:flex;align-items:center;gap:6px;cursor:pointer;text-align:left}
.lchip b{background:#fbbf24;color:#2e1065;border-radius:50%;width:20px;height:20px;line-height:20px;text-align:center;font-size:11.5px;flex-shrink:0}
.vexp{position:absolute;top:8px;right:10px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:800;cursor:pointer;z-index:2}
#vfull{position:fixed;inset:0;z-index:95;background:linear-gradient(160deg,#2e1065,#5b21b6);display:flex;flex-direction:column}
#vfull .vfh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px}
#vfull .vft{color:#ede9fe;font-weight:800;font-size:14px;direction:ltr}
#vfull .vfx{background:#fff;color:#6d28d9;border:0;border-radius:99px;padding:11px 16px;font-weight:800;font-size:13.5px;cursor:pointer;min-height:44px}
#vfull .vcv{position:relative;flex:1;min-height:0}
#vfull .vfl{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;max-height:34%;overflow:auto;direction:ltr}
#vfull .svgsc{flex:1;min-height:0;overflow:auto;background:#fdfcff;margin:0 10px;border-radius:12px;padding:10px;-webkit-overflow-scrolling:touch}
#vfull .svgin svg{width:100%;height:auto;display:block}
#vfull .svgz{display:flex;gap:10px;justify-content:center;padding:8px}
#vfull .svgz button{width:48px;height:44px;border-radius:99px;border:0;background:#fff;color:#6d28d9;font-size:22px;font-weight:800}
.svgfig{position:relative;cursor:pointer;padding-top:36px}
.svgfig .vexp{background:#ede9fe;border-color:#c4b5fd;color:#6d28d9}
#vfull .vfhint{color:#a79bc4;font-size:11px;text-align:center;padding:0 10px 12px;direction:rtl}
.figcap{font-size:12px;color:var(--muted);margin:6px 2px 0;text-align:center;line-height:1.5}
/* flashcards */
.flash{min-height:200px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;position:relative}
.flash .inner{font-size:17px;font-weight:700;line-height:1.6;padding:8px;width:100%}
.flash .backface{font-weight:500;font-size:15px}
.flash .hint{position:absolute;bottom:10px;left:0;right:0;font-size:11px;color:var(--muted)}
.fnav{display:flex;gap:8px;margin-top:12px}
.fnav button{flex:1;border:0;border-radius:12px;padding:12px;font-weight:800;font-size:14px;cursor:pointer}
.fnav .no{background:#fee2e2;color:var(--bad)}
.fnav .yes{background:#dcfce7;color:var(--ok)}
/* quiz */
.q{font-size:16px;font-weight:800;line-height:1.5;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;background:#fbf9ff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;font-size:14.5px;cursor:pointer;line-height:1.45}
.opt.ok{border-color:var(--ok);background:#f0fdf4}
.opt.bad{border-color:var(--bad);background:#fef2f2}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:12px;font-size:14px;margin-top:10px;line-height:1.6}
.fb.ok{background:#f0fdf4;border:1px solid #bbf7d0}
.fb.bad{background:#fef2f2;border:1px solid #fecaca}
.fb .ar{display:block;direction:rtl;text-align:right;margin-top:6px;color:#57534e}
.prog{font-size:12px;color:var(--muted);margin-bottom:8px}
.score-big{font-size:46px;font-weight:900;text-align:center;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.center{text-align:center}
.missed{text-align:left;font-size:13.5px;background:#fafafa;border-radius:10px;padding:10px 12px;margin:8px 0;border-right:3px solid var(--bad)}
.model{background:#fbf9ff;border-radius:12px;padding:12px;font-size:14.5px;line-height:1.6;margin-top:10px}
.prow{display:flex;align-items:center;gap:10px;margin:10px 0}
.prow .lbl{flex:1;font-size:14px;font-weight:600}
.prow .bar{flex:2}
.prow .val{width:56px;text-align:left;font-size:12px;color:var(--muted)}
.stat-grid{display:flex;gap:10px;margin:10px 0}
.stat-grid .s{flex:1;background:#fbf9ff;border-radius:14px;padding:12px;text-align:center}
.stat-grid .s b{display:block;font-size:20px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat-grid .s span{font-size:11px;color:var(--muted)}
.small{font-size:12px;color:var(--muted)}
.footer-note{text-align:center;font-size:11px;color:var(--muted);margin-top:22px;line-height:1.7}
/* translation popup */
#pop{position:fixed;z-index:70;max-width:320px;background:#2e1065;color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.4);display:none;font-size:14px;line-height:1.6}
#pop .par{direction:rtl;text-align:right;font-size:15px;font-weight:700;color:#ddd6fe}
#pop .pen{font-size:12.5px;color:#c4b5fd;margin-top:4px}
#pop .prow2{display:flex;gap:8px;margin-top:8px}
#pop button{flex:1;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:9px;padding:7px;font-size:12.5px;font-weight:700;cursor:pointer}
#pop .none{color:#fca5a5}
/* plan */
.weekrow{display:flex;gap:5px;overflow-x:auto;margin:10px 0 4px;padding-bottom:2px}
.weekrow button{flex:0 0 auto;border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 10px;font-size:12px;font-weight:800;color:var(--muted);cursor:pointer}
.weekrow button.on{border-color:var(--purple);color:var(--purple);background:#f5f3ff}
.daycol{background:#fdfcff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:9px 0}
.daycol .dh{display:flex;align-items:center;justify-content:space-between}
.daycol .dh b{font-size:14px}
.daycol .dh .today{font-size:10.5px;background:var(--grad);color:#fff;border-radius:99px;padding:3px 9px;font-weight:800}
.sess{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 10px;margin:8px 0}
.sess .dot{width:9px;height:9px;border-radius:50%;background:var(--grad);flex-shrink:0}
.sess .si{flex:1;font-size:13px;line-height:1.4}
.sess .si small{display:block;color:var(--muted);font-size:11px}
.sess.done .si{text-decoration:line-through;opacity:.55}
.sess button{border:0;border-radius:8px;padding:6px 9px;font-size:12px;font-weight:800;cursor:pointer}
.sess .chk{background:#dcfce7;color:var(--ok)}
.sess.done .chk{background:#e5e7eb;color:var(--muted)}
.sess .del{background:#fee2e2;color:var(--bad)}
.addbox{background:#f5f3ff;border:1.5px dashed #ddd6fe;border-radius:12px;padding:10px;margin:8px 0}
.addbox select{width:100%;padding:9px;border-radius:9px;border:1.5px solid #ddd6fe;font:inherit;font-size:13.5px;margin:5px 0;background:#fff}
/* tour */
#tourbg{position:fixed;inset:0;background:rgba(15,10,40,.72);z-index:80;display:none}
#tourhl{position:fixed;z-index:81;border:3px solid #fbbf24;border-radius:14px;box-shadow:0 0 0 4000px rgba(15,10,40,.55),0 0 24px #fbbf24;display:none;pointer-events:none}
#tourcard{position:fixed;z-index:82;left:16px;right:16px;background:#fff;border-radius:16px;padding:16px;display:none;box-shadow:0 14px 40px rgba(0,0,0,.45)}
#tourcard .tt{direction:rtl;text-align:right;font-size:14.5px;line-height:1.7;color:var(--ink)}
#tourcard .tn{display:flex;gap:8px;margin-top:12px}
#tourcard .tn button{flex:1;border:0;border-radius:10px;padding:10px;font-weight:800;font-size:13.5px;cursor:pointer}
#tourcard .next{background:var(--grad);color:#fff}
#tourcard .skip{background:#f3f4f6;color:var(--muted)}
#tourcard .tcount{font-size:11px;color:var(--muted);text-align:center;margin-top:8px}

.nhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.nhead .btn{display:inline-block;width:auto;flex:none;white-space:nowrap;padding:8px 14px;font-size:12.5px}
.ntier{font-weight:800;font-size:13px;margin:14px 2px 6px;color:#6d28d9}
.note{background:#fff;border-radius:12px;padding:10px 12px;margin:0 0 8px;box-shadow:0 1px 4px rgba(79,70,229,.12);border-left:5px solid #c4b5fd}
.note.t1{border-left-color:#f59e0b;background:#fffbeb}.note.t2{border-left-color:#6d28d9}
.note .nq{font-weight:800;color:#2e1065;font-size:14px;margin-bottom:4px}
.note .na{color:#374151;font-size:13.5px;line-height:1.5}
.note .nn{display:inline-block;background:#7c3aed;color:#fff;border-radius:9px;font-size:11px;font-weight:800;padding:1px 7px;margin-right:6px}
.note .ntag{display:inline-block;font-size:10.5px;color:#92400e;background:#fef3c7;border-radius:8px;padding:1px 7px;margin-top:6px}
.nterm{padding:7px 2px;border-bottom:1px solid #e5e7eb;font-size:13.5px}.nterm b{color:#6d28d9}.nterm .ar{display:block;direction:rtl;text-align:right;color:#57534e;font-size:12.5px}
.sess.late{border-color:#fca5a5;background:#fef2f2}.sess .ltag{display:inline-block;background:#dc2626;color:#fff;border-radius:8px;font-size:10.5px;font-weight:800;padding:1px 7px;margin-right:6px}.sess .lnote{display:block;color:#b91c1c;font-size:11px}
</style>
</head>
<body>
<header id="hdr"></header>
<div class="wrap" id="app"></div>
<div id="pop"></div>
<div id="tourbg"></div><div id="tourhl"></div>
<div id="tourcard"><div class="tt" id="tourtext"></div><div class="tn"><button class="skip" onclick="tourEnd()">تخطي</button><button class="next" id="tournext" onclick="tourNext()">التالي</button></div><div class="tcount" id="tourcount"></div></div>
<script>
const LECTURES = {"elec": ["Introduction and basic electricity", "Electricity, Ohm's law and semiconductors", "The pn junction, diodes and transistors", "Display units (CRT, plasma, LCD)", "Number systems, logic gates and Boolean algebra", "Digital electronics and logic design", "Computer memory and conversions (1)", "Computer memory and conversions (2)"], "anat": ["Radiographic terms and projections", "Upper limb: hand and wrist", "Upper limb: forearm and elbow", "Lower limb: pelvis, hip, femur and knee", "Respiratory system anatomy", "Bony thorax and chest film assessment", "Skull bones", "Skull landmarks, baselines and projections", "Vertebral column", "Spine radiography", "Myelography and the urinary system", "Hysterosalpingography (HSG)"], "path": ["Introduction to pathology and cell injury", "Cellular adaptations", "Acute inflammation", "Repair and healing", "Neoplasia", "Disorders of immunity"], "physio": ["Introduction to endocrinology", "Hypothalamus and pituitary gland", "Thyroid gland", "Adrenal gland", "Endocrine pancreas", "Pineal gland and thymus", "Urinary system, nephron, renal blood flow and GFR", "Tubular functions", "Micturition", "Acid-base balance", "Respiratory system", "Cardiovascular system: heart and ECG", "Gastrointestinal system"], "physics": ["Lecture 1", "Lecture 2", "Lecture 3", "Lecture 4", "Lecture 5", "Lecture 6", "Lecture 7", "Lecture 8", "Lecture 9", "Lecture 10", "Lecture 11", "Lecture 12", "Lecture 13", "Lecture 14", "Lecture 15", "Lecture 16", "Lecture 17"], "fund": ["Discovery of X-rays and the characteristic spectrum", "Basics of image formation and terminology", "Film storage, latent image and intensifying screens", "Positioning terminology", "Concepts of radiographic examination", "Processing: the developer", "Processing: the fixer", "Radiography as a profession and patient care", "Abdominal x-ray positioning", "Chest radiography", "Darkroom and film processing", "Introduction to CT", "Introduction to MRI", "MRI physics", "Introduction to ultrasound", "Ultrasound physics and instrumentation", "X-ray tube and generator", "Units of radiation measurement", "Preparation for contrast studies", "Radiographic exposure and quality", "Fluoroscopy", "MRI safety and patient preparation", "MRI of the head", "Dose measurement and patient protection", "Image artifacts and retakes"], "care": ["Patient care in radiography: introduction and radiation protection", "Hospital design and planning of X-ray departments", "The health care team and the radiology department", "Contrast media and the urinary tract", "Contrast media: IVU technique", "Pharmacology: drug names, classes and routes", "Patient classification, communication and handling", "Pediatric imaging", "Patient care procedures: safety, fire and transfers", "Hygiene and cross-infection", "Health-illness continuum and attitude", "Positioning, restraints and incidents", "Communication in patient care", "Communicating with special patient groups and families"]};
const DATA = {"elec1": {"name": "Fundamentals of Electronics", "lec": "Lecture 1 - Introduction and basic electricity", "short": "Elec", "sections": [{"id": "elec1_1", "title_en": "Course aims and the idea of electricity", "title_ar": "أهداف المادة وفكرة الكهرباء", "figs": [], "blocks": [{"en": "<p>The course (RAD 210) prepares the student to understand <b>electronics, solid state physics and digital electronics</b> as a base for modern diagnostic X-ray, nuclear medicine, CT, MRI and ultrasound units.</p>", "ar": "<p>المادة (RAD 210) بتجهّزك تفهم <b>الإلكترونيات وفيزياء الحالة الصلبة والإلكترونيات الرقمية</b> كأساس لأجهزة الأشعة التشخيصية والطب النووي والـ CT والـ MRI والسونار.</p>"}, {"en": "<p>Specific objectives:</p><ul><li>Describe analogue meters: functions, use of shunts, meters in X-ray, nuclear medicine, CT, MRI and U/S units.</li><li>Understand the DC principle.</li><li>Understand solid state physics, semiconductors, diodes and transistors.</li><li>Describe digital electronics, number systems, gates and truth tables.</li><li>Fundamentals of computer architecture.</li></ul>", "ar": "<p>الأهداف المحددة:</p><ul><li>وصف العدادات التناظرية ووظائفها واستخدام الـ shunt والعدادات في الأجهزة.</li><li>فهم مبدأ التيار المستمر DC.</li><li>فهم فيزياء الحالة الصلبة وأشباه الموصلات والدايود والترانزستور.</li><li>وصف الإلكترونيات الرقمية وأنظمة الأعداد والبوابات وجداول الحقيقة.</li><li>أساسيات بنية الكمبيوتر.</li></ul>"}, {"en": "<p><b>Electricity</b> is the ordered flow of electrons in a conductor. Think of it like water flowing in a pipe. Electrons are present and quite moveable in every conductor.</p>", "ar": "<p><b>الكهرباء</b> هي تدفّق منتظم للإلكترونات داخل موصّل. تخيّلها زي المياه في ماسورة. الإلكترونات موجودة وحرّة الحركة في أي موصّل.</p>"}], "terms": [["electricity", "The ordered flow of electrons in a conductor.", "الكهرباء: تدفق منظم للإلكترونات في موصّل."], ["electron", "Negatively charged particle that is free to move in a conductor.", "الإلكترون: جسيم سالب الشحنة حر الحركة في الموصّل."]]}, {"id": "elec1_2", "title_en": "Materials and conductivity", "title_ar": "المواد والتوصيل", "figs": [], "blocks": [{"en": "<ul><li><b>Conductors</b> permit the flow of electrons (gold, silver, copper).</li><li><b>Insulators</b> block the flow of electrons (rubber, glass, Teflon, mica).</li><li><b>Semiconductors</b> fall between the two. They are \"part-time\" conductors whose conductivity can be controlled.</li></ul>", "ar": "<ul><li><b>الموصّلات</b> بتسمح بمرور الإلكترونات (دهب، فضة، نحاس).</li><li><b>العوازل</b> بتمنع مرور الإلكترونات (مطاط، زجاج، تفلون، ميكا).</li><li><b>أشباه الموصلات</b> في النص، موصّلات \"بدوام جزئي\" وتقدر تتحكم في توصيلها.</li></ul>"}, {"en": "<p>Conduction depends on the <b>orbiting electrons</b>, not on the atomic nuclei. This is the electron theory of conduction.</p>", "ar": "<p>التوصيل بيعتمد على <b>الإلكترونات الدايرة حوالين النواة</b> مش على النوى نفسها. دي نظرية التوصيل الإلكتروني.</p>"}], "terms": [["conductor", "Material that lets electrons flow (gold, silver, copper).", "موصّل: مادة بتسمح بمرور الإلكترونات."], ["insulator", "Material that blocks electron flow (rubber, glass, Teflon, mica).", "عازل: مادة بتمنع مرور الإلكترونات."], ["semiconductor", "Material between conductor and insulator whose conductivity can be controlled.", "شبه موصّل: توصيله بين الموصّل والعازل وممكن يتحكم فيه."]]}, {"id": "elec1_3", "title_en": "Charge, current and voltage", "title_ar": "الشحنة والتيار والجهد", "figs": [], "blocks": [{"en": "<ul><li><b>Charge</b>: symbol q, unit coulomb (C). Electron charge = -1.602x10^-19 C, proton = +1.602x10^-19 C.</li><li><b>Current</b>: symbol I, unit ampere (A). It is the rate of flow of electrons: I = dq/dt. 1 A = 1 C/s. Often measured in milliamps (mA).</li><li><b>Voltage</b> (potential difference): symbol V, unit volt (V). It is the energy needed to move a unit of charge between two points. Like the potential energy of a waterfall.</li></ul>", "ar": "<ul><li><b>الشحنة</b>: رمزها q ووحدتها الكولوم (C). شحنة الإلكترون -1.602x10^-19 C والبروتون موجبة بنفس القيمة.</li><li><b>التيار</b>: رمزه I ووحدته الأمبير (A). هو معدل تدفق الإلكترونات: I = dq/dt. الأمبير = كولوم/ثانية. بيتقاس غالباً بالمللي أمبير.</li><li><b>الجهد</b> (فرق الجهد): رمزه V ووحدته الفولت. هو الطاقة المطلوبة لتحريك وحدة شحنة بين نقطتين، زي طاقة وضع الشلال.</li></ul>"}, {"en": "<p>One coulomb equals <b>6.25 x 10^18 electrons</b>. An ampere is one coulomb flowing past a point for one second (A = C/s).</p>", "ar": "<p>الكولوم الواحد = <b>6.25 x 10^18 إلكترون</b>. والأمبير هو كولوم واحد بيعدي نقطة في ثانية (A = C/s).</p>"}, {"en": "<p><b>Voltage is like water pressure</b> (the driving force, measured in volts). <b>Current is like water volume</b> flowing (measured in amps). To produce a current you need a <b>source of potential difference</b> and a <b>complete circuit</b>.</p>", "ar": "<p><b>الجهد زي ضغط المية</b> (القوة الدافعة بالفولت). <b>والتيار زي كمية المية</b> الجارية (بالأمبير). عشان يحصل تيار لازم <b>مصدر فرق جهد</b> و<b>دايرة كاملة</b>.</p>"}], "terms": [["coulomb", "Unit of electric charge; 1 C = 6.25 x 10^18 electrons.", "كولوم: وحدة الشحنة."], ["ampere", "Unit of current; 1 A = 1 C/s.", "أمبير: وحدة التيار."], ["potential difference", "Voltage: energy per unit charge between two points.", "فرق الجهد: طاقة لكل وحدة شحنة بين نقطتين."], ["EMF", "Electromotive force: the driving force that moves electrons along a conductor, also in volts.", "القوة الدافعة الكهربية: القوة اللي بتحرك الإلكترونات."]]}, {"id": "elec1_4", "title_en": "Energy, power and cell connections", "title_ar": "الطاقة والقدرة وتوصيل البطاريات", "figs": [], "blocks": [{"en": "<ul><li>Electrical energy is measured in <b>joules</b>.</li><li><b>Power</b> is energy per unit time. One joule per second = one <b>watt</b>.</li><li><b>P = V x I</b>.</li></ul>", "ar": "<ul><li>الطاقة الكهربية بتتقاس بالـ <b>جول</b>.</li><li><b>القدرة</b> هي الطاقة في الثانية. جول/ثانية = <b>واط</b>.</li><li><b>P = V x I</b>.</li></ul>"}, {"en": "<p><b>Series cells</b>: each cell gives 1.5 V, so two cells give 3 V and three give 4.5 V. <b>Parallel cells</b>: the voltage stays 1.5 V but a larger current can be drawn.</p>", "ar": "<p><b>البطاريات على التوالي</b>: كل واحدة 1.5 فولت، فاتنين = 3 فولت وتلاتة = 4.5 فولت. <b>على التوازي</b>: الجهد يفضل 1.5 فولت بس تقدر تسحب تيار أكبر.</p>"}], "terms": [["power", "Energy per unit time; P = V x I; unit watt (J/s).", "القدرة: الطاقة في الثانية؛ P = V x I."], ["watt", "Unit of power: one joule per second.", "واط: وحدة القدرة."]]}, {"id": "elec1_5", "title_en": "Resistance, resistors and circuits", "title_ar": "المقاومة والدوائر", "figs": [], "blocks": [{"en": "<p><b>Resistance</b> is the tendency of a conductor to limit electron flow, measured in <b>ohms</b> (Ω). A <b>resistor</b> is a device made specifically to reduce conductivity. In a resistor, current is directly proportional to voltage: <b>V = IR</b> (I = GV, where G = 1/R is the conductance).</p>", "ar": "<p><b>المقاومة</b> هي ميل الموصّل إنه يحدّ من مرور الإلكترونات، وبتتقاس بالأوم (Ω). و<b>المقاوم</b> جهاز معمول مخصوص عشان يقلل التوصيل. في المقاوم التيار يتناسب طردياً مع الجهد: <b>V = IR</b> (و G = 1/R هي الموصلية).</p>"}, {"en": "<p>Factors affecting resistance: the <b>shape</b> of the substance (R is proportional to length L and inversely proportional to area A), the <b>type</b> of substance, and its <b>temperature</b>.</p>", "ar": "<p>العوامل اللي بتأثر على المقاومة: <b>شكل</b> المادة (R تتناسب مع الطول L وعكسياً مع المساحة A) و<b>نوع</b> المادة و<b>درجة حرارتها</b>.</p>"}, {"en": "<ul><li><b>Series</b>: loads in a single string; the current is the same in every load. R total = R1 + R2 + ...</li><li><b>Parallel</b>: 1/R total = 1/R1 + 1/R2 + ...</li><li>Example: two 1 kΩ resistors give 2 kΩ in series and 0.5 kΩ in parallel.</li></ul>", "ar": "<ul><li><b>توالي</b>: الأحمال في خط واحد والتيار نفسه في كل حمل. R الكلية = R1 + R2 + ...</li><li><b>توازي</b>: 1/R الكلية = 1/R1 + 1/R2 + ...</li><li>مثال: مقاومتين 1 كيلو أوم = 2 كيلو أوم توالي و0.5 كيلو أوم توازي.</li></ul>"}, {"en": "<p>An <b>ohmmeter</b> does not work with a circuit connected to a power supply. Take the resistor out of the circuit and test it separately.</p>", "ar": "<p><b>الأوم ميتر</b> مبيشتغلش والدايرة متوصلة بمصدر. لازم تفصل المقاوم وتقيسه لوحده.</p>"}, {"en": "<p>Metric prefixes: pico 10^-12, nano 10^-9, micro 10^-6, milli 10^-3, kilo 10^3, mega 10^6, giga 10^9.</p>", "ar": "<p>البادئات: بيكو 10^-12، نانو 10^-9، ميكرو 10^-6، ميلي 10^-3، كيلو 10^3، ميجا 10^6، جيجا 10^9.</p>"}], "terms": [["resistance", "Tendency of a conductor to limit electron flow; unit ohm.", "المقاومة: ميل الموصّل لتقليل التدفق."], ["series circuit", "Loads connected in one string; same current through each.", "توالي: نفس التيار في كل الأحمال."], ["parallel circuit", "Loads connected across the same two points; 1/Rt = 1/R1 + 1/R2.", "توازي: الأحمال على نفس النقطتين."], ["ohmmeter", "Measures resistance; the component must be removed from powered circuit.", "أوم ميتر: بيقيس المقاومة."]]}], "flash": [{"f": "What is electricity?", "b": "The ordered flow of electrons in a conductor (like water in a pipe)."}, {"f": "Define conductors, insulators and semiconductors.", "b": "Conductors let electrons flow (gold, silver, copper); insulators block them (rubber, glass, Teflon, mica); semiconductors are in between, \"part-time\" conductors whose conductivity can be controlled."}, {"f": "Charge of an electron and a proton?", "b": "Electron: -1.602x10^-19 C. Proton: +1.602x10^-19 C."}, {"f": "Define current, its symbol and unit.", "b": "Rate of flow of electrons, I = dq/dt; unit ampere; 1 A = 1 C/s."}, {"f": "How many electrons make one coulomb?", "b": "6.25 x 10^18 electrons."}, {"f": "Voltage analogy and unit?", "b": "Like water pressure (waterfall potential energy); the volt. It is the energy required to move a unit charge between two points."}, {"f": "What two things are needed to produce a current?", "b": "A source of potential difference and a complete circuit."}, {"f": "Power formula and unit?", "b": "P = V x I; watt (one joule per second)."}, {"f": "Two 1.5 V cells in series, and in parallel?", "b": "Series: 3 V. Parallel: 1.5 V but a larger current can be drawn."}, {"f": "State the resistor relation and its constant.", "b": "V = IR (I = GV, G = 1/R is conductance)."}, {"f": "Three factors affecting resistance?", "b": "Shape (length and area), type of substance, temperature."}, {"f": "Resistors in series and in parallel?", "b": "Series: Rt = R1 + R2. Parallel: 1/Rt = 1/R1 + 1/R2 (two 1 kΩ: 2 kΩ series, 0.5 kΩ parallel)."}, {"f": "Why take a resistor out of the circuit before an ohmmeter?", "b": "An ohmmeter does not function with a circuit connected to a power supply."}], "quiz": [{"q": "Electricity is best defined as:", "o": ["Flow of protons in a gas", "Ordered flow of electrons in a conductor", "Heat inside atoms", "Random motion of neutrons"], "a": 1, "w": "الكهرباء = تدفق منتظم للإلكترونات في موصّل."}, {"q": "Which is an insulator?", "o": ["Copper", "Silver", "Glass", "Gold"], "a": 2, "w": "الزجاج عازل، والباقي موصّلات."}, {"q": "Semiconductors are called part-time conductors because:", "o": ["They never conduct", "Their conductivity can be controlled", "They only conduct at night", "They are always hot"], "a": 1, "w": "توصيلهم بيتحكم فيه."}, {"q": "The unit of electric charge is the:", "o": ["Ohm", "Watt", "Coulomb", "Volt"], "a": 2, "w": "وحدة الشحنة الكولوم."}, {"q": "1 ampere equals:", "o": ["1 coulomb per second", "1 volt per ohm only", "1 joule", "1 watt per volt squared"], "a": 0, "w": "الأمبير = كولوم/ثانية."}, {"q": "One coulomb is about:", "o": ["6.25 x 10^18 electrons", "1.6 x 10^-19 electrons", "10^6 electrons", "1000 electrons"], "a": 0, "w": "الكولوم = 6.25 x 10^18 إلكترون."}, {"q": "Voltage is compared to:", "o": ["Water volume", "Water pressure", "Pipe length", "Water colour"], "a": 1, "w": "الجهد زي ضغط المية، والتيار زي الحجم."}, {"q": "Power is calculated as:", "o": ["P = V / I", "P = V x I", "P = I / V", "P = R x V"], "a": 1, "w": "P = V x I."}, {"q": "Three 1.5 V cells in series give:", "o": ["1.5 V", "3 V", "4.5 V", "0.5 V"], "a": 2, "w": "3 x 1.5 = 4.5 فولت."}, {"q": "In a series circuit the current is:", "o": ["Different in each load", "The same in every load", "Zero", "Doubled at each load"], "a": 1, "w": "في التوالي التيار واحد."}, {"q": "Resistance of a wire increases when:", "o": ["Its length increases", "Its area increases", "It gets thicker", "It is cooled to 0 K only"], "a": 0, "w": "المقاومة بتزيد بزيادة الطول وبتقل بزيادة المساحة."}, {"q": "Two 1 kΩ resistors in parallel give:", "o": ["2 kΩ", "1 kΩ", "0.5 kΩ", "4 kΩ"], "a": 2, "w": "1/R = 1+1 = 2 يعني R = 0.5 كيلو."}, {"q": "An ohmmeter must be used:", "o": ["With power connected", "On a circuit without power, component removed", "Only on AC", "In series with a battery"], "a": 1, "w": "الأوم ميتر لازم من غير مصدر كهربا."}, {"q": "The relation V = IR means current is:", "o": ["Inversely proportional to voltage", "Directly proportional to voltage", "Independent of voltage", "Equal to resistance"], "a": 1, "w": "التيار يتناسب طردياً مع الجهد."}], "recall": [{"q": "Define electricity and give the water analogy.", "a": "Ordered flow of electrons in a conductor. Voltage is like pressure and current like water volume.", "w": "التعريف + تشبيه المية."}, {"q": "Classify materials by conductivity with examples.", "a": "Conductors (gold, silver, copper), insulators (rubber, glass, Teflon, mica), semiconductors in between.", "w": "التصنيف مع أمثلة."}, {"q": "Define charge, current and voltage with units.", "a": "q in coulomb (6.25x10^18 electrons per C); I in ampere (C/s); V in volt (energy per unit charge).", "w": "الوحدات."}, {"q": "What is needed to produce a current?", "a": "A source of potential difference and a complete circuit.", "w": "مصدر جهد + دايرة كاملة."}, {"q": "Write the power formula and explain.", "a": "P = V x I; energy per unit time; one joule per second is one watt.", "w": "القدرة."}, {"q": "Compare series and parallel cells.", "a": "Series: voltages add (1.5 V each). Parallel: voltage stays 1.5 V, current capacity higher.", "w": "مقارنة."}, {"q": "State Ohm's relation and factors affecting resistance.", "a": "V = IR; shape (length and area), type, temperature.", "w": "القانون والعوامل."}, {"q": "Combine resistors in series and parallel.", "a": "Series Rt = R1 + R2; parallel 1/Rt = 1/R1 + 1/R2.", "w": "توالي وتوازي."}, {"q": "How do you measure a resistor with an ohmmeter?", "a": "Remove it from the circuit with no power supply and measure it separately.", "w": "الأوم ميتر."}]}, "elec2": {"name": "Fundamentals of Electronics", "lec": "Lecture 2 - Electricity, Ohm's law and semiconductors", "short": "Elec", "sections": [{"id": "elec2_1", "title_en": "Electronics, charge and material classes", "title_ar": "الإلكترونيات والشحنة وأنواع المواد", "figs": [], "blocks": [{"en": "<p><b>Electronics</b> is the science of controlling electric energy, where electrons play the fundamental role. It deals with circuits that contain active components (vacuum tubes, transistors, diodes, integrated circuits) and passive components. Electricity is an invisible force that can produce <b>heat, light, sound and motion</b>.</p>", "ar": "<p><b>الإلكترونيات</b> هي علم التحكم في الطاقة الكهربية، والإلكترونات هي العنصر الأساسي. بتتعامل مع دوائر فيها مكونات نشطة (صمامات، ترانزستور، دايود، دوائر متكاملة) ومكونات سلبية. والكهرباء قوة مش مرئية بتنتج <b>حرارة وضوء وصوت وحركة</b>.</p>"}, {"en": "<p>Electricity breaks down into four things: <b>electric charge, voltage, current, resistance</b>.</p>", "ar": "<p>الكهرباء بتتقسم لأربعة: <b>الشحنة، الجهد، التيار، المقاومة</b>.</p>"}, {"en": "<p>The <b>electron</b> is the smallest amount of charge, with negative polarity, orbiting the nucleus. The <b>proton</b> is positive and sits in the nucleus with the <b>neutron</b>, which is neutral.</p>", "ar": "<p><b>الإلكترون</b> أصغر شحنة وقطبيته سالبة وبيدور حوالين النواة. <b>البروتون</b> موجب وفي النواة مع <b>النيوترون</b> المتعادل.</p>"}, {"en": "<p>The three classes by valence electrons:</p><ul><li><b>Conductors</b>: 1 valence electron; electrons move freely from atom to atom (all metals).</li><li><b>Insulators</b>: 8 valence electrons; used to prevent flow. Glass, rubber, plastic are also called <b>dielectrics</b> (they can store charge, used in capacitors).</li><li><b>Semiconductors</b>: 4 valence electrons (carbon, germanium, silicon); used in transistors.</li></ul>", "ar": "<p>التلات أنواع بحسب إلكترونات التكافؤ:</p><ul><li><b>موصّلات</b>: إلكترون تكافؤ واحد؛ الإلكترونات بتتحرك بحرية (كل المعادن).</li><li><b>عوازل</b>: 8 إلكترونات تكافؤ؛ بتمنع التيار. الزجاج والمطاط والبلاستيك اسمهم <b>dielectrics</b> (بتخزّن شحنة وبتستخدم في المكثفات).</li><li><b>أشباه الموصلات</b>: 4 إلكترونات تكافؤ (كربون، جرمانيوم، سيليكون)؛ بتستخدم في الترانزستور.</li></ul>"}], "terms": [["dielectric", "Insulating material that can store charge; used in capacitors.", "ديالكتريك: عازل بيخزن شحنة."], ["valence electron", "Electron in the outer orbit; conductors 1, semiconductors 4, insulators 8.", "إلكترون التكافؤ في المدار الخارجي."], ["electronics", "Science of controlling electric energy via electrons.", "علم التحكم في الطاقة الكهربية."]]}, {"id": "elec2_2", "title_en": "Charge, voltage, current, resistance", "title_ar": "الشحنة والجهد والتيار والمقاومة", "figs": [], "blocks": [{"en": "<ul><li>Charge symbol <b>Q</b> (quantity), unit <b>coulomb</b> = 6.25x10^18 electrons.</li><li>Potential difference symbol <b>E</b> (EMF), unit <b>volt</b>. 1 V is the work needed to move 1 C.</li><li>Current symbol <b>I</b> (intensity), unit <b>ampere</b>, <b>I = Q/T</b>. 1 ampere = 1 coulomb per second.</li><li>Resistance: opposition to current flow; unit <b>ohm</b> (Ω). A wire becoming hot is evidence of resistance. Conductors have little resistance, insulators a lot.</li></ul>", "ar": "<ul><li>الشحنة رمزها <b>Q</b> ووحدتها <b>الكولوم</b> = 6.25x10^18 إلكترون.</li><li>فرق الجهد رمزه <b>E</b> ووحدته <b>الفولت</b>. الفولت هو الشغل المطلوب لتحريك كولوم.</li><li>التيار رمزه <b>I</b> ووحدته <b>الأمبير</b>، <b>I = Q/T</b>. الأمبير = كولوم/ثانية.</li><li>المقاومة: معارضة مرور التيار؛ وحدتها <b>الأوم</b> (Ω). سخونة السلك دليل على وجود مقاومة. الموصّلات مقاومتها قليلة والعوازل كبيرة.</li></ul>"}, {"en": "<p><b>Current is charge in motion</b>: when a charge is forced to move by a potential difference, current is produced. The more electrons in motion, the greater the current.</p>", "ar": "<p><b>التيار هو شحنة متحركة</b>: لما فرق جهد يجبر الشحنة تتحرك بيحصل تيار. كل ما إلكترونات أكتر اتحركت التيار زاد.</p>"}], "terms": [["I = Q/T", "Current equals charge divided by time.", "التيار = الشحنة / الزمن."], ["resistor", "Component designed to provide resistance.", "المقاوم: مكون مصنوع لتوفير مقاومة."]]}, {"id": "elec2_3", "title_en": "Circuits and Ohm's law", "title_ar": "الدوائر وقانون أوم", "figs": [], "blocks": [{"en": "<p>A <b>circuit</b> is a path for current flow. In a <b>closed circuit</b> current flows. In an <b>open circuit</b> there is no conductive path (a break between two points) so <b>I = 0</b>.</p>", "ar": "<p><b>الدايرة</b> هي مسار لمرور التيار. في <b>الدايرة المغلقة</b> التيار بيمشي. في <b>الدايرة المفتوحة</b> مفيش مسار موصّل فـ <b>I = 0</b>.</p>"}, {"en": "<p>The battery is the <b>source</b> (it provides the potential energy). The circuit components are the <b>load resistance</b>, which determines how much current the source produces. Electrons flow from the <b>negative</b> side of the battery, through the load, back to the <b>positive</b> side.</p>", "ar": "<p>البطارية هي <b>المصدر</b> (بتوفر طاقة الوضع). ومكونات الدايرة هي <b>مقاومة الحمل</b> وهي اللي بتحدد التيار. الإلكترونات بتمشي من الطرف <b>السالب</b> للبطارية عبر الحمل ورجوع للطرف <b>الموجب</b>.</p>"}, {"en": "<p>Ohm's law: if you know any two of E, I, R you can calculate the third. Current and voltage are in linear proportion for a constant resistance.</p><ul><li><b>I = E/R</b> (current)</li><li><b>E = I x R</b> (voltage, also V = IR)</li><li><b>R = E/I</b> (resistance)</li></ul>", "ar": "<p>قانون أوم: لو عرفت اتنين من E وI وR تحسب التالت. التيار والجهد بينهم تناسب خطي لو المقاومة ثابتة.</p><ul><li><b>I = E/R</b> (التيار)</li><li><b>E = I x R</b> (الجهد، أو V = IR)</li><li><b>R = E/I</b> (المقاومة)</li></ul>"}], "terms": [["Ohm's law", "I = E/R; V = IR; R = E/I.", "قانون أوم."], ["open circuit", "Circuit with a break, so no current (I = 0).", "دايرة مفتوحة: مفيش تيار."], ["load", "The circuit components that draw current from the source.", "الحمل: مكونات الدايرة اللي بتسحب تيار."]]}, {"id": "elec2_4", "title_en": "Digital multimeter", "title_ar": "الملتيميتر الرقمي", "figs": [], "blocks": [{"en": "<p>A <b>multimeter</b> (volt-ohm meter) combines several measuring functions in one unit: <b>ammeter</b> (current), <b>voltmeter</b> (potential difference) and <b>ohmmeter</b> (resistance).</p>", "ar": "<p><b>الملتيميتر</b> جهاز واحد فيه كذا وظيفة قياس: <b>أميتر</b> (تيار) و<b>فولتميتر</b> (فرق جهد) و<b>أوم ميتر</b> (مقاومة).</p>"}, {"en": "<ul><li><b>Voltmeter</b>: connected in <b>parallel</b>; should have very <b>HIGH</b> input impedance.</li><li><b>Ammeter</b>: connected in <b>series</b> (break the circuit so all current passes through it); very <b>LOW</b> input impedance.</li><li><b>Ohmmeter</b>: with <b>no power supplied</b>. Adjust the range, starting from the highest limit if you do not know the value.</li></ul>", "ar": "<ul><li><b>الفولتميتر</b>: بيتوصل <b>توازي</b>؛ لازم يكون مقاومة دخله <b>عالية</b> جداً.</li><li><b>الأميتر</b>: بيتوصل <b>توالي</b> (تفتح الدايرة عشان كل التيار يعدي فيه)؛ مقاومة دخله <b>واطية</b> جداً.</li><li><b>الأوم ميتر</b>: <b>من غير مصدر كهربا</b>. اظبط المدى وابدأ من أعلى حد لو مش عارف القيمة.</li></ul>"}], "terms": [["ammeter", "Measures current; connected in series; very low input impedance.", "أميتر: يقيس التيار على التوالي."], ["voltmeter", "Measures potential difference; connected in parallel; very high input impedance.", "فولتميتر: على التوازي."], ["multimeter", "Instrument combining ammeter, voltmeter and ohmmeter.", "ملتيميتر."]]}, {"id": "elec2_5", "title_en": "DC and AC", "title_ar": "التيار المستمر والمتردد", "figs": [], "blocks": [{"en": "<p><b>DC</b> flows in one direction only (negative toward positive pole); battery circuits are DC with fixed polarity. <b>AC</b> periodically reverses polarity and direction. The home outlet is described as 60 cycles per second, and all audio signals are AC.</p>", "ar": "<p><b>الـ DC</b> بيمشي في اتجاه واحد (من السالب للموجب)؛ دوائر البطاريات DC وقطبيتها ثابتة. <b>الـ AC</b> بيعكس القطبية والاتجاه دوريا. مصدر البيت في المحاضرة 60 دورة في الثانية وكل إشارات الصوت AC.</p>"}, {"en": "<table class='cmp'><tr><th>DC</th><th>AC</th></tr><tr><td>Fixed polarity</td><td>Reverses polarity</td></tr><tr><td>Steady value cannot be stepped up or down by a transformer</td><td>Used for power distribution (can be transformed)</td></tr><tr><td>Easier to measure</td><td>Easier to amplify</td></tr></table><p>Heating effects are the same for both.</p>", "ar": "<table class='cmp'><tr><th>DC</th><th>AC</th></tr><tr><td>قطبية ثابتة</td><td>القطبية بتتعكس</td></tr><tr><td>القيمة الثابتة ماتتحولش بترانسفورمر</td><td>بيستخدم في توزيع القدرة (ممكن يتحول)</td></tr><tr><td>أسهل في القياس</td><td>أسهل في التكبير</td></tr></table><p>التأثير الحراري واحد في الاتنين.</p>"}, {"en": "<p>Sinusoidal AC quantities:</p><ul><li><b>Cycle</b>: one complete waveform.</li><li><b>Period</b>: time of one cycle, in seconds.</li><li><b>Frequency</b> (f): cycles per second, in hertz (Hz).</li><li><b>Amplitude</b>: maximum positive or negative value.</li><li><b>Wavelength</b>: distance a wave travels in one cycle; it gets shorter as frequency increases.</li></ul>", "ar": "<p>كميات الـ AC الجيبية:</p><ul><li><b>الدورة</b>: موجة كاملة.</li><li><b>الزمن الدوري</b>: زمن دورة واحدة بالثانية.</li><li><b>التردد</b> (f): عدد الدورات في الثانية بالهرتز.</li><li><b>السعة</b>: أقصى قيمة موجبة أو سالبة.</li><li><b>الطول الموجي</b>: المسافة اللي بتقطعها الموجة في دورة؛ بيقصر لما التردد يزيد.</li></ul>"}, {"en": "<p><b>Impedance</b> is resistance to current flow in AC circuits, also measured in ohms. <b>Grounding</b>: one side of the source is usually grounded for safety; in equipment the ground is a metal chassis used as a common return.</p>", "ar": "<p><b>الممانعة (Impedance)</b> هي مقاومة مرور التيار في دوائر الـ AC ووحدتها برضو الأوم. <b>التأريض</b>: أحد طرفي المصدر بيتأرض للأمان؛ وفي الأجهزة الأرضي هو الشاسيه المعدني كمرجع مشترك.</p>"}], "terms": [["DC", "Direct current: one direction, fixed polarity.", "تيار مستمر."], ["AC", "Alternating current: polarity and direction reverse periodically.", "تيار متردد."], ["frequency", "Cycles per second, unit hertz (Hz).", "التردد بالهرتز."], ["impedance", "Resistance to current in AC circuits, measured in ohms.", "الممانعة."], ["grounding", "Connecting one side of a source to ground for safety.", "التأريض للأمان."]]}, {"id": "elec2_6", "title_en": "Semiconductors: silicon, N-type and P-type", "title_ar": "أشباه الموصلات: سيليكون وN وP", "figs": [], "blocks": [{"en": "<p>Semiconductors are divided into <b>intrinsic</b> (pure) and <b>extrinsic</b> (doped). <b>Silicon</b> is the most common material for devices. Each Si atom has four valence electrons locked in <b>covalent bonds</b> with four neighbours, so pure silicon has no free charge carriers and acts as an <b>insulator</b>. Phosphorus (P) or boron (B) is added to change its conductivity (<b>doping</b>).</p>", "ar": "<p>أشباه الموصلات بتتقسم لـ <b>intrinsic</b> (نقي) و<b>extrinsic</b> (مشوب). <b>السيليكون</b> أشهر مادة. كل ذرة Si لها 4 إلكترونات تكافؤ في <b>روابط تساهمية</b> مع 4 جيران، فالسيليكون النقي مفيهوش حاملات شحنة حرة وبيتصرف كـ <b>عازل</b>. بيتضاف فسفور أو بورون لتغيير التوصيل (<b>التطعيم</b>).</p>"}, {"en": "<p><b>N-type</b>: pentavalent impurities (phosphorus, arsenic, antimony, bismuth) with 5 valence electrons. The 5th electron stays free to float. Carriers are negative; the impurities are <b>donors</b>.</p>", "ar": "<p><b>النوع N</b>: شوائب خماسية التكافؤ (فسفور، زرنيخ، أنتيمون، بزموت) بخمس إلكترونات تكافؤ. الإلكترون الخامس بيفضل حر. الحاملات سالبة والشوائب اسمها <b>donors</b> (مانحة).</p>"}, {"en": "<p><b>P-type</b>: trivalent impurities (boron, aluminum, indium, gallium) with 3 valence electrons. A vacant spot, a <b>hole</b>, forms in the covalent bond. Holes act as positive carriers and appear to move toward the negative terminal. The impurities are <b>acceptors</b>.</p>", "ar": "<p><b>النوع P</b>: شوائب ثلاثية التكافؤ (بورون، ألومنيوم، إنديوم، جاليوم). بيتكون مكان فاضي <b>hole</b> (فجوة) في الرابطة. الفجوات حاملات موجبة وكأنها بتتحرك ناحية الطرف السالب. والشوائب اسمها <b>acceptors</b> (قابلة).</p>"}], "terms": [["silicon", "Most common semiconductor material, 4 valence electrons.", "السيليكون."], ["doping", "Adding impurities (P or B) to silicon to change its conductivity.", "التطعيم."], ["N-type", "Doped with pentavalent donor; free electrons are carriers.", "نوع N: الحاملات إلكترونات."], ["P-type", "Doped with trivalent acceptor; holes are carriers.", "نوع P: الحاملات فجوات."], ["hole", "Vacant spot in a covalent bond acting as a positive carrier.", "الفجوة."], ["covalent bond", "Sharing of valence electrons between neighbouring atoms.", "رابطة تساهمية."]]}], "flash": [{"f": "Electrically, how are materials classified?", "b": "Conductors, insulators, semiconductors."}, {"f": "Valence electrons in conductors, insulators, semiconductors?", "b": "1, 8 and 4 respectively."}, {"f": "What are dielectrics?", "b": "Insulators (glass, rubber, plastic) that can store charge; used in capacitors."}, {"f": "Symbol and unit of charge, and one coulomb equals?", "b": "Q, coulomb; 6.25x10^18 electrons."}, {"f": "What does one volt measure?", "b": "The work needed to move 1 C of charge."}, {"f": "Current definition and formula?", "b": "I = Q/T; 1 ampere = 1 coulomb per second."}, {"f": "What is an open circuit?", "b": "A circuit with no conductive path between two points, so I = 0."}, {"f": "State Ohm's law in three forms.", "b": "I = E/R, E = IR, R = E/I."}, {"f": "Direction of electron flow?", "b": "From the negative side of the battery, through the load, back to the positive side."}, {"f": "How is a voltmeter connected, and its impedance?", "b": "In parallel; very high input impedance."}, {"f": "How is an ammeter connected, and its impedance?", "b": "In series; very low input impedance."}, {"f": "Ohmmeter rules?", "b": "No power supplied; adjust range, start from the highest limit if unknown."}, {"f": "DC versus AC?", "b": "DC: one direction, fixed polarity. AC: reverses polarity and direction periodically (used for power distribution)."}, {"f": "Relation between frequency and wavelength?", "b": "Wavelength gets shorter as frequency increases."}, {"f": "What is impedance?", "b": "Resistance to current flow in AC circuits, measured in ohms."}, {"f": "Why does pure silicon act as an insulator?", "b": "All 4 valence electrons are locked in covalent bonds, so there are no free carriers."}, {"f": "N-type: impurity, carriers, name?", "b": "Pentavalent (5 valence electrons: P, As, Sb, Bi); free electrons; donors."}, {"f": "P-type: impurity, carriers, name?", "b": "Trivalent (3 valence electrons: B, Al, In, Ga); holes; acceptors."}], "quiz": [{"q": "Which material has 4 valence electrons?", "o": ["Conductor", "Insulator", "Semiconductor", "Dielectric only"], "a": 2, "w": "أشباه الموصلات 4 إلكترونات تكافؤ."}, {"q": "Dielectric materials are used in:", "o": ["Capacitors", "Fuses", "Antennas only", "Ohmmeters"], "a": 0, "w": "بتخزن شحنة فبتستخدم في المكثفات."}, {"q": "The practical unit of potential difference is the:", "o": ["Ampere", "Volt", "Ohm", "Hertz"], "a": 1, "w": "فولت."}, {"q": "I = Q/T means 1 ampere is:", "o": ["1 volt per second", "1 coulomb per second", "1 ohm per volt", "1 joule"], "a": 1, "w": "أمبير = كولوم/ثانية."}, {"q": "In an open circuit the current is:", "o": ["Maximum", "Zero", "Equal to E", "Alternating"], "a": 1, "w": "مفيش مسار موصّل فـ I = 0."}, {"q": "If E = 12 V and R = 4 Ω, then I =", "o": ["48 A", "3 A", "8 A", "0.33 A"], "a": 1, "w": "I = E/R = 12/4 = 3 أمبير."}, {"q": "If I = 2 A and R = 5 Ω, then E =", "o": ["10 V", "2.5 V", "7 V", "0.4 V"], "a": 0, "w": "E = I x R = 10 فولت."}, {"q": "A voltmeter is connected:", "o": ["In series", "In parallel", "Without a circuit", "Only to AC"], "a": 1, "w": "الفولتميتر توازي وعالي المقاومة."}, {"q": "An ammeter should have:", "o": ["Very high impedance", "Very low impedance", "Infinite impedance", "No terminals"], "a": 1, "w": "الأميتر مقاومة دخل واطية جداً."}, {"q": "Which is true for DC?", "o": ["Reverses polarity", "Fixed polarity", "Used with transformers to step up", "Cannot flow in batteries"], "a": 1, "w": "DC قطبية ثابتة."}, {"q": "Frequency is measured in:", "o": ["Hertz", "Coulombs", "Ohms", "Watts"], "a": 0, "w": "هرتز."}, {"q": "Impedance is:", "o": ["Resistance to AC current flow", "Charge storage", "Frequency", "A type of battery"], "a": 0, "w": "الممانعة مقاومة الـ AC."}, {"q": "Pure silicon behaves as:", "o": ["A good conductor", "An insulator", "A magnet", "A battery"], "a": 1, "w": "مفيش حاملات حرة."}, {"q": "Which impurity makes N-type silicon?", "o": ["Boron", "Phosphorus", "Gallium", "Aluminum"], "a": 1, "w": "الفسفور خماسي فبيدي إلكترون حر."}, {"q": "Holes are carriers in:", "o": ["N-type", "P-type", "Both only when hot", "Neither"], "a": 1, "w": "P-type الحاملات فجوات."}, {"q": "Impurities added to make P-type are called:", "o": ["Donors", "Acceptors", "Insulators", "Dielectrics"], "a": 1, "w": "acceptors."}], "recall": [{"q": "Describe the three classes of materials with valence electrons.", "a": "Conductors 1, semiconductors 4, insulators 8 valence electrons; insulators = dielectrics store charge.", "w": "الأنواع التلاتة."}, {"q": "State Ohm's law and solve for I when E = 12 V and R = 4 Ω.", "a": "I = E/R = 3 A.", "w": "القانون + حساب."}, {"q": "How do you connect a voltmeter, an ammeter and an ohmmeter?", "a": "Voltmeter parallel (high impedance), ammeter series (low impedance), ohmmeter with no power.", "w": "طرق التوصيل."}, {"q": "Compare DC and AC.", "a": "DC one direction fixed polarity, easier to measure; AC reverses, used for power distribution, easier to amplify; same heating effect.", "w": "مقارنة."}, {"q": "Define cycle, period, frequency, amplitude, wavelength.", "a": "Cycle: one full waveform; period: time per cycle; frequency: cycles per second in Hz; amplitude: max value; wavelength: distance per cycle (shorter as f rises).", "w": "تعريفات."}, {"q": "Why is pure Si an insulator and how is it made useful?", "a": "Valence electrons are locked in covalent bonds; doping with P or B adds free carriers.", "w": "التطعيم."}, {"q": "Explain N-type and P-type semiconductors.", "a": "N: pentavalent donors give free electrons. P: trivalent acceptors create holes that appear to move to the negative terminal.", "w": "N وP."}]}, "elec3": {"name": "Fundamentals of Electronics", "lec": "Lecture 3 - The pn junction, diodes and transistors", "short": "Elec", "sections": [{"id": "elec3_1", "title_en": "The pn junction and the diode", "title_ar": "الوصلة pn والدايود", "figs": [], "blocks": [{"en": "<p>A <b>pn junction</b> is close contact of an n-type and a p-type semiconductor: a two-terminal device with an <b>anode</b> and a <b>cathode</b>. Examples: <b>diode</b> (one junction), <b>transistor</b> (two junctions), <b>thyristor</b> (three junctions).</p>", "ar": "<p><b>الوصلة pn</b> هي تلامس قريب بين شبه موصل n وشبه موصل p: جهاز بطرفين <b>anode</b> و<b>cathode</b>. أمثلة: <b>الدايود</b> (وصلة واحدة)، <b>الترانزستور</b> (وصلتين)، <b>الثايرستور</b> (تلات وصلات).</p>"}, {"en": "<p>The pn junction acts like a <b>one-way valve</b>: current flows in forward bias only. That is why it is used to build <b>solid state rectifiers</b> (pn junction diodes).</p>", "ar": "<p>الوصلة pn زي <b>صمام باتجاه واحد</b>: التيار بيمشي في الانحياز الأمامي بس. عشان كده بتتستخدم في <b>المقوّمات الصلبة</b>.</p>"}, {"en": "<p>How it works:</p><ul><li>Majority carriers cross the interface (<b>diffusion</b>) and recombine on the other side.</li><li>This leaves uncompensated space charges: the <b>depletion region</b>.</li><li>An electric field (built-in potential) builds up and acts as an <b>energy barrier</b>, reducing diffusion.</li><li>The field also causes minority carrier <b>drift</b> in the opposite direction.</li></ul>", "ar": "<p>إزاي بيشتغل:</p><ul><li>الحاملات الأغلبية بتعدي الحد (<b>انتشار</b>) وبتتحد في الناحية التانية.</li><li>ده بيسيب شحنات فراغية غير متعادلة: <b>منطقة النضوب</b>.</li><li>بيتكون مجال كهربي (جهد داخلي) كـ <b>حاجز طاقة</b> بيقلل الانتشار.</li><li>والمجال بيسبب <b>انجراف</b> للحاملات الأقلية في الاتجاه العكسي.</li></ul>"}], "terms": [["pn junction", "Junction of n-type and p-type semiconductor.", "الوصلة pn."], ["anode", "Positive terminal of a diode.", "الأنود: الطرف الموجب."], ["cathode", "Negative terminal of a diode.", "الكاثود: الطرف السالب."], ["depletion region", "Zone near the junction empty of free carriers, with uncompensated space charge.", "منطقة النضوب."], ["diffusion", "Majority carriers crossing the junction interface.", "الانتشار."]]}, {"id": "elec3_2", "title_en": "Forward and reverse bias", "title_ar": "الانحياز الأمامي والعكسي", "figs": [], "blocks": [{"en": "<p><b>Forward biased</b>: electrons from the n-side and holes from the p-side are pushed toward the center by the battery field. They combine and <b>current passes</b> through the diode (open door).</p>", "ar": "<p><b>الانحياز الأمامي</b>: إلكترونات من ناحية n وفجوات من ناحية p بتتدفع ناحية النص بمجال البطارية. بيتحدوا و<b>التيار بيعدي</b> (باب مفتوح).</p>"}, {"en": "<p><b>Reverse biased</b> (closed door): holes in the n-side are pushed one way and electrons in the p-side the other, creating an empty zone free of carriers, the <b>depletion region</b>. It acts as an <b>insulator</b> and prevents current.</p>", "ar": "<p><b>الانحياز العكسي</b> (باب مقفول): الفجوات والإلكترونات بتتدفع بعيد عن الوصلة فبتتكون منطقة فاضية من الحاملات هي <b>منطقة النضوب</b>. بتتصرف كعازل وبتمنع التيار.</p>"}], "terms": [["forward bias", "Battery pushes carriers to the junction; current flows.", "انحياز أمامي: التيار يمر."], ["reverse bias", "Carriers pulled away, depletion region widens; no current.", "انحياز عكسي: مفيش تيار."]]}, {"id": "elec3_3", "title_en": "Rectifiers and the power supply", "title_ar": "المقوّمات ومصدر القدرة", "figs": [], "blocks": [{"en": "<p><b>Half wave rectifier</b>: the diode converts AC to <b>pulsed DC</b>. It blocks current when the input is negative at the anode (output = 0). The diode drops about <b>0.6 V</b>, so output peak is 0.6 V lower than input peak. Output frequency = input frequency.</p>", "ar": "<p><b>مقوّم نصف موجة</b>: الدايود بيحول AC لـ <b>DC نابض</b>. بيمنع التيار لما الدخل سالب على الأنود (الخرج = 0). الدايود بيفقد حوالي <b>0.6 فولت</b> فقمة الخرج أقل من الدخل بـ 0.6. تردد الخرج = تردد الدخل.</p>"}, {"en": "<p><b>Full wave (bridge) rectifier</b>: the negative swings are transformed into positive swings. One pair of diodes conducts during the positive half cycle and the other pair during the negative half cycle. Output peak is <b>1.2 V</b> below input peak and the output frequency is <b>twice</b> the input frequency.</p>", "ar": "<p><b>مقوّم موجة كاملة (قنطرة)</b>: الأجزاء السالبة بتتحول لموجبة. زوج دايودات بيشتغل في نص الدورة الموجب والزوج التاني في السالب. قمة الخرج أقل من الدخل بـ <b>1.2 فولت</b> وتردد الخرج <b>ضعف</b> تردد الدخل.</p>"}, {"en": "<p>AC to DC power supply = transformer + full wave rectifier + filter capacitor:</p><ul><li><b>Transformer</b>: steps the input voltage up or down.</li><li><b>Rectifier</b>: converts AC to pulsed DC.</li><li><b>Filter capacitor</b>: smooths the pulses; it must be large enough to store the charge for a steady load current.</li></ul>", "ar": "<p>مصدر AC إلى DC = ترانسفورمر + مقوّم موجة كاملة + مكثف فلتر:</p><ul><li><b>الترانسفورمر</b>: بيرفع أو بيخفض جهد الدخل.</li><li><b>المقوّم</b>: بيحول AC لـ DC نابض.</li><li><b>مكثف الفلتر</b>: بيمهّد النبضات؛ لازم يكون كبير كفاية يخزن شحنة لتيار ثابت للحمل.</li></ul>"}, {"en": "<p>Advantages of solid state diodes:</p><ul><li>No filament: longer life, less power, less heat.</li><li>Smaller size, allows a compact x-ray unit.</li><li>Small voltage drop.</li><li>Reverse current is less than a vacuum diode, so more efficient rectifiers.</li></ul>", "ar": "<p>مميزات الدايود الصلب:</p><ul><li>مفيهوش فتيلة: عمر أطول وقدرة أقل وحرارة أقل.</li><li>حجم أصغر فبيسمح بوحدة أشعة مدمجة.</li><li>فقد جهد صغير.</li><li>التيار العكسي أقل من الصمام المفرغ فهو مقوّم أكفأ.</li></ul>"}], "terms": [["rectifier", "Device that converts AC to DC (diode).", "مقوّم: بيحول AC لـ DC."], ["bridge rectifier", "Full wave rectifier using four diodes.", "قنطرة التقويم."], ["filter capacitor", "Smooths pulsed DC into steady DC.", "مكثف التمهيد."], ["pulsed DC", "Output of a rectifier before filtering.", "DC نابض."]]}, {"id": "elec3_4", "title_en": "Transistor and thyristor", "title_ar": "الترانزستور والثايرستور", "figs": [], "blocks": [{"en": "<p>The <b>transistor</b> (invented 1947) is a three-terminal device: <b>base, collector, emitter</b>. It amplifies voltage. A small voltage or current at the base controls a larger current between collector and emitter. <b>Analogy</b>: a faucet; the control knob alters the flow of water.</p>", "ar": "<p><b>الترانزستور</b> (اتخترع 1947) جهاز بتلات أطراف: <b>base وcollector وemitter</b>. بيكبّر الجهد. جهد أو تيار صغير على الـ base بيتحكم في تيار أكبر بين الـ collector والـ emitter. <b>التشبيه</b>: حنفية، والمقبض بيغير تدفق المية.</p>"}, {"en": "<p><b>How it works (npn)</b>: with no base voltage, electrons in the emitter are blocked by the pn junction. A <b>negative</b> base voltage makes the base-emitter junction reverse biased (depletion region, no flow). A <b>positive base voltage above 0.6 V</b> forward biases it, electrons are drawn to the base, and because the base is very thin most electrons reach the collector. Increasing the base voltage increases emitter-to-collector flow.</p>", "ar": "<p><b>الشغل (npn)</b>: من غير جهد على الـ base الإلكترونات في الـ emitter بتتمنع بالوصلة. جهد <b>سالب</b> على الـ base بيخلي وصلة base-emitter انحياز عكسي (منطقة نضوب، مفيش مرور). جهد <b>موجب أعلى من 0.6 فولت</b> بيعمل انحياز أمامي والإلكترونات بتتجذب للـ base، وعشان الـ base رفيعة جداً معظم الإلكترونات بتوصل للـ collector. زيادة جهد الـ base بتزود التدفق.</p>"}, {"en": "<p><b>Thyristor</b>: silicon controlled rectifier, <b>3 junctions</b> (N-P-N-P).</p>", "ar": "<p><b>الثايرستور</b>: مقوّم سيليكوني متحكم فيه، <b>3 وصلات</b> (N-P-N-P).</p>"}], "terms": [["transistor", "Three-terminal device (base, collector, emitter) that amplifies and switches.", "ترانزستور: بيكبّر وبيفتح ويقفل."], ["base", "Control terminal of a transistor.", "القاعدة: طرف التحكم."], ["collector", "Terminal that collects electrons from the emitter.", "المجمّع."], ["emitter", "Terminal that emits electrons.", "الباعث."], ["thyristor", "Silicon controlled rectifier with 3 junctions (N-P-N-P).", "ثايرستور."]]}, {"id": "elec3_5", "title_en": "Applications and optoelectronics", "title_ar": "التطبيقات والإلكترونيات الضوئية", "figs": [], "blocks": [{"en": "<p>Applications in x-ray equipment:</p><ul><li><b>Diode</b>: rectification (high tension transformer).</li><li><b>Transistors</b>: electronic timing circuits.</li><li><b>Thyristor (triacs)</b>: switch the exposure on and off.</li><li><b>Microprocessors</b>: sophisticated measurement and control, checking that exposure factors are not outside their ratings.</li></ul>", "ar": "<p>التطبيقات في أجهزة الأشعة:</p><ul><li><b>الدايود</b>: التقويم (محول الجهد العالي).</li><li><b>الترانزستور</b>: دوائر التوقيت الإلكترونية.</li><li><b>الثايرستور (triacs)</b>: بيفتح ويقفل التعريض.</li><li><b>المعالجات الدقيقة</b>: قياس وتحكم متطور، وبتتأكد إن عوامل التعريض مش برا الحدود المسموحة.</li></ul>"}, {"en": "<p><b>LED</b> (light emitting diode): tiny light source in many colors, needs very small current so <b>always use a resistor</b> (300 Ω to 1 kΩ). Forward biased it conducts and emits light; with reverse polarity it stops. A <b>photodiode</b> is a 2-lead device that transforms <b>light energy into electric current</b> (solar cell).</p>", "ar": "<p><b>الـ LED</b>: مصدر ضوء صغير بألوان كتير، محتاج تيار صغير جداً فـ <b>لازم تستخدم مقاوم</b> (300 أوم لـ 1 كيلو). في الانحياز الأمامي بيوصّل وبيضيء وبالعكس بيقف. أما <b>الفوتوداييود</b> جهاز بطرفين بيحول <b>الطاقة الضوئية لتيار كهربي</b> (الخلية الشمسية).</p>"}], "terms": [["LED", "Light emitting diode: lights when forward biased; needs a series resistor.", "LED: دايود مضيء."], ["photodiode", "Converts light energy to electric current.", "فوتوداييود: يحول الضوء لتيار."], ["optoelectronics", "Devices that emit or respond to light (LED, photodiode).", "إلكترونيات ضوئية."]]}], "flash": [{"f": "What is a pn junction?", "b": "Close contact of an n-type and a p-type semiconductor; a two-terminal device (anode, cathode)."}, {"f": "Examples of junction devices?", "b": "Diode (1 junction), transistor (2), thyristor (3)."}, {"f": "Why is a diode a one-way valve?", "b": "Current flows only in forward bias; used for solid state rectifiers."}, {"f": "How is the depletion region formed?", "b": "Majority carriers diffuse across and recombine, leaving uncompensated space charges and a built-in field."}, {"f": "Forward bias effect?", "b": "Electrons and holes pushed to the center, combine; current passes (open door)."}, {"f": "Reverse bias effect?", "b": "Depletion region widens, acts as insulator; no current (closed door)."}, {"f": "Half wave rectifier: voltage drop and frequency?", "b": "0.6 V drop; output frequency equals input frequency."}, {"f": "Full wave rectifier: voltage drop and frequency?", "b": "1.2 V below input peak; output frequency is twice the input."}, {"f": "Parts of an AC to DC power supply?", "b": "Transformer, full wave rectifier, filter capacitor."}, {"f": "Advantages of solid state diodes?", "b": "No filament, long life, less power and heat, small size (compact x-ray unit), small voltage drop, small reverse current."}, {"f": "Transistor terminals and analogy?", "b": "Base, collector, emitter; a faucet whose knob controls the flow."}, {"f": "When does an npn transistor conduct?", "b": "When base voltage is positive above 0.6 V (base-emitter forward biased)."}, {"f": "What is a thyristor?", "b": "Silicon controlled rectifier, 3 junctions N-P-N-P; triacs switch exposure on and off."}, {"f": "LED rule?", "b": "Always use a resistor (300 Ω to 1 kΩ); conducts and lights in forward bias."}, {"f": "What does a photodiode do?", "b": "Transforms light energy into electric current (solar cell)."}], "quiz": [{"q": "A transistor has how many pn junctions?", "o": ["1", "2", "3", "4"], "a": 1, "w": "الدايود 1 والترانزستور 2 والثايرستور 3."}, {"q": "A diode conducts when it is:", "o": ["Reverse biased", "Forward biased", "Unbiased only", "Overheated"], "a": 1, "w": "الانحياز الأمامي."}, {"q": "The depletion region acts as:", "o": ["A conductor", "An insulator", "A battery", "An amplifier"], "a": 1, "w": "عازل."}, {"q": "Half wave rectifier output frequency is:", "o": ["Half the input", "Equal to the input", "Twice the input", "Zero"], "a": 1, "w": "نفس التردد."}, {"q": "Bridge rectifier output frequency is:", "o": ["Equal to input", "Half the input", "Twice the input", "Unrelated"], "a": 2, "w": "ضعف تردد الدخل."}, {"q": "Output peak of a full wave bridge is lower than input by:", "o": ["0.6 V", "1.2 V", "6 V", "0 V"], "a": 1, "w": "دايودين على المسار = 1.2 فولت."}, {"q": "The filter capacitor in a power supply:", "o": ["Steps up voltage", "Smooths the pulses", "Reverses polarity", "Blocks DC"], "a": 1, "w": "بيمهد النبضات."}, {"q": "Which is an advantage of solid state diodes?", "o": ["They contain a filament", "Larger size", "Longer life, less heat", "High voltage drop"], "a": 2, "w": "مفيش فتيلة فعمر أطول وحرارة أقل."}, {"q": "Transistor terminals are:", "o": ["Anode, cathode, gate", "Base, collector, emitter", "Source only", "Plus, minus"], "a": 1, "w": "base/collector/emitter."}, {"q": "An npn transistor starts conducting when the base is about:", "o": ["Negative", "Zero", "Positive above 0.6 V", "-0.6 V"], "a": 2, "w": "فوق 0.6 فولت."}, {"q": "A thyristor has:", "o": ["1 junction", "2 junctions", "3 junctions", "No junction"], "a": 2, "w": "تلات وصلات."}, {"q": "In x-ray equipment, triacs are used to:", "o": ["Rectify", "Switch the exposure on and off", "Display image", "Cool the tube"], "a": 1, "w": "بتفتح وتقفل التعريض."}, {"q": "An LED must be used with:", "o": ["A resistor", "A transformer", "No component", "A vacuum tube"], "a": 0, "w": "لتحديد التيار."}, {"q": "A photodiode converts:", "o": ["Light into current", "Current into light", "AC into DC", "Heat into sound"], "a": 0, "w": "ضوء لتيار."}], "recall": [{"q": "Explain how a pn junction forms a depletion region.", "a": "Diffusion of majority carriers, recombination, leaving space charges and a built-in field/barrier.", "w": "منطقة النضوب."}, {"q": "Compare forward and reverse bias.", "a": "Forward: carriers pushed to the junction, current flows. Reverse: depletion region widens, no current.", "w": "مقارنة."}, {"q": "Compare half wave and full wave rectifiers.", "a": "Half: blocks negative half, 0.6 V drop, same frequency. Full: uses both halves, 1.2 V drop, double frequency.", "w": "مقارنة المقوّمات."}, {"q": "Describe an AC to DC power supply.", "a": "Transformer, full wave rectifier, filter capacitor for steady current.", "w": "مصدر القدرة."}, {"q": "How does a transistor work (npn)?", "a": "Positive base above 0.6 V forward biases base-emitter; electrons pass to the collector through the thin base; more base voltage gives more flow.", "w": "الترانزستور."}, {"q": "List applications of semiconductor devices in x-ray equipment.", "a": "Diode: rectification; transistor: timing; thyristor/triacs: exposure switching; microprocessors: check exposure factors.", "w": "التطبيقات."}, {"q": "What are an LED and a photodiode?", "a": "LED emits light when forward biased with a resistor; photodiode converts light to current.", "w": "LED وفوتوداييود."}]}, "elec4": {"name": "Fundamentals of Electronics", "lec": "Lecture 4 - Display units (CRT, plasma, LCD)", "short": "Elec", "sections": [{"id": "elec4_1", "title_en": "Vacuum tubes and the CRT", "title_ar": "الصمامات المفرغة والـ CRT", "figs": [], "blocks": [{"en": "<p><b>Vacuum tubes</b> were among the earliest electronic components and dominated electronics until the 1950s. Today solid state devices have taken over, but tubes are still used in high power RF amplifiers, <b>cathode ray tubes</b> and some microwave devices.</p>", "ar": "<p><b>الصمامات المفرغة</b> كانت من أقدم المكونات وسادت لحد الخمسينات. دلوقتي الأجهزة الصلبة أخدت مكانها، بس لسه بتتستخدم في مكبرات RF عالية القدرة و<b>أنابيب أشعة الكاثود</b> وبعض أجهزة الميكروويف.</p>"}, {"en": "<p>The CRT was invented in <b>1896 by Ferdinand Braun</b>; first used for oscilloscopes, then television, then computers. <b>Philo Farnsworth</b> developed the CRT used for television. <b>Cathode rays</b> are high energy electrons emitted from the heated cathode (-) in a vacuum tube.</p>", "ar": "<p>الـ CRT اخترعه <b>فرديناند براون سنة 1896</b>؛ استخدم أول حاجة في الأوسيلوسكوب ثم التلفزيون ثم الكمبيوتر. و<b>فيلو فارنزورث</b> طوّر الـ CRT اللي اتستخدم في التلفزيون. <b>أشعة الكاثود</b> هي إلكترونات عالية الطاقة بتنبعث من الكاثود (-) المسخّن في أنبوب مفرغ.</p>"}, {"en": "<p>How a CRT works:</p><ul><li>A small heater heats the cathode, which emits an electron cloud.</li><li>Two anodes (+), accelerating and focusing, focus it into an electron beam.</li><li>The electron gun aims electrons at the phosphor screen, which glows (red, green, blue dots).</li><li>Black-and-white monitors have one electron gun; color monitors have <b>three (RGB)</b>.</li></ul>", "ar": "<p>إزاي الـ CRT بيشتغل:</p><ul><li>سخان صغير بيسخن الكاثود فبيطلع سحابة إلكترونات.</li><li>أنودين (+) تسريع وتركيز بيحولوها لشعاع إلكترونات.</li><li>مدفع الإلكترونات بيصوب على شاشة الفوسفور فبتتوهج (نقط أحمر وأخضر وأزرق).</li><li>الشاشات الأبيض والأسود فيها مدفع واحد والملونة <b>تلاتة (RGB)</b>.</li></ul>"}, {"en": "<p>Variations: <b>shadow mask</b> (metal screen with holes behind the phosphor, clusters of dots) and <b>aperture grill</b> (strips of lines).</p>", "ar": "<p>الأنواع: <b>shadow mask</b> (شبكة معدنية فيها فتحات ورا الفوسفور، مجموعات نقط) و<b>aperture grill</b> (خطوط رفيعة متجاورة).</p>"}, {"en": "<p>Disadvantages of CRT:</p><ul><li>Big, bulky, heavy.</li><li>Electromagnetic fields are a health hazard to living cells.</li><li>Emit a small amount of X-ray radiation (more at the back than the front).</li><li>Constant refreshing can cause headache.</li><li>Very high voltage and strong vacuum: risk of overheating or <b>implosion</b>.</li><li>A strong magnet near the tube can magnetize the shadow mask.</li></ul>", "ar": "<p>عيوب الـ CRT:</p><ul><li>كبير وتقيل وبياخد مساحة.</li><li>المجالات الكهرومغناطيسية خطر على الخلايا الحية.</li><li>بيطلع كمية صغيرة من الأشعة السينية (أكتر من الخلف عن الأمام).</li><li>التحديث المستمر ممكن يسبب صداع.</li><li>جهد عالي جداً وفراغ قوي: خطر سخونة أو <b>انفجار للداخل</b>.</li><li>مغناطيس قوي جنب الأنبوب ممكن يمغنط الـ shadow mask.</li></ul>"}, {"en": "<p>Advantages of CRT:</p><ul><li>Brightness easily increased.</li><li>Produces more colours.</li><li>Lower price than LCD or plasma.</li><li>Image quality and contrast are considered superior.</li></ul>", "ar": "<p>مميزات الـ CRT:</p><ul><li>السطوع بيتزود بسهولة.</li><li>ألوان أكتر.</li><li>أرخص من LCD والبلازما.</li><li>جودة الصورة والتباين ممتازين.</li></ul>"}], "terms": [["CRT", "Cathode ray tube: electron beam hits phosphor screen to form an image.", "أنبوب أشعة الكاثود."], ["cathode rays", "High energy electrons from the heated cathode in a vacuum tube.", "أشعة الكاثود: إلكترونات."], ["electron gun", "Weak particle accelerator aiming electrons at the phosphor screen.", "مدفع الإلكترونات."], ["phosphor", "Material that glows when struck by electrons.", "الفوسفور."], ["shadow mask", "Metal screen with holes behind the phosphor layer.", "شبكة الظل."], ["aperture grill", "Strip-line grill version of the CRT mask.", "الشبكة الخطية."]]}, {"id": "elec4_2", "title_en": "Plasma display", "title_ar": "شاشة البلازما", "figs": [], "blocks": [{"en": "<p>A plasma display lights up thousands of tiny dots with a high-energy beam of electrons. Three pixel colours (red, green, blue) are spread evenly, and mixing them in different proportions gives the full colour spectrum.</p>", "ar": "<p>شاشة البلازما بتنور آلاف النقط الصغيرة بشعاع عالي الطاقة. فيه 3 ألوان بكسل (أحمر وأخضر وأزرق) موزعة بالتساوي، وبخلطهم بنسب مختلفة بنحصل على طيف الألوان كله.</p>"}, {"en": "<p>Disadvantages of plasma:</p><ul><li>Short life span: about 20,000 to 30,000 hours.</li><li>Brightness dims with age.</li><li>More expensive than CRT.</li><li>Fragile, must be handled carefully.</li></ul>", "ar": "<p>عيوب البلازما:</p><ul><li>عمر قصير: حوالي 20 ألف لـ 30 ألف ساعة.</li><li>السطوع بيقل مع العمر.</li><li>أغلى من الـ CRT.</li><li>هشة وتتعامل بحذر.</li></ul>"}, {"en": "<p>Advantages of plasma:</p><ul><li>Wider viewing angle: <b>160°</b> (LCD 40°, rear projection 120°).</li><li>No projection throw distance limits.</li><li>Thinner than CRT; can be wall or ceiling mounted.</li><li>Clearer image, better colour and higher contrast than CRT.</li></ul>", "ar": "<p>مميزات البلازما:</p><ul><li>زاوية رؤية أوسع: <b>160°</b> (الـ LCD 40° والعرض الخلفي 120°).</li><li>مفيش حدود لمسافة الإسقاط.</li><li>أنحف من الـ CRT وممكن تتعلق على حيطة أو سقف.</li><li>صورة أوضح وألوان وتباين أحسن من الـ CRT.</li></ul>"}], "terms": [["plasma display", "Display lighting RGB phosphor dots with an electron beam; 160° viewing angle.", "شاشة بلازما."]]}, {"id": "elec4_3", "title_en": "Liquid crystal display (LCD)", "title_ar": "شاشة الكريستال السائل LCD", "figs": [], "blocks": [{"en": "<p>An LCD is a <b>multilayered sideways sandwich</b>: a fluorescent <b>backlight</b>, a first polarizing filter, a layer of thousands of liquid crystal <b>cells</b>, and a second polarizing filter. An electric field twists the crystal molecules so the light lines up with the second filter and passes through. The pixels can show over 20 million colours.</p>", "ar": "<p>الـ LCD <b>ساندويتش أفقي متعدد الطبقات</b>: إضاءة خلفية <b>backlight</b>، فلتر استقطاب أول، طبقة آلاف خلايا الكريستال السائل، وفلتر استقطاب تاني. المجال الكهربي بيلف جزيئات الكريستال فالضوء بيتماشى مع الفلتر التاني ويعدي. البكسلات تقدر تعرض أكتر من 20 مليون لون.</p>"}, {"en": "<p>LCD versus LED (Lecture 6):</p><ul><li>LCDs are not self-illuminating; they need a backlight.</li><li>An LED display is an LCD with an LED backlight (behind or around the panel). Same basic technology; the difference is only how it is illuminated.</li></ul>", "ar": "<p>LCD مقابل LED (المحاضرة 6):</p><ul><li>الـ LCD مش بينور نفسه؛ محتاج backlight.</li><li>شاشة الـ LED هي LCD بإضاءة خلفية LED (ورا أو حوالين اللوحة). نفس التقنية والفرق بس في الإضاءة.</li></ul>"}, {"en": "<p>Disadvantages of LCD:</p><ul><li>Some pixels can die (discoloured spots).</li><li>High cost.</li><li>Slow response time.</li><li>Fixed resolution.</li><li>Very limited viewing angle.</li></ul>", "ar": "<p>عيوب LCD:</p><ul><li>بعض البكسلات ممكن تموت (بقع).</li><li>تكلفة عالية.</li><li>استجابة بطيئة.</li><li>دقة ثابتة.</li><li>زاوية رؤية محدودة جداً.</li></ul>"}, {"en": "<p>Advantages of LCD:</p><ul><li>Maximum sharpness; zero geometric distortion at native resolution.</li><li>Very bright images.</li><li>Perfectly flat screen, thin, small footprint.</li><li>Little electricity and heat, light weight.</li><li>No flicker and low glare reduce eye strain.</li></ul>", "ar": "<p>مميزات LCD:</p><ul><li>أقصى وضوح؛ مفيش تشوه هندسي في الدقة الأصلية.</li><li>صور ساطعة جداً.</li><li>شاشة مسطحة تماماً ورفيعة.</li><li>استهلاك كهربا وحرارة قليلين وخفيفة.</li><li>مفيش وميض وانعكاس قليل فبيقلل إجهاد العين.</li></ul>"}], "terms": [["LCD", "Liquid crystal display: backlight, two polarizing filters and liquid crystal cells.", "شاشة كريستال سائل."], ["backlight", "Light source behind an LCD panel.", "الإضاءة الخلفية."], ["polarizing filter", "Filter that passes light of one orientation; an LCD uses two.", "فلتر استقطاب."], ["pixel", "Smallest picture element on a screen.", "بكسل."]]}], "flash": [{"f": "What are cathode rays?", "b": "High energy electrons emitted from the heated cathode of a vacuum tube."}, {"f": "When and by whom was the CRT invented?", "b": "1896, Ferdinand Braun."}, {"f": "Who developed the CRT used for television?", "b": "Philo Farnsworth."}, {"f": "How many electron guns in B/W and colour CRTs?", "b": "One in B/W; three (RGB) in colour."}, {"f": "Shadow mask versus aperture grill?", "b": "Shadow mask: perforated metal sheet, dot clusters. Aperture grill: lines packed in strips."}, {"f": "Three CRT disadvantages?", "b": "Bulky and heavy; EM fields and small X-ray emission; high voltage and vacuum implosion risk."}, {"f": "Plasma viewing angle compared with LCD?", "b": "160° versus LCD 40° (rear projection 120°)."}, {"f": "Plasma life span?", "b": "About 20,000 to 30,000 hours (13.7 years at 4 h per day)."}, {"f": "Layers of an LCD?", "b": "Backlight, polarizing filter, liquid crystal cells, second polarizing filter."}, {"f": "LCD versus LED display?", "b": "LED is an LCD with LED backlight; LCD is not self-illuminating."}, {"f": "LCD disadvantages?", "b": "Dead pixels, high cost, slow response, fixed resolution, limited viewing angle."}, {"f": "LCD advantages?", "b": "Sharp, bright, flat, thin, low power and heat, light, no flicker."}], "quiz": [{"q": "The CRT was invented in:", "o": ["1896", "1947", "1950", "1920"], "a": 0, "w": "1896 على يد براون."}, {"q": "Cathode rays are:", "o": ["Protons", "High energy electrons", "X-rays", "Neutrons"], "a": 1, "w": "إلكترونات عالية الطاقة."}, {"q": "A colour CRT has:", "o": ["One electron gun", "Two electron guns", "Three electron guns", "No gun"], "a": 2, "w": "RGB تلات مدافع."}, {"q": "Strong magnet near a CRT can:", "o": ["Brighten it", "Magnetize the shadow mask", "Cool it", "Fix pixels"], "a": 1, "w": "بيمغنط الـ shadow mask."}, {"q": "A CRT implosion risk is due to:", "o": ["Strong vacuum and high voltage", "Low voltage", "Plastic case", "Backlight"], "a": 0, "w": "فراغ قوي وجهد عالي."}, {"q": "Which is an advantage of CRT?", "o": ["Light weight", "Lower price than LCD/plasma", "Thin", "Wide angle 160°"], "a": 1, "w": "أرخص."}, {"q": "Plasma viewing angle is about:", "o": ["40°", "120°", "160°", "10°"], "a": 2, "w": "160 درجة."}, {"q": "Plasma disadvantage:", "o": ["Short life span", "Very wide viewing", "Flat", "Thin"], "a": 0, "w": "عمر قصير."}, {"q": "An LCD needs a backlight because:", "o": ["It is not self-illuminating", "It is hot", "It has no filter", "It uses vacuum"], "a": 0, "w": "مش بينور نفسه."}, {"q": "An LED display is:", "o": ["An LCD with LED backlight", "A plasma panel", "A CRT", "A vacuum tube"], "a": 0, "w": "LCD + LED backlight."}, {"q": "How many polarizing filters in an LCD?", "o": ["1", "2", "3", "0"], "a": 1, "w": "فلترين."}, {"q": "LCD disadvantage:", "o": ["Fixed resolution", "Superior contrast than all", "No cost", "Very wide viewing angle"], "a": 0, "w": "دقة ثابتة."}], "recall": [{"q": "Explain how a CRT forms an image.", "a": "Heated cathode emits electrons, anodes focus them into a beam, beam hits phosphor dots (RGB) that glow.", "w": "الـ CRT."}, {"q": "List CRT advantages and disadvantages.", "a": "Adv: brightness, colours, price, quality. Dis: bulky, EM fields, X-ray, headache, implosion.", "w": "مميزات وعيوب."}, {"q": "Compare plasma and LCD.", "a": "Plasma: 160°, thin, costly, short life. LCD: 40°, thin, light, low power, fixed resolution, slow response.", "w": "مقارنة."}, {"q": "Describe the layers of an LCD.", "a": "Backlight, polarizer 1, liqui
